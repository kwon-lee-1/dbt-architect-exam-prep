is reason."}, "B": {"label": "❌ Incorrect", "text": "Service tokens are **account-level** and have no user identity — they persist independently of any individual user. A service token would not have failed in this scenario."}, "C": {"label": "✅ Correct", "text": "The architecturally correct fix is a **service token with the minimum permission set required**. Service tokens (1) are account-level and outlive any user, (2) can be assigned multiple permission sets, each scoped to specific projects, and (3) provide explicit, narrowable permissions independent of any user. For a CI/CD job: typically `Job Admin` on the relevant project plus any read scopes the job needs."}, "D": {"label": "❌ Incorrect", "text": "There is no \"Transfer PAT ownership\" workflow in dbt Cloud. PATs are non-transferable — they are tied to a specific user account permanently."}, "E": {"label": "❌ Incorrect", "text": "RBAC group membership has no effect on existing PATs. PATs belong to specific users and cannot be inherited by other users via group membership."}}, "key_rule": "PAT = user-tied, dies with the user, permissions inherited from user. Service token = account-level, persists independently, explicit permission sets, project-scopable. **Production = service token. Always.**"}, {"id": "q06_Q22", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 22, "high_yield": false, "subdomain_id": "5.22", "subdomain_topic": "Service token permissions and creation", "question_text": "A team architect is configuring a new service token for a multi-project CI/CD integration on the **Enterprise** plan. They want the token to have:\n- `Job Admin` permission on Project A only\n- `Read-Only` permission on Project B only\n- No access to any other project\n\nWhich of the following statements about this configuration are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "A single service token can carry both permission sets simultaneously, with each permission set scoped to specific projects.", "B": "The architect must create two separate service tokens (one per permission set) because each service token can only carry a single permission set.", "C": "The service token can be created by any user holding a Developer license — license type determines token-creation rights.", "D": "The Account Admin permission must be used to create or modify a service token; a Developer-licensed user cannot create the token themselves regardless of the permissions being assigned.", "E": "On a Developer or Starter plan, this configuration would be impossible — only Semantic Layer permission sets are available to service tokens on those tiers."}, "correct_answers": ["A", "D"], "explanations": {"A": {"label": "✅ Correct", "text": "A single service token can carry **multiple permission sets**, and each permission set can be scoped to **all projects** or to **specific projects**. The architect's intent — `Job Admin` on Project A + `Read-Only` on Project B in a single token — is exactly the canonical least-privilege pattern that service tokens are designed to support."}, "B": {"label": "❌ Incorrect", "text": "Service tokens explicitly support multiple permission sets per token. Splitting into two tokens is unnecessary and reduces operational simplicity (more secrets to rotate)."}, "C": {"label": "❌ Incorrect", "text": "License type does not determine service-token creation rights. **Account Admin permission** is required to create service tokens, regardless of the creator's license."}, "D": {"label": "✅ Correct", "text": "Service token creation is gated by **Account Admin permission**, not by license type. A Developer-licensed user without Account Admin cannot create the token; either grant them Account Admin (likely overkill) or have an Account Admin create the token on their behalf."}, "E": {"label": "❌ Incorrect (in this scenario)", "text": "This statement is factually true — on Developer/Starter plans, service tokens can only be assigned **Semantic Layer permissions**. However, the scenario specifies the **Enterprise plan**, so the architect has access to all permission sets. E is therefore not a correct answer for this question."}}, "key_rule": "Service tokens — multiple permission sets per token, each project-scopable. Created by Account Admin only (not license-gated). Permission set availability: Enterprise/Enterprise+ = any; Legacy Team = limited; Developer/Starter = Semantic Layer only."}, {"id": "q07_Q1", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 1, "high_yield": true, "subdomain_id": "6.1", "subdomain_topic": "Webhook silent auto-disable", "question_text": "A team configures a webhook to send job failure alerts to a Slack channel. Three weeks later, they realize the Slack channel has been silent even though production jobs have been failing. Investigation reveals the webhook endpoint was briefly unreachable for a few days earlier in the month. What happened to the webhook?", "is_multi_select": false, "options": {"A": "The webhook paused delivery temporarily and resumed automatically once the endpoint was reachable again.", "B": "After 5 consecutive delivery failures, the webhook silently auto-disabled — no alert was sent when it disabled.", "C": "After 3 delivery failures, dbt Cloud sent an email to the account admin before disabling the webhook.", "D": "Webhooks have a 30-minute retry window — if delivery fails within that window, the event is dropped but the webhook stays active."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Webhooks do not auto-resume — once disabled by 5 consecutive failures, they remain disabled until manually re-enabled."}, "B": {"label": "✅ Correct", "text": "After **5 consecutive delivery failures**, dbt Cloud **silently auto-disables** the webhook — no notification is sent to alert the team. This is a critical monitoring gap: if a webhook endpoint goes down even briefly, alerts can stop permanently without any warning. Proactively monitor webhook health status in dbt Cloud or via external uptime checks."}, "C": {"label": "❌ Incorrect", "text": "There is no email notification when a webhook is auto-disabled. The disable is entirely silent."}, "D": {"label": "❌ Incorrect", "text": "The retry/failure tracking is based on consecutive failures across events, not a 30-minute window."}}, "key_rule": "**5 consecutive failures = silent webhook auto-disable**. Monitor webhook status proactively."}, {"id": "q07_Q2", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 2, "high_yield": true, "subdomain_id": "6.2", "subdomain_topic": "Webhook event timing and artifacts", "question_text": "A team's webhook handler listens for `job.run.errored` events and immediately queries the dbt Cloud API for the run's artifacts (manifest, catalog, sources) to post a diagnostic report to their incident channel. The handler fails to retrieve any artifacts. Why?", "is_multi_select": false, "options": {"A": "`job.run.errored` events don't include the run ID needed to query artifacts.", "B": "Artifacts are only stored for successful runs — errored runs have no artifacts.", "C": "`job.run.errored` fires **before** artifact ingestion — artifacts are not yet available at handler time. Use `job.run.completed` instead.", "D": "The webhook needs the `artifact_read` scope on its service token to access artifacts."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`job.run.errored` events include the run ID and other run metadata."}, "B": {"label": "❌ Incorrect", "text": "Artifacts can be generated for errored runs (partial artifacts) — the issue is timing, not existence."}, "C": {"label": "✅ Correct", "text": "`job.run.errored` fires **immediately** when an error is detected — before dbt Cloud has finished ingesting artifacts. `job.run.completed` fires **after** artifact ingestion is complete, making it the correct event for any handler that needs to query the API for run artifacts. Use `errored` only when you need the fastest possible notification and don't need artifacts."}, "D": {"label": "❌ Incorrect", "text": "Artifact access is controlled by service token permission sets, not a specific `artifact_read` scope."}}, "key_rule": "`errored` = fires before artifacts (fast notification). `completed` = fires after artifacts (use when you need API data)."}, {"id": "q07_Q3", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 3, "high_yield": false, "subdomain_id": "6.3", "subdomain_topic": "Webhook event types", "question_text": "Which of the following are valid dbt Cloud webhook event types? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "`job.run.started`", "B": "`job.run.queued`", "C": "`job.run.completed`", "D": "`job.run.cancelled`", "E": "`job.run.timeout`"}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "`job.run.started` fires when a job run begins execution. It's one of the three supported webhook event types."}, "B": {"label": "❌ Incorrect", "text": "`job.run.queued` is not a supported webhook event type. There is no webhook for when a job enters the queue."}, "C": {"label": "✅ Correct", "text": "`job.run.completed` fires after the run finishes (success or partial) AND after artifact ingestion. One of the three supported event types."}, "D": {"label": "❌ Incorrect", "text": "`job.run.cancelled` is not a supported webhook event type."}, "E": {"label": "❌ Incorrect", "text": "`job.run.timeout` is not a supported webhook event type."}}, "key_rule": "Three webhook events only: `job.run.started`, `job.run.completed`, `job.run.errored`."}, {"id": "q07_Q4", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 4, "high_yield": false, "subdomain_id": "6.4", "subdomain_topic": "Webhook response requirements", "question_text": "A team implements a webhook handler in AWS Lambda that processes dbt Cloud job events. The Lambda function takes an average of 25 seconds to complete processing. What is the risk?", "is_multi_select": false, "options": {"A": "No risk — dbt Cloud webhooks have no response time requirements.", "B": "The Lambda response time exceeds the 10-second window — dbt Cloud treats the delivery as failed, incrementing the failure counter toward the 5-failure auto-disable threshold.", "C": "The webhook will deliver successfully but the payload will be truncated after 10 seconds.", "D": "Responses over 15 seconds are retried automatically by dbt Cloud with exponential backoff."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud has a strict 10-second response window for webhook handlers."}, "B": {"label": "✅ Correct", "text": "Webhook handlers must return a **2xx HTTP status within 10 seconds**. If the handler takes 25 seconds to respond, dbt Cloud marks the delivery as a **failure** — incrementing toward the 5-failure silent auto-disable threshold. Fix: respond immediately with `200 OK`, then process the event asynchronously (e.g., push to SQS, return 200, Lambda processes separately)."}, "C": {"label": "❌ Incorrect", "text": "The payload is not truncated — the connection times out and dbt marks it as a delivery failure."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does retry failed deliveries, but the 10-second timeout is the trigger for failure, not a 15-second threshold. And exponential backoff is not the documented retry mechanism."}}, "key_rule": "Webhook handler must return **2xx within 10 seconds**. Slow handlers = delivery failure = risk of auto-disable."}, {"id": "q07_Q5", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 5, "high_yield": false, "subdomain_id": "6.5", "subdomain_topic": "Webhook delivery history", "question_text": "A security audit requires reviewing all webhook deliveries for a specific webhook over the past 45 days. Is this possible in dbt Cloud?", "is_multi_select": false, "options": {"A": "Yes — dbt Cloud stores complete webhook delivery history indefinitely.", "B": "No — dbt Cloud stores only the last 30 days of webhook delivery history. Events older than 30 days are not accessible.", "C": "Yes — 60 days of delivery history is available in Account Settings → Webhooks.", "D": "No — webhook delivery history is not stored; only the webhook configuration is retained."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Webhook history is retained for a fixed window, not indefinitely."}, "B": {"label": "✅ Correct", "text": "dbt Cloud retains **30 days** of delivery history per webhook. The 45-day audit request cannot be fulfilled from dbt Cloud — events older than 30 days are no longer accessible. For longer retention, webhook payloads should be persisted to an external store (e.g., S3, database) in the handler."}, "C": {"label": "❌ Incorrect", "text": "The retention window is 30 days, not 60 days."}, "D": {"label": "❌ Incorrect", "text": "Delivery history is stored — but only for 30 days."}}, "key_rule": "Webhook delivery history = **30 days only**. For longer retention, persist payloads in your handler."}, {"id": "q07_Q6", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 6, "high_yield": false, "subdomain_id": "6.6", "subdomain_topic": "Email notifications", "question_text": "A small team on the Starter plan wants to receive alerts when their nightly dbt production job fails. They do not want to build a webhook handler. What is the simplest solution, and are there any plan restrictions?", "is_multi_select": false, "options": {"A": "Email notifications require Enterprise plan — Starter teams must use webhooks.", "B": "Email notifications can be configured per job on any plan (including Starter) — no plan restriction applies. They can trigger on success, failure, or both.", "C": "Email notifications are only available for CI jobs — deploy jobs require webhooks.", "D": "Email notifications require a verified custom domain on the account."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Email notifications have no plan restriction — they are available on all plans including Starter and Developer."}, "B": {"label": "✅ Correct", "text": "**Email notifications** are the simplest alerting option in dbt Cloud. They are configured per job and have **no plan restrictions**. They can be set to trigger on success, failure, or both. For teams that don't need programmatic handling, email notifications are the recommended starting point before investing in webhook infrastructure."}, "C": {"label": "❌ Incorrect", "text": "Email notifications work for both CI jobs and deploy jobs."}, "D": {"label": "❌ Incorrect", "text": "Custom domain verification is not required for email notifications — they use dbt Cloud's email service."}}, "key_rule": "Email notifications = no plan restriction, per-job config, success/failure/both. Simplest alerting option — no webhook required."}, {"id": "q07_Q7", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 7, "high_yield": false, "subdomain_id": "6.7", "subdomain_topic": "job.run.started event", "question_text": "A team builds a webhook handler to pre-provision compute resources before a dbt job begins. They want the handler to fire as early as possible in the job lifecycle. Which webhook event should they subscribe to?", "is_multi_select": false, "options": {"A": "`job.run.completed` — fired when the job finishes, allowing post-run provisioning.", "B": "`job.run.errored` — fired if the job encounters errors.", "C": "`job.run.started` — fired when the job begins execution, before any models run.", "D": "There is no webhook event for job start — only completion and error events exist."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`job.run.completed` fires after the job finishes — too late for pre-provisioning compute before the run."}, "B": {"label": "❌ Incorrect", "text": "`job.run.errored` fires only when there is an error — it is not reliable for pre-run provisioning."}, "C": {"label": "✅ Correct", "text": "`job.run.started` fires at the **beginning of job execution**, before any models run. This is the correct event for tasks that must happen before the run begins, such as resuming a suspended warehouse, pre-warming a cache, or provisioning compute resources."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud has three webhook event types including `job.run.started`."}}, "key_rule": "`job.run.started` = fires at job start (before any models). Use for pre-run provisioning tasks."}, {"id": "q07_Q8", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 8, "high_yield": false, "subdomain_id": "6.8", "subdomain_topic": "job.run.completed timing", "question_text": "A team's webhook handler subscribes to `job.run.errored` and tries to immediately fetch the dbt Cloud run artifacts (manifest, catalog) via the API to send a diagnostic report. The API calls return empty or 404. A colleague suggests switching to `job.run.completed` instead. Why would this help?", "is_multi_select": false, "options": {"A": "`job.run.completed` fires faster than `job.run.errored`, so the API has more time to populate.", "B": "`job.run.errored` fires **before** artifact ingestion into the API. `job.run.completed` fires **after** artifacts have been ingested, so the API will have the run data available.", "C": "The artifacts endpoint requires an OAuth token, which is only generated after `job.run.completed`.", "D": "`job.run.errored` only includes partial run data — `job.run.completed` is always required to access full artifacts."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`job.run.errored` actually fires faster than `job.run.completed` — it fires immediately on error. Speed is not the differentiator; artifact availability is."}, "B": {"label": "✅ Correct", "text": "**`job.run.errored`** fires **immediately** when the job encounters an error — before dbt Cloud has finished ingesting run artifacts into the API. **`job.run.completed`** fires after **both** job completion AND artifact ingestion. If your handler needs to query the API for run artifacts (manifest, catalog, sources, run results), use `job.run.completed` to guarantee the data is available. The trade-off: `completed` is slightly delayed compared to `errored`."}, "C": {"label": "❌ Incorrect", "text": "OAuth token generation is not tied to webhook event type. API authentication is independent of which event fired."}, "D": {"label": "❌ Incorrect", "text": "Both events can eventually lead to full artifact access — the difference is timing, not data completeness."}}, "key_rule": "`job.run.errored` = fast, but artifacts not yet in API. `job.run.completed` = delayed, but artifacts are ready. Use `completed` when you need artifacts."}, {"id": "q07_Q9", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 9, "high_yield": false, "subdomain_id": "6.9", "subdomain_topic": "Three webhook event types", "question_text": "A team is designing their dbt Cloud monitoring stack. Which of the following correctly describes all three webhook event types and their primary use case?", "is_multi_select": false, "options": {"A": "`job.run.started` (pre-run prep), `job.run.completed` (post-run with artifacts available), `job.run.errored` (immediate error alert — no artifact guarantee)", "B": "`job.run.started` (fires at completion), `job.run.completed` (fires mid-run), `job.run.errored` (fires at start)", "C": "`job.run.started`, `job.run.paused`, `job.run.completed`", "D": "`job.run.queued`, `job.run.completed`, `job.run.errored`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The three dbt Cloud webhook event types are: **`job.run.started`** — fires when a job begins (before any models run; use for pre-run provisioning); **`job.run.completed`** — fires after completion AND artifact ingestion (safe to query API for artifacts); **`job.run.errored`** — fires immediately on error (fastest for alerting, but API artifacts may not yet be available)."}, "B": {"label": "❌ Incorrect", "text": "The timings described are all wrong — this inverts the actual behavior of each event."}, "C": {"label": "❌ Incorrect", "text": "`job.run.paused` is not a documented dbt Cloud webhook event type."}, "D": {"label": "❌ Incorrect", "text": "`job.run.queued` is not a documented dbt Cloud webhook event type. The three events are `started`, `completed`, and `errored`."}}, "key_rule": "Three events = `started` (pre-run), `completed` (post-run + artifacts ready), `errored` (fast alert, no artifact guarantee)."}, {"id": "q07_Q10", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 10, "high_yield": false, "subdomain_id": "6.10", "subdomain_topic": "Webhook signature validation", "question_text": "A security engineer asks how to verify that incoming webhook payloads are genuinely from dbt Cloud and not spoofed by a third party. What mechanism does dbt Cloud use?", "is_multi_select": false, "options": {"A": "Webhook payloads include an API key in the URL query string that matches the dbt Cloud account's API key.", "B": "dbt Cloud signs payloads using **SHA256 HMAC** and includes the signature in the **Authorization header** — recipients should compute the expected signature and compare.", "C": "dbt Cloud uses mutual TLS — the receiving endpoint must present a valid certificate from dbt Labs' CA.", "D": "Webhook payloads are encrypted using the account's public key — only the account's private key can decrypt them."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "API keys in query strings are not the dbt Cloud webhook security model and would be visible in logs."}, "B": {"label": "✅ Correct", "text": "dbt Cloud webhook payloads are signed using **SHA256 HMAC** with a shared secret. The signature is included in the **Authorization header** of each webhook delivery. Recipients should compute their own HMAC SHA256 signature using the shared secret and compare it to the header value. A mismatch indicates a spoofed or tampered payload. This is the same pattern used by GitHub, Stripe, and other services for webhook security."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not use mutual TLS for webhook delivery. Standard HTTPS is used for the transport, with HMAC for payload integrity."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not use asymmetric encryption for webhook payloads."}}, "key_rule": "Webhook security = **SHA256 HMAC signature** in Authorization header. Verify by computing expected HMAC and comparing."}, {"id": "q07_Q11", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 11, "high_yield": false, "subdomain_id": "6.11", "subdomain_topic": "Re-enabling a disabled webhook", "question_text": "A team discovers their webhook was silently disabled after consecutive delivery failures. After fixing the endpoint, how do they re-enable the webhook?", "is_multi_select": false, "options": {"A": "The webhook auto-re-enables after the endpoint returns a successful 2xx response to dbt Cloud's health check.", "B": "The webhook must be deleted and recreated with the same URL and secret.", "C": "The webhook must be manually re-enabled in the dbt Cloud UI — it does not auto-recover.", "D": "Contact dbt Cloud support to re-enable webhooks that have been auto-disabled."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no documented health check mechanism that auto-re-enables disabled webhooks."}, "B": {"label": "❌ Incorrect", "text": "Deleting and recreating is not required — the webhook can be re-enabled directly."}, "C": {"label": "✅ Correct", "text": "After a webhook is auto-disabled due to 5 consecutive delivery failures, it must be **manually re-enabled** in the dbt Cloud UI. It does not auto-recover. This is why proactive monitoring of webhook status is critical — the disable is silent, and re-enabling requires a human action. Navigate to Account Settings → Webhooks, find the disabled webhook, and toggle it back on after fixing the endpoint."}, "D": {"label": "❌ Incorrect", "text": "Re-enabling a disabled webhook is self-service in the dbt Cloud UI — support is not required."}}, "key_rule": "Disabled webhook (after 5 failures) = **manual re-enable required** in dbt Cloud UI. No auto-recovery."}, {"id": "q07_Q12", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 12, "high_yield": false, "subdomain_id": "6.12", "subdomain_topic": "Webhook response window", "question_text": "A team builds a webhook handler that performs heavy data processing synchronously — querying multiple APIs and writing to a database — before returning a response. The average processing time is 12 seconds. What is the risk?", "is_multi_select": false, "options": {"A": "No risk — dbt Cloud waits up to 60 seconds for a response.", "B": "The webhook delivery will be counted as a failure — dbt Cloud requires a 2xx response within **10 seconds**. Exceeding this causes a timeout failure, which counts toward the 5-failure auto-disable threshold.", "C": "The webhook will succeed but dbt Cloud will throttle future deliveries for that endpoint.", "D": "A 12-second response is within the acceptable range — the timeout is 30 seconds."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The timeout is 10 seconds, not 60 seconds."}, "B": {"label": "✅ Correct", "text": "dbt Cloud requires a **2xx HTTP response within 10 seconds**. If the handler takes longer than 10 seconds, dbt Cloud treats the delivery as a timeout failure — even if the processing eventually succeeds. Each timeout counts toward the **5-failure auto-disable threshold**. The fix: respond with a 200 immediately, then process asynchronously (e.g., push to a queue or trigger a background job)."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not implement throttling per se — the consequence of slow responses is failure counting and eventual disable."}, "D": {"label": "❌ Incorrect", "text": "The timeout is 10 seconds, not 30."}}, "key_rule": "Webhook = must return 2xx within **10 seconds**. Respond immediately and process asynchronously."}, {"id": "q07_Q13", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 13, "high_yield": false, "subdomain_id": "6.13", "subdomain_topic": "Job auto-deactivation", "question_text": "An engineer notices that a scheduled dbt job has stopped enqueuing runs automatically, even though the schedule is still configured. Investigation shows the job has failed on every run for the past 3 months. What feature likely caused this?", "is_multi_select": false, "options": {"A": "dbt Cloud automatically pauses jobs that exceed their configured run timeout.", "B": "The job reached the **100 consecutive failure** threshold and was auto-deactivated by the job auto-deactivation Beta feature — it stopped auto-enqueueing new runs.", "C": "The run slot quota was exhausted — no new jobs can be scheduled until existing queued runs complete.", "D": "The job's cron schedule expired — cron jobs must be renewed after 90 days."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Run timeout causes individual runs to cancel, not the job to be deactivated."}, "B": {"label": "✅ Correct", "text": "The **job auto-deactivation** feature (Beta) automatically stops a scheduled job from auto-enqueueing new runs after **100 consecutive failures**. This prevents a persistently broken job from consuming run slots indefinitely. The job itself is not deleted — it can be manually re-enabled and re-run. This is a housekeeping feature to prevent runaway broken jobs."}, "C": {"label": "❌ Incorrect", "text": "Run slot exhaustion would delay queuing, not permanently stop auto-enqueueing."}, "D": {"label": "❌ Incorrect", "text": "cron jobs do not expire on a 90-day cycle in dbt Cloud."}}, "key_rule": "Job auto-deactivation Beta = scheduled job stops auto-enqueueing after **100 consecutive failures**. Job is not deleted — manually re-enable after fixing the root cause."}, {"id": "q07_Q14", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 14, "high_yield": false, "subdomain_id": "6.14", "subdomain_topic": "Run slots", "question_text": "An organization on the **Starter plan** has two production jobs: Job A (takes 45 minutes) and Job B (takes 20 minutes). Both are scheduled to start at 6:00 AM. What happens?", "is_multi_select": false, "options": {"A": "Both jobs start simultaneously at 6:00 AM — Starter plan supports concurrent execution.", "B": "Job A starts at 6:00 AM. Job B queues and starts only after Job A completes at approximately 6:45 AM — Starter plan has **1 run slot**.", "C": "dbt Cloud cancels the lower-priority job (Job B) to ensure Job A completes without interference.", "D": "Both jobs run in parallel but share the same compute resources, slowing both down."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Starter plan has only 1 run slot — concurrent execution is not possible for deploy jobs."}, "B": {"label": "✅ Correct", "text": "**Developer and Starter plans have exactly 1 run slot**. Only one deploy job can run at a time. When two jobs are scheduled simultaneously, the second job queues and waits for the first to finish. With Job A taking 45 minutes, Job B would start around 6:45 AM instead of 6:00 AM. Note: CI jobs bypass the run slot system entirely."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud queues jobs — it does not cancel lower-priority ones."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not share compute between jobs — each job runs in its own isolated execution environment."}}, "key_rule": "Developer/Starter = **1 run slot**. Second job queues until first completes. CI jobs bypass slots entirely."}, {"id": "q07_Q15", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 15, "high_yield": false, "subdomain_id": "6.15", "subdomain_topic": "Memory limit per run pod", "question_text": "A team uses a dbt macro to load a large reference dataset into a Jinja variable during compilation. The macro reads the dataset using `run_query()` and stores it in a variable for downstream use across hundreds of models. Jobs start failing with out-of-memory errors. What is the cause and what is the limit?", "is_multi_select": false, "options": {"A": "The default thread count (4) causes memory contention — reduce threads to 1.", "B": "dbt Cloud imposes a **600 MiB memory limit** per run pod on all plans. Loading large datasets into Jinja variables via macros exhausts this limit.", "C": "The `run_query()` function is limited to 10,000 rows — the macro is truncating data.", "D": "The memory limit is 2 GiB on Enterprise+ and 512 MiB on other plans."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Thread count affects warehouse concurrency, not the dbt run pod memory."}, "B": {"label": "✅ Correct", "text": "dbt Cloud enforces a **600 MiB memory limit per run pod** on **all plans** — this is not configurable. Loading large datasets into Jinja variables (via `run_query()`) is the most common cause of OOM failures. The data must fit within the pod's memory budget. The fix: move large lookups to the warehouse layer rather than loading them into dbt compilation memory."}, "C": {"label": "❌ Incorrect", "text": "`run_query()` is not row-limited — it returns all results, which is exactly what causes the memory issue."}, "D": {"label": "❌ Incorrect", "text": "The memory limit is **600 MiB on all plans** — it does not vary by plan tier."}}, "key_rule": "dbt Cloud run pod memory limit = **600 MiB, all plans, not configurable**. Loading large datasets into macros causes OOM failures."}, {"id": "q07_Q16", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 16, "high_yield": false, "subdomain_id": "6.16", "subdomain_topic": "Thread count", "question_text": "A team increases the thread count on their dbt Cloud job from the default of 4 to 32, hoping to significantly speed up their 500-model deployment job. What is the likely outcome?", "is_multi_select": false, "options": {"A": "The job runs approximately 8× faster — thread count scales linearly with throughput.", "B": "The job may actually slow down or cause errors — high thread counts cause warehouse connection contention and may exceed the warehouse's concurrent query limits.", "C": "The job runs faster, but the cost increases proportionally to the thread count.", "D": "Thread count above 16 is blocked by dbt Cloud and will revert to 16 automatically."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Thread count does not scale linearly. Warehouse concurrency limits, connection pooling, and query queue depth all constrain the practical benefit of high thread counts."}, "B": {"label": "✅ Correct", "text": "The default thread count is **4**. Increasing it too aggressively causes **warehouse connection contention** — too many concurrent queries can overwhelm connection pools, cause queue buildup, or hit the warehouse's concurrent query limit. This can actually slow the job down or cause intermittent query failures. Increase thread count carefully and test the impact on job duration and warehouse performance."}, "C": {"label": "❌ Incorrect", "text": "Cost is driven by warehouse compute (credits/DBU), not directly by dbt thread count."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not automatically cap or revert the thread count setting."}}, "key_rule": "Thread count default = **4**. Too high = warehouse contention and possible slowdown. Increase carefully and test."}, {"id": "q07_Q17", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 17, "high_yield": false, "subdomain_id": "6.17", "subdomain_topic": "Interval scheduling drift", "question_text": "A team schedules a job to run \"every 1 hour\" using dbt Cloud's interval scheduling. The first run starts at 9:07 AM due to a slight queue delay. At what time will the second run start, and why?", "is_multi_select": false, "options": {"A": "10:00 AM — interval scheduling is clock-aligned.", "B": "10:07 AM — interval scheduling counts elapsed time from the start of the previous run, not from a fixed clock time.", "C": "10:07 AM — interval scheduling counts elapsed time from the end of the previous run.", "D": "10:00 AM — dbt Cloud corrects for the initial queue delay automatically."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Interval scheduling is NOT clock-aligned. It drifts based on when the first run actually started."}, "B": {"label": "✅ Correct", "text": "dbt Cloud's interval scheduling mode counts **elapsed time from the start of the previous run** — not from a fixed clock time. If the first run starts at 9:07 AM, the next run starts at **10:07 AM**, then 11:07 AM, and so on. The drift compounds over time. For precise clock-aligned schedules (e.g., exactly at 9:00 AM, 10:00 AM), use **cron syntax** instead of interval mode."}, "C": {"label": "❌ Incorrect", "text": "The interval is measured from the start of the previous run, not from when it ends."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not auto-correct for initial queue delays."}}, "key_rule": "Interval scheduling = drifts (counts from run start, not clock). Use **cron syntax** for clock-aligned schedules."}, {"id": "q07_Q18", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 18, "high_yield": false, "subdomain_id": "6.18", "subdomain_topic": "Job duration exceeds schedule frequency", "question_text": "A job is scheduled to run \"every 30 minutes\" but each run takes 45 minutes to complete. What does dbt Cloud do?", "is_multi_select": false, "options": {"A": "dbt Cloud runs both the current job and the next scheduled run concurrently, using two run slots.", "B": "The scheduler cancels any queued runs and keeps only the newest — preventing queue buildup. The effective run frequency becomes approximately 45 minutes.", "C": "The job is automatically suspended after the second overlap and must be manually re-enabled.", "D": "The next scheduled run waits in the queue and starts immediately after the current run finishes, creating a permanent backlog."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Even if run slots were available, the scheduler's behavior is to prevent backlog, not to run concurrently."}, "B": {"label": "✅ Correct", "text": "When a job's runtime exceeds its scheduling frequency, dbt Cloud's scheduler **cancels queued runs and keeps only the newest**. This prevents queue buildup — instead of accumulating a growing backlog of delayed runs, only the most recent scheduled invocation stays in queue. The effective execution frequency naturally becomes the actual job duration (approx. 45 minutes in this case). This is protective behavior, not an error state."}, "C": {"label": "❌ Incorrect", "text": "Jobs are not suspended due to schedule/duration overlap."}, "D": {"label": "❌ Incorrect", "text": "The queue backlog scenario is specifically what dbt Cloud's scheduler prevents by cancelling stale queued runs."}}, "key_rule": "Job duration > schedule interval → scheduler cancels queued runs, keeps newest. Effective frequency = actual run duration."}, {"id": "q07_Q19", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 19, "high_yield": false, "subdomain_id": "6.19", "subdomain_topic": "Email vs webhook notifications", "question_text": "A data team is deciding between email notifications and webhooks for their job failure monitoring. Which statement correctly describes when each is the better choice?", "is_multi_select": false, "options": {"A": "Webhooks are always better — email notifications are only for legacy setups.", "B": "Email is simpler for basic per-job alerting with no infrastructure required. Webhooks are better when you need programmatic handling — triggering Slack bots, PagerDuty, incident management, or custom automation.", "C": "Email notifications support richer content (with model-level failure details) while webhooks only provide a pass/fail signal.", "D": "Webhooks are only available on Enterprise plan — Starter teams must use email."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Email notifications are a fully supported feature with a clear use case — they are not deprecated."}, "B": {"label": "✅ Correct", "text": "**Email notifications**: no plan restriction, no infrastructure, simple success/failure alerts per job — ideal for small teams or low-complexity monitoring. **Webhooks**: require an endpoint and handler, but enable programmatic responses — integrating with Slack, PagerDuty, incident management, or custom dashboards. Use email when you just need a notification; use webhooks when you need to act on the event or route it to another system."}, "C": {"label": "❌ Incorrect", "text": "Webhooks actually include richer payload data (run ID, job details, timestamps). Email notifications are simpler in content, not richer."}, "D": {"label": "❌ Incorrect", "text": "Webhooks are available on plans that support the feature — they are not exclusively Enterprise. Check current plan documentation for availability."}}, "key_rule": "Email = simple, no infra, per-job alerts. Webhook = programmatic, integrate with Slack/PagerDuty/automation."}, {"id": "q07_Q20", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 20, "high_yield": false, "subdomain_id": "6.20", "subdomain_topic": "Webhook retry and disable behavior", "question_text": "A team's webhook endpoint is down for maintenance for 6 hours. During that time, dbt Cloud attempts to deliver webhook events for 5 job runs. All 5 deliveries fail (timeout). What happens after the 5th failure, and what must the team do to restore normal webhook operation?", "is_multi_select": false, "options": {"A": "dbt Cloud queues the 5 failed deliveries and replays them once the endpoint is back online.", "B": "After 5 consecutive failures, dbt Cloud **silently auto-disables** the webhook. The team must manually re-enable it in the dbt Cloud UI after restoring the endpoint.", "C": "dbt Cloud sends an email alert to Account Admins warning that the webhook has been disabled.", "D": "dbt Cloud retries each failed delivery up to 3 times with exponential backoff before marking it as failed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not queue and replay failed deliveries. Failed deliveries are lost."}, "B": {"label": "✅ Correct", "text": "After **5 consecutive delivery failures**, the webhook is **silently auto-disabled** — no notification is sent. The team must **manually re-enable the webhook** in the dbt Cloud UI after their endpoint is restored. The 5 missed events are lost; there is no replay. The 30-day delivery history shows the failed attempts, but the data is not re-delivered. This is why proactive webhook monitoring is critical."}, "C": {"label": "❌ Incorrect", "text": "No email alert is sent when a webhook is auto-disabled. The disable is silent — that is the critical gotcha."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not implement exponential backoff retries for individual webhook deliveries. Each attempt either succeeds (2xx within 10 seconds) or fails."}}, "key_rule": "5 consecutive webhook failures = **silent auto-disable**. No notification sent. Must manually re-enable. Failed deliveries are not replayed."}, {"id": "q08_Q1", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 1, "high_yield": true, "subdomain_id": "7.1", "subdomain_topic": "Cross-project environment resolution", "question_text": "A dbt Mesh has two projects: `platform` (producer) and `marketing` (consumer). The `platform` project has both a Staging environment and a Production environment. A developer's IDE job in `marketing` references a public model from `platform`. Which environment does `marketing`'s development job resolve the cross-project ref against?", "is_multi_select": false, "options": {"A": "Production — development jobs always use production data for stability.", "B": "Staging — development jobs in a consumer project resolve against the producer's Staging environment when one exists.", "C": "Development — cross-project refs always resolve against the producer's Development environment.", "D": "The job fails — cross-project refs cannot be resolved from the IDE."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Development jobs do NOT resolve to Production by default when a Staging environment exists."}, "B": {"label": "✅ Correct", "text": "The cross-project env resolution table (memorize this): Development → **Staging (if exists), else Production**. Since `platform` has a Staging environment, the `marketing` developer's IDE job resolves refs there."}, "C": {"label": "❌ Incorrect", "text": "Cross-project refs never resolve to the producer's Development environment — Development environments are not exposed for cross-project consumption."}, "D": {"label": "❌ Incorrect", "text": "Cross-project refs from the IDE are fully supported (Enterprise+)."}}, "key_rule": "Dev → Staging (if exists), else Production. Staging → Staging. Production → Production."}, {"id": "q08_Q2", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 2, "high_yield": true, "subdomain_id": "7.2", "subdomain_topic": "Setting up additional dbt projects stepwise", "question_text": "An architect is setting up a bidirectional dependency between ProjectA and ProjectB in dbt Mesh simultaneously — adding both `dependencies.yml` entries at the same time and running both projects at once. Both fail to resolve cross-project refs. What went wrong?", "is_multi_select": false, "options": {"A": "Bidirectional dependencies are not supported in dbt Mesh — only one-directional.", "B": "Cross-project dependencies must be set up **stepwise**: the producer runs first to generate its manifest, then the consumer adds the dependency and runs. Setting both up simultaneously creates a bootstrap failure.", "C": "The project names in `dependencies.yml` use mismatched casing.", "D": "Both projects need to be on the same dbt version for cross-project refs to work."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Bidirectional dependencies between projects can be set up — but must be done stepwise, not simultaneously."}, "B": {"label": "✅ Correct", "text": "Cross-project dependencies require a **chicken-and-egg stepwise setup**: (1) Producer project runs and generates its manifest first. (2) Consumer project adds the dependency in `dependencies.yml` and runs. Setting both up simultaneously means neither has a manifest to resolve against, causing both to fail."}, "C": {"label": "❌ Incorrect", "text": "Case sensitivity in `dependencies.yml` is a real gotcha, but the scenario specifically describes a simultaneous setup failure — that's a stepwise issue, not a naming issue."}, "D": {"label": "❌ Incorrect", "text": "There is no requirement for matching dbt versions across Mesh projects."}}, "key_rule": "Mesh setup = **stepwise**. Producer runs first → consumer adds dependency → consumer runs. Never simultaneous."}, {"id": "q08_Q3", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 3, "high_yield": true, "subdomain_id": "7.3", "subdomain_topic": "Ephemeral models cannot be public", "question_text": "A data engineer sets `access: public` on an ephemeral model to share it across projects. What happens?", "is_multi_select": false, "options": {"A": "The model becomes public and is available for cross-project refs.", "B": "dbt throws a **parsing error** — ephemeral models cannot have `access: public`.", "C": "The model is automatically converted to a view to support public access.", "D": "The model compiles but fails at runtime with an access violation."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Ephemeral models don't create a physical relation in the database — they can't be referenced cross-project."}, "B": {"label": "✅ Correct", "text": "Ephemeral models cannot have `access: public` — dbt raises a **parsing error** immediately. Ephemeral models can be `protected` or `private`, but not `public`. This is because public access requires the model to produce a referenceable relation in the database, which ephemeral models don't do."}, "C": {"label": "❌ Incorrect", "text": "dbt does not auto-convert materialization types based on access levels."}, "D": {"label": "❌ Incorrect", "text": "The error occurs at **parse time**, not runtime."}}, "key_rule": "Ephemeral + `access: public` = **parsing error**. Ephemeral can only be `protected` or `private`."}, {"id": "q08_Q4", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 4, "high_yield": true, "subdomain_id": "7.4", "subdomain_topic": "Model contracts must declare all columns", "question_text": "A team adds `contract: enforced: true` to a model but only declares 3 of the model's 15 columns in the YAML. What happens?", "is_multi_select": false, "options": {"A": "The contract validates only the 3 declared columns and ignores the rest.", "B": "dbt raises a compilation error — contracts require ALL columns to be declared when `enforced: true`.", "C": "The contract compiles successfully; undeclared columns get default type validation.", "D": "The contract enforces the 3 declared columns and auto-discovers the remaining 12 from the database."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Partial contracts are not supported — you cannot selectively enforce some columns."}, "B": {"label": "✅ Correct", "text": "When `contract: enforced: true`, **ALL columns must be declared** in the model's YAML. Partial declarations cause a compilation error. This is by design — a contract guarantees the complete schema, not just selected columns."}, "C": {"label": "❌ Incorrect", "text": "There are no default type validations for undeclared columns. The compilation fails."}, "D": {"label": "❌ Incorrect", "text": "dbt does not auto-discover or infer contract columns — all must be explicitly declared."}}, "key_rule": "Contracts = **ALL columns must be declared**. Partial contracts not supported → compilation error."}, {"id": "q08_Q5", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 5, "high_yield": true, "subdomain_id": "7.5", "subdomain_topic": "check constraint platform support", "question_text": "A team uses Snowflake as their warehouse and adds a `check` constraint to a model contract expecting it to enforce data validation at the database level. Will this work?", "is_multi_select": false, "options": {"A": "Yes — Snowflake enforces `check` constraints defined in dbt contracts.", "B": "No — Snowflake does not support `check` constraints in dbt contracts. Only Postgres and Databricks enforce them.", "C": "Yes — but only when using the Fusion engine with PKCS#8 key pair authentication.", "D": "No — `check` constraints are not supported in dbt contracts on any platform."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Snowflake does NOT support `check` constraints in dbt. The constraint will be defined in the YAML but not enforced at the database level."}, "B": {"label": "✅ Correct", "text": "`check` constraints are only enforced by **Postgres** and **Databricks**. On Snowflake and BigQuery, `check` constraints are unsupported (dbt will either error or silently ignore them)."}, "C": {"label": "❌ Incorrect", "text": "The Fusion engine is related to performance and key pair auth — it doesn't change constraint enforcement capabilities."}, "D": {"label": "❌ Incorrect", "text": "`check` constraints ARE supported — just not on all platforms. Postgres and Databricks enforce them."}}, "key_rule": "`check` constraints = **Postgres + Databricks only**. Snowflake and BigQuery do NOT support them."}, {"id": "q08_Q6", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 6, "high_yield": true, "subdomain_id": "7.6", "subdomain_topic": "Requirements for cross-project refs", "question_text": "A team on dbt Cloud Enterprise has set `access: public` on a model in ProjectA and wants ProjectB to reference it. They add the `ref()` call in ProjectB but get a resolution error. What else is required? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Upgrade to Enterprise+ plan — cross-project refs require Enterprise+, not Enterprise.", "B": "Add ProjectA to ProjectB's `dependencies.yml` under the `projects:` key.", "C": "Ensure the project name in `dependencies.yml` matches the name in `dbt_project.yml` exactly (case-sensitive).", "D": "Add a `public_models:` block to ProjectA's `dbt_project.yml`.", "E": "Configure a shared service token that both projects use for model resolution."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Cross-project refs require **Enterprise or Enterprise+** — both tiers support it. Enterprise alone is sufficient."}, "B": {"label": "✅ Correct", "text": "The consuming project (ProjectB) must list the producer project (ProjectA) in its `dependencies.yml` under the `projects:` key. Without this, dbt doesn't know to resolve refs against ProjectA's metadata."}, "C": {"label": "✅ Correct", "text": "The project name in `dependencies.yml` is **case-sensitive** and must exactly match the `name:` field in ProjectA's `dbt_project.yml`. A case mismatch causes silent resolution failures."}, "D": {"label": "❌ Incorrect", "text": "There is no `public_models:` block in `dbt_project.yml` — public access is declared on individual models via `access: public`."}, "E": {"label": "❌ Incorrect", "text": "Cross-project ref resolution uses the dbt Metadata Service — it doesn't require a shared service token between projects."}}, "key_rule": "Cross-project ref = `access: public` + Enterprise+ plan + **`dependencies.yml`** with exact case-sensitive project name."}, {"id": "q08_Q7", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 7, "high_yield": false, "subdomain_id": "7.7", "subdomain_topic": "Model versioning and deprecation", "question_text": "A public contracted model `dim_customers` is at `latest_version: 2`. Several downstream teams are still pinned to `v=1`. The platform team wants to retire v1. What is the correct approach?", "is_multi_select": false, "options": {"A": "Delete the `dim_customers_v1.sql` file directly — downstream consumers will auto-upgrade to v2.", "B": "Set a `deprecation_date` on v1 — this triggers a warning to all consumers still pinned on v1, giving them time to migrate before the date.", "C": "Change `latest_version` to `1` so all unpinned consumers revert to v1 while the team coordinates.", "D": "Set `access: private` on v1 to prevent new consumers from using it while allowing existing ones to continue."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deleting `v1.sql` immediately breaks all downstream consumers pinned on v1 — no migration window."}, "B": {"label": "✅ Correct", "text": "`deprecation_date` triggers a **compile-time warning** to all projects still using `ref('dim_customers', v=1)`, alerting them to migrate before the deprecation date. This is the correct graceful deprecation flow: create v2 → bump `latest_version` → set `deprecation_date` on v1 → notify consumers → delete v1 after the date."}, "C": {"label": "❌ Incorrect", "text": "Changing `latest_version` back to 1 doesn't help — consumers pinned to v1 are already on v1. Unpinned consumers would move to v1, which may be outdated for them."}, "D": {"label": "❌ Incorrect", "text": "Changing access to `private` would break cross-project consumers referencing v1 immediately — not a graceful migration."}}, "key_rule": "Retiring a model version = set `deprecation_date` → consumers get warnings. Never modify contracted public models in place."}, {"id": "q08_Q8", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 8, "high_yield": false, "subdomain_id": "7.8", "subdomain_topic": "Governance groups vs RBAC groups", "question_text": "A model is assigned to the `finance` governance group with `access: private`. A user in the RBAC \"Finance Team\" user group tries to reference this model from another model in a different governance group. Does their RBAC group membership grant them access?", "is_multi_select": false, "options": {"A": "Yes — being in the \"Finance Team\" RBAC group implies membership in the `finance` governance group.", "B": "No — governance groups and RBAC user groups are completely orthogonal concepts. RBAC user group membership does not grant governance group model access.", "C": "Yes — but only if the admin explicitly links the RBAC group to the governance group in Account Settings.", "D": "No — private model access requires the user to have a Developer license."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no automatic link between RBAC user groups and model governance groups — they are entirely independent systems."}, "B": {"label": "✅ Correct", "text": "**Governance groups** (model ownership boundaries — who can ref private models) and **RBAC user groups** (UI/job access permissions) are **completely orthogonal**. Being in the \"Finance Team\" RBAC group has zero effect on whether you can reference a private model in the `finance` governance group. Model group access is determined by the *model's* group, not the user's group."}, "C": {"label": "❌ Incorrect", "text": "There is no admin-linkable mapping between RBAC groups and governance groups in Account Settings."}, "D": {"label": "❌ Incorrect", "text": "License type is about UI feature access, not model governance group access."}}, "key_rule": "Governance groups ≠ RBAC user groups. **Completely orthogonal**. Model group controls which models can `ref()` private assets."}, {"id": "q08_Q9", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 9, "high_yield": false, "subdomain_id": "7.9", "subdomain_topic": "Multiple projects sharing sources", "question_text": "A dbt Mesh has three projects, each needing access to the same raw data sources (e.g., `raw.orders`, `raw.customers`). Can they all define `sources:` for these tables independently?", "is_multi_select": false, "options": {"A": "Yes — each project can define its own `sources:` for the same raw tables with no conflicts.", "B": "No — sources can only be defined in one project. Other projects must import the source definitions via packages.", "C": "Multiple projects can define the same sources, but this causes lineage duplication and is strongly discouraged. The recommended pattern is a foundational project with public staging models.", "D": "Sources are defined at the account level in dbt Cloud and shared automatically across all projects."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "While technically possible, defining the same sources in multiple projects creates lineage duplication and governance issues. It's explicitly discouraged."}, "B": {"label": "❌ Incorrect", "text": "Source definitions are not limited to a single project. The constraint is best-practice, not technical."}, "C": {"label": "✅ Correct", "text": "Multiple projects defining the same raw sources creates lineage duplication and distributed ownership. The **recommended Mesh pattern** is a single foundational project that owns the sources and exposes clean public staging models. Other projects reference these public staging models via cross-project refs — they never touch the raw sources directly."}, "D": {"label": "❌ Incorrect", "text": "Sources are not account-level constructs — they're defined within projects."}}, "key_rule": "Don't share `sources:` across Mesh projects. Use a **foundational project** with public staging models instead."}, {"id": "q08_Q10", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 10, "high_yield": false, "subdomain_id": "7.10", "subdomain_topic": "Recognizing Mesh in lineage graph", "question_text": "An architect is reviewing the dbt Catalog lineage graph for a project. Which of the following visual indicators confirm the project is part of a dbt Mesh? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Models are displayed with their schema and database names visible.", "B": "The graph shows distinct project boundary nodes — upstream projects appear as labeled groupings separate from the local project's DAG.", "C": "Lineage edges cross project boundaries with the upstream model labeled by its source project name.", "D": "All models display their `access` level (private/protected/public) next to their name.", "E": "The Catalog shows a \"Cost Insights\" tab for each project."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Schema and database names may be visible in any project setup — this is not a Mesh-specific indicator."}, "B": {"label": "✅ Correct", "text": "In a Mesh, upstream projects appear as distinct **project boundary nodes** in the lineage graph — labeled groupings separate from the consuming project's own model nodes. In a single-project setup, all nodes belong to one namespace with no project labels."}, "C": {"label": "✅ Correct", "text": "**Cross-project lineage edges** are a clear Mesh indicator — edges crossing project namespaces with the upstream model labeled by its source project name (e.g., `jaffle_finance.monthly_revenue`)."}, "D": {"label": "❌ Incorrect", "text": "Access level badges appear on public models specifically — but displaying access levels alone doesn't confirm Mesh. It's one indicator combined with others."}, "E": {"label": "❌ Incorrect", "text": "The Cost Insights tab is a Fusion/Enterprise+ feature unrelated to Mesh configuration."}}, "key_rule": "Mesh in lineage = **project boundary nodes** + **cross-project edges with source project labels**. Also: \"Find public models\" view in Catalog only appears with Mesh."}, {"id": "q08_Q11", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 11, "high_yield": true, "subdomain_id": "7.11", "subdomain_topic": "Incremental model + contract: on_schema_change", "question_text": "A contracted incremental model on Snowflake uses `on_schema_change: sync_all_columns`. The team runs a refresh and gets a compilation error. What is the issue?", "is_multi_select": false, "options": {"A": "`sync_all_columns` requires the Fusion engine to work with contracts.", "B": "Contracts on incremental models only support `on_schema_change: append_new_columns` or `fail` — `sync_all_columns` is not supported.", "C": "`sync_all_columns` is not a valid `on_schema_change` value — the correct value is `sync_columns`.", "D": "Contracted models cannot be incremental — they must be table or view materializations."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Fusion engine doesn't change the schema change handling for contracted incrementals."}, "B": {"label": "✅ Correct", "text": "When a model has both `contract: enforced: true` and is incremental, only `on_schema_change: append_new_columns` or `on_schema_change: fail` are supported. `sync_all_columns` drops and re-adds columns, which would violate the contract's column guarantees. dbt prevents this at compile time."}, "C": {"label": "❌ Incorrect", "text": "`sync_all_columns` is a valid `on_schema_change` value in general — it's just incompatible with contracts."}, "D": {"label": "❌ Incorrect", "text": "Contracted models can be incremental — they just have restricted schema change options."}}, "key_rule": "Incremental + contract = only `append_new_columns` or `fail`. `sync_all_columns` not supported with contracts."}, {"id": "q08_Q12", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 12, "high_yield": false, "subdomain_id": "7.12", "subdomain_topic": "Unpinned ref resolves to latest_version", "question_text": "A model in a consumer project references an upstream versioned model with an unpinned `ref('dim_customers')` call. The producer project has `latest_version: 2` with v1 and v2 both defined. Which version does the consumer reference?", "is_multi_select": false, "options": {"A": "v1 — unpinned refs always resolve to the lowest version for stability.", "B": "The call is ambiguous and raises a compile error — all versioned model refs must be pinned.", "C": "v2 — unpinned refs always resolve to `latest_version`.", "D": "The version used depends on which environment the job runs in."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Unpinned refs resolve to the *latest* version, not the lowest."}, "B": {"label": "❌ Incorrect", "text": "Unpinned refs are valid and resolve to `latest_version`. Only when you need a specific older version do you need to pin (e.g., `ref('dim_customers', v=1)`)."}, "C": {"label": "✅ Correct", "text": "An unpinned `ref('dim_customers')` **always resolves to `latest_version`**. Since `latest_version: 2`, the consumer gets v2. To pin to an older version: `ref('dim_customers', v=1)`. Cross-project: `ref('producer_project', 'dim_customers', v=1)`."}, "D": {"label": "❌ Incorrect", "text": "`latest_version` is a project-level definition — it doesn't vary by environment."}}, "key_rule": "Unpinned `ref('model')` → resolves to **`latest_version`**. Pin with `v=1` to use older versions."}, {"id": "q08_Q13", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 13, "high_yield": false, "subdomain_id": "7.13", "subdomain_topic": "Python models and contracts", "question_text": "A team wants to apply a dbt contract to a Python model to enforce column types across cross-project consumers. They add `contract: enforced: true` and declare all columns in the YAML. The contract is ignored and no validation occurs. Why?", "is_multi_select": false, "options": {"A": "Python models support contracts but require the `--enforce-contracts` flag at runtime.", "B": "dbt contracts only work on **SQL materializations** — Python models cannot have contracts enforced.", "C": "Contracts on Python models require dbt 1.5+ — the team is likely on an older version.", "D": "Python model contracts require BigQuery or Databricks — they are not supported on Snowflake."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `--enforce-contracts` runtime flag. Contracts are a compile-time feature, and Python models are simply not supported."}, "B": {"label": "✅ Correct", "text": "dbt **contracts are only supported on SQL materializations**. Python models are opaque to dbt's column-level introspection — dbt cannot enforce column types or constraints on Python model outputs because the schema is determined by the Python code at runtime, not by dbt's compilation. If governance is required on Python model outputs, the logic must be reimplemented as a SQL model."}, "C": {"label": "❌ Incorrect", "text": "Version is not the limitation. Python model contracts are architecturally unsupported regardless of dbt version."}, "D": {"label": "❌ Incorrect", "text": "The limitation is not platform-specific — Python model contracts are unsupported on all platforms."}}, "key_rule": "Contracts = **SQL models only**. Python models cannot have contracts. Reimplement as SQL if governance is required."}, {"id": "q08_Q14", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 14, "high_yield": false, "subdomain_id": "7.14", "subdomain_topic": "state:modified.contract selector", "question_text": "A platform team wants to detect when any model's contract has changed — specifically, when column names or data types in a contracted model's YAML definition have been modified. Which state selector should they use in their CI job?", "is_multi_select": false, "options": {"A": "`state:modified.body` — detects SQL content changes", "B": "`state:modified.configs` — detects all configuration changes", "C": "`state:modified.contract` — specifically detects contract changes (column names or types)", "D": "`state:modified.relation` — detects schema changes"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`state:modified.body` detects changes to the model's SQL or seed file content — not YAML contract definitions."}, "B": {"label": "❌ Incorrect", "text": "`state:modified.configs` detects configuration changes but **excludes** database/schema/alias changes. It also does not specifically target contract column/type changes."}, "C": {"label": "✅ Correct", "text": "**`state:modified.contract`** is the precise selector for detecting when a model's **contract has changed** — specifically column names or data types in the contract definition. This is essential in a dbt Mesh: if a contracted public model's column types change, downstream consumers need to know. Using this selector in CI ensures contract changes are always caught and validated."}, "D": {"label": "❌ Incorrect", "text": "`state:modified.relation` detects changes to database, schema, or alias — not contract definitions."}}, "key_rule": "`state:modified.contract` = detects contract changes (column names/types). Use in CI for contracted public models."}, {"id": "q08_Q15", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 15, "high_yield": false, "subdomain_id": "7.15", "subdomain_topic": "Cross-project ref syntax", "question_text": "A developer in the `marketing` project wants to reference a public model named `monthly_revenue` from the `jaffle_finance` project. They also need to pin to version 1 of the model. Which `ref()` calls are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "`{{ ref('monthly_revenue') }}`", "B": "`{{ ref('jaffle_finance', 'monthly_revenue') }}`", "C": "`{{ ref('jaffle_finance.monthly_revenue') }}`", "D": "`{{ ref('jaffle_finance', 'monthly_revenue', v=1) }}`", "E": "`{{ source('jaffle_finance', 'monthly_revenue') }}`"}, "correct_answers": ["B", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Single-argument `ref('monthly_revenue')` only searches within the current project — it will fail or reference a wrong model if the source model is in another project."}, "B": {"label": "✅ Correct", "text": "**Two-argument `ref('project', 'model')`** is the correct cross-project ref syntax: `{{ ref('jaffle_finance', 'monthly_revenue') }}`. This references the latest version of `monthly_revenue` in the `jaffle_finance` project."}, "C": {"label": "❌ Incorrect", "text": "Dot notation `'jaffle_finance.monthly_revenue'` is not valid `ref()` syntax. The project and model name are separate arguments."}, "D": {"label": "✅ Correct", "text": "**Three-argument `ref('project', 'model', v=N)`** is the cross-project ref with version pinning: `{{ ref('jaffle_finance', 'monthly_revenue', v=1) }}`. This pins to version 1 specifically."}, "E": {"label": "❌ Incorrect", "text": "`source()` is for raw source tables, not dbt models in other projects. Cross-project model references use `ref()`."}}, "key_rule": "Cross-project ref = `ref('project_name', 'model_name')`. With version pin = `ref('project_name', 'model_name', v=1)`."}, {"id": "q08_Q16", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 16, "high_yield": false, "subdomain_id": "7.16", "subdomain_topic": "dependencies.yml case sensitivity", "question_text": "A team's consumer project has the following `dependencies.yml`:\n```yaml\nprojects:\n  - name: jaffle_Finance\n```\nThe upstream project's `dbt_project.yml` has `name: jaffle_finance` (all lowercase). Cross-project refs fail. What is the cause?", "is_multi_select": false, "options": {"A": "The `dependencies.yml` file must be placed in the `models/` directory, not the project root.", "B": "Project names in `dependencies.yml` must match the upstream project's `dbt_project.yml` name **exactly** — including case. `jaffle_Finance` ≠ `jaffle_finance`.", "C": "`dependencies.yml` only accepts lowercase project names — uppercase letters are not permitted.", "D": "The upstream project must also list the consumer project in its `dependencies.yml` for bidirectional resolution."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dependencies.yml` belongs in the project root, not in `models/`. This is correct placement."}, "B": {"label": "✅ Correct", "text": "Project names in `dependencies.yml` are **case-sensitive** and must exactly match the `name:` field in the upstream project's `dbt_project.yml`. `jaffle_Finance` does not match `jaffle_finance` — the mismatch causes silent resolution failures. This is a common source of cross-project ref bugs."}, "C": {"label": "❌ Incorrect", "text": "Project names can technically be mixed case in `dbt_project.yml`. The constraint is matching exactly, not forcing lowercase."}, "D": {"label": "❌ Incorrect", "text": "Bidirectional dependencies require careful stepwise setup, but the issue here is simply a case mismatch in the project name."}}, "key_rule": "`dependencies.yml` project names are **case-sensitive** — must exactly match `dbt_project.yml` `name:` field."}, {"id": "q08_Q17", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 17, "high_yield": false, "subdomain_id": "7.17", "subdomain_topic": "Protected vs private access", "question_text": "A team has a model assigned `access: protected` (the default). A developer in a different governance group within the same project tries to reference it. Another developer in an installed package also tries to reference it. Which of these succeed?", "is_multi_select": false, "options": {"A": "Neither — `protected` is equivalent to `private` and restricts access to the same group only.", "B": "Both succeed — `protected` allows access from any project or package.", "C": "The same-project developer succeeds; the package developer also succeeds. `protected` = same project or installed package.", "D": "The same-project developer succeeds; the package developer fails. `protected` = same project only."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`protected` is less restrictive than `private`. `private` restricts to the same governance group only."}, "B": {"label": "❌ Incorrect", "text": "`public` allows any project or package. `protected` is more restrictive than `public`."}, "C": {"label": "✅ Correct", "text": "**`protected` (default)** allows references from: (1) any model within the **same project** regardless of governance group, AND (2) models in **installed packages**. A developer in a different group within the same project can reference it; a developer in an installed package can also reference it. Only **cross-project refs from other dbt projects** (not packages) are blocked. `private` would restrict to same governance group only."}, "D": {"label": "❌ Incorrect", "text": "Installed packages CAN reference `protected` models — this is one of the two allowed access scenarios."}}, "key_rule": "`private` = same group only. `protected` = same project + installed packages. `public` = any project."}, {"id": "q08_Q18", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 18, "high_yield": false, "subdomain_id": "7.18", "subdomain_topic": "--favor-state flag", "question_text": "A developer runs `dbt build --select state:modified+ --defer --state ./prod` in their local environment. Some modified models exist in their local dev schema, but dbt resolves their upstream parent models against local dev relations instead of production. They want dbt to prefer the production state even when a local dev relation exists. What flag achieves this?", "is_multi_select": false, "options": {"A": "`--prefer-prod` — forces all upstream resolution to production.", "B": "`--favor-state` — flips defer resolution to prefer the state manifest (production) over local dev relations.", "C": "`--no-defer` combined with `--state` achieves the same effect.", "D": "Add `target: prod` to `profiles.yml` to force resolution against production."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`--prefer-prod` is not a valid dbt flag."}, "B": {"label": "✅ Correct", "text": "By default, `--defer` resolves unselected upstream nodes against: dev relations first → staging → production (using whatever exists locally first). **`--favor-state`** flips this priority: it prefers the **state manifest** (production) for resolution even when a local dev relation exists. Use `--favor-state` when you want to test against production-state data, not your potentially-stale local dev state."}, "C": {"label": "❌ Incorrect", "text": "`--no-defer` disables deferral entirely — it would force all upstream nodes to be built rather than resolved."}, "D": {"label": "❌ Incorrect", "text": "Changing `profiles.yml` target changes where the job writes, not how `--defer` resolves upstream parents."}}, "key_rule": "Default `--defer` = dev relations first, then prod. `--favor-state` = flips priority to prefer state manifest (prod) over local dev relations."}, {"id": "q08_Q19", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 19, "high_yield": false, "subdomain_id": "7.19", "subdomain_topic": "Breaking contract changes", "question_text": "A platform team has a public contracted model `dim_customers` that downstream projects depend on. Which of the following changes to the contract definition are considered **breaking changes** that require creating a new model version? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Adding a new column to the contract definition", "B": "Removing an existing column from the contract definition", "C": "Changing a column's data type from `string` to `int`", "D": "Updating a column's description in the YAML", "E": "Adding a new tag to the model's config block"}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Adding a new column is **non-breaking** — downstream consumers that don't use the new column are unaffected."}, "B": {"label": "✅ Correct", "text": "**Removing an existing column** is a **breaking change** — any downstream consumer referencing that column will fail. This is exactly what contracts protect against: removing a column from a contracted public model without creating a new version is a contract violation."}, "C": {"label": "✅ Correct", "text": "**Changing a column's data type** is a **breaking change** — downstream models may fail due to type incompatibility. Both removing columns and changing types are the primary breaking change scenarios contracts enforce."}, "D": {"label": "❌ Incorrect", "text": "Description changes are non-breaking — they have no effect on data or schema."}, "E": {"label": "❌ Incorrect", "text": "Tag additions are non-breaking configuration changes — they don't affect the model's schema or data."}}, "key_rule": "Contract breaking changes = **removing columns** + **changing data types** + modifying constraints. Never modify in-place — create a new version."}, {"id": "q08_Q20", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 20, "high_yield": false, "subdomain_id": "7.20", "subdomain_topic": "Public model without contract", "question_text": "A platform team publishes a model as `access: public` without adding a contract (`enforced: false`). Three months later, they rename a column in the model SQL and the YAML. Downstream consumer projects do not immediately break. When do they break?", "is_multi_select": false, "options": {"A": "Immediately — dbt Mesh validates public model schemas in real-time via the metadata service.", "B": "Never — without a contract, downstream projects are not coupled to column definitions.", "C": "When the downstream project next **parses and runs** against the updated schema — the breaking change is undetected until runtime.", "D": "Within 24 hours — the metadata service refreshes public model schemas on a daily cycle."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The metadata service does not perform real-time schema validation. Downstream projects only encounter the change when they actually r
