"subdomain_id": "11.5", "subdomain_topic": "Model group gotchas", "question_text": "Which of the following statements about model **governance groups** (not RBAC user groups) are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The list of users in a dbt Cloud RBAC group named `finance` is automatically synced to the governance group `finance`, granting those users the ability to ref private models in the `finance` governance group.", "B": "Referencing a `private` model from outside its group causes a `DbtReferenceError` at **parse time**, not at runtime — the model never builds.", "C": "A model can belong to **exactly one** group; attempting to assign multiple groups via both `dbt_project.yml` and an in-file `{{ config() }}` causes the most specific declaration (in-file) to win, not a merge.", "D": "The `owner:` property on a group requires **both** `name` and `email` — omitting either causes a parse error.", "E": "Group assignments defined in `dbt_project.yml` (via `+group:`) cannot be overridden by schema.yml or inline `config()` — they are locked at the project level."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Governance groups (defined in dbt YAML, control which models can ref private models) and RBAC user groups (defined in dbt Cloud, control which humans can access the UI/IDE/jobs) are **completely orthogonal**. Matching names is pure coincidence and creates no linkage — governance membership is a property of models, not users."}, "B": {"label": "✅ Correct", "text": "Private access violations are caught at **parse time** (during `dbt compile` or the manifest build), not at runtime. dbt raises a `DbtReferenceError`: \"the referenced node is private to the [group name].\" The offending model never gets to the database. This early detection is the core value of governance groups."}, "C": {"label": "✅ Correct", "text": "A model belongs to exactly one group. The three assignment methods (`+group:` in `dbt_project.yml`, `group:` in schema.yml, `{{ config(group='...') }}` in-file) follow dbt's standard config precedence: **in-file > schema.yml > project-level**. The most specific declaration wins — there is no merging of groups."}, "D": {"label": "❌ Incorrect", "text": "The `owner:` property requires `name` **OR** `email` — either one is sufficient. Both are not mandatory."}, "E": {"label": "❌ Incorrect", "text": "This is the opposite of dbt's config precedence. Project-level `+group:` provides a default that can be overridden by more specific declarations in schema.yml or in-file config — the same pattern as all other dbt config."}}, "key_rule": "Governance groups are code-level model ownership boundaries with standard dbt config precedence (in-file > schema.yml > project). Violations caught at parse time. Never conflate them with RBAC user groups — they share nothing but naming conventions."}];

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  qs: [],
  idx: 0,
  sel: [],
  done: false,
  score: { ok: 0, total: 0 },
  filter: 'all',
  shuffle: false,
};

// ── Utilities ─────────────────────────────────────────────────────────────────
function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function md(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, url) {
      const safe = /^(https?:|mailto:|\.\.?\/|#)/i.test(url) ? url : '#';
      return '<a href="' + safe + '" target="_blank" rel="noopener">' + text + '</a>';
    });
}

// ── Filter / shuffle ──────────────────────────────────────────────────────────
function applyFilter() {
  let pool = ALL_QUESTIONS;
  if (state.filter === 'hy') pool = pool.filter(q => q.high_yield);
  else if (state.filter !== 'all') pool = pool.filter(q => q.file_id === state.filter);
  state.qs = state.shuffle ? fisherYates(pool) : pool.slice();
  state.idx = 0;
  state.sel = [];
  state.done = false;
  state.score = { ok: 0, total: 0 };
}

// ── Header ────────────────────────────────────────────────────────────────────
function renderHeader() {
  const { ok, total } = state.score;
  const pct = total ? Math.round(ok / total * 100) : null;
  document.getElementById('score-badge').textContent =
    total === 0 ? 'Score: —' : 'Score: ' + ok + '/' + total + ' (' + pct + '%)';
  const progress = state.qs.length ? (state.idx / state.qs.length * 100) : 0;
  const bar = document.getElementById('progress-bar');
  bar.style.width = progress + '%';
  bar.setAttribute('aria-valuenow', Math.round(progress));
}

// ── Question card ─────────────────────────────────────────────────────────────
function renderQ() {
  const card = document.getElementById('card');
  const q = state.qs[state.idx];
  if (!q) { renderEnd(); return; }

  const letters = Object.keys(q.options).sort();

  const optHtml = letters.map(function(letter) {
    const isCorrect = q.correct_answers.indexOf(letter) >= 0;
    const isSel = state.sel.indexOf(letter) >= 0;
    let cls = 'opt';
    if (state.done) {
      if (isCorrect) cls += ' correct';
      else if (isSel) cls += ' wrong-sel';
    } else if (isSel) {
      cls += ' selected';
    }
    return '<button class="' + cls + '" data-l="' + letter + '"' +
           (state.done ? ' disabled' : '') + '>' +
           '<span class="opt-letter">' + letter + '</span>' +
           '<span>' + md(q.options[letter]) + '</span>' +
           '</button>';
  }).join('');

  const hint = q.is_multi_select ? 'Select 2 answers' : 'Select 1 answer';
  const canSub = state.sel.length > 0;
  const actionHtml = state.done ? '' :
    '<div class="action-row">' +
    '<button class="btn-submit" id="sub-btn"' + (canSub ? '' : ' disabled') + '>Submit</button>' +
    '<span class="select-hint">' + hint + '</span>' +
    '</div>';

  let explHtml = '';
  if (state.done) {
    const items = letters.map(function(letter) {
      const isCorrect = q.correct_answers.indexOf(letter) >= 0;
      const isSel = state.sel.indexOf(letter) >= 0;
      const expl = q.explanations[letter] || {};
      const label = expl.label || (isCorrect ? '\u2705 Correct' : '\u274c Incorrect');
      const text = expl.text || '';
      let cls = 'expl-item ';
      if (isCorrect) cls += 'correct';
      else if (isSel) cls += 'wrong-sel';
      else cls += 'neutral';
      return '<div class="' + cls + '">' +
             '<div class="expl-head">' + letter + ') ' + md(label) + '</div>' +
             '<div class="expl-text">' + md(text) + '</div>' +
             '</div>';
    }).join('');

    const ruleHtml = q.key_rule
      ? '<div class="key-rule">💡 <strong>Key rule:</strong> ' + md(q.key_rule) + '</div>'
      : '';

    const isLast = state.idx >= state.qs.length - 1;
    explHtml = '<hr class="divider">' +
               '<div class="expl-list">' + items + '</div>' +
               ruleHtml +
               '<button class="btn-next" id="next-btn">' + (isLast ? 'See Results' : 'Next →') + '</button>';
  }

  card.innerHTML =
    '<div class="card-meta">' +
    '<span class="topic-pill">Topic ' + esc(q.topic_num) + ': ' + esc(q.topic_name) + '</span>' +
    (q.high_yield ? '<span class="star-badge">\u2b50 High-Yield</span>' : '') +
    '<span class="q-counter">Q' + (state.idx + 1) + ' / ' + state.qs.length + '</span>' +
    '</div>' +
    '<div class="subdomain">' + esc(q.subdomain_id) + ' — ' + md(q.subdomain_topic) + '</div>' +
    '<div class="question-text">' + md(q.question_text) + '</div>' +
    '<div class="options">' + optHtml + '</div>' +
    actionHtml +
    explHtml;

  card.querySelectorAll('.opt').forEach(function(btn) {
    btn.addEventListener('click', function() { toggleOpt(btn.dataset.l); });
  });
  const subBtn = document.getElementById('sub-btn');
  if (subBtn) subBtn.addEventListener('click', submit);
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', nextQ);

  document.getElementById('kbd-hint').textContent = state.done
    ? 'Enter or → to continue'
    : 'Keys: 1–' + letters.length + ' select · Enter submit';

  renderHeader();
}

// ── Interactions ──────────────────────────────────────────────────────────────
function toggleOpt(letter) {
  if (state.done) return;
  const q = state.qs[state.idx];
  if (q.is_multi_select) {
    const i = state.sel.indexOf(letter);
    if (i >= 0) state.sel.splice(i, 1);
    else state.sel.push(letter);
  } else {
    state.sel = [letter];
  }
  renderQ();
}

function submit() {
  if (state.done || state.sel.length === 0) return;
  const q = state.qs[state.idx];
  const correct = q.correct_answers.slice().sort().join(',');
  const selected = state.sel.slice().sort().join(',');
  state.done = true;
  state.score.total++;
  if (selected === correct) state.score.ok++;
  renderQ();
}

function nextQ() {
  if (state.idx >= state.qs.length - 1) { renderEnd(); return; }
  state.idx++;
  state.sel = [];
  state.done = false;
  renderQ();
}

// ── End screen ────────────────────────────────────────────────────────────────
function renderEnd() {
  const { ok, total } = state.score;
  const pct = total ? Math.round(ok / total * 100) : 0;
  const grade = pct >= 80 ? '\u2705 Pass' : pct >= 60 ? '\u26a0\ufe0f Close' : '\u274c Keep studying';
  document.getElementById('card').innerHTML =
    '<div class="end-wrap">' +
    '<div class="end-score">' + ok + '/' + total + '</div>' +
    '<div class="end-pct">' + pct + '%</div>' +
    '<div class="end-sub">' + grade + ' · ' + total + ' questions answered</div>' +
    '<button class="btn-restart" id="restart-btn">Try Again</button>' +
    '</div>';
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('kbd-hint').textContent = '';
  document.getElementById('restart-btn').addEventListener('click', function() {
    applyFilter();
    renderQ();
  });
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (document.activeElement === document.getElementById('filter-select')) return;
  const q = state.qs[state.idx];
  if (!q) return;
  const letters = Object.keys(q.options).sort();
  const numMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 };
  if (!state.done) {
    if (e.key in numMap) {
      const letter = letters[numMap[e.key]];
      if (letter) { toggleOpt(letter); e.preventDefault(); }
    } else if (e.key === 'Enter' && state.sel.length > 0) {
      submit(); e.preventDefault();
    }
  } else {
    if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'n') {
      nextQ(); e.preventDefault();
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  const topicMap = {};
  let hyCount = 0;
  ALL_QUESTIONS.forEach(function(q) {
    if (q.high_yield) hyCount++;
    if (!topicMap[q.file_id]) {
      topicMap[q.file_id] = { num: q.topic_num, name: q.topic_name, count: 0 };
    }
    topicMap[q.file_id].count++;
  });

  const sel = document.getElementById('filter-select');
  sel.innerHTML =
    '<option value="all">All Topics (' + ALL_QUESTIONS.length + ')</option>' +
    '<option value="hy">\u2b50 High-Yield (' + hyCount + ')</option>' +
    Object.keys(topicMap).map(function(fid) {
      const t = topicMap[fid];
      return '<option value="' + fid + '">Topic ' + esc(t.num) + ': ' + esc(t.name) + ' (' + t.count + ')</option>';
    }).join('');

  sel.addEventListener('change', function(e) {
    state.filter = e.target.value;
    applyFilter();
    renderQ();
  });

  const shuffleBtn = document.getElementById('shuffle-btn');
  shuffleBtn.addEventListener('click', function() {
    state.shuffle = !state.shuffle;
    shuffleBtn.textContent = 'Shuffle: ' + (state.shuffle ? 'ON' : 'OFF');
    shuffleBtn.classList.toggle('on', state.shuffle);
    shuffleBtn.setAttribute('aria-pressed', state.shuffle);
    applyFilter();
    renderQ();
  });

  applyFilter();
  renderQ();
});
</script>
</body>
</html>
