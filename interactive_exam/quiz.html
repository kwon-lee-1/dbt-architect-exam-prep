nse and adds them to the Developer group for that project. Can they now edit models in the IDE?", "is_multi_select": false, "options": {"A": "No — Read-Only license users do not inherit from any permission sets. They can only view artifacts and the deploy section, regardless of group membership.", "B": "Yes — the Developer group grants IDE access, which the Read-Only license allows at the project level.", "C": "Yes — but only in the IDE's read-only mode (no execution, no saves).", "D": "No — they can't access the IDE, but the Developer group gives them access to dbt Cloud's API."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**Read-Only license users do not inherit rights from any permission sets**. Their access is identical regardless of which groups they belong to: view artifacts and the deploy section (jobs, runs, schedules) only. No IDE access, no job execution, no editing. The Developer group assignment has zero effect."}, "B": {"label": "❌ Incorrect", "text": "The Developer group cannot elevate a Read-Only license — the license type always overrides group permissions."}, "C": {"label": "❌ Incorrect", "text": "There is no \"read-only IDE mode\" — IDE access is binary, and Read-Only license users cannot access it at all."}, "D": {"label": "❌ Incorrect", "text": "Read-Only license does not grant any elevated API access through group membership."}}, "key_rule": "Read-Only license = **fixed access only** (view artifacts + deploy section). Groups irrelevant. Identical access for all Read-Only users."}, {"id": "q06_Q3", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 3, "high_yield": true, "subdomain_id": "5.3", "subdomain_topic": "Service token: one-time visibility", "question_text": "An admin creates a new service token to use in a CI/CD pipeline. They close the dialog before saving the token value. How can they recover the token?", "is_multi_select": false, "options": {"A": "Contact dbt Cloud support with the token name to retrieve the value.", "B": "The token can be re-revealed by clicking \"Show Token\" in the service token settings.", "C": "The token value is shown only once — it cannot be recovered. Delete it, create a new one, and update all integrations.", "D": "The token value can be retrieved from Account Settings → API Tokens at any time."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Labs support cannot reveal stored token values — they are not stored in recoverable form."}, "B": {"label": "❌ Incorrect", "text": "There is no \"Show Token\" button after initial creation — the value is permanently obscured."}, "C": {"label": "✅ Correct", "text": "Service token values are shown **exactly once** at creation time. If the dialog is closed before saving the value, it is permanently unrecoverable. The only path forward is to delete the existing token, create a new one, and update all integrations that used the old token."}, "D": {"label": "❌ Incorrect", "text": "After the initial creation dialog is closed, the token value is not stored in a retrievable form in the UI."}}, "key_rule": "Service token = **one-time reveal**. Save immediately. Lost token = delete → create new → update all integrations."}, {"id": "q06_Q4", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 4, "high_yield": true, "subdomain_id": "5.4", "subdomain_topic": "Service token 403 error", "question_text": "A service token is configured correctly and has the right permission sets, but all API calls return `403 Forbidden`. The token was created recently and the credentials haven't changed. What is the most likely cause?", "is_multi_select": false, "options": {"A": "The service token was created before the last SSO configuration change and needs to be rotated.", "B": "The calling IP address is not on the account's IP allowlist — service tokens honor IP restrictions just like human logins.", "C": "The service token needs to be assigned to a specific project before it can make API calls.", "D": "The service token has expired — tokens expire after 90 days by default."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "SSO configuration changes do not invalidate service tokens — service tokens are separate from SSO."}, "B": {"label": "✅ Correct", "text": "**Service tokens honor IP restriction allowlists** exactly like human user logins. If the CI server or automation tool's IP is not on the account's allowlist, all API calls will return `403 Forbidden` — even if the token itself is valid and correctly permissioned."}, "C": {"label": "❌ Incorrect", "text": "Service tokens can be scoped to projects, but a missing project assignment would result in a permissions error on project-specific endpoints, not a blanket `403` on all API calls."}, "D": {"label": "❌ Incorrect", "text": "Service tokens do not have a 90-day expiration — they don't expire on a time schedule (unlike OAuth tokens)."}}, "key_rule": "Service token `403` = check **IP allowlist** first. Service tokens respect IP restrictions."}, {"id": "q06_Q5", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 5, "high_yield": true, "subdomain_id": "5.5", "subdomain_topic": "Security Admin cannot trigger jobs", "question_text": "During an incident, a Security Admin is the only person available. They need to manually trigger a production job to restore data. They find they cannot access the Jobs page at all. Why?", "is_multi_select": false, "options": {"A": "Security Admin has zero access to jobs, runs, or environments — it is purely an administrative role for user/group/SSO/IP management.", "B": "Jobs can only be triggered by the Account Owner during incidents.", "C": "The Security Admin needs to be temporarily added to the Job Runner group.", "D": "Security Admin requires 2FA to access the Jobs page during an incident."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**Security Admin has zero data access** — no IDE, no jobs, no runs, no environments. It is scoped purely to: managing users, groups, licenses, SSO configuration, and IP restrictions. To trigger jobs in an incident, the correct role is **Job Admin** or **Job Runner**."}, "B": {"label": "❌ Incorrect", "text": "Job triggering is not exclusive to Account Owners."}, "C": {"label": "❌ Incorrect", "text": "This suggestion reflects the correct fix but the question asks why they can't currently trigger jobs — Security Admin's scope doesn't include jobs."}, "D": {"label": "❌ Incorrect", "text": "2FA for incident access is not a documented dbt Cloud requirement."}}, "key_rule": "Security Admin = **zero data access**. No IDE, no jobs, no runs. For job execution: Job Admin or Job Runner."}, {"id": "q06_Q6", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 6, "high_yield": false, "subdomain_id": "5.6", "subdomain_topic": "Database Admin and IDE access", "question_text": "A Database Admin user wants to write a quick SQL fix directly in the dbt Cloud IDE. Can they?", "is_multi_select": false, "options": {"A": "Yes — but only in view mode; they cannot execute queries.", "B": "No — Database Admin manages data platform configs and Semantic Layer settings but has no IDE access.", "C": "Yes — Database Admin includes IDE access equivalent to the Developer role.", "D": "Yes — Database Admin includes read/write IDE access for all projects they manage."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no \"view mode\" IDE access — IDE access is binary based on role."}, "B": {"label": "✅ Correct", "text": "**Database Admin does not include IDE access**. The role is scoped to: data platform configurations, environment variables, and Semantic Layer configuration. To write code in the IDE, a user needs the Developer, Analyst, or Admin permission set. This is a common trap — \"Database Admin\" sounds like it should have more data access than it does."}, "C": {"label": "❌ Incorrect", "text": "Database Admin ≠ Developer. They are distinct roles with different scopes."}, "D": {"label": "❌ Incorrect", "text": "Database Admin is explicitly a non-IDE role focused on platform configuration."}}, "key_rule": "Database Admin = **no IDE**. IDE access requires: Developer, Analyst, Admin, or Account Admin."}, {"id": "q06_Q7", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 7, "high_yield": true, "subdomain_id": "5.7", "subdomain_topic": "Project Admin cannot create projects", "question_text": "A project-level Admin user needs to create a new dbt project for a new data team. They navigate to the account settings but find the \"Create New Project\" button is greyed out. Why?", "is_multi_select": false, "options": {"A": "The user needs to log out and back in to see the new project creation option.", "B": "New project creation is disabled after the account reaches its project limit on the current plan.", "C": "Creating projects is restricted to Account Admin and Project Creator roles — project-level Admin cannot create new projects.", "D": "The user needs to be in the Owner group to create projects."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is a permissions issue, not a session issue."}, "B": {"label": "❌ Incorrect", "text": "While plan limits exist, the question describes a permissions issue (greyed out button), not a plan limit error."}, "C": {"label": "✅ Correct", "text": "**Project-level Admin cannot create new projects** — Admin gives full control within *existing* projects only. Creating new projects requires **Account Admin** (account-level) or the **Project Creator** (account-level) permission set. This is one of the most important Admin vs Account Admin distinctions on the exam."}, "D": {"label": "❌ Incorrect", "text": "The Owner group doesn't directly map to \"create projects\" permission — the specific roles that enable this are Account Admin and Project Creator."}}, "key_rule": "**Admin ≠ Account Admin**. Admin = full control of existing projects. Create new projects = **Account Admin** or **Project Creator** only."}, {"id": "q06_Q8", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 8, "high_yield": false, "subdomain_id": "5.8", "subdomain_topic": "SSO enforced, admin locked out", "question_text": "An organization enforces SSO for all dbt Cloud users. The Identity Provider (IdP) goes down and all users are locked out. Can administrators still access dbt Cloud?", "is_multi_select": false, "options": {"A": "Yes — but only if they previously enabled the \"Admin Password Bypass\" setting in Account Settings.", "B": "No — when SSO is enforced, all users including admins must use SSO. IdP downtime = complete lockout.", "C": "No — but they can contact dbt Cloud support to temporarily disable SSO enforcement.", "D": "Yes — admins retain password-based login access by default even when SSO is enforced."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no \"Admin Password Bypass\" setting that must be explicitly enabled — it's the default behavior."}, "B": {"label": "❌ Incorrect", "text": "Full lockout would be a catastrophic single point of failure. dbt explicitly preserves admin access via password when SSO is enforced."}, "C": {"label": "❌ Incorrect", "text": "Support escalation may be a last resort, but admins have a built-in path (password login) that doesn't require support intervention."}, "D": {"label": "✅ Correct", "text": "By default, **admins retain password-based login** even when SSO is enforced for the organization. This is a deliberate design to prevent admin lockout during IdP outages. (You can turn this off with **Allow password logins for account administrators** in SSO & SCIM.)"}}, "key_rule": "SSO enforced + IdP down = **admins can still log in with password** (default behavior, unless explicitly restricted)."}, {"id": "q06_Q9", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 9, "high_yield": false, "subdomain_id": "5.9", "subdomain_topic": "License mapping precedence", "question_text": "An SSO user belongs to IdP groups that are mapped to both Read-Only and Developer in the license mappings. Which license do they get, and when does it apply?", "is_multi_select": false, "options": {"A": "Developer, the next time they sign in.", "B": "Read-Only, immediately.", "C": "The account's default license.", "D": "Both licenses at once."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Developer wins over Read-Only. License mapping changes take effect the next time users sign in with SSO."}, "B": {"label": "❌ Incorrect", "text": "Developer takes precedence, and mappings apply at sign-in."}, "C": {"label": "❌ Incorrect", "text": "The default license is for users who match no mapping."}, "D": {"label": "❌ Incorrect", "text": "The docs describe a single resolved license per user."}}, "key_rule": "License mappings use **IdP group names**. In both mapped groups → Developer. In neither → the account default license. Applied at sign-in."}, {"id": "q06_Q10", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 10, "high_yield": false, "subdomain_id": "5.10", "subdomain_topic": "Default groups and new user access", "question_text": "A company wants all new contractors to join the organization without automatically receiving any project access. Currently, new users are being added to projects as soon as they're created. What should the admin change?", "is_multi_select": false, "options": {"A": "Customize the permissions of both the Member and Everyone groups, since new users are added to both.", "B": "Require manual approval for all new user accounts before they're activated.", "C": "Change the default license type from Developer to Read-Only.", "D": "Set the Member group to have no permissions."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say dbt adds new users to both the Member and Everyone groups. Member is broad (it restricts only features that alter billing or security), and Everyone is yours to customize. Adjust both to limit what new users get."}, "B": {"label": "❌ Incorrect", "text": "Manual account approval is not a built-in dbt Cloud feature."}, "C": {"label": "❌ Incorrect", "text": "Changing the default license type would affect what features users can access, but the root issue is group membership auto-assignment."}, "D": {"label": "❌ Incorrect", "text": "Setting Member group to no permissions would affect all existing members, not just new contractors. Also, new users land in both Member AND Everyone — just fixing Member is insufficient."}}, "key_rule": "New users are auto-added to **both Member and Everyone**. Customize both to limit default access."}, {"id": "q06_Q11", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 11, "high_yield": false, "subdomain_id": "5.11", "subdomain_topic": "Most permissive group wins", "question_text": "A user is in two groups: \"ReadOnly-Team\" (Stakeholder permissions) and \"Data-Team\" (Developer permissions). What is their effective access level?", "is_multi_select": false, "options": {"A": "A blend of both — they get read access everywhere but write access only in Data-Team projects.", "B": "Developer — the most permissive group wins.", "C": "The last group they were added to determines their access.", "D": "Stakeholder — the most restrictive group wins to protect data."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Permissions are not blended or intersected — the most permissive set wins in full."}, "B": {"label": "✅ Correct", "text": "When a user belongs to multiple groups, the **most permissive group wins**. The Developer permission set from \"Data-Team\" overrides the Stakeholder from \"ReadOnly-Team\". This means adding a user to any high-permission group grants them that access — you cannot restrict someone with a low-access group if they're also in a high-access group."}, "C": {"label": "❌ Incorrect", "text": "Membership order has no effect — it's always the most permissive group."}, "D": {"label": "❌ Incorrect", "text": "dbt uses most-permissive, not most-restrictive. This is the opposite of some IAM systems and is an important gotcha."}}, "key_rule": "**Most permissive group wins**. A user in both a restrictive and permissive group gets the permissive access."}, {"id": "q06_Q12", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 12, "high_yield": false, "subdomain_id": "5.12", "subdomain_topic": "Stakeholder vs Account Viewer", "question_text": "A data governance officer needs read-only access to dbt Cloud **including the full sensitive audit log** (which contains user actions and PII-adjacent activity). Which role should they be assigned?", "is_multi_select": false, "options": {"A": "Stakeholder (project-level) — read-only access to everything including the audit log.", "B": "Read-Only license — provides access to all audit log entries.", "C": "Account Viewer — read-only across the account, including the full sensitive audit log.", "D": "Security Admin — provides access to the audit log for compliance purposes."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Stakeholder is project-level and the audit log it provides access to **excludes sensitive information**. Not suitable for full compliance audit access."}, "B": {"label": "❌ Incorrect", "text": "Read-Only license users have fixed access to artifacts and deploy section only — not the full audit log."}, "C": {"label": "✅ Correct", "text": "**Account Viewer** gives read-only access to all settings, projects, environments and runs, and to audit logs including sensitive account-level information. Stakeholder and Read-Only exclude sensitive audit information."}, "D": {"label": "❌ Incorrect", "text": "Security Admin provides administrative access to security settings but is not the designated role for read-only audit log access."}}, "key_rule": "Account Viewer = full audit log including sensitive. Stakeholder / Read-Only = audit log without sensitive info."}, {"id": "q06_Q13", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 13, "high_yield": true, "subdomain_id": "5.13", "subdomain_topic": "Semantic Layer service token", "question_text": "A team needs to create a service token that allows an external BI tool to query the dbt Semantic Layer. Which permission set should be assigned to this service token?", "is_multi_select": false, "options": {"A": "Job Admin — gives access to run jobs and query data.", "B": "Database Admin — manages data platform configs including Semantic Layer.", "C": "Semantic Layer — the only permission set scoped to Semantic Layer queries; service token exclusive.", "D": "Developer — gives full project access including Semantic Layer queries."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Job Admin does not include Semantic Layer query access — it manages jobs and runs."}, "B": {"label": "❌ Incorrect", "text": "Database Admin manages configuration, not query execution via the Semantic Layer."}, "C": {"label": "✅ Correct", "text": "The **Semantic Layer** permission set is specifically designed for this purpose — it allows querying the Semantic Layer API and nothing else. It is also **service token exclusive** — it cannot be assigned to human users (they'd use normal project access)."}, "D": {"label": "❌ Incorrect", "text": "Developer is for building models. It isn't the set scoped to querying the Semantic Layer."}}, "key_rule": "Semantic Layer queries via API = **Semantic Layer permission set** on a service token. Service token only — cannot assign to users."}, {"id": "q06_Q14", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 14, "high_yield": false, "subdomain_id": "5.14", "subdomain_topic": "Who can create projects", "question_text": "Which of the following users can create a new dbt Cloud project? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "A user with the Security Admin role.", "B": "A user with the Account Admin role.", "C": "A user with the Project Creator role.", "D": "A user with the Developer license and Analyst role.", "E": "A user with the project-level Admin role."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Security Admin manages users, groups, SSO, and IP restrictions — not project creation."}, "B": {"label": "✅ Correct", "text": "**Account Admin** has full account-level access including project creation."}, "C": {"label": "✅ Correct", "text": "**Project Creator** is an account-level role specifically designed to allow project creation and configuration without requiring full Account Admin access."}, "D": {"label": "❌ Incorrect", "text": "Neither the Developer license nor the Analyst role grants project creation ability."}, "E": {"label": "❌ Incorrect", "text": "Project-level **Admin** cannot create new projects — it only manages existing ones. This is the most critical distinction between Admin and Account Admin."}}, "key_rule": "Create projects = **Account Admin** OR **Project Creator**. Project-level Admin cannot create new projects."}, {"id": "q06_Q15", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 15, "high_yield": false, "subdomain_id": "5.15", "subdomain_topic": "Service token rotation", "question_text": "A company wants to rotate an existing service token used in multiple integrations. What is the correct rotation procedure?", "is_multi_select": false, "options": {"A": "Edit the existing token → change the \"Expiry\" field to extend its validity → save.", "B": "Contact dbt Labs support to rotate the token cryptographically while preserving the existing value.", "C": "Click \"Rotate Token\" on the existing token — the value updates in place and integrations continue working.", "D": "Create a new service token → update all integrations with the new token value → delete the old token."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Service tokens don't have a user-configurable expiry field — and changing expiry wouldn't constitute rotation anyway."}, "B": {"label": "❌ Incorrect", "text": "Token rotation is a self-service operation in dbt Cloud — support is not involved."}, "C": {"label": "❌ Incorrect", "text": "There is no in-place rotation — service tokens cannot be updated to generate a new value while maintaining the same token identifier."}, "D": {"label": "✅ Correct", "text": "Service tokens have **no in-place rotation mechanism**. The correct pattern is: create a new token → copy the value → update every integration that uses the old token → delete the old token. This zero-downtime rotation ensures continuous integration availability."}}, "key_rule": "Token rotation = **create new → update integrations → delete old**. No in-place rotation."}, {"id": "q06_Q16", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 16, "high_yield": false, "subdomain_id": "5.16", "subdomain_topic": "Environment write access default", "question_text": "A group is given the **Developer** permission set. What does its \"Environment write access\" default to?", "is_multi_select": false, "options": {"A": "Production only.", "B": "All environments.", "C": "Development only.", "D": "None. The group is read-only on environments."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "It isn't limited to Production."}, "B": {"label": "✅ Correct", "text": "In the enterprise permissions table Developer is read-only on environment settings, but when added to a group, the **Environment write access** field defaults to **All environments**. Check it."}, "C": {"label": "❌ Incorrect", "text": "The default is broader than Development."}, "D": {"label": "❌ Incorrect", "text": "The default isn't read-only."}}, "key_rule": "Environment write access is by environment **type**, not a single environment. It lets a group create, edit and delete runs and jobs, not environments. Supported sets: Analyst, Database admin, Developer, Git admin, Job creator, Team admin."}, {"id": "q06_Q17", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 17, "high_yield": false, "subdomain_id": "5.17", "subdomain_topic": "Setting up license mappings", "question_text": "Where do you set up license mappings, and what do you enter?", "is_multi_select": false, "options": {"A": "Account settings → SSO & SCIM, using dbt group names.", "B": "Each user's profile.", "C": "Account settings → Groups & Licenses → License mappings, using comma-separated IdP group names for Read-Only and Developer.", "D": "The Everyone group's permission set."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "License mappings live under Groups & Licenses, and they use IdP group names."}, "B": {"label": "❌ Incorrect", "text": "They're account-level, not set per user."}, "C": {"label": "✅ Correct", "text": "The docs say license type mappings are based on IdP groups, not dbt groups. Changes take effect the next time users sign in."}, "D": {"label": "❌ Incorrect", "text": "Permission sets don't assign licenses."}}, "key_rule": "License mappings = Groups & Licenses → IdP group names → Read-Only / Developer. Default license: Developer, Read-Only or Analyst (IT can't be the default)."}, {"id": "q06_Q18", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 18, "high_yield": false, "subdomain_id": "5.18", "subdomain_topic": "Analyst vs Developer role", "question_text": "A team lead needs to assign a role to a data analyst who needs to **write and run models in the dbt Cloud IDE** AND **view existing job run history** — but should NOT be able to create new jobs or edit existing ones. Which role is most appropriate?", "is_multi_select": false, "options": {"A": "Analyst — they have IDE access, can run models interactively, and can view jobs/runs/environments without being able to create or edit jobs.", "B": "Job Viewer — specifically designed for viewing job run history.", "C": "Developer — they need IDE access and can view runs.", "D": "Database Admin — provides read access to all platform configurations including job history."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**Analyst** is built for users who run and analyze dbt models in the IDE but can't create or edit anything outside the IDE."}, "B": {"label": "❌ Incorrect", "text": "Job Viewer has no IDE access — they can only view job results and logs, not write or run models."}, "C": {"label": "❌ Incorrect", "text": "Developer is for building and maintaining models and managing production behavior. Analyst is the set for running and analyzing models without creating or editing outside the IDE."}, "D": {"label": "❌ Incorrect", "text": "Database Admin manages platform configurations and has no IDE access for writing dbt code."}}, "key_rule": "Analyst = run and analyze models in the IDE, can't create or edit outside it. Job Viewer = read-only job results, no IDE."}, {"id": "q06_Q19", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 19, "high_yield": false, "subdomain_id": "5.19", "subdomain_topic": "Default group auto-add behavior", "question_text": "A company discovers that every new user invited to their dbt Cloud account automatically gains read access to all projects in the account. An admin investigates and finds no explicit project permission assignments. What is the most likely cause?", "is_multi_select": false, "options": {"A": "New users inherit the permissions of the user who invited them.", "B": "The account is on Developer plan, which grants all users full read access.", "C": "New users are automatically added to both the **Member** and **Everyone** groups, which are configured with broad default permissions including project read access.", "D": "dbt Cloud grants all users read access by default — this must be manually revoked per project."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Permissions are not inherited from the inviting user."}, "B": {"label": "❌ Incorrect", "text": "Plan tier does not grant blanket read access. The default group behavior is plan-agnostic."}, "C": {"label": "✅ Correct", "text": "New users in dbt Cloud are automatically added to **both the Member group AND the Everyone group** by default. These two default groups typically have broad permissions that may include project read access. dbt adds new users to both by default. The fix: customize the Member and Everyone permissions."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not grant read access as a platform default. The auto-add behavior of default groups is the mechanism."}}, "key_rule": "New users auto-join **both Member and Everyone**. Customize both to limit default access."}, {"id": "q06_Q20", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 20, "high_yield": false, "subdomain_id": "5.20", "subdomain_topic": "Owner group immutability", "question_text": "A dbt Cloud Account Admin attempts to remove the Account Admin permission set from the **Owner group** to limit what account owners can do. They find the option is greyed out. Why?", "is_multi_select": false, "options": {"A": "The Owner group permissions can only be changed by dbt Labs support, not by account admins.", "B": "The Owner group is a managed group — it can only be edited during the initial account setup period.", "C": "The Owner group permissions are locked until all Owner members approve the change via a majority vote workflow.", "D": "The Owner group's permissions can't be changed. It's the default group for the people responsible for the whole account."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is not a support escalation scenario. The immutability is a product constraint, not an access control issue."}, "B": {"label": "❌ Incorrect", "text": "There is no \"initial account setup period\" after which groups become locked. The Owner group is permanently immutable."}, "C": {"label": "❌ Incorrect", "text": "There is no majority vote or approval workflow for group permission changes in dbt Cloud."}, "D": {"label": "✅ Correct", "text": "The docs say you cannot change the permissions of the Owner group. Member and Everyone can be customized."}}, "key_rule": "Owner group permissions can't be changed. Member and Everyone can be customized."}, {"id": "q06_Q21", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 21, "high_yield": true, "subdomain_id": "5.21", "subdomain_topic": "PAT vs service token in production", "question_text": "A production CI/CD pipeline calls the dbt API. Which token should it use?", "is_multi_select": false, "options": {"A": "A personal access token from the engineer who built it.", "B": "A deprecated user API key.", "C": "An Account Admin service token.", "D": "A service token with only the permission sets the pipeline needs."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A PAT inherits one person's permissions. The docs say to use a PAT only where it's needed and a service token for flows that need a service account."}, "B": {"label": "❌ Incorrect", "text": "User API keys are deprecated and no longer work."}, "C": {"label": "❌ Incorrect", "text": "An Account Admin token has full read + write access to the account. The docs say to use it with caution."}, "D": {"label": "✅ Correct", "text": "Service tokens belong to the account, not a user, and carry explicit permission sets that can be scoped to specific projects."}}, "key_rule": "Production automation → a service token with minimal permission sets. A PAT inherits the creator's permissions and is account-specific."}, {"id": "q06_Q22", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 22, "high_yield": false, "subdomain_id": "5.22", "subdomain_topic": "Service token permissions and creation", "question_text": "A team architect is configuring a new service token for a multi-project CI/CD integration on the **Enterprise** plan. They want the token to have:\n- `Job Admin` permission on Project A only\n- `Read-Only` permission on Project B only\n- No access to any other project\n\nWhich of the following statements about this configuration are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The service token can be created by any user holding a Developer license — license type determines token-creation rights.", "B": "Creating a service token takes a Developer license and account admin permissions.", "C": "On a Developer or Starter plan, this configuration would be impossible — only Semantic Layer permission sets are available to service tokens on those tiers.", "D": "A single service token can carry both permission sets simultaneously, with each permission set scoped to specific projects.", "E": "The architect must create two separate service tokens (one per permission set) because each service token can only carry a single permission set."}, "correct_answers": ["B", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A Developer license alone isn't enough. Creating a service token also takes account admin permissions."}, "B": {"label": "✅ Correct", "text": "The docs say you can generate service tokens if you have a Developer license **and** account admin permissions. Read-Only and IT licenses can't use service tokens."}, "C": {"label": "❌ Incorrect (in this scenario)", "text": "This statement is factually true — on Developer/Starter plans, service tokens can only be assigned **Semantic Layer permissions**. However, the scenario specifies the **Enterprise plan**, so the architect has access to all permission sets. C is therefore not a correct answer for this question."}, "D": {"label": "✅ Correct", "text": "A single service token can carry **multiple permission sets**, and each permission set can be scoped to **all projects** or to **specific projects**. The architect's intent — `Job Admin` on Project A + `Read-Only` on Project B in a single token — is exactly the canonical least-privilege pattern that service tokens are designed to support."}, "E": {"label": "❌ Incorrect", "text": "Service tokens explicitly support multiple permission sets per token. Splitting into two tokens is unnecessary and reduces operational simplicity (more secrets to rotate)."}}, "key_rule": "Service tokens — multiple permission sets per token, each project-scopable. Created with a Developer license + account admin permissions. Permission set availability: Enterprise/Enterprise+ = any; Legacy Team = limited; Developer/Starter = Semantic Layer only."}, {"id": "q07_Q1", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 1, "high_yield": true, "subdomain_id": "6.1", "subdomain_topic": "Webhook auto-archive", "question_text": "A webhook's endpoint keeps failing. What does dbt do?", "is_multi_select": false, "options": {"A": "Archives the webhook after 1,000 consecutive failed deliveries or 7 consecutive days of failed deliveries, whichever comes first.", "B": "Disables it after 5 consecutive failed deliveries.", "C": "Never disables it. It keeps retrying forever.", "D": "Pauses it for 30 minutes after each failure, then resumes."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say dbt automatically archives a webhook after 1,000 consecutive failed deliveries or 7 consecutive days of failed deliveries, whichever comes first."}, "B": {"label": "❌ Incorrect", "text": "Five is how many times dbt retries each event, not the archive threshold."}, "C": {"label": "❌ Incorrect", "text": "dbt does archive failing webhooks."}, "D": {"label": "❌ Incorrect", "text": "Not documented."}}, "key_rule": "Each event is retried **5 times**. A webhook is archived after **1,000 consecutive failures or 7 days** of failures. Reactivate by changing the endpoint URL (UI) or `PUT` with `active: true` (API)."}, {"id": "q07_Q2", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 2, "high_yield": true, "subdomain_id": "6.2", "subdomain_topic": "Webhook event timing and artifacts", "question_text": "A team's webhook handler listens for `job.run.errored` events and immediately queries the dbt Cloud API for the run's artifacts (manifest, catalog, sources) to post a diagnostic report to their incident channel. The handler fails to retrieve any artifacts. Why?", "is_multi_select": false, "options": {"A": "The webhook needs the `artifact_read` scope on its service token to access artifacts.", "B": "`job.run.errored` fires **before** artifact ingestion — artifacts are not yet available at handler time. Use `job.run.completed` instead.", "C": "Artifacts are only stored for successful runs — errored runs have no artifacts.", "D": "`job.run.errored` events don't include the run ID needed to query artifacts."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Artifact access is controlled by service token permission sets, not a specific `artifact_read` scope."}, "B": {"label": "✅ Correct", "text": "`job.run.errored` fires **immediately** when an error is detected — before dbt Cloud has finished ingesting artifacts. `job.run.completed` fires **after** artifact ingestion is complete, making it the correct event for any handler that needs to query the API for run artifacts. Use `errored` only when you need the fastest possible notification and don't need artifacts."}, "C": {"label": "❌ Incorrect", "text": "The issue is timing. The docs say that on `job.run.errored` the job's metadata and artifacts might not have been ingested yet."}, "D": {"label": "❌ Incorrect", "text": "`job.run.errored` events include the run ID and other run metadata."}}, "key_rule": "`errored` = fires before artifacts (fast notification). `completed` = fires after artifacts (use when you need API data)."}, {"id": "q07_Q3", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 3, "high_yield": false, "subdomain_id": "6.3", "subdomain_topic": "Webhook event types", "question_text": "Which of the following are valid dbt Cloud webhook event types? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "`job.run.completed`", "B": "`job.run.timeout`", "C": "`job.run.queued`", "D": "`job.run.started`", "E": "`job.run.cancelled`"}, "correct_answers": ["A", "D"], "explanations": {"A": {"label": "✅ Correct", "text": "`job.run.completed` fires after the run finishes (success or failure) AND after artifact ingestion. One of the three supported event types."}, "B": {"label": "❌ Incorrect", "text": "`job.run.timeout` is not a supported webhook event type."}, "C": {"label": "❌ Incorrect", "text": "`job.run.queued` is not a supported webhook event type. There is no webhook for when a job enters the queue."}, "D": {"label": "✅ Correct", "text": "`job.run.started` fires when a job run begins execution. It's one of the three supported webhook event types."}, "E": {"label": "❌ Incorrect", "text": "`job.run.cancelled` is not a supported webhook event type."}}, "key_rule": "Three webhook events only: `job.run.started`, `job.run.completed`, `job.run.errored`."}, {"id": "q07_Q4", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 4, "high_yield": false, "subdomain_id": "6.4", "subdomain_topic": "Webhook response requirements", "question_text": "A team implements a webhook handler in AWS Lambda that processes dbt Cloud job events. The Lambda function takes an average of 25 seconds to complete processing. What is the risk?", "is_multi_select": false, "options": {"A": "The Lambda takes longer than the 10-second timeout, so dbt records the delivery as failed even if the function eventually succeeds.", "B": "Responses over 15 seconds are retried automatically by dbt Cloud with exponential backoff.", "C": "No risk — dbt Cloud webhooks have no response time requirements.", "D": "The webhook will deliver successfully but the payload will be truncated after 10 seconds."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "A webhook in dbt has a timeout of **10 seconds**. A slow endpoint can record success on its own side while dbt records a failure. Fix: respond right away, then process the event asynchronously (for example, queue it)."}, "B": {"label": "❌ Incorrect", "text": "dbt retries each event five times, but the timeout is 10 seconds, not 15. Backoff isn't documented."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud has a strict 10-second response window for webhook handlers."}, "D": {"label": "❌ Incorrect", "text": "The payload is not truncated — the connection times out and dbt marks it as a delivery failure."}}, "key_rule": "Webhook timeout = **10 seconds**. A slow handler counts as a failed delivery. Respond fast, process async."}, {"id": "q07_Q5", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 5, "high_yield": false, "subdomain_id": "6.5", "subdomain_topic": "Webhook delivery history", "question_text": "A security audit requires reviewing all webhook deliveries for a specific webhook over the past 45 days. Is this possible in dbt Cloud?", "is_multi_select": false, "options": {"A": "No — webhook delivery history is not stored; only the webhook configuration is retained.", "B": "Yes — 60 days of delivery history is available in Account Settings → Webhooks.", "C": "Yes — dbt Cloud stores complete webhook delivery history indefinitely.", "D": "No — dbt keeps a log of each webhook delivery for only 7 days."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Delivery history is stored — but only for 7 days."}, "B": {"label": "❌ Incorrect", "text": "The retention window is 7 days, not 60."}, "C": {"label": "❌ Incorrect", "text": "Webhook history is retained for a fixed window, not indefinitely."}, "D": {"label": "✅ Correct", "text": "dbt keeps a log of each webhook delivery for **7 days** (the Recent Deliveries section). A 45-day audit can't be served from dbt. Persist the payloads in your handler if you need longer."}}, "key_rule": "Webhook delivery history = **7 days**. For longer retention, persist payloads in your handler."}, {"id": "q07_Q6", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 6, "high_yield": false, "subdomain_id": "6.6", "subdomain_topic": "Email notifications", "question_text": "A small team on the Starter plan wants to receive alerts when their nightly dbt production job fails. They do not want to build a webhook handler. What is the simplest solution, and are there any plan restrictions?", "is_multi_select": false, "options": {"A": "Email notifications require Enterprise plan — Starter teams must use webhooks.", "B": "Email notifications are only available for CI jobs — deploy jobs require webhooks.", "C": "Email notifications are set up under your profile's Notification settings. You choose the events (succeeds, warns, fails, is canceled). No webhook handler needed.", "D": "Email notifications require a verified custom domain on the account."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs don't tie email notifications to the Enterprise plan."}, "B": {"label": "❌ Incorrect", "text": "Job notifications aren't limited to CI jobs."}, "C": {"label": "✅ Correct", "text": "Email is the simplest option. Developers set up their own email notifications under Notification settings, and pick the events: succeeds, warns, fails, is canceled."}, "D": {"label": "❌ Incorrect", "text": "Custom domain verification is not required for email notifications — they use dbt Cloud's email service."}}, "key_rule": "Email = profile → Notification settings. Events: succeeds, warns, fails, is canceled. No webhook needed."}, {"id": "q07_Q7", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 7, "high_yield": false, "subdomain_id": "6.7", "subdomain_topic": "job.run.started event", "question_text": "A team builds a webhook handler to pre-provision compute resources before a dbt job begins. They want the handler to fire as early as possible in the job lifecycle. Which webhook event should they subscribe to?", "is_multi_select": false, "options": {"A": "`job.run.completed` — fired when the job finishes, allowing post-run provisioning.", "B": "There is no webhook event for job start — only completion and error events exist.", "C": "`job.run.started` — fired when the job begins execution, before any models run.", "D": "`job.run.errored` — fired if the job encounters errors."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`job.run.completed` fires after the job finishes — too late for pre-provisioning compute before the run."}, "B": {"label": "❌ Incorrect", "text": "dbt Cloud has three webhook event types including `job.run.started`."}, "C": {"label": "✅ Correct", "text": "`job.run.started` fires at the **beginning of job execution**, before any models run. This is the correct event for tasks that must happen before the run begins, such as resuming a suspended warehouse, pre-warming a cache, or provisioning compute resources."}, "D": {"label": "❌ Incorrect", "text": "`job.run.errored` fires only when there is an error — it is not reliable for pre-run provisioning."}}, "key_rule": "`job.run.started` = fires at job start (before any models). Use for pre-run provisioning tasks."}, {"id": "q07_Q8", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 8, "high_yield": false, "subdomain_id": "6.8", "subdomain_topic": "job.run.completed timing", "question_text": "A team's webhook handler subscribes to `job.run.errored` and tries to immediately fetch the dbt Cloud run artifacts (manifest, catalog) via the API to send a diagnostic report. The API calls return empty or 404. A colleague suggests switching to `job.run.completed` instead. Why would this help?", "is_multi_select": false, "options": {"A": "The artifacts endpoint requires an OAuth token, which is only generated after `job.run.completed`.", "B": "`job.run.errored` fires **before** artifact ingestion into the API. `job.run.completed` fires **after** artifacts have been ingested, so the API will have the run data available.", "C": "`job.run.errored` only includes partial run data — `job.run.completed` is always required to access full artifacts.", "D": "`job.run.completed` fires faster than `job.run.errored`, so the API has more time to populate."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "OAuth token generation is not tied to webhook event type. API authentication is independent of which event fired."}, "B": {"label": "✅ Correct", "text": "**`job.run.errored`** fires **immediately** when the job encounters an error — before dbt Cloud has finished ingesting run artifacts into the API. **`job.run.completed`** fires after **both** job completion AND artifact ingestion. If your handler needs to query the API for run artifacts (manifest, catalog, sources, run results), use `job.run.completed` to guarantee the data is available. The trade-off: `completed` is slightly delayed compared to `errored`."}, "C": {"label": "❌ Incorrect", "text": "Both events can eventually lead to full artifact access — the difference is timing, not data completeness."}, "D": {"label": "❌ Incorrect", "text": "`job.run.errored` actually fires faster than `job.run.completed` — it fires immediately on error. Speed is not the differentiator; artifact availability is."}}, "key_rule": "`job.run.errored` = fast, but artifacts not yet in API. `job.run.completed` = delayed, but artifacts are ready. Use `completed` when you need artifacts."}, {"id": "q07_Q9", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 9, "high_yield": false, "subdomain_id": "6.9", "subdomain_topic": "Three webhook event types", "question_text": "A team is designing their dbt Cloud monitoring stack. Which of the following correctly describes all three webhook event types and their primary use case?", "is_multi_select": false, "options": {"A": "`job.run.started` (pre-run prep), `job.run.completed` (post-run with artifacts available), `job.run.errored` (immediate error alert — no artifact guarantee)", "B": "`job.run.started` (fires at completion), `job.run.completed` (fires mid-run), `job.run.errored` (fires at start)", "C": "`job.run.queued`, `job.run.completed`, `job.run.errored`", "D": "`job.run.started`, `job.run.paused`, `job.run.completed`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The three dbt Cloud webhook event types are: **`job.run.started`** — fires when a job begins (before any models run; use for pre-run provisioning); **`job.run.completed`** — fires after completion AND artifact ingestion (safe to query API for artifacts); **`job.run.errored`** — fires immediately on error (fastest for alerting, but API artifacts may not yet be available)."}, "B": {"label": "❌ Incorrect", "text": "The timings described are all wrong — this inverts the actual behavior of each event."}, "C": {"label": "❌ Incorrect", "text": "`job.run.queued` is not a documented dbt Cloud webhook event type. The three events are `started`, `completed`, and `errored`."}, "D": {"label": "❌ Incorrect", "text": "`job.run.paused` is not a documented dbt Cloud webhook event type."}}, "key_rule": "Three events = `started` (pre-run), `completed` (post-run + artifacts ready), `errored` (fast alert, no artifact guarantee)."}, {"id": "q07_Q10", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 10, "high_yield": false, "subdomain_id": "6.10", "subdomain_topic": "Webhook signature validation", "question_text": "A security engineer asks how to verify that incoming webhook payloads are genuinely from dbt Cloud and not spoofed by a third party. What mechanism does dbt Cloud use?", "is_multi_select": false, "options": {"A": "Webhook payloads include an API key in the URL query string that matches the dbt Cloud account's API key.", "B": "Webhook payloads are encrypted using the account's public key — only the account's private key can decrypt them.", "C": "dbt Cloud uses mutual TLS — the receiving endpoint must present a valid certificate from dbt Labs' CA.", "D": "dbt Cloud signs payloads using **SHA256 HMAC** and includes the signature in the **Authorization header** — recipients should compute the expected signature and compare."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "API keys in query strings are not the dbt Cloud webhook security model and would be visible in logs."}, "B": {"label": "❌ Incorrect", "text": "dbt Cloud does not use asymmetric encryption for webhook payloads."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not use mutual TLS for webhook delivery. Standard HTTPS is used for the transport, with HMAC for payload integrity."}, "D": {"label": "✅ Correct", "text": "The `Authorization` header holds a SHA256 hash (HMAC) of the request body, with your webhook's secret token as the key. Compute the same hash on your server and compare. The docs strongly recommend this check to catch spoofed requests."}}, "key_rule": "Webhook security = **SHA256 HMAC signature** in Authorization header. Verify by computing expected HMAC and comparing."}, {"id": "q07_Q11", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 11, "high_yield": false, "subdomain_id": "6.11", "subdomain_topic": "Reactivating a webhook", "question_text": "A webhook was archived after repeated failures and the endpoint is now fixed. How do you reactivate it in the UI?", "is_multi_select": false, "options": {"A": "Contact dbt support.", "B": "Wait. dbt retries archived webhooks every hour.", "C": "Update the webhook's endpoint URL. dbt reactivates it automatically when the URL changes.", "D": "Delete it and recreate it with the same secret."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "It's self-service."}, "B": {"label": "❌ Incorrect", "text": "Not documented. Archived webhooks aren't retried on a timer."}, "C": {"label": "✅ Correct", "text": "The docs say dbt automatically reactivates the webhook when the URL changes. Through the API, use `PUT` with `active` set to `true`, or update `client_url`."}, "D": {"label": "❌ Incorrect", "text": "Not needed."}}, "key_rule": "Reactivate = change the endpoint URL (UI) or `PUT` with `active: true` (API)."}, {"id": "q07_Q12", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 12, "high_yield": false, "subdomain_id": "6.12", "subdomain_topic": "Webhook response window", "question_text": "A team builds a webhook handler that performs heavy data processing synchronously — querying multiple APIs and writing to a database — before returning a response. The average processing time is 12 seconds. What is the risk?", "is_multi_select": false, "options": {"A": "The delivery is recorded as a failure — dbt's webhook timeout is **10 seconds**.", "B": "No risk — dbt Cloud waits up to 60 seconds for a response.", "C": "The webhook will succeed but dbt Cloud will throttle future deliveries for that endpoint.", "D": "A 12-second response is within the acceptable range — the timeout is 30 seconds."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say a webhook in dbt has a timeout of **10 seconds**. A slow endpoint can record success on its side while dbt records a failure. Fix: respond immediately, then process asynchronously."}, "B": {"label": "❌ Incorrect", "text": "The timeout is 10 seconds, not 60 seconds."}, "C": {"label": "❌ Incorrect", "text": "Not documented. The consequence is a failed delivery."}, "D": {"label": "❌ Incorrect", "text": "The timeout is 10 seconds, not 30."}}, "key_rule": "Webhook timeout = **10 seconds**. Respond immediately and process asynchronously."}, {"id": "q07_Q13", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 13, "high_yield": false, "subdomain_id": "6.13", "subdomain_topic": "Job auto-deactivation", "question_text": "An engineer notices that a scheduled dbt job has stopped enqueuing runs automatically, even though the schedule is still configured. Investigation shows the job has failed on every run for the past 3 months. What feature likely caused this?", "is_multi_select": false, "options": {"A": "The job's cron schedule expired — cron jobs must be renewed after 90 days.", "B": "The run slot quota was exhausted — no new jobs can be scheduled until existing queued runs complete.", "C": "The job reached the **100 consecutive failure** threshold and was auto-deactivated — it stopped auto-enqueueing new runs.", "D": "dbt Cloud automatically pauses jobs that exceed their configured run timeout."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "cron jobs do not expire on a 90-day cycle in dbt Cloud."}, "B": {"label": "❌ Incorrect", "text": "Run slot exhaustion would delay queuing, not permanently stop auto-enqueueing."}, "C": {"label": "✅ Correct", "text": "dbt deactivates a deploy job or a CI job after **100 consecutive failing runs**, so it's no longer enqueued from schedules or triggers. Reactivate it by editing and saving the job, or with **Run now**."}, "D": {"label": "❌ Incorrect", "text": "Run timeout causes individual runs to cancel, not the job to be deactivated."}}, "key_rule": "Auto-deactivation = a deploy or CI job stops being enqueued after **100 consecutive failures**. Edit and save it, or **Run now**, to reactivate."}, {"id": "q07_Q14", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 14, "high_yield": false, "subdomain_id": "6.14", "subdomain_topic": "Job notification events", "question_text": "Which events can you choose for job notifications?", "is_multi_select": false, "options": {"A": "Starts, queued, times out.", "B": "Succeeds and fails only.", "C": "Success, error, skipped.", "D": "Succeeds, warns, fails, is canceled."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not job notification events."}, "B": {"label": "❌ Incorrect", "text": "There are two more: warns and is canceled."}, "C": {"label": "❌ Incorrect", "text": "Not the documented event names."}, "D": {"label": "✅ Correct", "text": "Warns comes from warning-level lines in data tests or source freshness, so a run that shows Success can still send a Warns notification."}}, "key_rule": "Job notification events = succeeds, warns, fails, is canceled. Channels: email, Slack (public channels only), Teams."}, {"id": "q07_Q15", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 15, "high_yield": false, "subdomain_id": "6.15", "subdomain_topic": "Memory limit per run pod", "question_text": "A team uses a dbt macro to load a large reference dataset into a Jinja variable during compilation. The macro reads the dataset using `run_query()` and stores it in a variable for downstream use across hundreds of models. Jobs start failing with out-of-memory errors. What is the cause and what is the limit?", "is_multi_select": false, "options": {"A": "The `run_query()` function is limited to 10,000 rows — the macro is truncating data.", "B": "dbt Cloud imposes a **600 MiB memory limit** per run pod on all plans. Loading large datasets into Jinja variables via macros exhausts this limit.", "C": "The default thread count (4) causes memory contention — reduce threads to 1.", "D": "The memory limit is 2 GiB on Enterprise+ and 512 MiB on other plans."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not a documented limit."}, "B": {"label": "✅ Correct", "text": "All dbt accounts have a pod memory of **600 MiB**, applied per run. It's set at the account level and can't be customized per job. A run that exceeds it is terminated with a \"memory limit error\". Keep large lookups in the warehouse."}, "C": {"label": "❌ Incorrect", "text": "Thread count affects warehouse concurrency, not the dbt run pod memory."}, "D": {"label": "❌ Incorrect", "text": "The memory limit is **600 MiB on all plans** — it does not vary by plan tier."}}, "key_rule": "dbt Cloud run pod memory limit = **600 MiB, all plans, not configurable**. Loading large datasets into macros causes OOM failures."}, {"id": "q07_Q16", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 16, "high_yield": false, "subdomain_id": "6.16", "subdomain_topic": "Thread count", "question_text": "A team increases the thread count on their dbt Cloud job from the default of 4 to 32, hoping to significantly speed up their 500-model deployment job. What is the likely outcome?", "is_multi_select": false, "options": {"A": "Thread count above 16 is blocked by dbt Cloud and will revert to 16 automatically.", "B": "The job runs approximately 8× faster — thread count scales linearly with throughput.", "C": "The job runs faster, but the cost increases proportionally to the thread count.", "D": "Run time can drop, but only as far as the dependency graph and the warehouse's concurrent-query limit allow, and the extra load can queue other tools' queries."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs state no maximum on threads."}, "B": {"label": "❌ Incorrect", "text": "Not linear. The dependency graph limits how many models can run at once, and the warehouse's concurrent-query limit can make models queue."}, "C": {"label": "❌ Incorrect", "text": "The docs say more threads increase the load on your warehouse. They don't say cost scales with threads."}, "D": {"label": "✅ Correct", "text": "The default thread count is **4**. More threads usually cut run time, but they add load on the warehouse and may queue other tools' queries. The graph and the warehouse's concurrent-query limit cap the benefit. The docs advise testing different values."}}, "key_rule": "Default threads = **4**. More threads usually shorten runs but add warehouse load. Limited by the DAG and warehouse concurrency. Test different values."}, {"id": "q07_Q17", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 17, "high_yield": false, "subdomain_id": "6.17", "subdomain_topic": "Interval scheduling", "question_text": "A job uses the Intervals schedule type, every 2 hours. How does dbt time the runs?", "is_multi_select": false, "options": {"A": "At fixed hours in the account's local time zone.", "B": "Every 2 hours counted from midnight UTC, with the same gap each time (a run at 00:04 is followed by one at 02:04).", "C": "2 hours after the previous run finishes.", "D": "At clock hours in each user's time zone."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt uses UTC for all jobs. It doesn't convert to local time or adjust for daylight saving."}, "B": {"label": "✅ Correct", "text": "The docs say Intervals run every N hours starting from midnight UTC, and the gap between runs stays constant."}, "C": {"label": "❌ Incorrect", "text": "The docs describe a constant gap between runs, not a gap from when the previous run finishes."}, "D": {"label": "❌ Incorrect", "text": "All scheduling is UTC."}}, "key_rule": "Intervals = every N hours from midnight UTC, constant gap. Specific hours = whole UTC hours. Cron = exact times. All UTC."}, {"id": "q07_Q18", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 18, "high_yield": false, "subdomain_id": "6.18", "subdomain_topic": "Job duration exceeds schedule frequency", "question_text": "A job is scheduled to run \"every 30 minutes\" but each run takes 45 minutes to complete. What does dbt Cloud do?", "is_multi_select": false, "options": {"A": "The scheduler cancels any queued runs and keeps only the newest — preventing queue buildup. The effective run frequency becomes approximately 45 minutes.", "B": "The job is automatically suspended after the second overlap and must be manually re-enabled.", "C": "dbt Cloud runs both the current job and the next scheduled run concurrently, using two run slots.", "D": "The next scheduled run waits in the queue and starts immediately after the current run finishes, creating a permanent backlog."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "When a job's runtime exceeds its scheduling frequency, dbt Cloud's scheduler **cancels queued runs and keeps only the newest**. This prevents queue buildup — instead of accumulating a growing backlog of delayed runs, only the most recent scheduled invocation stays in queue. The effective execution frequency naturally becomes the actual job duration (approx. 45 minutes in this case). This is protective behavior, not an error state."}, "B": {"label": "❌ Incorrect", "text": "Jobs are not suspended due to schedule/duration overlap."}, "C": {"label": "❌ Incorrect", "text": "Even if run slots were available, the scheduler's behavior is to prevent backlog, not to run concurrently."}, "D": {"label": "❌ Incorrect", "text": "The queue backlog scenario is specifically what dbt Cloud's scheduler prevents by cancelling stale queued runs."}}, "key_rule": "Job duration > schedule interval → scheduler cancels queued runs, keeps newest. Effective frequency = actual run duration."}, {"id": "q07_Q19", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 19, "high_yield": false, "subdomain_id": "6.19", "subdomain_topic": "Email vs webhook notifications", "question_text": "A data team is deciding between email notifications and webhooks for their job failure monitoring. Which statement correctly describes when each is the better choice?", "is_multi_select": false, "options": {"A": "Email notifications support richer content (with model-level failure details) while webhooks only provide a pass/fail signal.", "B": "Webhooks are only available on Enterprise plan — Starter teams must use email.", "C": "Email is simpler for basic per-job alerting with no infrastructure required. Webhooks are better when you need programmatic handling — triggering Slack bots, PagerDuty, incident management, or custom automation.", "D": "Webhooks are always better — email notifications are only for legacy setups."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Webhooks actually include richer payload data (run ID, job details, timestamps). Email notifications are simpler in content, not richer."}, "B": {"label": "❌ Incorrect", "text": "Webhooks work on Starter or Enterprise-tier plans, not only Enterprise."}, "C": {"label": "✅ Correct", "text": "**Email notifications**: no plan restriction, no infrastructure, simple success/failure alerts per job — ideal for small teams or low-complexity monitoring. **Webhooks**: require an endpoint and handler, but enable programmatic responses — integrating with Slack, PagerDuty, incident management, or custom dashboards. Use email when you just need a notification; use webhooks when you need to act on the event or route it to another system."}, "D": {"label": "❌ Incorrect", "text": "Email notifications are a fully supported feature with a clear use case — they are not deprecated."}}, "key_rule": "Email = simple, no infra, per-job alerts. Webhook = programmatic, integrate with Slack/PagerDuty/automation."}, {"id": "q07_Q20", "file_id": "q07", "topic_num": "6", "topic_name": "Monitoring & Alerting", "question_num": 20, "high_yield": false, "subdomain_id": "6.20", "subdomain_topic": "Webhook permissions", "question_text": "Which users can create webhooks on an Enterprise-tier plan?", "is_multi_select": false, "options": {"A": "Only Account Admins.", "B": "Anyone with a Read-Only license.", "C": "Users, or service tokens, with the Account Admin, Admin or Developer permission set.", "D": "Security Admins."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Admin and Developer permission sets work too."}, "B": {"label": "❌ Incorrect", "text": "Read-Only users don't have write access."}, "C": {"label": "✅ Correct", "text": "The docs say you, or the API service token, must have the Account Admin, Admin or Developer permission set for write access. On Starter, the UI needs a Developer license."}, "D": {"label": "❌ Incorrect", "text": "Security Admin isn't one of the permission sets listed."}}, "key_rule": "Create webhooks: Enterprise-tier = Account Admin, Admin or Developer permission set. Starter = Developer license. Plan: Starter or Enterprise-tier."}, {"id": "q08_Q1", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 1, "high_yield": true, "subdomain_id": "7.1", "subdomain_topic": "Cross-project environment resolution", "question_text": "A dbt Mesh has two projects: `platform` (producer) and `marketing` (consumer). The `platform` project has both a Staging environment and a Production environment. A developer's IDE job in `marketing` references a public model from `platform`. Which environment does `marketing`'s development job resolve the cross-project ref against?", "is_multi_select": false, "options": {"A": "Production — development jobs always use production data for stability.", "B": "The job fails — cross-project refs cannot be resolved from the IDE.", "C": "Development — cross-project refs always resolve against the producer's Development environment.", "D": "Staging — development jobs in a consumer project resolve against the producer's Staging environment when one exists."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Development jobs do NOT resolve to Production by default when a Staging environment exists."}, "B": {"label": "❌ Incorrect", "text": "Cross-project refs from the IDE are supported on Enterprise and Enterprise+."}, "C": {"label": "❌ Incorrect", "text": "The docs resolve downstream Development refs to the upstream's Staging (if it exists) or Production."}, "D": {"label": "✅ Correct", "text": "The cross-project env resolution table (memorize this): Development → **Staging (if exists), else Production**. Since `platform` has a Staging environment, the `marketing` developer's IDE job resolves refs there."}}, "key_rule": "Dev → Staging (if exists), else Production. Staging → Staging if it exists, else Production. Production → Production."}, {"id": "q08_Q2", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 2, "high_yield": true, "subdomain_id": "7.2", "subdomain_topic": "Setting up additional dbt projects stepwise", "question_text": "An architect is setting up a bidirectional dependency between ProjectA and ProjectB in dbt Mesh simultaneously — adding both `dependencies.yml` entries at the same time and running both projects at once. Both fail to resolve cross-project refs. What went wrong?", "is_multi_select": false, "options": {"A": "Bidirectional dependencies are not supported in dbt Mesh — only one-directional.", "B": "Cross-project dependencies must be set up **stepwise**: the producer runs first to generate its manifest, then the consumer adds the dependency and runs. Setting both up simultaneously creates a bootstrap failure.", "C": "The project names in `dependencies.yml` use mismatched casing.", "D": "Both projects need to be on the same dbt version for cross-project refs to work."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Bidirectional dependencies between projects can be set up — but must be done stepwise, not simultaneously."}, "B": {"label": "✅ Correct", "text": "The docs say to set up dependent projects stepwise: each project must run and produce public models before the original producer can depend on the original consumer (A runs → B adds A and runs → A adds B)."}, "C": {"label": "❌ Incorrect", "text": "Case sensitivity in `dependencies.yml` is a real gotcha, but the scenario specifically describes a simultaneous setup failure — that's a stepwise issue, not a naming issue."}, "D": {"label": "❌ Incorrect", "text": "There is no requirement for matching dbt versions across Mesh projects."}}, "key_rule": "Mesh setup = **stepwise**. Producer runs first → consumer adds dependency → consumer runs. Never simultaneous."}, {"id": "q08_Q3", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 3, "high_yield": true, "subdomain_id": "7.3", "subdomain_topic": "Ephemeral models cannot be public", "question_text": "A data engineer sets `access: public` on an ephemeral model to share it across projects. What happens?", "is_multi_select": false, "options": {"A": "dbt throws a **parsing error** — ephemeral models cannot have `access: public`.", "B": "The model is automatically converted to a view to support public access.", "C": "The model becomes public and is available for cross-project refs.", "D": "The model compiles but fails at runtime with an access violation."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say models with `materialized: ephemeral` cannot be `public`, and setting it causes a parse error."}, "B": {"label": "❌ Incorrect", "text": "dbt does not auto-convert materialization types based on access levels."}, "C": {"label": "❌ Incorrect", "text": "Not allowed. dbt raises a parse error."}, "D": {"label": "❌ Incorrect", "text": "The error occurs at **parse time**, not runtime."}}, "key_rule": "Ephemeral + `access: public` = **parsing error**. Ephemeral can only be `protected` or `private`."}, {"id": "q08_Q4", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 4, "high_yield": true, "subdomain_id": "7.4", "subdomain_topic": "Model contracts must declare all columns", "question_text": "A team adds `contract: enforced: true` to a model but only declares 3 of the model's 15 columns in the YAML. What happens?", "is_multi_select": false, "options": {"A": "The contract compiles successfully; undeclared columns get default type validation.", "B": "The contract enforces the 3 declared columns and auto-discovers the remaining 12 from the database.", "C": "dbt raises a compilation error — contracts require ALL columns to be declared when `enforced: true`.", "D": "The contract validates only the 3 declared columns and ignores the rest."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There are no default type validations for undeclared columns. The compilation fails."}, "B": {"label": "❌ Incorrect", "text": "dbt does not auto-discover or infer contract columns — all must be explicitly declared."}, "C": {"label": "✅ Correct", "text": "When `contract: enforced: true`, **ALL columns must be declared** in the model's YAML. Partial declarations cause a compilation error. This is by design — a contract guarantees the complete schema, not just selected columns."}, "D": {"label": "❌ Incorrect", "text": "Partial contracts are not supported — you cannot selectively enforce some columns."}}, "key_rule": "Contracts = **ALL columns must be declared**. Partial contracts not supported → compilation error."}, {"id": "q08_Q5", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 5, "high_yield": true, "subdomain_id": "7.5", "subdomain_topic": "check constraint platform support", "question_text": "A team uses Snowflake as their warehouse and adds a `check` constraint to a model contract expecting it to enforce data validation at the database level. Will this work?", "is_multi_select": false, "options": {"A": "Yes — Snowflake enforces `check` constraints defined in dbt contracts.", "B": "No — `check` constraints are not supported in dbt contracts on any platform.", "C": "Yes — but only when using the Fusion engine with PKCS#8 key pair authentication.", "D": "No — Snowflake does not support `check` constraints in dbt contracts. Only Postgres and Databricks enforce them."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Snowflake doesn't support the `check` syntax. dbt skips the `check` config."}, "B": {"label": "❌ Incorrect", "text": "`check` constraints ARE supported — just not on all platforms. Postgres and Databricks enforce them."}, "C": {"label": "❌ Incorrect", "text": "The Fusion engine is related to performance and key pair auth — it doesn't change constraint enforcement capabilities."}, "D": {"label": "✅ Correct", "text": "`check` constraints are enforced on **Postgres** and **Databricks**. Snowflake doesn't support `check` (dbt skips it), and neither does BigQuery."}}, "key_rule": "`check` constraints = **Postgres + Databricks only**. Snowflake and BigQuery do NOT support them."}, {"id": "q08_Q6", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 6, "high_yield": true, "subdomain_id": "7.6", "subdomain_topic": "Requirements for cross-project refs", "question_text": "A team on dbt Cloud Enterprise has set `access: public` on a model in ProjectA and wants ProjectB to reference it. They add the `ref()` call in ProjectB but get a resolution error. What else is required? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Add a `public_models:` block to ProjectA's `dbt_project.yml`.", "B": "Ensure the project name in `dependencies.yml` matches the name in `dbt_project.yml` exactly (case-sensitive).", "C": "Configure a shared service token that both projects use for model resolution.", "D": "Upgrade to Enterprise+ plan — cross-project refs require Enterprise+, not Enterprise.", "E": "Add ProjectA to ProjectB's `dependencies.yml` under the `projects:` key."}, "correct_answers": ["B", "E"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `public_models:` block in `dbt_project.yml` — public access is declared on individual models via `access: public`."}, "B": {"label": "✅ Correct", "text": "The project name in `dependencies.yml` is **case-sensitive** and must exactly match the `name:` field in ProjectA's `dbt_project.yml`. The docs say it must match exactly."}, "C": {"label": "❌ Incorrect", "text": "Cross-project ref resolution uses the dbt Metadata Service — it doesn't require a shared service token between projects."}, "D": {"label": "❌ Incorrect", "text": "Cross-project refs require **Enterprise or Enterprise+** — both tiers support it. Enterprise alone is sufficient."}, "E": {"label": "✅ Correct", "text": "The consuming project (ProjectB) must list the producer project (ProjectA) in its `dependencies.yml` under the `projects:` key. Without this, dbt doesn't know to resolve refs against ProjectA's metadata."}}, "key_rule": "Cross-project ref = `access: public` + Enterprise or Enterprise+ + **`dependencies.yml`** with the exact case-sensitive project name + successful production runs upstream."}, {"id": "q08_Q7", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 7, "high_yield": false, "subdomain_id": "7.7", "subdomain_topic": "Model versioning and deprecation", "question_text": "A public contracted model `dim_customers` is at `latest_version: 2`. Several downstream teams are still pinned to `v=1`. The platform team wants to retire v1. What is the correct approach?", "is_multi_select": false, "options": {"A": "Set `access: private` on v1 to prevent new consumers from using it while allowing existing ones to continue.", "B": "Set a `deprecation_date` on v1 — dbt notifies consumers that v1 is slated for deprecation, giving them time to migrate.", "C": "Delete the `dim_customers_v1.sql` file directly — downstream consumers will auto-upgrade to v2.", "D": "Change `latest_version` to `1` so all unpinned consumers revert to v1 while the team coordinates."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Changing access to `private` would break cross-project consumers referencing v1 immediately — not a graceful migration."}, "B": {"label": "✅ Correct", "text": "The docs say dbt notifies consumers of a versioned model when new versions become available or when versions are slated for deprecation. The graceful flow: create v2 → bump `latest_version` → set `deprecation_date` on v1 → let consumers migrate → remove v1 after the date."}, "C": {"label": "❌ Incorrect", "text": "Deleting `v1.sql` immediately breaks all downstream consumers pinned on v1 — no migration window."}, "D": {"label": "❌ Incorrect", "text": "Changing `latest_version` back to 1 doesn't help — consumers pinned to v1 are already on v1. Unpinned consumers would move to v1, which may be outdated for them."}}, "key_rule": "Retiring a model version = set `deprecation_date` → consumers are notified. Never modify contracted public
