models in place."}, {"id": "q08_Q8", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 8, "high_yield": false, "subdomain_id": "7.8", "subdomain_topic": "Governance groups vs RBAC groups", "question_text": "A model is assigned to the `finance` governance group with `access: private`. A user in the RBAC \"Finance Team\" user group tries to reference this model from another model in a different governance group. Does their RBAC group membership grant them access?", "is_multi_select": false, "options": {"A": "Yes — but only if the admin explicitly links the RBAC group to the governance group in Account Settings.", "B": "No — private model access requires the user to have a Developer license.", "C": "No — governance groups and RBAC user groups are completely orthogonal concepts. RBAC user group membership does not grant governance group model access.", "D": "Yes — being in the \"Finance Team\" RBAC group implies membership in the `finance` governance group."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not documented."}, "B": {"label": "❌ Incorrect", "text": "License type is about UI feature access, not model governance group access."}, "C": {"label": "✅ Correct", "text": "A model's `group` is set in project code, and `access: private` means only resources in that group can reference it. Platform user groups are a separate access-control feature, and the docs don't link the two."}, "D": {"label": "❌ Incorrect", "text": "Not documented."}}, "key_rule": "Model groups (code) ≠ platform user groups (access control). A model's `group` decides who can `ref()` it when it's private."}, {"id": "q08_Q9", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 9, "high_yield": false, "subdomain_id": "7.9", "subdomain_topic": "Multiple projects sharing sources", "question_text": "A dbt Mesh has three projects, each needing access to the same raw data sources (e.g., `raw.orders`, `raw.customers`). Can they all define `sources:` for these tables independently?", "is_multi_select": false, "options": {"A": "They shouldn't. The docs advise that no two sources in a mesh point to the same relation. Use a foundational project that exposes public staging models.", "B": "Yes — each project can define its own `sources:` for the same raw tables with no conflicts.", "C": "No — sources can only be defined in one project. Other projects must import the source definitions via packages.", "D": "Sources are defined at the account level in dbt Cloud and shared automatically across all projects."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say sharing sources across projects isn't currently possible. The workaround is a foundational project that holds the source staging models and exposes them as public models. They also advise that no two sources in a mesh point to the same relation."}, "B": {"label": "❌ Incorrect", "text": "The docs advise against two sources in a mesh pointing to the same relation."}, "C": {"label": "❌ Incorrect", "text": "Not what the docs say."}, "D": {"label": "❌ Incorrect", "text": "Sources are not account-level constructs — they're defined within projects."}}, "key_rule": "Don't share `sources:` across Mesh projects. Use a **foundational project** with public staging models instead."}, {"id": "q08_Q10", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 10, "high_yield": false, "subdomain_id": "7.10", "subdomain_topic": "Recognizing Mesh in lineage graph", "question_text": "An architect is reviewing the dbt Catalog lineage graph for a project. Which of the following visual indicators confirm the project is part of a dbt Mesh? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The Catalog shows a \"Cost Insights\" tab for each project.", "B": "The graph shows distinct project boundary nodes — upstream projects appear as labeled groupings separate from the local project's DAG.", "C": "Lineage edges cross project boundaries with the upstream model labeled by its source project name.", "D": "All models display their `access` level (private/protected/public) next to their name.", "E": "Models are displayed with their schema and database names visible."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not a Mesh indicator."}, "B": {"label": "✅ Correct", "text": "In Catalog, nodes for another project show a project icon next to the project name, and downstream projects appear as separate project nodes connected by dashed lines."}, "C": {"label": "✅ Correct", "text": "Public models from other projects appear in the lineage, and selecting one shows which project produces it."}, "D": {"label": "❌ Incorrect", "text": "Not a documented Mesh indicator."}, "E": {"label": "❌ Incorrect", "text": "Schema and database names may be visible in any project setup — this is not a Mesh-specific indicator."}}, "key_rule": "Mesh in Catalog = project nodes (project icon) + public models from other projects. Only **directly referenced** public models appear. Account lineage → List view lists projects and public models."}, {"id": "q08_Q11", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 11, "high_yield": true, "subdomain_id": "7.11", "subdomain_topic": "Incremental model + contract: on_schema_change", "question_text": "A contracted incremental model on Snowflake uses `on_schema_change: sync_all_columns`. The team runs a refresh and gets a compilation error. What is the issue?", "is_multi_select": false, "options": {"A": "Contracted models cannot be incremental — they must be table or view materializations.", "B": "Contracts on incremental models only support `on_schema_change: append_new_columns` or `fail` — `sync_all_columns` is not supported.", "C": "`sync_all_columns` is not a valid `on_schema_change` value — the correct value is `sync_columns`.", "D": "`sync_all_columns` requires the Fusion engine to work with contracts."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Contracted models can be incremental — they just have restricted schema change options."}, "B": {"label": "✅ Correct", "text": "The docs say incremental models with an enforced contract are supported only with `on_schema_change: append_new_columns` or `fail`."}, "C": {"label": "❌ Incorrect", "text": "`sync_all_columns` is a valid `on_schema_change` value in general — it's just incompatible with contracts."}, "D": {"label": "❌ Incorrect", "text": "The Fusion engine doesn't change the schema change handling for contracted incrementals."}}, "key_rule": "Incremental + contract = only `append_new_columns` or `fail`. `sync_all_columns` not supported with contracts."}, {"id": "q08_Q12", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 12, "high_yield": false, "subdomain_id": "7.12", "subdomain_topic": "Unpinned ref resolves to latest_version", "question_text": "A model in a consumer project references an upstream versioned model with an unpinned `ref('dim_customers')` call. The producer project has `latest_version: 2` with v1 and v2 both defined. Which version does the consumer reference?", "is_multi_select": false, "options": {"A": "The call is ambiguous and raises a compile error — all versioned model refs must be pinned.", "B": "v1 — unpinned refs always resolve to the lowest version for stability.", "C": "The version used depends on which environment the job runs in.", "D": "v2 — unpinned refs always resolve to `latest_version`."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Unpinned refs are valid and resolve to `latest_version`. Only when you need a specific older version do you need to pin (e.g., `ref('dim_customers', v=1)`)."}, "B": {"label": "❌ Incorrect", "text": "Unpinned refs resolve to the *latest* version, not the lowest."}, "C": {"label": "❌ Incorrect", "text": "`latest_version` is a project-level definition — it doesn't vary by environment."}, "D": {"label": "✅ Correct", "text": "An unpinned `ref('dim_customers')` **always resolves to `latest_version`**. Since `latest_version: 2`, the consumer gets v2. To pin to an older version: `ref('dim_customers', v=1)`. Cross-project: `ref('producer_project', 'dim_customers', v=1)`."}}, "key_rule": "Unpinned `ref('model')` → resolves to **`latest_version`**. Pin with `v=1` to use older versions."}, {"id": "q08_Q13", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 13, "high_yield": false, "subdomain_id": "7.13", "subdomain_topic": "Python models and contracts", "question_text": "A team wants to apply a dbt contract to a Python model to enforce column types across cross-project consumers. They add `contract: enforced: true` and declare all columns in the YAML. The contract is ignored and no validation occurs. Why?", "is_multi_select": false, "options": {"A": "Python models support contracts but require the `--enforce-contracts` flag at runtime.", "B": "Contracts on Python models require dbt 1.5+ — the team is likely on an older version.", "C": "Python model contracts require BigQuery or Databricks — they are not supported on Snowflake.", "D": "dbt contracts only work on **SQL materializations** — Python models cannot have contracts enforced."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `--enforce-contracts` runtime flag. Contracts are a compile-time feature, and Python models are simply not supported."}, "B": {"label": "❌ Incorrect", "text": "Version is not the limitation. Python model contracts are architecturally unsupported regardless of dbt version."}, "C": {"label": "❌ Incorrect", "text": "The limitation is not platform-specific — Python model contracts are unsupported on all platforms."}, "D": {"label": "✅ Correct", "text": "The docs list Python models as not supported for contracts (along with ephemeral, materialized views and custom materializations)."}}, "key_rule": "Contracts = **SQL models only**. Python models cannot have contracts. Reimplement as SQL if governance is required."}, {"id": "q08_Q14", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 14, "high_yield": false, "subdomain_id": "7.14", "subdomain_topic": "state:modified.contract selector", "question_text": "A platform team wants to detect when any model's contract has changed — specifically, when column names or data types in a contracted model's YAML definition have been modified. Which state selector should they use in their CI job?", "is_multi_select": false, "options": {"A": "`state:modified.relation` — detects schema changes", "B": "`state:modified.configs` — detects all configuration changes", "C": "`state:modified.contract` — specifically detects contract changes (column names or types)", "D": "`state:modified.body` — detects SQL content changes"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`state:modified.relation` detects changes to database, schema, or alias — not contract definitions."}, "B": {"label": "❌ Incorrect", "text": "`state:modified.configs` detects configuration changes but **excludes** database/schema/alias changes. It also does not specifically target contract column/type changes."}, "C": {"label": "✅ Correct", "text": "**`state:modified.contract`** is the precise selector for detecting when a model's **contract has changed** — specifically column names or data types in the contract definition. This is essential in a dbt Mesh: if a contracted public model's column types change, downstream consumers need to know. Using this selector in CI ensures contract changes are always caught and validated."}, "D": {"label": "❌ Incorrect", "text": "`state:modified.body` detects changes to the model's SQL or seed file content — not YAML contract definitions."}}, "key_rule": "`state:modified.contract` = detects contract changes (column names/types). Use in CI for contracted public models."}, {"id": "q08_Q15", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 15, "high_yield": false, "subdomain_id": "7.15", "subdomain_topic": "Cross-project ref syntax", "question_text": "A developer in the `marketing` project wants to reference a public model named `monthly_revenue` from the `jaffle_finance` project. They also need to pin to version 1 of the model. Which `ref()` calls are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "`{{ ref('jaffle_finance', 'monthly_revenue', v=1) }}`", "B": "`{{ ref('jaffle_finance', 'monthly_revenue') }}`", "C": "`{{ source('jaffle_finance', 'monthly_revenue') }}`", "D": "`{{ ref('monthly_revenue') }}`", "E": "`{{ ref('jaffle_finance.monthly_revenue') }}`"}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "**Three-argument `ref('project', 'model', v=N)`** is the cross-project ref with version pinning: `{{ ref('jaffle_finance', 'monthly_revenue', v=1) }}`. This pins to version 1 specifically."}, "B": {"label": "✅ Correct", "text": "**Two-argument `ref('project', 'model')`** is the correct cross-project ref syntax: `{{ ref('jaffle_finance', 'monthly_revenue') }}`. This references the latest version of `monthly_revenue` in the `jaffle_finance` project."}, "C": {"label": "❌ Incorrect", "text": "`source()` is for raw source tables, not dbt models in other projects. Cross-project model references use `ref()`."}, "D": {"label": "❌ Incorrect", "text": "Single-argument `ref('monthly_revenue')` only searches within the current project — it will fail or reference a wrong model if the source model is in another project."}, "E": {"label": "❌ Incorrect", "text": "Dot notation `'jaffle_finance.monthly_revenue'` is not valid `ref()` syntax. The project and model name are separate arguments."}}, "key_rule": "Cross-project ref = `ref('project_name', 'model_name')`. With version pin = `ref('project_name', 'model_name', v=1)`."}, {"id": "q08_Q16", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 16, "high_yield": false, "subdomain_id": "7.16", "subdomain_topic": "dependencies.yml case sensitivity", "question_text": "A team's consumer project has the following `dependencies.yml`:\n```yaml\nprojects:\n  - name: jaffle_Finance\n```\nThe upstream project's `dbt_project.yml` has `name: jaffle_finance` (all lowercase). Cross-project refs fail. What is the cause?", "is_multi_select": false, "options": {"A": "The upstream project must also list the consumer project in its `dependencies.yml` for bidirectional resolution.", "B": "Project names in `dependencies.yml` must match the upstream project's `dbt_project.yml` name **exactly** — including case. `jaffle_Finance` ≠ `jaffle_finance`.", "C": "`dependencies.yml` only accepts lowercase project names — uppercase letters are not permitted.", "D": "The `dependencies.yml` file must be placed in the `models/` directory, not the project root."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Bidirectional dependencies require careful stepwise setup, but the issue here is simply a case mismatch in the project name."}, "B": {"label": "✅ Correct", "text": "Project names in `dependencies.yml` are **case-sensitive** and must exactly match the `name:` field in the upstream project's `dbt_project.yml`. `jaffle_Finance` does not match `jaffle_finance`. The docs say the name must match exactly, e.g. `jaffle_marketing`, not `JAFFLE_MARKETING`."}, "C": {"label": "❌ Incorrect", "text": "Project names can technically be mixed case in `dbt_project.yml`. The constraint is matching exactly, not forcing lowercase."}, "D": {"label": "❌ Incorrect", "text": "`dependencies.yml` belongs in the project root, not in `models/`. This is correct placement."}}, "key_rule": "`dependencies.yml` project names are **case-sensitive** — must exactly match `dbt_project.yml` `name:` field."}, {"id": "q08_Q17", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 17, "high_yield": false, "subdomain_id": "7.17", "subdomain_topic": "Protected vs private access", "question_text": "A team has a model assigned `access: protected` (the default). A developer in a different governance group within the same project tries to reference it. Another developer in an installed package also tries to reference it. Which of these succeed?", "is_multi_select": false, "options": {"A": "The same-project developer succeeds; the package developer also succeeds. `protected` = same project or installed package.", "B": "Neither — `protected` is equivalent to `private` and restricts access to the same group only.", "C": "The same-project developer succeeds; the package developer fails. `protected` = same project only.", "D": "Both succeed — `protected` allows access from any project or package."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**`protected` (default)** allows references from: (1) any model within the **same project** regardless of governance group, AND (2) models in **installed packages**. A developer in a different group within the same project can reference it; a developer in an installed package can also reference it. Only **cross-project refs from other dbt projects** (not packages) are blocked. `private` would restrict to same governance group only."}, "B": {"label": "❌ Incorrect", "text": "`protected` is less restrictive than `private`. `private` restricts to the same governance group only."}, "C": {"label": "❌ Incorrect", "text": "Installed packages CAN reference `protected` models — this is one of the two allowed access scenarios."}, "D": {"label": "❌ Incorrect", "text": "`public` allows any project or package. `protected` is more restrictive than `public`."}}, "key_rule": "`private` = same group only. `protected` = same project + installed packages. `public` = any project."}, {"id": "q08_Q18", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 18, "high_yield": false, "subdomain_id": "7.18", "subdomain_topic": "--favor-state flag", "question_text": "A developer runs `dbt build --select state:modified+ --defer --state ./prod` in their local environment. Some modified models exist in their local dev schema, but dbt resolves their upstream parent models against local dev relations instead of production. They want dbt to prefer the production state even when a local dev relation exists. What flag achieves this?", "is_multi_select": false, "options": {"A": "Add `target: prod` to `profiles.yml` to force resolution against production.", "B": "`--prefer-prod` — forces all upstream resolution to production.", "C": "`--no-defer` combined with `--state` achieves the same effect.", "D": "`--favor-state` — flips defer resolution to prefer the state manifest (production) over local dev relations."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Changing `profiles.yml` target changes where the job writes, not how `--defer` resolves upstream parents."}, "B": {"label": "❌ Incorrect", "text": "`--prefer-prod` is not a valid dbt flag."}, "C": {"label": "❌ Incorrect", "text": "`--no-defer` disables deferral entirely — it would force all upstream nodes to be built rather than resolved."}, "D": {"label": "✅ Correct", "text": "By default dbt resolves `ref` against your dev target, and `--defer` only fills in unselected upstream nodes that don't exist there (using the state manifest). **`--favor-state`** flips this priority: it prefers the **state manifest** (production) for resolution even when a local dev relation exists. Use `--favor-state` when you want to test against production-state data, not your potentially-stale local dev state."}}, "key_rule": "Default `--defer` = your dev relations first, then the state manifest. `--favor-state` = flips priority to prefer state manifest (prod) over local dev relations."}, {"id": "q08_Q19", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 19, "high_yield": false, "subdomain_id": "7.19", "subdomain_topic": "Breaking contract changes", "question_text": "A platform team has a public contracted model `dim_customers` that downstream projects depend on. Which of the following changes to the contract definition are considered **breaking changes** that require creating a new model version? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Updating a column's description in the YAML", "B": "Removing an existing column from the contract definition", "C": "Changing a column's data type from `string` to `int`", "D": "Adding a new column to the contract definition", "E": "Adding a new tag to the model's config block"}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Description changes are non-breaking — they have no effect on data or schema."}, "B": {"label": "✅ Correct", "text": "**Removing an existing column** is a **breaking change** — any downstream consumer referencing that column will fail. This is exactly what contracts protect against: removing a column from a contracted public model without creating a new version is a contract violation."}, "C": {"label": "✅ Correct", "text": "**Changing a column's data type** is a **breaking change** — downstream models may fail due to type incompatibility. Both removing columns and changing types are the primary breaking change scenarios contracts enforce."}, "D": {"label": "❌ Incorrect", "text": "Adding a new column is **non-breaking** — downstream consumers that don't use the new column are unaffected."}, "E": {"label": "❌ Incorrect", "text": "Tag additions are non-breaking configuration changes — they don't affect the model's schema or data."}}, "key_rule": "Contract breaking changes = **removing columns** + **changing data types** + modifying constraints. Never modify in-place — create a new version."}, {"id": "q08_Q20", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 20, "high_yield": false, "subdomain_id": "7.20", "subdomain_topic": "Public model without contract", "question_text": "A platform team publishes a model as `access: public` without adding a contract (`enforced: false`). Three months later, they rename a column in the model SQL and the YAML. Downstream consumer projects do not immediately break. When do they break?", "is_multi_select": false, "options": {"A": "Immediately — dbt Mesh validates public model schemas in real-time via the metadata service.", "B": "Never — without a contract, downstream projects are not coupled to column definitions.", "C": "When the downstream project next **parses and runs** against the updated schema — the breaking change is undetected until runtime.", "D": "Within 24 hours — the metadata service refreshes public model schemas on a daily cycle."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The metadata service does not perform real-time schema validation. Downstream projects only encounter the change when they actually run."}, "B": {"label": "❌ Incorrect", "text": "Downstream projects are still coupled at runtime — if they reference a column by name that no longer exists, the query will fail. The contract merely moves this detection earlier (to compile time)."}, "C": {"label": "✅ Correct", "text": "Without a contract, breaking changes (like renaming a column) are **undetected until the downstream project next parses and runs** against the new schema. The downstream team gets no warning — their pipeline silently succeeds on old data until the next run hits the missing column and fails. This is the core reason contracts on public models are critical: they surface breaking changes at compile time, not at runtime."}, "D": {"label": "❌ Incorrect", "text": "Not documented."}}, "key_rule": "No contract on public model = breaking changes detected only at downstream **runtime**. Contracts surface them at compile time. Always add contracts to public models."}, {"id": "q08_Q21", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 21, "high_yield": true, "subdomain_id": "7.21", "subdomain_topic": "Per-project access scoping", "question_text": "A platform team owns the `core` project, which contains a sensitive model `customer_pii` they want to expose to **only** the `compliance` consumer project — no other downstream project should be able to reference it. They set `access: public` on the model and add `compliance` to its `dependencies.yml`. A few weeks later, the `marketing` project also adds `core` as a dependency and successfully references `customer_pii`. The platform team is surprised. What is the correct understanding?", "is_multi_select": false, "options": {"A": "The `marketing` project bypassed dbt's access controls — this is a known bug that requires escalating to dbt Labs Support.", "B": "`access: public` exposes a model to **any** downstream project that adds the producer as a dependency. dbt Mesh has **no per-project allowlist** for public models. To restrict the model, keep it `private` to a governance group and consume it via a shared package or foundational-project pattern.", "C": "The platform team made a configuration mistake — `access: public` accepts an `allowed_projects:` list that they forgot to populate.", "D": "Adding `restrict-access: True` to the `core` project's `dbt_project.yml` would have limited the public model to the first project listed in `dependencies.yml`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is the **documented behavior**, not a bug. `public` means public."}, "B": {"label": "✅ Correct", "text": "`access: public` is **all-or-nothing** — once a model is public, *any* downstream project that adds the producer as a dependency can `ref()` it. dbt Mesh has no per-project allowlist mechanism. The closest workarounds: (1) keep the model `private` to a governance group and have only the intended consumer use it via a shared package, or (2) use a foundational-project pattern that exposes only what's intended for broad consumption. Sensitive models should generally not be `public` at all."}, "C": {"label": "❌ Incorrect", "text": "There is **no `allowed_projects:` field** on `access: public`. The access modifier is a three-level scope (`private`/`protected`/`public`), not a recipient list."}, "D": {"label": "❌ Incorrect", "text": "`restrict-access: True` is a **package-level** flag that blocks consumers from referencing `protected` models in an installed package. It is still binary (block all consumers vs. allow all) — not a per-project allowlist, and it does not affect `public` models at all."}}, "key_rule": "`access: public` = any downstream project can ref it. **No per-project allowlist exists.** Use `private` + shared package, or a foundational-project pattern, for selective exposure."}, {"id": "q08_Q22", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 22, "high_yield": true, "subdomain_id": "7.22", "subdomain_topic": "Building upstream models from a downstream job", "question_text": "A downstream project lists an upstream project in `dependencies.yml`. A job in the downstream project selects one of the upstream's public models. What happens?", "is_multi_select": false, "options": {"A": "dbt builds the upstream model in the downstream environment.", "B": "The downstream job can select it but can't build it. Upstream models are built by the upstream project's own jobs.", "C": "It builds only with `--full-refresh`.", "D": "It builds only with `--defer`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say that with project dependencies you can select upstream models but can't actually build them."}, "B": {"label": "✅ Correct", "text": "Upstream models aren't parsed or run in the downstream project. The metadata service resolves the ref."}, "C": {"label": "❌ Incorrect", "text": "A flag doesn't change this."}, "D": {"label": "❌ Incorrect", "text": "`--defer` doesn't change this either."}}, "key_rule": "With project dependencies you can select upstream models but can't build them. Build them with the upstream project's own jobs."}, {"id": "q08_Q23", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 23, "high_yield": true, "subdomain_id": "7.23", "subdomain_topic": "Orchestrating across projects", "question_text": "A platform team wants the `analytics` project's job to run automatically after the `core` project's deployment job finishes. What do they configure?", "is_multi_select": false, "options": {"A": "`dbt build --select package:core+` in the analytics job.", "B": "A `source_status:fresher+` selector in the analytics job.", "C": "\"Run when another job finishes\" on the analytics job, selecting the `core` project and its job.", "D": "A copy of the core job inside the analytics project."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A selector can select upstream models in the downstream project but can't build them."}, "B": {"label": "❌ Incorrect", "text": "A selector doesn't trigger another project's job."}, "C": {"label": "✅ Correct", "text": "In the job's Triggers, enable Run when another job finishes, pick the project, the upstream job, and the **Completes on** status. It needs a Starter or Enterprise-tier plan, and two projects means an Enterprise-tier plan."}, "D": {"label": "❌ Incorrect", "text": "Not needed."}}, "key_rule": "Cross-project orchestration = \"Run when another job finishes\" (project + job + Completes on). Selectors don't build or trigger upstream projects."}, {"id": "q09_Q1", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 1, "high_yield": true, "subdomain_id": "8.1", "subdomain_topic": "CI jobs do not update Catalog", "question_text": "A team runs CI jobs on every pull request and a scheduled deployment job every 24 hours. They notice that the dbt Catalog is not reflecting model changes that landed in CI runs during the day — only overnight changes appear. What is the cause?", "is_multi_select": false, "options": {"A": "The Catalog only updates when `dbt docs generate` is run as a standalone command, not as a checkbox.", "B": "CI jobs have a 12-hour delay before Catalog updates reflect their changes.", "C": "CI jobs **do not update Catalog metadata** — only deployment jobs (scheduled or manual) in production or staging environments do.", "D": "CI jobs update Catalog but only for models that passed all tests."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The job type matters, not the `dbt docs generate` step. dbt v2 jobs refresh Catalog automatically, and CI jobs never update it."}, "B": {"label": "❌ Incorrect", "text": "There is no delayed Catalog update for CI jobs — they are explicitly excluded from Catalog updates."}, "C": {"label": "✅ Correct", "text": "CI jobs are explicitly excluded from updating dbt Catalog metadata. Only **deployment jobs** (scheduled or manually triggered) running in production or staging environments update the Catalog. This is by design — CI builds temp schemas that don't represent production state. The team's overnight deployment job is the correct Catalog updater."}, "D": {"label": "❌ Incorrect", "text": "CI test pass/fail status has no bearing on whether CI jobs update Catalog — they simply don't update it at all."}}, "key_rule": "CI jobs = **never update Catalog**. Only job runs in a production or staging environment update it."}, {"id": "q09_Q2", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 2, "high_yield": true, "subdomain_id": "8.2", "subdomain_topic": "Catalog inactivity purge", "question_text": "A team has a `sandbox` environment in dbt Cloud that runs experimental jobs. The environment hasn't had a successful job run in 4 months. What happens to this environment in dbt Catalog?", "is_multi_select": false, "options": {"A": "The environment is purged after 6 months of inactivity.", "B": "The environment is automatically purged from Catalog after 3 months with no job runs.", "C": "The environment remains in Catalog indefinitely — only manual deletion removes it.", "D": "The environment is flagged as \"Inactive\" in Catalog but remains visible."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The threshold is **3 months**, not 6 months."}, "B": {"label": "✅ Correct", "text": "The docs say an environment with **no job runs in the past 3 months** has all its metadata purged. The 4-month inactive `sandbox` environment would already be purged. To prevent it, schedule jobs to run at least once every 3 months."}, "C": {"label": "❌ Incorrect", "text": "Environments are not retained indefinitely — there is an auto-purge policy."}, "D": {"label": "❌ Incorrect", "text": "There is no \"Inactive\" flagging status — inactive environments are fully purged."}}, "key_rule": "No job runs in **3 months** = environment metadata purged from Catalog. Run a job at least every 3 months."}, {"id": "q09_Q3", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 3, "high_yield": false, "subdomain_id": "8.3", "subdomain_topic": "Column-level lineage limitations", "question_text": "An Enterprise team is excited about column-level lineage in dbt Catalog. They have a mix of SQL and Python models in their project. For which models will column-level lineage be available?", "is_multi_select": false, "options": {"A": "SQL models only — Python models can't be parsed.", "B": "Only models with `contract: enforced: true` — contracts are required for column-level lineage.", "C": "All models — column-level lineage works for both SQL and Python models.", "D": "Only models using the `table` or `incremental` materialization — views are excluded."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Column-level lineage (Enterprise and Enterprise+) is built from the SQL `select` statements in a model. The docs say it's not possible to parse a Python model, so Catalog shows a Python error for it."}, "B": {"label": "❌ Incorrect", "text": "Contracts are not a prerequisite for column-level lineage — they are separate concepts."}, "C": {"label": "❌ Incorrect", "text": "Column-level lineage explicitly does NOT work for Python models regardless of plan."}, "D": {"label": "❌ Incorrect", "text": "The docs don't limit column-level lineage by materialization."}}, "key_rule": "Column-level lineage = Enterprise / Enterprise+ AND **SQL models only**. Python models can't be parsed."}, {"id": "q09_Q4", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 4, "high_yield": false, "subdomain_id": "8.4", "subdomain_topic": "What catalog.json contains vs manifest.json", "question_text": "A data engineer is debugging why the dbt Catalog shows incorrect column types for a model. They need to understand which artifact file to inspect. What does `catalog.json` contain that `manifest.json` does not?", "is_multi_select": false, "options": {"A": "`catalog.json` contains run results and test outcomes; `manifest.json` contains model definitions.", "B": "`catalog.json` contains environment variable values; `manifest.json` contains connection details.", "C": "`catalog.json` contains the compiled SQL for each model; `manifest.json` contains the raw Jinja.", "D": "`catalog.json` contains warehouse metadata about the tables and views your project builds (column names, types, stats); `manifest.json` contains model metadata and lineage from the dbt project."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Run results and test outcomes are in `run_results.json` — not `catalog.json`."}, "B": {"label": "❌ Incorrect", "text": "Environment variables and connection details are not stored in either `catalog.json` or `manifest.json`."}, "C": {"label": "❌ Incorrect", "text": "Compiled SQL is in the `target/` directory as individual `.sql` files, or in `manifest.json`'s compiled SQL field — not `catalog.json`."}, "D": {"label": "✅ Correct", "text": "`catalog.json` contains **warehouse metadata** about the tables and views your project builds: column names, types and stats, as they exist in the warehouse. `manifest.json` contains dbt project metadata: model definitions, lineage graph, configs, node relationships."}}, "key_rule": "`catalog.json` = **warehouse metadata** (column names, types, stats). `manifest.json` = project metadata and lineage."}, {"id": "q09_Q5", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 5, "high_yield": false, "subdomain_id": "8.5", "subdomain_topic": "Docs step for dbt v2 jobs", "question_text": "A team runs dbt v2 deployment jobs in their Production environment. Do they need a `dbt docs generate` step for Catalog to refresh?", "is_multi_select": false, "options": {"A": "Yes, every job needs a `dbt docs generate` step.", "B": "No. dbt v2 jobs refresh Catalog metadata automatically on every run.", "C": "Yes, but only the first job in each project.", "D": "No, but only if the job runs on a schedule."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say you don't need a `dbt docs generate` step with dbt v2."}, "B": {"label": "✅ Correct", "text": "Jobs on dbt v2 refresh Catalog metadata on every run. Some metadata still needs specific commands: test results need `dbt test` or `dbt build`, and source freshness needs `dbt source freshness`."}, "C": {"label": "❌ Incorrect", "text": "There's no first-job rule."}, "D": {"label": "❌ Incorrect", "text": "Scheduled or manual doesn't matter. What matters is a production or staging deployment run."}}, "key_rule": "dbt v2 jobs update Catalog automatically. Test results need `dbt test`/`build`. Freshness needs `dbt source freshness`."}, {"id": "q09_Q6", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 6, "high_yield": true, "subdomain_id": "8.6", "subdomain_topic": "Model Query History", "question_text": "A team wants to use dbt Catalog's Model Query History feature to identify which models are most frequently queried by downstream users, in order to prioritize optimization work. What is required to enable this feature?", "is_multi_select": false, "options": {"A": "Enterprise or Enterprise+ plan, and it must be enabled in the Production environment settings by testing and enabling query history permissions.", "B": "Starter plan with the Advanced CI feature enabled.", "C": "The feature is available on all dbt Cloud plans — no specific plan required.", "D": "Enterprise+ plan only, and it requires the Fusion engine to be enabled."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Model Query History requires **Enterprise or Enterprise+** plan. New PROD environments have it on automatically. For an existing one: Orchestration → Environments → select the Production environment → Settings → scroll to Query History → click **\"Test Permissions\"** → check **\"Enable query history\"** → Save. It tracks SELECT queries by downstream users/tools (excludes dbt builds and test runs)."}, "B": {"label": "❌ Incorrect", "text": "Advanced CI and Model Query History are unrelated features."}, "C": {"label": "❌ Incorrect", "text": "Model Query History is not available on Starter or Developer plans."}, "D": {"label": "❌ Incorrect", "text": "Query history is available on Enterprise and Enterprise+, and the docs don't require Fusion."}}, "key_rule": "Model Query History = **Enterprise or Enterprise+**. On by default for new PROD environments. Tracks consumption SELECT queries only (not dbt builds)."}, {"id": "q09_Q7", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 7, "high_yield": false, "subdomain_id": "8.7", "subdomain_topic": "dbt Docs vs dbt Catalog", "question_text": "A new team member asks about the difference between `dbt docs generate` (dbt Docs) and dbt Catalog. Which statement is correct?", "is_multi_select": false, "options": {"A": "dbt Docs is available on Enterprise+; dbt Catalog is available on all plans.", "B": "dbt Catalog is built on top of `dbt docs generate` artifacts and requires them to be generated daily.", "C": "dbt Docs generates a static HTML site from project metadata (available on all plans). dbt Catalog is a dynamic real-time metadata platform (available on Starter+ only) with features like lineage, data health, and query history.", "D": "They are the same product — dbt Catalog is just the new branding for dbt Docs."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Docs is available on all plans; dbt Catalog requires Starter+. This is the reverse of the stated answer."}, "B": {"label": "❌ Incorrect", "text": "Catalog gets its metadata from job runs through the Discovery API. dbt v2 jobs need no `dbt docs generate` step."}, "C": {"label": "✅ Correct", "text": "**dbt Docs** (`dbt docs generate`) creates a **static site** from project artifacts that you host yourself. dbt Docs v2 isn't available in the dbt platform. It reflects the state at the time of generation. **dbt Catalog** is a **dynamic, real-time metadata platform** in dbt Cloud that provides lineage, data health signals, and exploration tools on **Starter and above** (query history and column-level lineage need Enterprise tiers). Catalog updates after production and staging job runs; dbt Docs is a point-in-time snapshot."}, "D": {"label": "❌ Incorrect", "text": "They are distinct products with different capabilities, plans, and use cases."}}, "key_rule": "dbt Docs = static HTML, all plans. dbt Catalog = dynamic real-time metadata, Starter+ only."}, {"id": "q09_Q8", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 8, "high_yield": false, "subdomain_id": "8.8", "subdomain_topic": "Dev builds don't appear in Catalog", "question_text": "A developer builds and tests a model in the dbt Cloud IDE in their personal dev schema (`dbt_alice`). They expect to see it appear in dbt Catalog so they can share a lineage link with a stakeholder. The model does not appear in Catalog. Why?", "is_multi_select": false, "options": {"A": "Catalog only indexes models that have been tagged with `+catalog: true` in their config.", "B": "Catalog shows **production and staging deployment runs**. Models built only in a developer's dev schema don't appear.", "C": "The developer must manually publish the model to Catalog from the IDE using the \"Publish\" button.", "D": "The model needs to be committed to the main branch before it appears in Catalog."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `catalog: true` tag requirement. Models appear based on job runs in the production or staging environment."}, "B": {"label": "✅ Correct", "text": "Catalog updates after job runs in the **production or staging** deployment environment. A model built in a developer's personal schema (dev) doesn't appear until a production or staging deployment job builds it."}, "C": {"label": "❌ Incorrect", "text": "There is no manual \"Publish to Catalog\" button in the IDE."}, "D": {"label": "❌ Incorrect", "text": "Committing to main is not sufficient. A production or staging deployment job must run."}}, "key_rule": "Catalog = production and staging deployment runs. Dev builds are invisible."}, {"id": "q09_Q9", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 9, "high_yield": false, "subdomain_id": "8.9", "subdomain_topic": "Data health signals", "question_text": "A stakeholder views a model in dbt Catalog and sees a **\"Degraded\"** health signal. What can cause it?", "is_multi_select": false, "options": {"A": "The model has no description — degraded means undocumented.", "B": "The model has not been built in more than 30 days.", "C": "The model failed to build, has failing tests, or an upstream source is stale.", "D": "The model has more than 100 downstream consumers."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A missing description gives **Caution**, not Degraded."}, "B": {"label": "❌ Incorrect", "text": "Not built in 30 days gives **Caution**, not Degraded."}, "C": {"label": "✅ Correct", "text": "Degraded for a model = failed to build, failing tests, or a stale upstream source (freshness errored or hasn't run in 30 days)."}, "D": {"label": "❌ Incorrect", "text": "Consumer count isn't a health signal."}}, "key_rule": "Statuses: Healthy / Caution / Degraded / **Unknown** (no run has processed it). **Caution** = warnings, no tests, no description, not built in 30 days. **Degraded** = failures or stale sources. Available on all plans (Preview)."}, {"id": "q09_Q10", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 10, "high_yield": false, "subdomain_id": "8.10", "subdomain_topic": "Lenses DAG overlays", "question_text": "A data platform team wants to quickly identify which models in the lineage graph have the most test failures and which are materialized as views vs tables. Which dbt Catalog feature allows this?", "is_multi_select": false, "options": {"A": "The **Lenses** feature — DAG overlays that color-code nodes by attributes like materialization type, test status, model layer, or consumption query history.", "B": "The **Filters** panel — allows filtering models by materialization type and test status.", "C": "The **Resources** tab — lists all models with sortable columns for materialization and test status.", "D": "The **Column-level lineage** view — shows test status per column in the lineage graph."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**Lenses** are visual **DAG overlays** in dbt Catalog's lineage graph. They color-code nodes based on selected attributes. Per the dbt docs, the available lenses are: **Resource type**, **Materialization type**, **Latest status**, **Model layer** (staging / intermediate / marts), **Test status**, and **Consumption query history**. This allows rapid visual identification of problem areas, materialization patterns, or hot/cold consumption directly in the graph."}, "B": {"label": "❌ Incorrect", "text": "Filters narrow which nodes are shown; they don't provide a visual DAG overlay."}, "C": {"label": "❌ Incorrect", "text": "The Resources tab is a list view — useful for sorting, but does not provide the visual DAG overlay that Lenses provide."}, "D": {"label": "❌ Incorrect", "text": "Column-level lineage shows column data flow, not test status overlays on nodes."}}, "key_rule": "Lenses = DAG overlays in dbt Catalog. Six lenses available: Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history. **Cost is NOT a lens** — Cost Insights is a separate Catalog feature."}, {"id": "q09_Q11", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 11, "high_yield": false, "subdomain_id": "8.11", "subdomain_topic": "Cross-project lineage requirements", "question_text": "A governance lead wants Catalog lineage that spans multiple dbt projects. What does the setup need?", "is_multi_select": false, "options": {"A": "Enterprise or Enterprise+, public models in the upstream project, and project dependencies in the downstream project.", "B": "Any plan, with `dbt docs generate` in each project.", "C": "Enterprise+ only.", "D": "The Starter plan with dbt Mesh configured."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Multi-project lineage is on Enterprise and Enterprise+. It shows public models, and a project appears as a dependent when it lists the upstream in `dependencies.yml`."}, "B": {"label": "❌ Incorrect", "text": "A docs step doesn't create cross-project lineage."}, "C": {"label": "❌ Incorrect", "text": "Enterprise has it too."}, "D": {"label": "❌ Incorrect", "text": "Project dependencies and multi-project lineage aren't on Starter."}}, "key_rule": "Multi-project lineage = **Enterprise / Enterprise+**, public models + project dependencies. Direct references only."}, {"id": "q09_Q12", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 12, "high_yield": false, "subdomain_id": "8.12", "subdomain_topic": "Artifacts setting", "question_text": "A team has four deployment jobs. An admin opens Account settings → project → Edit → **Artifacts**. What does this setting do?", "is_multi_select": false, "options": {"A": "It decides which job Catalog reads. Designate all four.", "B": "It picks the job whose artifacts feed legacy dbt Docs and source freshness links. Catalog reads metadata from the Discovery API after each production or staging run. Associate only one production job.", "C": "It's a per-job \"Publish to Catalog\" toggle.", "D": "It's a \"Catalog source job\" dropdown in the Production environment settings."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Catalog doesn't use this setting. The docs say to associate only one production job with a project."}, "B": {"label": "✅ Correct", "text": "The Artifacts setting is labeled legacy dbt Docs. Catalog refreshes after each production or staging run."}, "C": {"label": "❌ Incorrect", "text": "There's no such toggle."}, "D": {"label": "❌ Incorrect", "text": "There's no such dropdown."}}, "key_rule": "Account settings → project → Edit → Artifacts = legacy dbt Docs / freshness. One production job per project. Catalog doesn't depend on it."}, {"id": "q09_Q13", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 13, "high_yield": false, "subdomain_id": "8.13", "subdomain_topic": "sources.json contents", "question_text": "An architect is auditing what each dbt artifact file contains. What information is stored in `sources.json` that is NOT in `manifest.json`?", "is_multi_select": false, "options": {"A": "Source table names and their warehouse locations", "B": "Source-to-model lineage edges", "C": "Source schema definitions and column names", "D": "**Source freshness check results** — the actual freshness measurements and pass/fail status from the last `dbt source freshness` run"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Source table names and locations are defined in the project YAML and appear in `manifest.json` as source node metadata."}, "B": {"label": "❌ Incorrect", "text": "Source-to-model lineage is captured in `manifest.json` as part of the project DAG."}, "C": {"label": "❌ Incorrect", "text": "Source schema definitions (column names, descriptions) are in `manifest.json`."}, "D": {"label": "✅ Correct", "text": "`sources.json` contains **source definitions AND freshness check results** — specifically the actual freshness measurements (e.g., time since last update) and the pass/warn/error status from `dbt source freshness` runs. `manifest.json` contains the source definitions but not the runtime freshness results. This is why `sources.json` must be refreshed regularly to reflect current data freshness state in Catalog."}}, "key_rule": "`sources.json` = source definitions + **freshness check results** (actual measured freshness + pass/warn/error status). `manifest.json` = project structure, lineage, metadata."}, {"id": "q09_Q14", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 14, "high_yield": false, "subdomain_id": "8.14", "subdomain_topic": "Cost Insights requirements", "question_text": "A team on Enterprise wants Cost Insights for Snowflake spend per model. What does it need?", "is_multi_select": false, "options": {"A": "The Fusion engine and state-aware orchestration, both required.", "B": "A supported warehouse, platform metadata credentials with a passing test, and at least one production job. State-aware orchestration or dbt State is only needed for cost-reduction data.", "C": "A separate Snowflake integration set up by dbt support.", "D": "BigQuery only. Snowflake isn't supported."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs don't list Fusion as a requirement. State-aware orchestration is only for reduction data."}, "B": {"label": "✅ Correct", "text": "Cost Insights is on Enterprise and Enterprise+. Cost data appears after production jobs run."}, "C": {"label": "❌ Incorrect", "text": "Not required."}, "D": {"label": "❌ Incorrect", "text": "Supported: Snowflake, BigQuery, Databricks, Redshift (Preview)."}}, "key_rule": "Cost Insights = Enterprise / Enterprise+, metadata credentials, production job. Refreshes once daily. Estimates, not billing reconciliation."}, {"id": "q09_Q15", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 15, "high_yield": false, "subdomain_id": "8.15", "subdomain_topic": "Cost formulas by platform", "question_text": "An architect is setting up Cost Insights for a multi-cloud team using Snowflake and BigQuery. Which cost calculation formulas are correct for each platform?", "is_multi_select": false, "options": {"A": "Snowflake: TiB processed × price per TiB. BigQuery: credits × price per credit.", "B": "Both platforms use credits × price per credit — Cost Insights normalizes across platforms.", "C": "Snowflake: credits × price per credit. BigQuery: TiB of data processed × price per TiB (cached queries = $0).", "D": "Snowflake: warehouse-hours × rate. BigQuery: slot usage × rate."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This reverses the formulas for each platform."}, "B": {"label": "❌ Incorrect", "text": "Cost Insights uses each platform's native billing model — it does not normalize to a single unit."}, "C": {"label": "✅ Correct", "text": "**Snowflake**: cost = **credits × price per credit** (Snowflake charges in virtual warehouse credits). **BigQuery** (on-demand): cost = **TiB processed × price per TiB**. Capacity pricing uses slot-hours instead. Cached queries are $0. **Databricks**: cost is proportional DBU allocation based on query runtime. Each platform has a fundamentally different billing model, and Cost Insights translates these into comparable cost estimates per model run."}, "D": {"label": "❌ Incorrect", "text": "Snowflake isn't costed by warehouse-hours. Slot-hours is BigQuery capacity pricing only."}}, "key_rule": "Snowflake = credits × price. BigQuery on-demand = TiB processed × price per TiB (capacity = slot hours; cached = $0). Databricks = proportional DBU allocation."}, {"id": "q09_Q16", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 16, "high_yield": false, "subdomain_id": "8.16", "subdomain_topic": "Query History: what it tracks", "question_text": "A data engineer enables Model Query History in dbt Catalog to understand how often their models are queried. They notice that dbt's own model build runs (when dbt materializes tables) are NOT counted in the query history. Is this expected, and why?", "is_multi_select": false, "options": {"A": "Expected — Model Query History tracks **consumption queries** (SELECT queries by downstream users and tools) only. dbt model builds and test executions are explicitly excluded.", "B": "Unexpected — dbt builds appear in the 24-hour delayed refresh, not the real-time view.", "C": "Unexpected — all SELECT queries against a model, including dbt builds, should be counted.", "D": "Expected — Query History only counts queries executed from the dbt Cloud IDE, not from automated jobs."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Model Query History is specifically designed to track **consumption** — SELECT queries by **downstream users and BI tools** against production models. It explicitly **excludes dbt model builds and dbt test executions**. This is intentional: the goal is to understand how often business users and tools are consuming the data, not how often dbt is rebuilding it. Including build runs would inflate counts and obscure actual consumption patterns."}, "B": {"label": "❌ Incorrect", "text": "The exclusion of dbt builds is by design, not a timing issue."}, "C": {"label": "❌ Incorrect", "text": "dbt build runs are explicitly excluded from Query History counts."}, "D": {"label": "❌ Incorrect", "text": "Query History counts external consumption queries (BI tools, direct SQL), not just IDE queries."}}, "key_rule": "Query History = **consumption queries only** (downstream users/tools). Excludes dbt builds and test executions."}, {"id": "q09_Q17", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 17, "high_yield": false, "subdomain_id": "8.17", "subdomain_topic": "Query History: 4 places to view", "question_text": "A data platform lead wants to identify the top 10 most-consumed models across their entire project to prioritize optimization work. Where in dbt Catalog can they find this information? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Environment settings → consumption metrics", "B": "Account Settings → Usage dashboard", "C": "Lineage graph → apply the **Lenses** overlay for query volume", "D": "Project details → \"Most consumed models\" performance chart", "E": "Job run history → sort by execution count"}, "correct_answers": ["C", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Environment settings do not show consumption metrics."}, "B": {"label": "❌ Incorrect", "text": "Account Settings does not contain a model consumption dashboard."}, "C": {"label": "✅ Correct", "text": "The **Lineage graph with the Lenses overlay set to query volume** color-codes nodes by consumption frequency — immediately showing which models in the DAG are most queried. This is particularly useful for understanding consumption patterns in context of the data pipeline."}, "D": {"label": "✅ Correct", "text": "**Project details → \"Most consumed models\"** is one of the four places to view Query History. This performance chart shows the highest-traffic models across the project."}, "E": {"label": "❌ Incorrect", "text": "Job run history shows dbt job execution, not downstream user consumption of model data."}}, "key_rule": "Query History in 4 places: (1) Project details performance chart, (2) Lineage graph Lenses, (3) Resources list sorted by consumption, (4) Individual model page."}, {"id": "q09_Q18", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 18, "high_yield": false, "subdomain_id": "8.18", "subdomain_topic": "External metadata ingestion", "question_text": "A team wants Catalog to show Snowflake tables and views that aren't defined in dbt. What is available?", "is_multi_select": false, "options": {"A": "External metadata ingestion (Preview) on Enterprise and Enterprise+. Snowflake only for now.", "B": "It's available on all plans and all warehouses.", "C": "Catalog only ever shows dbt resources.", "D": "Only Fivetran connectors are supported."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "It connects to the warehouse so Catalog can show resources not defined in dbt. It runs daily at 5 PM UTC and when you save credentials."}, "B": {"label": "❌ Incorrect", "text": "Enterprise tiers only, and Snowflake only for now."}, "C": {"label": "❌ Incorrect", "text": "Ingestion exists for non-dbt warehouse resources."}, "D": {"label": "❌ Incorrect", "text": "It reads the warehouse, not specific tools."}}, "key_rule": "External metadata ingestion = Enterprise / Enterprise+, Preview, Snowflake only."}, {"id": "q09_Q19", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 19, "high_yield": false, "subdomain_id": "8.19", "subdomain_topic": "Staging environment Catalog updates", "question_text": "A team assumes that only their Production environment deployment job updates dbt Catalog. They set up a Staging environment with its own deployment job for pre-production validation. Will the Staging environment's models appear in Catalog?", "is_multi_select": false, "options": {"A": "No — Staging environments are for validation only and are never reflected in Catalog.", "B": "Yes — deployment jobs in **both Production and Staging** environments update Catalog metadata.", "C": "Yes — but only if the Staging environment is explicitly linked to Catalog in Account Settings.", "D": "No — only the Production environment updates Catalog by definition."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Staging environments are reflected in Catalog. The exclusion applies to CI jobs and dev schemas, not Staging environments."}, "B": {"label": "✅ Correct", "text": "dbt Catalog is updated by **deployment jobs in both Production and Staging environments** — not just Production. Set a single environment per project as production or staging. CI jobs remain excluded."}, "C": {"label": "❌ Incorrect", "text": "No explicit Catalog linking is required for Staging environments — deployment jobs in Staging automatically update Catalog."}, "D": {"label": "❌ Incorrect", "text": "Staging environment deployment jobs also update Catalog. Production is the primary view, but Staging is included."}}, "key_rule": "Catalog updated by deployment jobs in **Production AND Staging** environments. CI jobs and dev schemas are excluded."}, {"id": "q09_Q20", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 20, "high_yield": false, "subdomain_id": "8.20", "subdomain_topic": "Query History use cases", "question_text": "An architect has enabled Model Query History in dbt Catalog. Which of the following are **valid use cases** for Query History data? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Identifying models to prioritize for performance optimization (high-traffic models benefit most from optimization)", "B": "Tracking which dbt developers are most active in running jobs", "C": "Comparing the compute cost of two different model materializations", "D": "Monitoring dbt job execution duration over time", "E": "Assessing the downstream impact before deprecating a model (understanding how many consumers would be affected)"}, "correct_answers": ["A", "E"], "explanations": {"A": {"label": "✅ Correct", "text": "**Optimization prioritization** is a primary use case. High-traffic models (queried frequently by downstream users) deliver the most value when optimized — Query History reveals which models to tackle first for maximum impact."}, "B": {"label": "❌ Incorrect", "text": "Query History tracks external user/tool consumption of models, not dbt developer activity within dbt Cloud jobs. Developer activity is tracked in dbt Cloud audit logs."}, "C": {"label": "❌ Incorrect", "text": "Compute cost comparison uses Cost Insights, not Query History. These are separate features."}, "D": {"label": "❌ Incorrect", "text": "Job execution duration is tracked in the dbt Cloud job run history, not Query History."}, "E": {"label": "✅ Correct", "text": "**Deprecation impact assessment** is a primary use case. Before deprecating a model, teams use Query History to understand how many downstream users and tools actively query it, quantifying the migration effort and stakeholder communication needed."}}, "key_rule": "Query History use cases: (1) **optimization prioritization** (which models to improve), (2) **deprecation impact assessment** (who consumes this model)."}, {"id": "q09_Q21", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 21, "high_yield": true, "subdomain_id": "8.21", "subdomain_topic": "Picking the right Lens for a diagnostic workflow", "question_text": "A platform architect gets a complaint that the warehouse bill spiked last month. They open dbt Catalog and want to narrow in on models that are both (a) frequently queried by downstream consumers and (b) materialized as full-refresh tables rather than incremental. What is the most efficient workflow using Lenses, and what is a common misconception about what Lenses can answer directly?", "is_multi_select": false, "options": {"A": "Apply the **Cost lens** — it directly reports per-model warehouse spend, which already accounts for query volume and materialization strategy. No other lens is needed.", "B": "Lenses cannot answer this. You must export the manifest and run_results to an external BI tool because Catalog does not expose query volume or materialization at the node level.", "C": "Apply the **Consumption query history lens** first to surface hot nodes, then toggle to the **Materialization type lens** on the same DAG view to spot which hot nodes are `table` vs `incremental`. Lenses do not *combine* overlays simultaneously — you switch between them on the same graph.", "D": "Apply the **Test status lens** — degraded tests correlate with expensive rebuilds, so this is the standard cost-triage entry point."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "**There is no \"Cost lens\"** in dbt Catalog. The available lenses are Resource type, Materialization type, Latest status, Model layer, Test status, and Consumption query history. Cost data lives in **Cost Insights**, a separate feature (Enterprise / Enterprise+). It isn't a lens. This is a common trap distractor."}, "B": {"label": "❌ Incorrect", "text": "Both **Consumption query history** and **Materialization type** are first-class lenses in dbt Catalog — no external export required."}, "C": {"label": "✅ Correct", "text": "Lenses are **single-attribute overlays** applied one at a time to the same lineage graph. The documented workflow is to switch lenses on the same DAG: **Consumption query history** highlights hot nodes visually, then flipping to **Materialization type** re-colors those same nodes by table/view/incremental/ephemeral. The architect reads the intersection visually. There is no \"combined lens\" view — that's the common misconception."}, "D": {"label": "❌ Incorrect", "text": "Test status reflects data quality (worst-case test result per node), not cost or consumption. There's no documented correlation between failing tests and cost spikes."}}, "key_rule": "Lenses = **one attribute at a time** overlayed on the lineage graph. For multi-attribute diagnostics, switch lenses on the same view and read the intersection visually. The six available lenses: **Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history**. Cost is *not* a lens — Cost Insights is a separate feature."}, {"id": "q09_Q22", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 22, "high_yield": true, "subdomain_id": "8.22", "subdomain_topic": "Lens names and definitions", "question_text": "A new architect on the team is learning the dbt Catalog Lenses system. They want to confirm which Lens corresponds to which behavior. Match the Lens to its definition. **Select TWO correct statements.**", "is_multi_select": true, "options": {"A": "The **Test status** lens shows the status from the latest test execution against a resource. When a model has multiple tests with different results, the lens reflects the **worst-case** status.", "B": "The **Latest status** lens shows the result of the model's most recent **test execution** in the current environment.", "C": "The **Model layer** lens classifies models as `public`, `protected`, or `private` based on their cross-project access modifier.", "D": "The **Cost** lens displays warehouse spend per model, color-coded by cost tier. It is one of the six standard lenses in dbt Catalog.", "E": "The **Resource type** lens organizes resources by type (models, tests, seeds, saved query, etc.) and uses the `resource_type` selector."}, "correct_answers": ["A", "E"], "explanations": {"A": {"label": "✅ Correct", "text": "The **Test status** lens reflects the latest test execution against the resource. The documented behavior for models with multiple tests of differing results is that the lens shows the **worst-case** status — a single failing test will color the node `degraded` even if other tests on the same model passed. This protects against false-positive \"healthy\" coloring."}, "B": {"label": "❌ Incorrect", "text": "This describes Test status, not Latest status. The **Latest status** lens shows the status from the resource's **latest execution** (the model's own run/build status — success, fail, error, etc.) in the current environment, not its test results. The two lenses are independent."}, "C": {"label": "❌ Incorrect", "text": "The **Model layer** lens classifies models by **modeling-best-practices layer** (staging / intermediate / marts), based on file prefix or directory — not by cross-project `access` modifier. Access levels (private/protected/public) are not exposed as a lens."}, "D": {"label": "❌ Incorrect", "text": "**There is no Cost lens.** Cost data lives in **Cost Insights**, a separate feature (Enterprise / Enterprise+). The six available lenses are: Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history."}, "E": {"label": "✅ Correct", "text": "The **Resource type** lens organizes resources by type — models, tests, seeds, saved queries, sources, exposures, etc. It is backed by the same `resource_type` selector used at the CLI (`--select resource_type:test`)."}}, "key_rule": "Six lenses — **Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history**. Test status uses **worst-case** when multiple tests disagree. Latest status ≠ Test status. There is no Cost lens."}, {"id": "q09_Q23", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 23, "high_yield": true, "subdomain_id": "8.23", "subdomain_topic": "Model layer lens detection rules", "question_text": "A team's repository has the following models. Using the **Model layer** Lens in dbt Catalog, which layer would each be classified as?\n\n- `models/marts/finance/fct_orders.sql`\n- `models/intermediate/int_order_payments_joined.sql`\n- `models/staging/stripe/stg_stripe__charges.sql`\n- `models/utils/dim_calendar.sql` (note: not in a `marts/` subdirectory; uses `dim_` prefix)\n- `models/cleanup/orders_cleaned.sql` (no recognized prefix, no recognized directory)\n\nWhich of the following correctly describes the Model layer Lens classification rules and how each file would be classified? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The Model layer Lens classifies models using **two signals**: file prefix (`stg_`, `int_`, `fct_`/`dim_`) and directory location (`/staging/`, `/intermediate/` or `/int/`, `/marts/`). Either signal alone is sufficient for a layer match.", "B": "`fct_orders.sql` → Marts; `int_order_payments_joined.sql` → Intermediate; `stg_stripe__charges.sql` → Staging; `dim_calendar.sql` → **Marts** (the `dim_` prefix matches the Marts rule even though it's not in a `marts/` directory).", "C": "`dim_calendar.sql` is classified as **Intermediate** because it's not in a `marts/` directory — directory location takes precedence over prefix.", "D": "The Model layer Lens uses model **materialization type** (table vs view) to determine the layer, not naming conventions.", "E": "`orders_cleaned.sql` (no recognized prefix or directory) is automatically classified as **Marts** — Marts is the default fallback layer."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "Per the dbt docs, the Model layer Lens uses **two equivalent signals** — file **prefix** (`stg_` / `int_` / `fct_` or `dim_`) **OR** directory location (`/staging/` / `/intermediate/` or `/int/` / `/marts/`). Either signal alone is enough to classify the model. This means a `dim_calendar.sql` outside a `/marts/` directory is still classified as Marts via its prefix."}, "B": {"label": "✅ Correct", "text": "All five mappings here are right: `fct_orders.sql` → Marts (both signals match), `int_order_payments_joined.sql` → Intermediate (both match), `stg_stripe__charges.sql` → Staging (both match), and `dim_calendar.sql` → **Marts** via `dim_` prefix despite not being in `/marts/`. The first three reinforce the dual-signal nature; the fourth is the discriminator."}, "C": {"label": "❌ Incorrect", "text": "There is no precedence rule favoring directory over prefix — either signal classifies the model. `dim_calendar.sql` matches the Marts rule via its prefix."}, "D": {"label": "❌ Incorrect", "text": "The Model layer lens is based on **best-practices naming/directory conventions**, not materialization type. Materialization is a separate lens (Materialization type)."}, "E": {"label": "❌ Incorrect", "text": "There is **no default fallback layer**. A model with no recognized prefix and no recognized directory is **unclassified** by the Model layer lens — it does not get a default classification. `orders_cleaned.sql` would simply not be tagged with a layer."}}, "key_rule": "Model layer = prefix **OR** directory match. **Marts** = `fct_`/`dim_` prefix or `/marts/` dir. **Intermediate** = `int_` prefix or `/int/`/`/intermediate/` dir. **Staging** = `stg_` prefix or `/staging/` dir. No default fallback — unrecognized models are unclassified."}, {"id": "q10_Q1", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 1, "high_yield": true, "subdomain_id": "9.1", "subdomain_topic": "Post-hook transaction behavior on model failure", "question_text": "On Postgres, a post-hook is configured to insert a row into an audit table every time a model completes. The model fails mid-execution due to a bad SQL statement. Does the audit row get inserted?", "is_multi_select": false, "options": {"A": "Yes — but the audit row is marked with a \"failed\" status code automatically.", "B": "Yes — post-hooks run regardless of model success or failure to ensure audit completeness.", "C": "No — post-hooks are skipped when a model fails, but dbt logs the skipped hook in the run results.", "D": "No — by default, post-hooks run inside the model's transaction. When the model fails, the transaction rolls back before the post-hook executes."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt has no mechanism to automatically mark audit rows with failure status from within the transaction — and the hook doesn't run at all on failure anyway."}, "B": {"label": "❌ Incorrect", "text": "Post-hooks do not automatically run on failure — they are part of the same transaction that rolls back."}, "C": {"label": "❌ Incorrect", "text": "While dbt does track skipped hooks, the core issue is that the hook doesn't run — the log detail is secondary."}, "D": {"label": "✅ Correct", "text": "On transactional adapters (the docs name Postgres and Redshift), `pre-hook` and `post-hook` run **inside the model's transaction** by default. When the model fails, the transaction rolls back — and since the post-hook is part of that transaction, it **never executes**. Fix: add `transaction: false` to the hook definition so it runs outside the transaction and persists even when the model fails: `post_hook: {sql: \"INSERT INTO audit...\", transaction: false}`."}}, "key_rule": "Post-hook default = **inside transaction**. Model failure = transaction rollback = hook skipped. Use `transaction: false` for audit logging."}, {"id": "q10_Q2", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 2, "high_yield": true, "subdomain_id": "9.2", "subdomain_topic": "Post-hook failure rolls back model", "question_text": "On Postgres, a post-hook runs a `GRANT SELECT` statement after a model builds. The role name in the grant is misspelled, causing the grant to fail. What happens to the model that was just built?", "is_multi_select": false, "options": {"A": "The model's creation is rolled back — since the post-hook runs inside the transaction, its failure rolls back the entire transaction including the model.", "B": "The model remains built but is flagged as \"degraded\" in the dbt Catalog health signals.", "C": "Only the post-hook is retried — the model itself is not affected.", "D": "The model remains built — post-hook failures are isolated and don't affect model creation."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "On Postgres and Redshift, hooks run inside the same transaction as the model build, so a failing hook fails the transaction and the model build is rolled back too. Use `transaction: false` if the hook must not affect the build."}, "B": {"label": "❌ Incorrect", "text": "There is no \"degraded\" status for post-hook failures in dbt Catalog."}, "C": {"label": "❌ Incorrect", "text": "dbt does not automatically retry post-hooks."}, "D": {"label": "❌ Incorrect", "text": "This is the opposite of the actual behavior — post-hook failures within a transaction are not isolated."}}, "key_rule": "Post-hook failure (inside transaction) = **model rollback too**. Use `transaction: false` for non-critical post-hooks."}, {"id": "q10_Q3", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 3, "high_yield": true, "subdomain_id": "9.3", "subdomain_topic": "{{ results }} context variable", "question_text": "A team adds a post-hook to a model that uses `{{ results }}` to log the outcome:\n\n```yaml\npost_hook: \"INSERT INTO run_log VALUES ({{ results }})\"\n```\n\nThe hook runs without errors but `results` is always `None`. Why?", "is_multi_select": false, "options": {"A": "`{{ results }}` is populated only after the first model in a run completes — a single-model run always returns `None`.", "B": "`{{ results }}` must be called as `{{ this.results }}` within a post-hook context.", "C": "`{{ results }}` is **only available in `on-run-end` hooks** — it returns `None` silently in `pre-hook` and `post-hook`.", "D": "`{{ results }}` requires the `on-run-end` hook to be configured first before it's populated in post-hooks."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The number of models in a run has no bearing on `results` availability — the issue is the hook type, not run size."}, "B": {"label": "❌ Incorrect", "text": "`{{ this.results }}` is not valid syntax — `results` is a separate top-level variable, not an attribute of `this`."}, "C": {"label": "✅ Correct", "text": "`{{ results }}` is **only available in `on-run-end` hooks** — it returns `None` in `pre-hook` and `post-hook` with no error or warning. This is a silent failure that can be hard to debug. The correct approach: use `{{ this }}` in post-hooks to reference the current model relation, and use `{{ results }}` only in `on-run-end` to access all run outcomes."}, "D": {"label": "❌ Incorrect", "text": "`on-run-end` is independent — it doesn't \"unlock\" `results` for post-hooks."}}, "key_rule": "`{{ results }}` = **`on-run-end` only**. In pre/post-hook = `None` (silent). Use `{{ this }}` in post-hooks."}, {"id": "q10_Q4", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 4, "high_yield": false, "subdomain_id": "9.4", "subdomain_topic": "Multiple hooks accumulate", "question_text": "A model has 2 post-hooks d
