un."}, "B": {"label": "❌ Incorrect", "text": "Downstream projects are still coupled at runtime — if they reference a column by name that no longer exists, the query will fail. The contract merely moves this detection earlier (to compile time)."}, "C": {"label": "✅ Correct", "text": "Without a contract, breaking changes (like renaming a column) are **undetected until the downstream project next parses and runs** against the new schema. The downstream team gets no warning — their pipeline silently succeeds on old data until the next run hits the missing column and fails. This is the core reason contracts on public models are critical: they surface breaking changes at compile time, not at runtime."}, "D": {"label": "❌ Incorrect", "text": "The 24-hour metadata refresh is for Cost Insights — it is unrelated to schema validation."}}, "key_rule": "No contract on public model = breaking changes detected only at downstream **runtime**. Contracts surface them at compile time. Always add contracts to public models."}, {"id": "q08_Q21", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 21, "high_yield": true, "subdomain_id": "7.21", "subdomain_topic": "Per-project access scoping", "question_text": "A platform team owns the `core` project, which contains a sensitive model `customer_pii` they want to expose to **only** the `compliance` consumer project — no other downstream project should be able to reference it. They set `access: public` on the model and add `compliance` to its `dependencies.yml`. A few weeks later, the `marketing` project also adds `core` as a dependency and successfully references `customer_pii`. The platform team is surprised. What is the correct understanding?", "is_multi_select": false, "options": {"A": "The platform team made a configuration mistake — `access: public` accepts an `allowed_projects:` list that they forgot to populate.", "B": "`access: public` exposes a model to **any** downstream project that adds the producer as a dependency. dbt Mesh has **no per-project allowlist** for public models. To restrict the model, keep it `private` to a governance group and consume it via a shared package or foundational-project pattern.", "C": "The `marketing` project bypassed dbt's access controls — this is a known bug that requires escalating to dbt Labs Support.", "D": "Adding `restrict-access: True` to the `core` project's `dbt_project.yml` would have limited the public model to the first project listed in `dependencies.yml`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is **no `allowed_projects:` field** on `access: public`. The access modifier is a three-level scope (`private`/`protected`/`public`), not a recipient list."}, "B": {"label": "✅ Correct", "text": "`access: public` is **all-or-nothing** — once a model is public, *any* downstream project that adds the producer as a dependency can `ref()` it. dbt Mesh has no per-project allowlist mechanism. The closest workarounds: (1) keep the model `private` to a governance group and have only the intended consumer use it via a shared package, or (2) use a foundational-project pattern that exposes only what's intended for broad consumption. Sensitive models should generally not be `public` at all."}, "C": {"label": "❌ Incorrect", "text": "This is the **documented behavior**, not a bug. `public` means public."}, "D": {"label": "❌ Incorrect", "text": "`restrict-access: True` is a **package-level** flag that blocks consumers from referencing `protected` models in an installed package. It is still binary (block all consumers vs. allow all) — not a per-project allowlist, and it does not affect `public` models at all."}}, "key_rule": "`access: public` = any downstream project can ref it. **No per-project allowlist exists.** Use `private` + shared package, or a foundational-project pattern, for selective exposure."}, {"id": "q08_Q22", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 22, "high_yield": true, "subdomain_id": "7.22", "subdomain_topic": "`package:upstream_project` selector in Mesh", "question_text": "A team has a downstream `marketing` project that lists `jaffle_finance` (an upstream Mesh project) in `dependencies.yml`. The downstream architect wants the Slim CI job in `marketing` to:\n\n1. Build only models changed in the current PR.\n2. Skip rebuilding (or unnecessarily resolving) upstream `jaffle_finance` public models, since those are already deployed in production.\n3. Treat the upstream models as immutable references during the CI run.\n\nWhich command best implements this?", "is_multi_select": false, "options": {"A": "`dbt build --select state:modified+ --defer --state ./prod-artifacts`", "B": "`dbt build --select state:modified+ --exclude package:jaffle_finance --defer --state ./prod-artifacts`", "C": "`dbt build --select package:jaffle_finance+ --defer --state ./prod-artifacts`", "D": "`dbt build --select state:modified+ --select-upstream-only --defer`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "⚠️ Partially correct, but suboptimal", "text": "This is the standard Slim CI command and it WILL work — `--defer` ensures upstream models resolve against production. However, in a Mesh, if any upstream `jaffle_finance` public model is captured by `state:modified+` (e.g., because it's been re-pulled into the manifest), it could end up in the build set unnecessarily. Excluding the upstream package explicitly is cleaner and safer."}, "B": {"label": "✅ Correct", "text": "This is the recommended Mesh-aware Slim CI pattern. `--select state:modified+` captures changed downstream nodes and their descendants. `--exclude package:jaffle_finance` ensures any upstream public models pulled into the downstream namespace are filtered out — they're treated as immutable references. `--defer --state ./prod-artifacts` resolves any unselected parents (including upstream refs) against production. The combination guarantees the CI builds **only** downstream-owned changed models."}, "C": {"label": "❌ Incorrect", "text": "`package:jaffle_finance+` selects everything downstream of upstream public models — this would force a near-full rebuild of the downstream project, the opposite of Slim CI."}, "D": {"label": "❌ Incorrect", "text": "`--select-upstream-only` is not a real dbt flag."}}, "key_rule": "Mesh-aware Slim CI = `state:modified+ --exclude package:upstream --defer --state prod/`. Upstream Mesh projects share the namespace with Hub packages — case-sensitive `package:` selector applies."}, {"id": "q08_Q23", "file_id": "q08", "topic_num": "7", "topic_name": "dbt Mesh & Cross-Project References", "question_num": 23, "high_yield": true, "subdomain_id": "7.23", "subdomain_topic": "Selectors do not trigger cross-project builds", "question_text": "A platform engineer has two dbt Cloud projects: `core` (upstream) and `analytics` (downstream, with `core` in its `dependencies.yml`). They want a single dbt Cloud job in `analytics` that:\n\n1. Rebuilds upstream `core` models when their source data changes.\n2. Then rebuilds downstream `analytics` models that depend on the rebuilt `core` models.\n\nThe engineer authors this single job step in `analytics`:\n\n```bash\ndbt build --select package:core+ source_status:fresher+ --state ./prev/\n```\n\nThe job runs but does not build any `core` models — only `analytics` models are rebuilt (against stale `core` data). Which TWO statements correctly explain this behavior?", "is_multi_select": true, "options": {"A": "`dbt build --select` invocations are **scoped to the current project's manifest**. `package:core+` only selects upstream public models that exist in the `analytics` manifest — it cannot trigger an actual build inside the `core` project's environment.", "B": "Cross-project upstream-then-downstream orchestration must be done at the **job level**, not the selector level. The standard pattern is to configure the `analytics` job's \"Run after job\" trigger to fire after `core`'s deployment job completes (Enterprise+ feature).", "C": "The `--state` flag is incompatible with `package:` selectors — removing it would let dbt cross the project boundary.", "D": "Adding `--full-refresh` would force dbt to rebuild upstream models in the upstream project's environment.", "E": "The `source_status:fresher+` selector covers upstream models automatically — the actual issue is just the missing `--full-refresh` flag."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "A `dbt build` invocation **never crosses project boundaries**. The `package:core+` selector resolves nodes from the **downstream's manifest** — these are the upstream public models that have been pulled in for ref resolution, NOT executable build targets in the upstream environment. The upstream's actual model code lives in the upstream project's repo and only its own dbt jobs can build it."}, "B": {"label": "✅ Correct", "text": "The canonical Mesh orchestration pattern: configure the **downstream job's \"Run after job\" trigger** (in dbt Cloud → Job → Triggers → Run after job, Enterprise+) to fire after the **upstream's deployment job** completes. This is a job-level concern, not a CLI selector concern. There is no single dbt CLI command that builds two projects in sequence."}, "C": {"label": "❌ Incorrect", "text": "`--state` is fully compatible with `package:` selectors. The issue is architectural, not a flag conflict."}, "D": {"label": "❌ Incorrect", "text": "`--full-refresh` controls incremental rebuild behavior within the **current** invocation — it has no relationship to project boundaries."}, "E": {"label": "❌ Incorrect", "text": "`source_status:fresher+` only operates on declared `sources:` (raw warehouse tables). Upstream Mesh public models are consumed via `ref()`, not `source()`, so they are **never** flagged by `source_status:`. To trigger downstream when upstream rebuilds, use job chaining."}}, "key_rule": "Selectors filter the current invocation's manifest. **Cross-project orchestration = \"Run after job\" chaining**, not selectors. `state:modified` is project-local; `source_status:fresher+` doesn't see upstream public models (they're refs, not sources)."}, {"id": "q09_Q1", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 1, "high_yield": true, "subdomain_id": "8.1", "subdomain_topic": "CI jobs do not update Catalog", "question_text": "A team runs CI jobs on every pull request and a scheduled deployment job every 24 hours. They notice that the dbt Catalog is not reflecting model changes that landed in CI runs during the day — only overnight changes appear. What is the cause?", "is_multi_select": false, "options": {"A": "CI jobs have a 12-hour delay before Catalog updates reflect their changes.", "B": "CI jobs **do not update Catalog metadata** — only deployment jobs (scheduled or manual) in production or staging environments do.", "C": "The Catalog only updates when `dbt docs generate` is run as a standalone command, not as a checkbox.", "D": "CI jobs update Catalog but only for models that passed all tests."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no delayed Catalog update for CI jobs — they are explicitly excluded from Catalog updates."}, "B": {"label": "✅ Correct", "text": "CI jobs are explicitly excluded from updating dbt Catalog metadata. Only **deployment jobs** (scheduled or manually triggered) running in production or staging environments update the Catalog. This is by design — CI builds temp schemas that don't represent production state. The team's overnight deployment job is the correct Catalog updater."}, "C": {"label": "❌ Incorrect", "text": "The `dbt docs generate` checkbox in a deployment job does update Catalog — the key is that it must be in a deployment job, not a CI job."}, "D": {"label": "❌ Incorrect", "text": "CI test pass/fail status has no bearing on whether CI jobs update Catalog — they simply don't update it at all."}}, "key_rule": "CI jobs = **never update Catalog**. Only production/staging deployment jobs with `dbt docs generate` update Catalog."}, {"id": "q09_Q2", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 2, "high_yield": true, "subdomain_id": "8.2", "subdomain_topic": "Catalog inactivity purge", "question_text": "A team has a `sandbox` environment in dbt Cloud that runs experimental jobs. The environment hasn't had a successful job run in 4 months. What happens to this environment in dbt Catalog?", "is_multi_select": false, "options": {"A": "The environment remains in Catalog indefinitely — only manual deletion removes it.", "B": "The environment is automatically purged from Catalog after 3 months of no successful job runs.", "C": "The environment is flagged as \"Inactive\" in Catalog but remains visible.", "D": "The environment is purged after 6 months of inactivity."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Environments are not retained indefinitely — there is an auto-purge policy."}, "B": {"label": "✅ Correct", "text": "Environments with **no successful job run in 3+ months** are automatically removed from dbt Catalog. The 4-month inactive `sandbox` environment would already be purged. To keep an environment visible in Catalog, schedule at least one lightweight job (even `dbt compile`) to run successfully at least quarterly."}, "C": {"label": "❌ Incorrect", "text": "There is no \"Inactive\" flagging status — inactive environments are fully purged."}, "D": {"label": "❌ Incorrect", "text": "The threshold is **3 months**, not 6 months."}}, "key_rule": "No successful run in **3+ months** = environment auto-purged from Catalog. Run at least quarterly to stay visible."}, {"id": "q09_Q3", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 3, "high_yield": false, "subdomain_id": "8.3", "subdomain_topic": "Column-level lineage limitations", "question_text": "An Enterprise+ team is excited about column-level lineage in dbt Catalog. They have a mix of SQL and Python models in their project. For which models will column-level lineage be available?", "is_multi_select": false, "options": {"A": "All models — column-level lineage works for both SQL and Python models on Enterprise+.", "B": "SQL models only — column-level lineage does not work for Python models (their internals are opaque to dbt's parser).", "C": "Only models using the `table` or `incremental` materialization — views are excluded.", "D": "Only models with `contract: enforced: true` — contracts are required for column-level lineage."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Column-level lineage explicitly does NOT work for Python models regardless of plan."}, "B": {"label": "✅ Correct", "text": "Column-level lineage in dbt Catalog is available for **SQL models only** (Enterprise+). Python model internals are opaque to dbt's SQL lineage parser — it cannot trace column transformations through Python code. If a team has high-value Python models, column-level lineage will not be available for those specific models."}, "C": {"label": "❌ Incorrect", "text": "Column-level lineage works for all SQL materialization types, not just table/incremental."}, "D": {"label": "❌ Incorrect", "text": "Contracts are not a prerequisite for column-level lineage — they are separate concepts."}}, "key_rule": "Column-level lineage = Enterprise+ AND **SQL models only**. Python models = opaque to parser."}, {"id": "q09_Q4", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 4, "high_yield": false, "subdomain_id": "8.4", "subdomain_topic": "What catalog.json contains vs manifest.json", "question_text": "A data engineer is debugging why the dbt Catalog shows incorrect column types for a model. They need to understand which artifact file to inspect. What does `catalog.json` contain that `manifest.json` does not?", "is_multi_select": false, "options": {"A": "`catalog.json` contains the compiled SQL for each model; `manifest.json` contains the raw Jinja.", "B": "`catalog.json` contains column-level information (names, types, row counts) introspected directly from the database; `manifest.json` contains model metadata and lineage from the dbt project.", "C": "`catalog.json` contains run results and test outcomes; `manifest.json` contains model definitions.", "D": "`catalog.json` contains environment variable values; `manifest.json` contains connection details."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Compiled SQL is in the `target/` directory as individual `.sql` files, or in `manifest.json`'s compiled SQL field — not `catalog.json`."}, "B": {"label": "✅ Correct", "text": "`catalog.json` is produced by `dbt docs generate` and contains **database-introspected column information** — actual column names, data types, and row counts as they exist in the warehouse. `manifest.json` contains dbt project metadata: model definitions, lineage graph, configs, node relationships."}, "C": {"label": "❌ Incorrect", "text": "Run results and test outcomes are in `run_results.json` — not `catalog.json`."}, "D": {"label": "❌ Incorrect", "text": "Environment variables and connection details are not stored in either `catalog.json` or `manifest.json`."}}, "key_rule": "`catalog.json` = **warehouse-introspected column info** (names, types, row counts). `manifest.json` = project metadata and lineage."}, {"id": "q09_Q5", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 5, "high_yield": false, "subdomain_id": "8.5", "subdomain_topic": "Multiple jobs generating artifacts", "question_text": "A team has two deployment jobs both configured to generate documentation for the same dbt project. What is the risk?", "is_multi_select": false, "options": {"A": "No risk — dbt Cloud merges artifact outputs from multiple jobs to produce a comprehensive Catalog.", "B": "The jobs will overwrite each other's artifacts — the Catalog will reflect whichever job ran last, potentially showing an inconsistent or incomplete state.", "C": "dbt Cloud automatically deduplicates artifact outputs when multiple jobs generate docs.", "D": "The second job fails automatically when it detects another job is already generating artifacts for the same project."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not merge artifacts — each job write overwrites the previous one."}, "B": {"label": "✅ Correct", "text": "When multiple jobs are both designated for artifact generation, they **overwrite each other's artifacts** — the Catalog reflects whatever job ran last. If the jobs run at different times covering different scopes, the Catalog state can be inconsistent or incomplete. Best practice: designate **exactly one job per project** for artifact generation."}, "C": {"label": "❌ Incorrect", "text": "There is no deduplication logic for artifacts."}, "D": {"label": "❌ Incorrect", "text": "There is no lock or failure mechanism preventing concurrent artifact generation — they simply overwrite each other."}}, "key_rule": "**One job per project** for artifact generation. Multiple jobs = conflicting/overwritten artifacts = inconsistent Catalog."}, {"id": "q09_Q6", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 6, "high_yield": true, "subdomain_id": "8.6", "subdomain_topic": "Model Query History", "question_text": "A team wants to use dbt Catalog's Model Query History feature to identify which models are most frequently queried by downstream users, in order to prioritize optimization work. What is required to enable this feature?", "is_multi_select": false, "options": {"A": "The feature is available on all dbt Cloud plans — no specific plan required.", "B": "Enterprise or Enterprise+ plan, and it must be enabled in the Production environment settings by testing and enabling query history permissions.", "C": "Enterprise+ plan only, and it requires the Fusion engine to be enabled.", "D": "Starter plan with the Advanced CI feature enabled."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model Query History is not available on Starter or Developer plans."}, "B": {"label": "✅ Correct", "text": "Model Query History requires **Enterprise or Enterprise+** plan. To enable it: Orchestration → Environments → select the Production environment → Settings → scroll to Query History → click **\"Test Permissions\"** → check **\"Enable query history\"** → Save. It tracks SELECT queries by downstream users/tools (excludes dbt builds and test runs)."}, "C": {"label": "❌ Incorrect", "text": "Fusion engine is required for Cost Insights, not Model Query History. The plan requirement is Enterprise (not Enterprise+)."}, "D": {"label": "❌ Incorrect", "text": "Advanced CI and Model Query History are unrelated features."}}, "key_rule": "Model Query History = **Enterprise+** plan. Enable in Production env settings. Tracks downstream SELECT queries only (not dbt builds)."}, {"id": "q09_Q7", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 7, "high_yield": false, "subdomain_id": "8.7", "subdomain_topic": "dbt Docs vs dbt Catalog", "question_text": "A new team member asks about the difference between `dbt docs generate` (dbt Docs) and dbt Catalog. Which statement is correct?", "is_multi_select": false, "options": {"A": "They are the same product — dbt Catalog is just the new branding for dbt Docs.", "B": "dbt Docs generates a static HTML site from project metadata (available on all plans). dbt Catalog is a dynamic real-time metadata platform (available on Starter+ only) with features like lineage, data health, and query history.", "C": "dbt Docs is available on Enterprise+; dbt Catalog is available on all plans.", "D": "dbt Catalog is built on top of `dbt docs generate` artifacts and requires them to be generated daily."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "They are distinct products with different capabilities, plans, and use cases."}, "B": {"label": "✅ Correct", "text": "**dbt Docs** (`dbt docs generate`) creates a **static HTML site** from project artifacts — available on **all plans**, self-hosted or served via dbt Cloud. It reflects the state at the time of generation. **dbt Catalog** is a **dynamic, real-time metadata platform** in dbt Cloud that provides lineage, data health signals, query history, and exploration tools — available on **Starter and above**. The Catalog is always up-to-date with production job runs; dbt Docs is a point-in-time snapshot."}, "C": {"label": "❌ Incorrect", "text": "dbt Docs is available on all plans; dbt Catalog requires Starter+. This is the reverse of the stated answer."}, "D": {"label": "❌ Incorrect", "text": "dbt Catalog does use artifacts generated by deployment jobs, but it is not simply a wrapper around `dbt docs generate` output. It has its own metadata ingestion and real-time features."}}, "key_rule": "dbt Docs = static HTML, all plans. dbt Catalog = dynamic real-time metadata, Starter+ only."}, {"id": "q09_Q8", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 8, "high_yield": false, "subdomain_id": "8.8", "subdomain_topic": "Catalog reflects production only", "question_text": "A developer builds and tests a model in the dbt Cloud IDE in their personal dev schema (`dbt_alice`). They expect to see it appear in dbt Catalog so they can share a lineage link with a stakeholder. The model does not appear in Catalog. Why?", "is_multi_select": false, "options": {"A": "Catalog only indexes models that have been tagged with `+catalog: true` in their config.", "B": "dbt Catalog reflects the **production environment only** by default. Dev and staging models do not appear in Catalog until they exist in a production deployment job run.", "C": "The model needs to be committed to the main branch before it appears in Catalog.", "D": "The developer must manually publish the model to Catalog from the IDE using the \"Publish\" button."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `catalog: true` tag requirement. Models appear in Catalog based on which environment they were built in."}, "B": {"label": "✅ Correct", "text": "dbt Catalog reflects the **production environment only** by default. Models built in developer personal schemas (dev) or staging environments do not surface in Catalog until they have been run through a **production deployment job**. The developer cannot share a Catalog link for an unreleased model — it only appears after the next production run builds it."}, "C": {"label": "❌ Incorrect", "text": "Committing to main is not sufficient — a production deployment job must actually run and build the model."}, "D": {"label": "❌ Incorrect", "text": "There is no manual \"Publish to Catalog\" button in the IDE."}}, "key_rule": "dbt Catalog = production environment only. Dev/staging models are invisible until built by a production deployment job."}, {"id": "q09_Q9", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 9, "high_yield": false, "subdomain_id": "8.9", "subdomain_topic": "Data health signals", "question_text": "A stakeholder views a model in dbt Catalog and sees a **\"Degraded\"** health signal. What does this indicate, and what typically triggers it?", "is_multi_select": false, "options": {"A": "The model has not been run in more than 30 days.", "B": "The model's dbt tests are failing or sources feeding it are stale — health signals are driven by test results and source freshness checks.", "C": "The model has no description or documentation — degraded means undocumented.", "D": "The model has more than 100 downstream consumers, causing performance degradation."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Inactivity does not directly trigger a \"Degraded\" signal. Inactivity triggers the Catalog purge after 3 months."}, "B": {"label": "✅ Correct", "text": "Data health signals in dbt Catalog (Healthy / Caution / Degraded) are driven by **test results and source freshness** outcomes from the most recent production job run. **Degraded** indicates that tests are failing or sources are stale — the model's data quality is questionable. **Caution** indicates warnings. **Healthy** means all tests passed and sources are fresh. These signals give data consumers quick visibility into data trustworthiness."}, "C": {"label": "❌ Incorrect", "text": "Documentation completeness is not a health signal driver. Missing descriptions do not cause a Degraded status."}, "D": {"label": "❌ Incorrect", "text": "Downstream consumer count is tracked (query history) but is not a health signal."}}, "key_rule": "Catalog health = Healthy / Caution / Degraded — driven by **test results** and **source freshness**. Degraded = failing tests or stale sources."}, {"id": "q09_Q10", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 10, "high_yield": false, "subdomain_id": "8.10", "subdomain_topic": "Lenses DAG overlays", "question_text": "A data platform team wants to quickly identify which models in the lineage graph have the most test failures and which are materialized as views vs tables. Which dbt Catalog feature allows this?", "is_multi_select": false, "options": {"A": "The **Filters** panel — allows filtering models by materialization type and test status.", "B": "The **Lenses** feature — DAG overlays that color-code nodes by attributes like materialization type, test status, model layer, or consumption query history.", "C": "The **Column-level lineage** view — shows test status per column in the lineage graph.", "D": "The **Resources** tab — lists all models with sortable columns for materialization and test status."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Filters narrow which nodes are shown; they don't provide a visual DAG overlay."}, "B": {"label": "✅ Correct", "text": "**Lenses** are visual **DAG overlays** in dbt Catalog's lineage graph. They color-code nodes based on selected attributes. Per the dbt docs, the available lenses are: **Resource type**, **Materialization type**, **Latest status**, **Model layer** (staging / intermediate / marts), **Test status**, and **Consumption query history**. This allows rapid visual identification of problem areas, materialization patterns, or hot/cold consumption directly in the graph."}, "C": {"label": "❌ Incorrect", "text": "Column-level lineage shows column data flow, not test status overlays on nodes."}, "D": {"label": "❌ Incorrect", "text": "The Resources tab is a list view — useful for sorting, but does not provide the visual DAG overlay that Lenses provide."}}, "key_rule": "Lenses = DAG overlays in dbt Catalog. Six lenses available: Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history. **Cost is NOT a lens** — Cost Insights is a separate Catalog feature."}, {"id": "q09_Q11", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 11, "high_yield": false, "subdomain_id": "8.11", "subdomain_topic": "Cross-project lineage plan requirement", "question_text": "A data governance lead wants to view lineage that spans multiple dbt projects in dbt Catalog — tracing data flow from raw sources through the Platform project into the Marketing project. What plan is required?", "is_multi_select": false, "options": {"A": "Starter plan — cross-project lineage is included with basic Catalog access.", "B": "Enterprise plan — cross-project lineage requires the Enterprise tier.", "C": "Enterprise+ plan — cross-project lineage (multi-project DAG view) is an Enterprise+ feature.", "D": "No specific plan — cross-project lineage is available on all plans that have dbt Mesh configured."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Starter plan has basic Catalog access but does not include cross-project lineage."}, "B": {"label": "❌ Incorrect", "text": "Enterprise has many features but multi-project lineage in Catalog is gated to Enterprise+."}, "C": {"label": "✅ Correct", "text": "**Cross-project lineage** (multi-project DAG view spanning multiple dbt projects) requires **Enterprise+**. This allows the lineage graph to show data flowing across project boundaries — tracing dependencies from upstream foundational projects through downstream consumer projects. It is one of the key Enterprise+ features alongside column-level lineage and project dependencies (dbt Mesh)."}, "D": {"label": "❌ Incorrect", "text": "dbt Mesh configuration (project dependencies) requires Enterprise+, so this is a tautology — but the plan requirement is explicit."}}, "key_rule": "Cross-project lineage in Catalog = **Enterprise+** required."}, {"id": "q09_Q12", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 12, "high_yield": false, "subdomain_id": "8.12", "subdomain_topic": "Production job designation", "question_text": "A team has four deployment jobs in their dbt project. They want to designate which job's artifacts are used to populate dbt Catalog. Where in dbt Cloud is this configured, and how many jobs can be designated?", "is_multi_select": false, "options": {"A": "In each job's Advanced Settings → \"Publish to Catalog\" toggle. All jobs can be toggled on simultaneously.", "B": "In Account Settings → select the project → Edit → Artifacts section. **One job per project** should be designated to avoid conflicting artifact states.", "C": "In the Production environment settings → \"Catalog source job\" dropdown. Multiple jobs can be designated.", "D": "Automatically — whichever job ran most recently updates Catalog; no manual designation is needed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no per-job \"Publish to Catalog\" toggle in job settings."}, "B": {"label": "✅ Correct", "text": "Artifact designation is configured at: **Account Settings → click account name in left sidebar → select project → Edit → Artifacts section**. Here you select which job generates documentation and source freshness artifacts for Catalog. Only **one job per project** should be designated — if multiple jobs generate artifacts, they overwrite each other's output, causing inconsistent or stale Catalog state."}, "C": {"label": "❌ Incorrect", "text": "The designation is in Account Settings → project → Artifacts, not in the environment settings."}, "D": {"label": "❌ Incorrect", "text": "Catalog does not automatically use the most recently run job. The designation is explicit and manual."}}, "key_rule": "Artifact designation path: Account Settings → project → Edit → Artifacts. One job per project — multiple jobs cause conflicting artifacts."}, {"id": "q09_Q13", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 13, "high_yield": false, "subdomain_id": "8.13", "subdomain_topic": "sources.json contents", "question_text": "An architect is auditing what each dbt artifact file contains. What information is stored in `sources.json` that is NOT in `manifest.json`?", "is_multi_select": false, "options": {"A": "Source table names and their warehouse locations", "B": "**Source freshness check results** — the actual freshness measurements and pass/fail status from the last `dbt source freshness` run", "C": "Source-to-model lineage edges", "D": "Source schema definitions and column names"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Source table names and locations are defined in the project YAML and appear in `manifest.json` as source node metadata."}, "B": {"label": "✅ Correct", "text": "`sources.json` contains **source definitions AND freshness check results** — specifically the actual freshness measurements (e.g., time since last update) and the pass/warn/error status from `dbt source freshness` runs. `manifest.json` contains the source definitions but not the runtime freshness results. This is why `sources.json` must be refreshed regularly to reflect current data freshness state in Catalog."}, "C": {"label": "❌ Incorrect", "text": "Source-to-model lineage is captured in `manifest.json` as part of the project DAG."}, "D": {"label": "❌ Incorrect", "text": "Source schema definitions (column names, descriptions) are in `manifest.json`."}}, "key_rule": "`sources.json` = source definitions + **freshness check results** (actual measured freshness + pass/warn/error status). `manifest.json` = project structure, lineage, metadata."}, {"id": "q09_Q14", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 14, "high_yield": false, "subdomain_id": "8.14", "subdomain_topic": "Cost Insights requirements", "question_text": "A team on dbt Cloud Enterprise wants to use the Cost Insights feature to track Snowflake spend per model. They navigate to the Catalog but cannot find Cost Insights. What requirements are they missing?", "is_multi_select": false, "options": {"A": "Cost Insights is available on Enterprise+ only — they need to upgrade.", "B": "Cost Insights requires **Fusion engine enabled** AND **state-aware orchestration enabled** — both must be active. Also note that data refreshes with up to a 24-hour lag.", "C": "Cost Insights requires a separate Snowflake cost management integration to be configured by dbt support.", "D": "Cost Insights is only available for BigQuery — Snowflake cost tracking uses a different mechanism."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "While Enterprise+ provides additional features, Cost Insights availability depends on Fusion engine and state-aware orchestration, not just plan tier."}, "B": {"label": "✅ Correct", "text": "Cost Insights requires: (1) **Fusion engine enabled** and (2) **state-aware orchestration enabled**. Both conditions must be met. Additionally, Cost Insights data refreshes with up to a **24-hour lag** — it is not a real-time billing dashboard. Snowflake costs are calculated as credits × price per credit; BigQuery as TiB processed × price (cached = $0); Databricks as proportional DBU allocation."}, "C": {"label": "❌ Incorrect", "text": "No separate support engagement is required. Cost Insights is self-serve once Fusion and state-aware orchestration are enabled."}, "D": {"label": "❌ Incorrect", "text": "Cost Insights supports Snowflake, BigQuery, and Databricks — not BigQuery exclusively."}}, "key_rule": "Cost Insights = **Fusion engine + state-aware orchestration** required. Up to 24-hour refresh lag — not real-time."}, {"id": "q09_Q15", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 15, "high_yield": false, "subdomain_id": "8.15", "subdomain_topic": "Cost formulas by platform", "question_text": "An architect is setting up Cost Insights for a multi-cloud team using Snowflake and BigQuery. Which cost calculation formulas are correct for each platform?", "is_multi_select": false, "options": {"A": "Snowflake: TiB processed × price per TiB. BigQuery: credits × price per credit.", "B": "Snowflake: credits × price per credit. BigQuery: TiB of data processed × price per TiB (cached queries = $0).", "C": "Both platforms use credits × price per credit — Cost Insights normalizes across platforms.", "D": "Snowflake: warehouse-hours × rate. BigQuery: slot usage × rate."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This reverses the formulas for each platform."}, "B": {"label": "✅ Correct", "text": "**Snowflake**: cost = **credits × price per credit** (Snowflake charges in virtual warehouse credits). **BigQuery**: cost = **TiB of data processed × price per TiB** — and importantly, **cached queries cost $0** in BigQuery (no data scanned = no charge). **Databricks**: cost is proportional DBU allocation based on query runtime. Each platform has a fundamentally different billing model, and Cost Insights translates these into comparable cost estimates per model run."}, "C": {"label": "❌ Incorrect", "text": "Cost Insights uses each platform's native billing model — it does not normalize to a single unit."}, "D": {"label": "❌ Incorrect", "text": "Warehouse-hours and slot usage are not the documented Cost Insights formulas."}}, "key_rule": "Snowflake = credits × price. BigQuery = TiB processed × price (cached = $0). Databricks = proportional DBU allocation."}, {"id": "q09_Q16", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 16, "high_yield": false, "subdomain_id": "8.16", "subdomain_topic": "Query History: what it tracks", "question_text": "A data engineer enables Model Query History in dbt Catalog to understand how often their models are queried. They notice that dbt's own model build runs (when dbt materializes tables) are NOT counted in the query history. Is this expected, and why?", "is_multi_select": false, "options": {"A": "Unexpected — all SELECT queries against a model, including dbt builds, should be counted.", "B": "Expected — Model Query History tracks **consumption queries** (SELECT queries by downstream users and tools) only. dbt model builds and test executions are explicitly excluded.", "C": "Expected — Query History only counts queries executed from the dbt Cloud IDE, not from automated jobs.", "D": "Unexpected — dbt builds appear in the 24-hour delayed refresh, not the real-time view."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt build runs are explicitly excluded from Query History counts."}, "B": {"label": "✅ Correct", "text": "Model Query History is specifically designed to track **consumption** — SELECT queries by **downstream users and BI tools** against production models. It explicitly **excludes dbt model builds and dbt test executions**. This is intentional: the goal is to understand how often business users and tools are consuming the data, not how often dbt is rebuilding it. Including build runs would inflate counts and obscure actual consumption patterns."}, "C": {"label": "❌ Incorrect", "text": "Query History counts external consumption queries (BI tools, direct SQL), not just IDE queries."}, "D": {"label": "❌ Incorrect", "text": "The 24-hour lag applies to Cost Insights, not Query History. And the exclusion of dbt builds is by design, not a timing issue."}}, "key_rule": "Query History = **consumption queries only** (downstream users/tools). Excludes dbt builds and test executions."}, {"id": "q09_Q17", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 17, "high_yield": false, "subdomain_id": "8.17", "subdomain_topic": "Query History: 4 places to view", "question_text": "A data platform lead wants to identify the top 10 most-consumed models across their entire project to prioritize optimization work. Where in dbt Catalog can they find this information? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Account Settings → Usage dashboard", "B": "Project details → \"Most consumed models\" performance chart", "C": "Lineage graph → apply the **Lenses** overlay for query volume", "D": "Job run history → sort by execution count", "E": "Environment settings → consumption metrics"}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Account Settings does not contain a model consumption dashboard."}, "B": {"label": "✅ Correct", "text": "**Project details → \"Most consumed models\"** is one of the four places to view Query History. This performance chart shows the highest-traffic models across the project."}, "C": {"label": "✅ Correct", "text": "The **Lineage graph with the Lenses overlay set to query volume** color-codes nodes by consumption frequency — immediately showing which models in the DAG are most queried. This is particularly useful for understanding consumption patterns in context of the data pipeline."}, "D": {"label": "❌ Incorrect", "text": "Job run history shows dbt job execution, not downstream user consumption of model data."}, "E": {"label": "❌ Incorrect", "text": "Environment settings do not show consumption metrics."}}, "key_rule": "Query History in 4 places: (1) Project details performance chart, (2) Lineage graph Lenses, (3) Resources list sorted by consumption, (4) Individual model page."}, {"id": "q09_Q18", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 18, "high_yield": false, "subdomain_id": "8.18", "subdomain_topic": "Non-dbt asset ingestion", "question_text": "A team uses dbt Catalog but also has significant data pipelines built in Apache Spark and Fivetran that feed into their dbt models. They want Catalog to show complete end-to-end lineage including these non-dbt assets. Is this possible?", "is_multi_select": false, "options": {"A": "No — dbt Catalog only shows lineage for dbt models. External assets must be documented separately.", "B": "Yes — non-dbt warehouse assets can be ingested into dbt Catalog to provide complete lineage that spans both dbt and non-dbt pipeline components.", "C": "Yes — but only Fivetran connectors are supported; Spark pipelines require a separate lineage tool.", "D": "Yes — but only on Enterprise+ plan and only for assets in the same warehouse as the dbt project."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Catalog explicitly supports non-dbt asset ingestion for complete lineage."}, "B": {"label": "✅ Correct", "text": "**Non-dbt warehouse assets** (tables, views, and pipelines from tools like Spark, Fivetran, Kafka, etc.) can be **ingested into dbt Catalog** to provide complete end-to-end lineage. This allows Catalog to show the full data flow: from raw sources through ingestion pipelines, into dbt transformation layers, and out to consuming BI tools — even when parts of the pipeline are outside dbt."}, "C": {"label": "❌ Incorrect", "text": "The capability is not limited to Fivetran — it applies to non-dbt assets broadly."}, "D": {"label": "❌ Incorrect", "text": "Non-dbt asset ingestion is not restricted to a specific plan tier or same-warehouse requirement."}}, "key_rule": "dbt Catalog supports non-dbt asset ingestion for complete end-to-end lineage beyond dbt models."}, {"id": "q09_Q19", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 19, "high_yield": false, "subdomain_id": "8.19", "subdomain_topic": "Staging environment Catalog updates", "question_text": "A team assumes that only their Production environment deployment job updates dbt Catalog. They set up a Staging environment with its own deployment job for pre-production validation. Will the Staging environment's models appear in Catalog?", "is_multi_select": false, "options": {"A": "No — only the Production environment updates Catalog by definition.", "B": "Yes — deployment jobs in **both Production and Staging** environments update Catalog metadata.", "C": "Yes — but only if the Staging environment is explicitly linked to Catalog in Account Settings.", "D": "No — Staging environments are for validation only and are never reflected in Catalog."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Staging environment deployment jobs also update Catalog. Production is the primary view, but Staging is included."}, "B": {"label": "✅ Correct", "text": "dbt Catalog is updated by **deployment jobs in both Production and Staging environments** — not just Production. The Staging environment has its own independent view in Catalog (not just a snapshot of Production), allowing pre-production models to be explored and validated before they graduate to Production. CI jobs remain excluded — only scheduled/manual deployment jobs update Catalog."}, "C": {"label": "❌ Incorrect", "text": "No explicit Catalog linking is required for Staging environments — deployment jobs in Staging automatically update Catalog."}, "D": {"label": "❌ Incorrect", "text": "Staging environments are reflected in Catalog. The exclusion applies to CI jobs and dev schemas, not Staging environments."}}, "key_rule": "Catalog updated by deployment jobs in **Production AND Staging** environments. CI jobs and dev schemas are excluded."}, {"id": "q09_Q20", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 20, "high_yield": false, "subdomain_id": "8.20", "subdomain_topic": "Query History use cases", "question_text": "An architect has enabled Model Query History in dbt Catalog. Which of the following are **valid use cases** for Query History data? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Identifying models to prioritize for performance optimization (high-traffic models benefit most from optimization)", "B": "Tracking which dbt developers are most active in running jobs", "C": "Assessing the downstream impact before deprecating a model (understanding how many consumers would be affected)", "D": "Monitoring dbt job execution duration over time", "E": "Comparing the compute cost of two different model materializations"}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "**Optimization prioritization** is a primary use case. High-traffic models (queried frequently by downstream users) deliver the most value when optimized — Query History reveals which models to tackle first for maximum impact."}, "B": {"label": "❌ Incorrect", "text": "Query History tracks external user/tool consumption of models, not dbt developer activity within dbt Cloud jobs. Developer activity is tracked in dbt Cloud audit logs."}, "C": {"label": "✅ Correct", "text": "**Deprecation impact assessment** is a primary use case. Before deprecating a model, teams use Query History to understand how many downstream users and tools actively query it, quantifying the migration effort and stakeholder communication needed."}, "D": {"label": "❌ Incorrect", "text": "Job execution duration is tracked in the dbt Cloud job run history, not Query History."}, "E": {"label": "❌ Incorrect", "text": "Compute cost comparison uses Cost Insights, not Query History. These are separate features."}}, "key_rule": "Query History use cases: (1) **optimization prioritization** (which models to improve), (2) **deprecation impact assessment** (who consumes this model)."}, {"id": "q09_Q21", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 21, "high_yield": true, "subdomain_id": "8.21", "subdomain_topic": "Picking the right Lens for a diagnostic workflow", "question_text": "A platform architect gets a complaint that the warehouse bill spiked last month. They open dbt Catalog and want to narrow in on models that are both (a) frequently queried by downstream consumers and (b) materialized as full-refresh tables rather than incremental. What is the most efficient workflow using Lenses, and what is a common misconception about what Lenses can answer directly?", "is_multi_select": false, "options": {"A": "Apply the **Cost lens** — it directly reports per-model warehouse spend, which already accounts for query volume and materialization strategy. No other lens is needed.", "B": "Apply the **Consumption query history lens** first to surface hot nodes, then toggle to the **Materialization type lens** on the same DAG view to spot which hot nodes are `table` vs `incremental`. Lenses do not *combine* overlays simultaneously — you switch between them on the same graph.", "C": "Apply the **Test status lens** — degraded tests correlate with expensive rebuilds, so this is the standard cost-triage entry point.", "D": "Lenses cannot answer this. You must export the manifest and run_results to an external BI tool because Catalog does not expose query volume or materialization at the node level."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "**There is no \"Cost lens\"** in dbt Catalog. The available lenses are Resource type, Materialization type, Latest status, Model layer, Test status, and Consumption query history. Cost data lives in **Cost Insights** — a separate Catalog feature that requires the Fusion engine and state-aware orchestration; it is not surfaced as a lens overlay. This is a common trap distractor."}, "B": {"label": "✅ Correct", "text": "Lenses are **single-attribute overlays** applied one at a time to the same lineage graph. The documented workflow is to switch lenses on the same DAG: **Consumption query history** highlights hot nodes visually, then flipping to **Materialization type** re-colors those same nodes by table/view/incremental/ephemeral. The architect reads the intersection visually. There is no \"combined lens\" view — that's the common misconception."}, "C": {"label": "❌ Incorrect", "text": "Test status reflects data quality (worst-case test result per node), not cost or consumption. There's no documented correlation between failing tests and cost spikes."}, "D": {"label": "❌ Incorrect", "text": "Both **Consumption query history** and **Materialization type** are first-class lenses in dbt Catalog — no external export required."}}, "key_rule": "Lenses = **one attribute at a time** overlayed on the lineage graph. For multi-attribute diagnostics, switch lenses on the same view and read the intersection visually. The six available lenses: **Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history**. Cost is *not* a lens — Cost Insights is a separate feature."}, {"id": "q09_Q22", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 22, "high_yield": true, "subdomain_id": "8.22", "subdomain_topic": "Lens names and definitions", "question_text": "A new architect on the team is learning the dbt Catalog Lenses system. They want to confirm which Lens corresponds to which behavior. Match the Lens to its definition. **Select TWO correct statements.**", "is_multi_select": true, "options": {"A": "The **Test status** lens shows the status from the latest test execution against a resource. When a model has multiple tests with different results, the lens reflects the **worst-case** status.", "B": "The **Latest status** lens shows the result of the model's most recent **test execution** in the current environment.", "C": "The **Resource type** lens organizes resources by type (models, tests, seeds, saved query, etc.) and uses the `resource_type` selector.", "D": "The **Cost** lens displays warehouse spend per model, color-coded by cost tier. It is one of the six standard lenses in dbt Catalog.", "E": "The **Model layer** lens classifies models as `public`, `protected`, or `private` based on their cross-project access modifier."}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "The **Test status** lens reflects the latest test execution against the resource. The documented behavior for models with multiple tests of differing results is that the lens shows the **worst-case** status — a single failing test will color the node `degraded` even if other tests on the same model passed. This protects against false-positive \"healthy\" coloring."}, "B": {"label": "❌ Incorrect", "text": "This describes Test status, not Latest status. The **Latest status** lens shows the status from the resource's **latest execution** (the model's own run/build status — success, fail, error, etc.) in the current environment, not its test results. The two lenses are independent."}, "C": {"label": "✅ Correct", "text": "The **Resource type** lens organizes resources by type — models, tests, seeds, saved queries, sources, exposures, etc. It is backed by the same `resource_type` selector used at the CLI (`--select resource_type:test`)."}, "D": {"label": "❌ Incorrect", "text": "**There is no Cost lens.** Cost data lives in **Cost Insights**, a separate Catalog feature that requires the Fusion engine and state-aware orchestration. The six available lenses are: Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history."}, "E": {"label": "❌ Incorrect", "text": "The **Model layer** lens classifies models by **modeling-best-practices layer** (staging / intermediate / marts), based on file prefix or directory — not by cross-project `access` modifier. Access levels (private/protected/public) are not exposed as a lens."}}, "key_rule": "Six lenses — **Resource type, Materialization type, Latest status, Model layer, Test status, Consumption query history**. Test status uses **worst-case** when multiple tests disagree. Latest status ≠ Test status. There is no Cost lens."}, {"id": "q09_Q23", "file_id": "q09", "topic_num": "8", "topic_name": "dbt Catalog", "question_num": 23, "high_yield": true, "subdomain_id": "8.23", "subdomain_topic": "Model layer lens detection rules", "question_text": "A team's repository has the following models. Using the **Model layer** Lens in dbt Catalog, which layer would each be classified as?\n\n- `models/marts/finance/fct_orders.sql`\n- `models/intermediate/int_order_payments_joined.sql`\n- `models/staging/stripe/stg_stripe__charges.sql`\n- `models/utils/dim_calendar.sql` (note: not in a `marts/` subdirectory; uses `dim_` prefix)\n- `models/cleanup/orders_cleaned.sql` (no recognized prefix, no recognized directory)\n\nWhich of the following correctly describes the Model layer Lens classification rules and how each file would be classified? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The Model layer Lens classifies models using **two signals**: file prefix (`stg_`, `int_`, `fct_`/`dim_`) and directory location (`/staging/`, `/intermediate/` or `/int/`, `/marts/`). Either signal alone is sufficient for a layer match.", "B": "`fct_orders.sql` → Marts; `int_order_payments_joined.sql` → Intermediate; `stg_stripe__charges.sql` → Staging; `dim_calendar.sql` → **Marts** (the `dim_` prefix matches the Marts rule even though it's not in a `marts/` directory).", "C": "`dim_calendar.sql` is classified as **Intermediate** because it's not in a `marts/` directory — directory location takes precedence over prefix.", "D": "`orders_cleaned.sql` (no recognized prefix or directory) is automatically classified as **Marts** — Marts is the default fallback layer.", "E": "The Model layer Lens uses model **materialization type** (table vs view) to determine the layer, not naming conventions."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "Per the dbt docs, the Model layer Lens uses **two equivalent signals** — file **prefix** (`stg_` / `int_` / `fct_` or `dim_`) **OR** directory location (`/staging/` / `/intermediate/` or `/int/` / `/marts/`). Either signal alone is enough to classify the model. This means a `dim_calendar.sql` outside a `/marts/` directory is still classified as Marts via its prefix."}, "B": {"label": "✅ Correct", "text": "All five mappings here are right: `fct_orders.sql` → Marts (both signals match), `int_order_payments_joined.sql` → Intermediate (both match), `stg_stripe__charges.sql` → Staging (both match), and `dim_calendar.sql` → **Marts** via `dim_` prefix despite not being in `/marts/`. The first three reinforce the dual-signal nature; the fourth is the discriminator."}, "C": {"label": "❌ Incorrect", "text": "There is no precedence rule favoring directory over prefix — either signal classifies the model. `dim_calendar.sql` matches the Marts rule via its prefix."}, "D": {"label": "❌ Incorrect", "text": "There is **no default fallback layer**. A model with no recognized prefix and no recognized directory is **unclassified** by the Model layer lens — it does not get a default classification. `orders_cleaned.sql` would simply not be tagged with a layer."}, "E": {"label": "❌ Incorrect", "text": "The Model layer lens is based on **best-practices naming/directory conventions**, not materialization type. Materialization is a separate lens (Materialization type)."}}, "key_rule": "Model layer = prefix **OR** directory match. **Marts** = `fct_`/`dim_` prefix or `/marts/` dir. **Intermediate** = `int_` prefix or `/int/`/`/intermediate/` dir. **Staging** = `stg_` prefix or `/staging/` dir. No default fallback — unrecognized models are unclassified."}, {"id": "q10_Q1", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 1, "high_yield": true, "subdomain_id": "9.1", "subdomain_topic": "Post-hook transaction behavior on model failure", "question_text": "A post-hook is configured to insert a row into an audit table every time a model completes. The model fails mid-execution due to a bad SQL statement. Does the audit row get inserted?", "is_multi_select": false, "options": {"A": "Yes — post-hooks run regardless of model success or failure to ensure audit completeness.", "B": "No — by default, post-hooks run inside the model's transaction. When the model fails, the transaction rolls back before the post-hook executes.", "C": "Yes — but the audit row is marked with a \"failed\" status code automatically.", "D": "No — post-hooks are skipped when a model fails, but dbt logs the skipped hook in the run results."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Post-hooks do not automatically run on failure — they are part of the same transaction that rolls back."}, "B": {"label": "✅ Correct", "text": "By default, `pre-hook` and `post-hook` run **inside the model's transaction**. When the model fails, the transaction rolls back — and since the post-hook is part of that transaction, it **never executes**. Fix: add `transaction: false` to the hook definition so it runs outside the transaction and persists even when the model fails: `post_hook: {sql: \"INSERT INTO audit...\", transaction: false}`."}, "C": {"label": "❌ Incorrect", "text": "dbt has no mechanism to automatically mark audit rows with failure status from within the transaction — and the hook doesn't run at all on failure anyway."}, "D": {"label": "❌ Incorrect", "text": "While dbt does track skipped hooks, the core issue is that the hook doesn't run — the log detail is secondary."}}, "key_rule": "Post-hook default = **inside transaction**. Model failure = transaction rollback = hook skipped. Use `transaction: false` for audit logging."}, {"id": "q10_Q2", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 2, "high_yield": true, "subdomain_id": "9.2", "subdomain_topic": "Post-hook failure rolls back model", "question_text": "A post-hook runs a `GRANT SELECT` statement after a model builds. The role name in the grant is misspelled, causing the grant to fail. What happens to the model that was just built?", "is_multi_select": false, "options": {"A": "The model remains built — post-hook failures are isolated and don't affect model creation.", "B": "The model's creation is rolled back — since the post-hook runs inside the transaction, its failure rolls back the entire transaction including the model.", "C": "The model remains built but is flagged as \"degraded\" in the dbt Catalog health signals.", "D": "Only the post-hook is retried — the model itself is not affected."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is the opposite of the actual behavior — post-hook failures within a transaction are not isolated."}, "B": {"label": "✅ Correct", "text": "Since post-hooks run inside the model's transaction by default, a post-hook failure **causes the entire transaction to roll back** — including the model creation itself. The model is dropped. This is a double-edged sword: the transaction guarantees atomicity but means post-hook failures can undo completed model builds. Escape this behavior with `transaction: false` if the post-hook is non-critical."}, "C": {"label": "❌ Incorrect", "text": "There is no \"degraded\" status for post-hook failures in dbt Catalog."}, "D": {"label": "❌ Incorrect", "text": "dbt does not automatically retry post-hooks."}}, "key_rule": "Post-hook failure (inside transaction) = **model rollback too**. Use `transaction: false` for non-critical post-hooks."}, {"id": "q10_Q3", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 3, "high_yield": true, "subdomain_id": "9.3", "subdomain_topic": "{{ results }} context variable", "question_text": "A team adds a post-hook to a model that uses `{{ results }}` to log the outcome:\n\n```yaml\npost_hook: \"INSERT INTO run_log VALUES ({{ results }})\"\n```\n\nThe hook runs without errors but `results` is always `None`. Why?", "is_multi_select": false, "options": {"A": "`{{ results }}` requires the `on-run-end` hook to be configured first before it's populated in post-hooks.", "B": "`{{ results }}` is **only available in `on-run-end` hooks** — it returns `None` silently in `pre-hook` and `post-hook`.", "C": "`{{ results }}` must be called as `{{ this.results }}` within a post-hook context.", "D": "`{{ results }}` is populated only after the first model in a run completes — a single-model run always returns `None`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-end` is independent — it doesn't \"unlock\" `results` for post-hooks."}, "B": {"label": "✅ Correct", "text": "`{{ results }}` is **only available in `on-run-end` hooks** — it returns `None` in `pre-hook` and `post-hook` with no error or warning. This is a silent failure that can be hard to debug. The correct approach: use `{{ this }}` in post-hooks to reference the current model relation, and use `{{ results }}` only in `on-run-end` to access all run outcomes."}, "C": {"label": "❌ Incorrect", "text": "`{{ this.results }}` is not valid syntax — `results` is a separate top-level variable, not an attribute of `this`."}, "D": {"label": "❌ Incorrect", "text": "The number of models in a run has no bearing on `results` availability — the issue is the hook type, not run size."}}, "key_rule": "`{{ results }}` = **`on-run-end` only**. In pre/post-hook = `None` (silent). Use `{{ this }}` in post-hooks."}, {"id": "q10_Q4", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 4, "high_yield": false, "subdomain_id": "9.4", "subdomain_topic": "Multiple hooks accumulate", "question_text": "A model has 2 post-hooks defined in `dbt_project.yml` and 3 post-hooks defined in the model's `config()` block. How many post-hooks execute when the model runs?", "is_multi_select": false, "options": {"A": "3 — model-level `config()` hooks override project-level hooks.", "B": "2 — project-level hooks take precedence over model-level hooks.", "C": "5 — all hooks from all scopes accumulate and execute in order.", "D": "2 — dbt deduplicates identical hooks automatically."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model-level hooks do NOT override project-level hooks — they accumulate."}, "B": {"label": "❌ Incorrect", "text": "Project-level hooks do NOT override model-level hooks either — all execute."}, "C": {"label": "✅ Correct", "text": "Hooks from **all scopes accumulate** — they do not override each other. All 5 post-hooks execute: first the 2 project-level hooks (in definition order), then the 3 model-level `config()` block hooks (in definition order). Execution order: package → `dbt_project.yml` → `config()` block. Within each scope: top-to-bottom."}, "D": {"label": "❌ Incorrect", "text": "dbt does not deduplicate hooks — even identical SQL statements would each execute once per scope level."}}, "key_rule": "Hooks **accumulate** across scopes — they never override. All hooks from all scopes execute in scope order."}, {"id": "q10_Q5", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 5, "high_yield": true, "subdomain_id": "9.5", "subdomain_topic": "VACUUM on Redshift: transaction: false", "question_text": "A Redshift post-hook is designed to run `VACUUM SORT ONLY` after each model builds. The hook fails with a database error. What is the most likely cause and fix?", "is_multi_select": false, "options": {"A": "Redshift doesn't support `VACUUM` commands in dbt hooks — use `dbt run-operation` instead.", "B": "`VACUUM` on Redshift cannot run inside a transaction. Add `transaction: false` to the hook so it runs outside the model's transaction.", "C": "`VACUUM SORT ONLY` syntax is deprecated in Redshift — use `VACUUM FULL` instead.", "D": "Post-hooks can't run multi-word SQL commands — split the command into a macro."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`VACUUM` can be used in dbt hooks — the issue is transaction context, not hook type. Using `dbt run-operation` would work but isn't required."}, "B": {"label": "✅ Correct", "text": "**Redshift's `VACUUM` command cannot run inside a transaction** — it's a DDL operation that must run outside any active transaction context. By default, post-hooks run inside the model's transaction. Fix: `post_hook: {sql: \"VACUUM SORT ONLY {{this}}\", transaction: false}`. The `transaction: false` flag runs the hook outside the transaction."}, "C": {"label": "❌ Incorrect", "text": "`VACUUM SORT ONLY` is valid Redshift syntax — it's not deprecated."}, "D": {"label": "❌ Incorrect", "text": "Multi-word SQL is valid in hook definitions."}}, "key_rule": "Redshift `VACUUM` cannot run inside a transaction. Use `transaction: false` in the post-hook definition."}, {"id": "q10_Q6", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 6, "high_yield": false, "subdomain_id": "9.6", "subdomain_topic": "on-run-end fires on partial failure", "question_text": "A run includes 20 models. 3 models fail. An `on-run-end` hook is configured to send a Slack notification summarizing the run. Does the `on-run-end` hook fire?", "is_multi_select": false, "options": {"A": "No — `on-run-end` only fires when the run completes successfully (all models pass).", "B": "Yes — `on-run-end` fires after the run completes regardless of partial failures. The `results` variable contains entries for all resources including failures.", "C": "Yes — but only if the `on-run-end` hook is defined with `transaction: false`.", "D": "No — `on-run-end` is skipped when any model fails to prevent sending false success notifications."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-end` fires after the run regardless of success or failure — partial failure doesn't suppress it."}, "B": {"label": "✅ Correct", "text": "`on-run-end` **always executes** after the run completes, even on partial failures. The `results` variable contains result objects for ALL resources that ran — including failed ones. Filter by `res.status == 'error'` to identify and report failures. This is what makes `on-run-end` powerful for alerting: it fires reliably and provides complete outcome data."}, "C": {"label": "❌ Incorrect", "text": "`on-run-end` is not subject to model transaction context — it runs at the project level outside model transactions. `transaction: false` is relevant for `pre-hook`/`post-hook`, not `on-run-end`."}, "D": {"label": "❌ Incorrect", "text": "Suppressing `on-run-end` on failure would defeat its main use case (alerting on failures)."}}, "key_rule": "`on-run-end` always fires — even on partial failure. Use `results` to detect and report failures."}, {"id": "q10_Q7", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 7, "high_yield": false, "subdomain_id": "9.7", "subdomain_topic": "on-run-start and on-run-end configuration location", "question_text": "A developer wants to add an `on-run-start` hook to resume a Snowflake warehouse before any models run. They add the hook to a model's `config()` block. The hook never fires. Why?", "is_multi_select": false, "options": {"A": "`on-run-start` requires the `transaction: false` flag to fire correctly.", "B": "`on-run-start` and `on-run-end` can only be configured in `dbt_project.yml` — they cannot be set in model `config()` blocks or YAML property files.", "C": "The Snowflake warehouse resume command must use a specific macro format to work in hooks.", "D": "`on-run-start` hooks only fire when running `dbt run` — not `dbt build` or other commands."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`transaction: false` is relevant for post-hooks that run SQL that can't be in a transaction — it has nothing to do with `on-run-start` configuration location."}, "B": {"label": "✅ Correct", "text": "`on-run-start` and `on-run-end` are **project-level hooks** and can **only be configured in `dbt_project.yml`**. They cannot be defined in model `config()` blocks or YAML property files — those locations only support `pre-hook` and `post-hook`. This is a common mistake when developers confuse the scope of different hook types."}, "C": {"label": "❌ Incorrect", "text": "The macro format is a separate concern — the root issue is where the hook is configured."}, "D": {"label": "❌ Incorrect", "text": "`on-run-start` fires once per dbt command — this includes `dbt run`, `dbt build`, `dbt test`, `dbt seed`, `dbt snapshot`, `dbt compile`, and `dbt docs generate`."}}, "key_rule": "`on-run-start`/`on-run-end` = **`dbt_project.yml` only**. Cannot be set in model `config()` blocks or YAML files."}, {"id": "q10_Q8", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 8, "high_yield": false, "subdomain_id": "9.8", "subdomain_topic": "Seeds and hook configuration", "question_text": "A team wants to add a post-hook to a seed file to grant SELECT privileges to a reporter role after each seed load. Where must this post-hook be configured?", "is_multi_select": false, "options": {"A": "In the seed CSV file's header row using a special dbt comment format.", "B": "In the seed file's corresponding `.yml` property file or in `dbt_project.yml` — seeds do not support in-file `config()` blocks.", "C": "In the model's `config()` block (any `.sql` file that references the seed).", "D": "In `profiles.yml` under the seed's connection configuration."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Seed CSV files are plain data files — they have no mechanism for dbt config comments or headers."}, "B": {"label": "✅ Correct", "text": "Seeds are CSV files — they **cannot have in-file `config()` blocks** (that syntax is for `.sql` model files). Hooks for seeds must be configured either in `dbt_project.yml` (project-level) or in a YAML property file (e.g., `seeds/schema.yml`). Both approaches attach the hook to the seed without needing a SQL file."}, "C": {"label": "❌ Incorrect", "text": "You cannot configure a hook for a seed in a model's `config()` block — that block applies to the specific SQL model file, not referenced seeds."}, "D": {"label": "❌ Incorrect", "text": "`profiles.yml` contains connection configuration — hooks are not configured there."}}, "key_rule": "Seeds = no in-file `config()` block (CSV files). Seed hooks → `dbt_project.yml` OR YAML property file only."}, {"id": "q10_Q9", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 9, "high_yield": false, "subdomain_id": "9.9", "subdomain_topic": "transaction: false syntax", "question_text": "A team needs an audit log row to persist even when the model it's associated with fails. They currently use a standard post-hook but the audit row is never inserted on failure. What is the correct hook syntax to run the SQL outside the model's transaction?", "is_multi_select": false, "options": {"A": "Add `no_transaction: true` to the hook string.", "B": "Use dictionary syntax: `{sql: \"INSERT INTO audit_log ...\", transaction: false}`.", "C": "Use `on-run-end` instead of `post-hook` — it always runs outside transactions.", "D": "Call the hook with `--no-transaction` flag in the dbt command."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`no_transaction: true` is not valid hook syntax."}, "B": {"label": "✅ Correct", "text": "To run a hook **outside the model's transaction**, use the **dictionary syntax** with `transaction: false`: `post_hook: {sql: \"INSERT INTO audit_log VALUES (...)\", transaction: false}`. Without this, post-hooks run inside the model's transaction — if the model fails, the transaction rolls back and the hook never executes. Common use cases for `transaction: false`: audit logging (must persist on failure), VACUUM/ANALYZE on Redshift (cannot run inside a transaction), and cleanup operations that should always execute."}, "C": {"label": "❌ Incorrect", "text": "`on-run-end` fires after the full run completes and is unrelated to individual model transaction behavior. Using it for per-model audit rows would require inspecting `results` to find which models ran, which is more complex."}, "D": {"label": "❌ Incorrect", "text": "There is no `--no-transaction` CLI flag in dbt."}}, "key_rule": "Hook outside transaction = `{sql: \"...\", transaction: false}`. Required for audit logs, VACUUM, and any SQL that must persist even when the model fails."}, {"id": "q10_Q10", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 10, "high_yield": false, "subdomain_id": "9.10", "subdomain_topic": "Hook execution order across scopes", "question_text": "A dbt project has the following hooks configured:\n- A package defines a `post-hook` for a model\n- `dbt_project.yml` defines 2 `post-hook` entries\n- The model's `config()` block defines 1 `post-hook`\n\nIn what order do these post-hooks execute when the model runs?", "is_multi_select": false, "options": {"A": "config() block first → dbt_project.yml → package (model-level takes priority)", "B": "Package → dbt_project.yml → config() block (outer scope first, inner scope last)", "C": "All hooks run in random order — the order is not guaranteed", "D": "dbt_project.yml → config() block → package (alphabetical by scope name)"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model-level hooks do not take priority — they run last, not first."}, "B": {"label": "✅ Correct", "text": "Hook execution order flows from **outermost to innermost scope**: (1) **Package-level hooks** run first; (2) **`dbt_project.yml` project-level hooks** run second; (3) **Model `config()` block / YAML property file hooks** run last. Within the same scope, hooks execute in **definition order** (top to bottom). All hooks from all scopes accumulate — model-level hooks never override project-level hooks."}, "C": {"label": "❌ Incorrect", "text": "The order is deterministic and documented — it is not random."}, "D": {"label": "❌ Incorrect", "text": "Alphabetical by scope name is not the ordering rule."}}, "key_rule": "Hook order = **package → dbt_project.yml → config() block**. All hooks accumulate — none override others."}, {"id": "q10_Q11", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 11, "high_yield": false, "subdomain_id": "9.11", "subdomain_topic": "{{ this }} context variable", "question_text": "A post-hook needs to run a GRANT statement after a Snowflake model builds, granting SELECT to a reporter role on the exact table/view that was just created. Which context variable provides the fully-qualified relation object for the current model?", "is_multi_select": false, "options": {"A": "`{{ model.name }}` — the model's identifier", "B": "`{{ this }}` — the relation object for the current model (database.schema.identifier)", "C": "`{{ target.schema }}.{{ model.name }}` — constructed from target and model name", "D": "`{{ node.relation_name }}` — the canonical relation reference"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`{{ model.name }}` is just the model identifier string — it does not include database or schema, so it cannot be used in a GRANT statement that needs a fully-qualified reference."}, "B": {"label": "✅ Correct", "text": "**`{{ this }}`** is the **relation object** for the current model — it resolves to the fully-qualified `database.schema.identifier` in the compiled hook SQL. It is available in both `pre-hook` and `post-hook`. The standard Snowflake GRANT pattern is: `GRANT SELECT ON {{ this }} TO ROLE reporter`. This is one of the most common hook use cases."}, "C": {"label": "❌ Incorrect", "text": "While this could work in simple cases, it is fragile and not idiomatic. `{{ this }}` handles quoting and qualification correctly."}, "D": {"label": "❌ Incorrect", "text": "`{{ node.relation_name }}` is not a documented standard context variable for hooks."}}, "key_rule": "`{{ this }}` = fully-qualified relation object in pre/post-hooks. Standard for GRANT statements: `GRANT SELECT ON {{ this }} TO ROLE reporter`."}, {"id": "q10_Q12", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 12, "high_yield": false, "subdomain_id": "9.12", "subdomain_topic": "on-run-end context variables", "question_text": "An `on-run-end` hook needs to report two things: (1) which schemas were written to during the run, and (2) a list of results for every resource that ran. Which context variables provide these?", "is_multi_select": false, "options": {"A": "`{{ target.schema }}` and `{{ results }}`", "B": "`{{ schemas }}` (list of schemas) and `{{ results }}` (list of result objects for every resource)", "C": "`{{ database_schemas }}` and `{{ run_results }}`", "D": "`{{ this }}` and `{{ results }}`"}, "correct_answers": ["B"], "
