efined in `dbt_project.yml` and 3 post-hooks defined in the model's `config()` block. How many post-hooks execute when the model runs?", "is_multi_select": false, "options": {"A": "3 — model-level `config()` hooks override project-level hooks.", "B": "5 — all hooks from all scopes accumulate and execute in order.", "C": "2 — dbt deduplicates identical hooks automatically.", "D": "2 — project-level hooks take precedence over model-level hooks."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model-level hooks do NOT override project-level hooks — they accumulate."}, "B": {"label": "✅ Correct", "text": "Hooks from **all scopes accumulate** — they do not override each other. All 5 post-hooks execute: first the 2 project-level hooks (in definition order), then the 3 model-level `config()` block hooks (in definition order). Execution order: package → `dbt_project.yml` → `config()` block. Within each scope: top-to-bottom."}, "C": {"label": "❌ Incorrect", "text": "dbt doesn't deduplicate hooks."}, "D": {"label": "❌ Incorrect", "text": "Project-level hooks do NOT override model-level hooks either — all execute."}}, "key_rule": "Hooks **accumulate** across scopes — they never override. All hooks from all scopes execute in scope order."}, {"id": "q10_Q5", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 5, "high_yield": true, "subdomain_id": "9.5", "subdomain_topic": "VACUUM on Redshift: transaction: false", "question_text": "A Redshift post-hook is designed to run `VACUUM SORT ONLY` after each model builds. The hook fails with a database error. What is the most likely cause and fix?", "is_multi_select": false, "options": {"A": "Redshift doesn't support `VACUUM` commands in dbt hooks — use `dbt run-operation` instead.", "B": "`VACUUM SORT ONLY` syntax is deprecated in Redshift — use `VACUUM FULL` instead.", "C": "Post-hooks can't run multi-word SQL commands — split the command into a macro.", "D": "`VACUUM` on Redshift cannot run inside a transaction. Add `transaction: false` to the hook so it runs outside the model's transaction."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`VACUUM` can be used in dbt hooks — the issue is transaction context, not hook type. Using `dbt run-operation` would work but isn't required."}, "B": {"label": "❌ Incorrect", "text": "`VACUUM SORT ONLY` is valid Redshift syntax — it's not deprecated."}, "C": {"label": "❌ Incorrect", "text": "Multi-word SQL is valid in hook definitions."}, "D": {"label": "✅ Correct", "text": "**Redshift's `VACUUM` command cannot run inside a transaction**, which the docs give as a reason to use `transaction: false`. By default, post-hooks run inside the model's transaction. Fix: `post_hook: {sql: \"VACUUM SORT ONLY {{this}}\", transaction: false}`. The `transaction: false` flag runs the hook outside the transaction."}}, "key_rule": "Redshift `VACUUM` cannot run inside a transaction. Use `transaction: false` in the post-hook definition."}, {"id": "q10_Q6", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 6, "high_yield": false, "subdomain_id": "9.6", "subdomain_topic": "on-run-end fires on partial failure", "question_text": "A run includes 20 models. 3 models fail. An `on-run-end` hook is configured to send a Slack notification summarizing the run. Does the `on-run-end` hook fire?", "is_multi_select": false, "options": {"A": "Yes — but only if the `on-run-end` hook is defined with `transaction: false`.", "B": "No — `on-run-end` is skipped when any model fails to prevent sending false success notifications.", "C": "No — `on-run-end` only fires when the run completes successfully (all models pass).", "D": "Yes — `on-run-end` fires after the run completes regardless of partial failures. The `results` variable contains entries for all resources including failures."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-end` is not subject to model transaction context — it runs at the project level outside model transactions. `transaction: false` is relevant for `pre-hook`/`post-hook`, not `on-run-end`."}, "B": {"label": "❌ Incorrect", "text": "Suppressing `on-run-end` on failure would defeat its main use case (alerting on failures)."}, "C": {"label": "❌ Incorrect", "text": "`on-run-end` fires after the run regardless of success or failure — partial failure doesn't suppress it."}, "D": {"label": "✅ Correct", "text": "`on-run-end` runs at the end of the command. `results` has one Result object per resource that executed, and the docs example shows an `error` result next to a `success` one. Filter on `res.status` to report failures."}}, "key_rule": "`on-run-end` runs at the end of the command, and `results` includes failed resources. Filter on `res.status`."}, {"id": "q10_Q7", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 7, "high_yield": false, "subdomain_id": "9.7", "subdomain_topic": "on-run-start and on-run-end configuration location", "question_text": "A developer wants to add an `on-run-start` hook to resume a Snowflake warehouse before any models run. They add the hook to a model's `config()` block. The hook never fires. Why?", "is_multi_select": false, "options": {"A": "`on-run-start` and `on-run-end` can only be configured in `dbt_project.yml` — they cannot be set in model `config()` blocks or YAML property files.", "B": "`on-run-start` requires the `transaction: false` flag to fire correctly.", "C": "`on-run-start` hooks only fire when running `dbt run` — not `dbt build` or other commands.", "D": "The Snowflake warehouse resume command must use a specific macro format to work in hooks."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "`on-run-start` and `on-run-end` are **project-level hooks** and can **only be configured in `dbt_project.yml`**. They cannot be defined in model `config()` blocks or YAML property files — those locations only support `pre-hook` and `post-hook`. This is a common mistake when developers confuse the scope of different hook types."}, "B": {"label": "❌ Incorrect", "text": "`transaction: false` is relevant for post-hooks that run SQL that can't be in a transaction — it has nothing to do with `on-run-start` configuration location."}, "C": {"label": "❌ Incorrect", "text": "`on-run-start` fires once per dbt command — this includes `dbt run`, `dbt build`, `dbt test`, `dbt seed`, `dbt snapshot`, `dbt compile`, and `dbt docs generate`."}, "D": {"label": "❌ Incorrect", "text": "The macro format is a separate concern — the root issue is where the hook is configured."}}, "key_rule": "`on-run-start`/`on-run-end` = **`dbt_project.yml` only**. Cannot be set in model `config()` blocks or YAML files."}, {"id": "q10_Q8", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 8, "high_yield": false, "subdomain_id": "9.8", "subdomain_topic": "Seeds and hook configuration", "question_text": "A team wants to add a post-hook to a seed file to grant SELECT privileges to a reporter role after each seed load. Where must this post-hook be configured?", "is_multi_select": false, "options": {"A": "In the seed CSV file's header row using a special dbt comment format.", "B": "In the seed file's corresponding `.yml` property file or in `dbt_project.yml` — seeds do not support in-file `config()` blocks.", "C": "In the model's `config()` block (any `.sql` file that references the seed).", "D": "In `profiles.yml` under the seed's connection configuration."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Seed CSV files are plain data files — they have no mechanism for dbt config comments or headers."}, "B": {"label": "✅ Correct", "text": "Seeds are CSV files — they **cannot have in-file `config()` blocks** (that syntax is for `.sql` model files). Hooks for seeds must be configured either in `dbt_project.yml` (project-level) or in a YAML property file (e.g., `seeds/schema.yml`). Both approaches attach the hook to the seed without needing a SQL file."}, "C": {"label": "❌ Incorrect", "text": "You cannot configure a hook for a seed in a model's `config()` block — that block applies to the specific SQL model file, not referenced seeds."}, "D": {"label": "❌ Incorrect", "text": "`profiles.yml` contains connection configuration — hooks are not configured there."}}, "key_rule": "Seeds = no in-file `config()` block (CSV files). Seed hooks → `dbt_project.yml` OR YAML property file only."}, {"id": "q10_Q9", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 9, "high_yield": false, "subdomain_id": "9.9", "subdomain_topic": "transaction: false syntax", "question_text": "A team needs an audit log row to persist even when the model it's associated with fails. They currently use a standard post-hook but the audit row is never inserted on failure. What is the correct hook syntax to run the SQL outside the model's transaction?", "is_multi_select": false, "options": {"A": "Use `on-run-end` instead of `post-hook` — it always runs outside transactions.", "B": "Add `no_transaction: true` to the hook string.", "C": "Use dictionary syntax: `{sql: \"INSERT INTO audit_log ...\", transaction: false}`.", "D": "Call the hook with `--no-transaction` flag in the dbt command."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-end` fires after the full run completes and is unrelated to individual model transaction behavior. Using it for per-model audit rows would require inspecting `results` to find which models ran, which is more complex."}, "B": {"label": "❌ Incorrect", "text": "`no_transaction: true` is not valid hook syntax."}, "C": {"label": "✅ Correct", "text": "To run a hook **outside the model's transaction**, use the **dictionary syntax** with `transaction: false`: `post_hook: {sql: \"INSERT INTO audit_log VALUES (...)\", transaction: false}`. Without this, post-hooks run inside the model's transaction — if the model fails, the transaction rolls back and the hook never executes. The docs name two typical uses: `VACUUM` on Redshift, and an audit record that should persist even if the build fails. Don't use it on Snowflake, BigQuery, Spark or Databricks, where dbt doesn't use transactions. `before_begin()` / `after_commit()` are helper-macro alternatives."}, "D": {"label": "❌ Incorrect", "text": "There is no `--no-transaction` CLI flag in dbt."}}, "key_rule": "Hook outside transaction = `{sql: \"...\", transaction: false}`. Required for audit logs, VACUUM, and any SQL that must persist even when the model fails."}, {"id": "q10_Q10", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 10, "high_yield": false, "subdomain_id": "9.10", "subdomain_topic": "Hook execution order across scopes", "question_text": "A dbt project has the following hooks configured:\n- A package defines a `post-hook` for a model\n- `dbt_project.yml` defines 2 `post-hook` entries\n- The model's `config()` block defines 1 `post-hook`\n\nIn what order do these post-hooks execute when the model runs?", "is_multi_select": false, "options": {"A": "dbt_project.yml → config() block → package (alphabetical by scope name)", "B": "config() block first → dbt_project.yml → package (model-level takes priority)", "C": "Package → dbt_project.yml → config() block (outer scope first, inner scope last)", "D": "All hooks run in random order — the order is not guaranteed"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Alphabetical by scope name is not the ordering rule."}, "B": {"label": "❌ Incorrect", "text": "Model-level hooks do not take priority — they run last, not first."}, "C": {"label": "✅ Correct", "text": "Hook execution order flows from **outermost to innermost scope**: (1) **Package-level hooks** run first; (2) **`dbt_project.yml` project-level hooks** run second; (3) **Model `config()` block / YAML property file hooks** run last. Within the same scope, hooks execute in **definition order** (top to bottom). All hooks from all scopes accumulate — model-level hooks never override project-level hooks."}, "D": {"label": "❌ Incorrect", "text": "The order is deterministic and documented — it is not random."}}, "key_rule": "Hook order = **package → dbt_project.yml → config() block**. All hooks accumulate — none override others."}, {"id": "q10_Q11", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 11, "high_yield": false, "subdomain_id": "9.11", "subdomain_topic": "{{ this }} context variable", "question_text": "A post-hook needs to run a GRANT statement after a Snowflake model builds, granting SELECT to a reporter role on the exact table/view that was just created. Which context variable provides the fully-qualified relation object for the current model?", "is_multi_select": false, "options": {"A": "`{{ model.name }}` — the model's identifier", "B": "`{{ target.schema }}.{{ model.name }}` — constructed from target and model name", "C": "`{{ node.relation_name }}` — the canonical relation reference", "D": "`{{ this }}` — the relation object for the current model (database.schema.identifier)"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`{{ model.name }}` is just the model identifier string — it does not include database or schema, so it cannot be used in a GRANT statement that needs a fully-qualified reference."}, "B": {"label": "❌ Incorrect", "text": "While this could work in simple cases, it is fragile and not idiomatic. `{{ this }}` handles quoting and qualification correctly."}, "C": {"label": "❌ Incorrect", "text": "`{{ node.relation_name }}` is not a documented standard context variable for hooks."}, "D": {"label": "✅ Correct", "text": "**`{{ this }}`** is the **relation object** for the current model — it resolves to the fully-qualified `database.schema.identifier` in the compiled hook SQL. It is available in both `pre-hook` and `post-hook`. The docs use `{{ this }}` in their hook examples, such as `analyze table {{ this }} ...`."}}, "key_rule": "`{{ this }}` = fully-qualified relation object in pre/post-hooks."}, {"id": "q10_Q12", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 12, "high_yield": false, "subdomain_id": "9.12", "subdomain_topic": "on-run-end context variables", "question_text": "An `on-run-end` hook needs to report two things: (1) which schemas were written to during the run, and (2) a list of results for every resource that ran. Which context variables provide these?", "is_multi_select": false, "options": {"A": "`{{ schemas }}` (list of schemas) and `{{ results }}` (list of result objects for every resource)", "B": "`{{ this }}` and `{{ results }}`", "C": "`{{ target.schema }}` and `{{ results }}`", "D": "`{{ database_schemas }}` and `{{ run_results }}`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Two `on-run-end`-specific variables: **`{{ schemas }}`** — a list of all schemas written to during the run (useful for generating per-schema grants or reports). **`{{ results }}`** — a list of result objects for every resource that ran, each with `res.node.unique_id`, `res.status`, and `res.message`. Additionally, `{{ database_schemas }}` provides (database, schema) tuples for cross-database runs. These variables are ONLY available in `on-run-end` — they return `None` in pre-hook or post-hook."}, "B": {"label": "❌ Incorrect", "text": "`{{ this }}` is a pre/post-hook variable representing the current model — it is not available in `on-run-end`."}, "C": {"label": "❌ Incorrect", "text": "`{{ target.schema }}` is the primary target schema, not the full list of all schemas written to during the run."}, "D": {"label": "❌ Incorrect", "text": "`{{ run_results }}` is not the documented variable name — it is `{{ results }}`."}}, "key_rule": "`on-run-end` variables: `{{ schemas }}` (list of schemas), `{{ results }}` (list of result objects), `{{ database_schemas }}` (tuples). All return `None` in pre/post-hooks."}, {"id": "q10_Q13", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 13, "high_yield": false, "subdomain_id": "9.13", "subdomain_topic": "Operations require run_query", "question_text": "A developer writes a macro to clean up temporary tables:\n```sql\n{% macro cleanup_temp_tables() %}\n  DROP TABLE IF EXISTS {{ target.schema }}.tmp_staging;\n{% endmacro %}\n```\nThey run `dbt run-operation cleanup_temp_tables`. The command succeeds but the table is still there. Why?", "is_multi_select": false, "options": {"A": "`DROP TABLE` requires a separate `--force` flag when called via `run-operation`.", "B": "The macro must use `run_query()` or a `{% call statement() %}` block to execute SQL — simply returning a SQL string from a macro does not execute it.", "C": "Macros called via `run-operation` run in read-only mode by default.", "D": "`dbt run-operation` can only call macros that are in the `macros/` directory, not in `models/`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `--force` flag for `dbt run-operation`."}, "B": {"label": "✅ Correct", "text": "A macro called via `dbt run-operation` does **not** auto-execute SQL simply by returning a string. The macro must explicitly execute SQL using **`run_query()`** or a `{% call statement() %}` block. A macro that just templates SQL as a return value produces no warehouse side effect. Fix: `{% do run_query(\"DROP TABLE IF EXISTS \" ~ target.schema ~ \".tmp_staging\") %}`."}, "C": {"label": "❌ Incorrect", "text": "`run-operation` macros run with full write access to the warehouse — there is no read-only default mode."}, "D": {"label": "❌ Incorrect", "text": "Macros for `run-operation` are in the `macros/` directory — this is correct. Location is not the issue."}}, "key_rule": "Operations don't auto-execute SQL return values. Must use `run_query()` or `{% call statement() %}` to actually execute SQL."}, {"id": "q10_Q14", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 14, "high_yield": false, "subdomain_id": "9.14", "subdomain_topic": "dbt run-operation syntax", "question_text": "A macro named `grant_schema_access` accepts two parameters: `role` and `schema_name`. How is this macro correctly invoked using `dbt run-operation`?", "is_multi_select": false, "options": {"A": "`dbt run-operation grant_schema_access --params '{\"role\": \"analyst\", \"schema_name\": \"core\"}'`", "B": "`dbt run-operation grant_schema_access --args '{role: analyst, schema_name: core}'`", "C": "`dbt run-operation grant_schema_access role=analyst schema_name=core`", "D": "`dbt run-operation --macro grant_schema_access --args role=analyst --args schema_name=core`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The flag is `--args`, not `--params`."}, "B": {"label": "✅ Correct", "text": "`dbt run-operation` passes arguments via the **`--args` flag** as a **YAML dictionary**: `dbt run-operation grant_schema_access --args '{role: analyst, schema_name: core}'`. Both YAML and JSON dict formats are accepted. The keys must exactly match the macro's parameter names."}, "C": {"label": "❌ Incorrect", "text": "Positional or keyword arguments passed directly after the macro name are not valid syntax for `dbt run-operation`."}, "D": {"label": "❌ Incorrect", "text": "The `--macro` flag does not exist. The macro name is a positional argument directly after `run-operation`."}}, "key_rule": "`dbt run-operation <macro_name> --args '{key: value, key2: value2}'`. Args as YAML/JSON dict. Keys match macro parameter names exactly."}, {"id": "q10_Q15", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 15, "high_yield": false, "subdomain_id": "9.15", "subdomain_topic": "Operations vs hooks", "question_text": "A team needs to grant `SELECT` on all tables in the production schema to a `reporter` role. This grant must run once after each **full** deployment job (not per model). They are deciding between a `post-hook` and a `dbt run-operation`. Which approach is more appropriate and why?", "is_multi_select": false, "options": {"A": "An `on-run-end` hook in `dbt_project.yml` — it fires once per dbt command, granting on all schemas after the job completes.", "B": "A `post-hook` on every model — this grants per table as each model builds.", "C": "Either approach works identically — the choice is stylistic.", "D": "A `dbt run-operation` step added to the job's command list — it is explicitly invoked once after the build completes, running an ad-hoc grant across all tables."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "An **`on-run-end` hook** configured in `dbt_project.yml` fires **once per dbt command** — after all models have built. It can run `GRANT SELECT ON ALL TABLES IN SCHEMA {{ target.schema }} TO ROLE reporter` in a single statement. The docs show `on-run-end` hooks granting at the end of a run (for example looping over `schemas`). It runs automatically with every command, with no extra job step. A `run-operation` step also works but is invoked manually."}, "B": {"label": "❌ Incorrect", "text": "Per-model post-hooks grant per table as each model builds — this works but means hundreds of individual GRANT statements rather than one bulk grant."}, "C": {"label": "❌ Incorrect", "text": "The approaches differ in automation (hooks are automatic) vs explicitness (operations are manual command steps)."}, "D": {"label": "❌ Incorrect", "text": "Works, but it's a manual step you must add to each job. Operations fit one-off tasks."}}, "key_rule": "Use `on-run-end` for automated run-level tasks (once per job). Use `run-operation` for ad-hoc or one-time commands."}, {"id": "q10_Q16", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 16, "high_yield": false, "subdomain_id": "9.16", "subdomain_topic": "on-run-start/end fire frequency", "question_text": "A team configures an `on-run-start` hook to log the run start time to an audit table. They run `dbt build` which executes 50 models. How many times does the `on-run-start` hook fire?", "is_multi_select": false, "options": {"A": "50 times — once per model", "B": "2 times — once at the start of `dbt run` and once at the start of `dbt test` (since `dbt build` internally executes both)", "C": "0 times — `on-run-start` only fires for `dbt run`, not `dbt build`", "D": "1 time — once per dbt command invocation"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-start` fires once per command invocation — not per model. Per-model execution is for `pre-hook`/`post-hook`."}, "B": {"label": "❌ Incorrect", "text": "`dbt build` is a single command invocation — it does not fire separate `on-run-start` hooks for its internal run and test phases."}, "C": {"label": "❌ Incorrect", "text": "`on-run-start` fires for `dbt build`, `dbt run`, and all other resource-executing dbt commands."}, "D": {"label": "✅ Correct", "text": "`on-run-start` fires **once per dbt command invocation** — regardless of how many models are in the run. For `dbt build` with 50 models, it fires exactly **once**. The same applies to `on-run-end`. These are project-level hooks, not resource-level. Also note: `on-run-start`/`on-run-end` fire for **every dbt command** that executes project resources — `dbt run`, `dbt build`, `dbt test`, `dbt seed`, `dbt snapshot`, `dbt compile`, `dbt docs generate`."}}, "key_rule": "`on-run-start`/`on-run-end` = once per dbt command, not per model. Fires for all resource-executing commands (run, build, test, seed, snapshot, compile)."}, {"id": "q10_Q17", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 17, "high_yield": false, "subdomain_id": "9.17", "subdomain_topic": "Grants: config vs hooks", "question_text": "A data platform team wants every model in the project granted `SELECT` to a `reporter` role after it builds. What do the docs recommend?", "is_multi_select": false, "options": {"A": "A `post-hook` in every model's `config()` block.", "B": "`on-run-end` with `schemas` to grant on each schema.", "C": "The `grants` resource config in `dbt_project.yml`, e.g. `+grants: {select: ['reporter']}`.", "D": "A `dbt run-operation` step in every job."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Needs a change in every model, and the docs prefer the `grants` config."}, "B": {"label": "❌ Incorrect", "text": "A valid hook pattern, but it's not what the docs recommend when the `grants` config can do the job."}, "C": {"label": "✅ Correct", "text": "The docs say to define grants as resource configs whenever possible. dbt makes the grants match exactly, revoking grantees you didn't list."}, "D": {"label": "❌ Incorrect", "text": "Manual step in every job."}}, "key_rule": "Grants → `grants` config first. Post-hooks only for what it can't do (masking or row access policies, future grants, objects other than tables and views, Databricks `READ_METADATA`/`USAGE`)."}, {"id": "q10_Q18", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 18, "high_yield": false, "subdomain_id": "9.18", "subdomain_topic": "Calling macros from hooks", "question_text": "A team has a macro `my_grant(relation, role)` that generates a GRANT statement. They want to call it from a `post-hook` on a model. What is the correct hook syntax?", "is_multi_select": false, "options": {"A": "`post_hook: \"{{ my_grant({{ this }}, 'reporter') }}\"`", "B": "`post_hook: \"my_grant(this, 'reporter')\"`", "C": "`post_hook: my_grant(this, 'reporter')`", "D": "`post_hook: \"{{ my_grant(this, 'reporter') }}\"`"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`{{ {{ this }} }}` is invalid nested Jinja — it causes a compilation error. `this` inside a Jinja expression does not need extra `{{ }}`."}, "B": {"label": "❌ Incorrect", "text": "Without Jinja delimiters (`{{ }}`), the string is passed literally without macro evaluation."}, "C": {"label": "❌ Incorrect", "text": "Without Jinja delimiters, this is a literal string, not a macro call."}, "D": {"label": "✅ Correct", "text": "Hooks are strings evaluated as Jinja templates. To call a macro, wrap the entire call in Jinja: `\"{{ my_grant(this, 'reporter') }}\"`. The outer `{{ }}` tells dbt to evaluate the Jinja expression. Inside, `this` is the relation context variable (no extra curly braces needed). dbt evaluates the hook string as Jinja at runtime, calls `my_grant(this, 'reporter')`, and executes the returned SQL."}}, "key_rule": "Macro call in hook = `\"{{ macro_name(this, 'arg') }}\"`. `this` inside `{{ }}` needs no additional delimiters."}, {"id": "q10_Q19", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 19, "high_yield": false, "subdomain_id": "9.19", "subdomain_topic": "Hook accumulation", "question_text": "A project uses a dbt package that defines a `post-hook` on all models. The `dbt_project.yml` also defines a `post-hook`. A model's `config()` block additionally defines a `post-hook`. A developer expects the model-level `config()` hook to override and replace the others. What actually happens?", "is_multi_select": false, "options": {"A": "The model-level `config()` hook overrides all others — only the model's config() hook runs.", "B": "The package hook is disabled when `dbt_project.yml` defines any hook, regardless of model config.", "C": "All three post-hooks run — hooks from all scopes **accumulate**, and no scope overrides another.", "D": "The `dbt_project.yml` hook overrides the package hook, and the config() hook overrides both — only one hook runs."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model-level hooks do not override higher-scope hooks — they add to them."}, "B": {"label": "❌ Incorrect", "text": "Package hooks are not disabled by project-level hook definitions."}, "C": {"label": "✅ Correct", "text": "Hooks in dbt **accumulate across all scopes** — they do not override each other. All three hooks run: the package hook, the `dbt_project.yml` hook, and the model's `config()` hook. They execute in order: package → project.yml → config() block. If you have 3 hooks at project level and 2 at model level, all 5 execute. This is an important distinction from how configs work in dbt (where more specific configs override less specific ones). Hooks are additive, not override-based."}, "D": {"label": "❌ Incorrect", "text": "No hook scope overrides another. They all accumulate."}}, "key_rule": "Hooks **accumulate** — they never override. All hooks from all scopes run. Configs override; hooks add."}, {"id": "q10_Q20", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 20, "high_yield": false, "subdomain_id": "9.20", "subdomain_topic": "on-run-end results object", "question_text": "An `on-run-end` hook sends a summary notification. A developer needs to count how many models succeeded and how many errored. They use `{{ results }}` in the hook. What is the structure of each object in `results`, and how do they filter for errors?", "is_multi_select": false, "options": {"A": "`results` is a dictionary keyed by model name — access error status with `results['model_name']['status']`.", "B": "Each result object has `res.node.unique_id`, `res.status` (values: `success`, `error`, `skipped`), and `res.message`. Filter errors with `{% if res.status == 'error' %}`.", "C": "Each result has `res.model` (name) and `res.passed` (boolean) — filter with `{% if not res.passed %}`.", "D": "Each result is a string like `\"model_name: success\"` — filter with `if 'error' in res`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`results` is a list, not a dictionary. Access is by iteration, not by key."}, "B": {"label": "✅ Correct", "text": "Each object in `{{ results }}` has: **`res.node.unique_id`** (e.g., `model.project.model_name`), **`res.status`** (the docs example shows `success` and `error`), and **`res.message`** (error or completion message). To count errors: `{% set error_count = results | selectattr(\"status\", \"equalto\", \"error\") | list | length %}`. The results list includes all resources that ran, even partial failures — making it ideal for run-level reporting in `on-run-end`."}, "C": {"label": "❌ Incorrect", "text": "`res.passed` is not a documented property. The status field uses string values, not a boolean."}, "D": {"label": "❌ Incorrect", "text": "Results are not string values. They are structured objects with named properties."}}, "key_rule": "`results` list — each item has `res.node.unique_id`, `res.status`, `res.message`. Filter: `selectattr(\"status\", \"equalto\", \"error\")`."}, {"id": "q11_Q1", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 1, "high_yield": true, "subdomain_id": "10.1", "subdomain_topic": "`@` graph operator vs `+model+`", "question_text": "A data engineer wants to run `model_x` and all of its descendants, but also wants to ensure that every ancestor of every descendant is included so that the full graph is self-consistent. Which selector achieves this?", "is_multi_select": false, "options": {"A": "`@model_x`", "B": "`+model_x+`", "C": "`model_x*`", "D": "`model_x+`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "`@model_x` is the **full closure operator**. It expands to: `model_x` + all descendants of `model_x` + all ancestors of every one of those descendants. Use it when you need a complete, self-contained subgraph — everything needed to rebuild `model_x` and validate all downstream consumers."}, "B": {"label": "❌ Incorrect", "text": "`+model_x+` = all ancestors of `model_x` **plus** all descendants of `model_x`. It does NOT include ancestors of the descendants — only ancestors of `model_x` itself."}, "C": {"label": "❌ Incorrect", "text": "`model_x*` is not valid dbt selector syntax."}, "D": {"label": "❌ Incorrect", "text": "`model_x+` = `model_x` and all its descendants, but none of their ancestors."}}, "key_rule": "`@model` = model + descendants + **all ancestors of descendants**. `+model+` = model's own ancestors + model + model's own descendants. The `@` operator is uniquely needed for full-closure subgraph runs."}, {"id": "q11_Q2", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 2, "high_yield": true, "subdomain_id": "10.2", "subdomain_topic": "Set operator: union vs intersection", "question_text": "A CI job needs to run only models that are both modified AND tagged `nightly`. Which dbt selector syntax correctly expresses this intersection?", "is_multi_select": false, "options": {"A": "`state:modified tag:nightly`", "B": "`state:modified,tag:nightly`", "C": "`state:modified & tag:nightly`", "D": "`state:modified+tag:nightly`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A **space** between selectors = **union**. This runs models that are modified OR tagged `nightly` (whichever set is larger)."}, "B": {"label": "✅ Correct", "text": "A **comma** between selectors = **intersection**. `state:modified,tag:nightly` selects only the nodes that satisfy BOTH conditions simultaneously. This is the correct syntax for \"modified AND tagged\"."}, "C": {"label": "❌ Incorrect", "text": "The docs don't mention `&`. Intersection is a comma."}, "D": {"label": "❌ Incorrect", "text": "The `+` attached to a selector adds graph depth (parents/children), not set intersection. This is invalid for combining two different selectors."}}, "key_rule": "**Space = union** (either/or). **Comma = intersection** (both/and). This is one of the most commonly confused distinctions in dbt node selection."}, {"id": "q11_Q3", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 3, "high_yield": true, "subdomain_id": "10.3", "subdomain_topic": "`state:modified` and `var()` / `env_var()`", "question_text": "A team uses CI slim builds with `dbt run --select state:modified+ --state ./prod-manifest`. They find that changing the value of a variable used in a model with `{{ var('some_var') }}` doesn't flag the model as modified. Why?", "is_multi_select": false, "options": {"A": "The `--state` flag must be combined with `--vars` for variable changes to be tracked.", "B": "`state:modified` compares compiled SQL, so any variable change would be detected.", "C": "dbt can't trace a `var()` or `env_var()` value change into `state:modified`. The model is likely flagged only if the change alters its configuration.", "D": "Variable changes are detected only with `state:modified.configs`, not `state:modified`."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Passing `--vars` with `--state` doesn't change this."}, "B": {"label": "❌ Incorrect", "text": "The docs say dbt can't identify that lineage, so the model isn't included just because the value changed."}, "C": {"label": "✅ Correct", "text": "The state comparison caveats page says dbt is unable to include the model in `state:modified` because a `var` or `env_var` value changed. It's likely marked modified only if the change results in a different configuration."}, "D": {"label": "❌ Incorrect", "text": "Not documented."}}, "key_rule": "`var()` / `env_var()` value changes aren't traced by `state:modified`. Don't rely on it alone to find affected models."}, {"id": "q11_Q4", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 4, "high_yield": true, "subdomain_id": "10.4", "subdomain_topic": "Manifest overwrite problem", "question_text": "A CI pipeline runs `dbt run --select state:modified+ --state ./target --target-path ./target`. The team notices the slim CI always builds every model, not just modified ones. What is the root cause?", "is_multi_select": false, "options": {"A": "When `--state` and `--target-path` point to the same directory, dbt overwrites `manifest.json` during the parse phase before it can be used for comparison.", "B": "The `state:modified` selector requires a separate `--profiles-dir` to work correctly.", "C": "`--state` and `--target-path` cannot be used together; they are mutually exclusive flags.", "D": "`--target-path` must point to an absolute path, not a relative path, for state comparison to work."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say dbt overwrites `manifest.json` during parsing, and warn that setting `--state` and `--target-path` to the same path with `--defer` or `state:modified` can lead to non-idempotent behavior. Fixes: move the manifest to its own folder (for example `state/`), write to a different `--target-path`, or pass `--no-write-json`."}, "B": {"label": "❌ Incorrect", "text": "`--profiles-dir` is unrelated to state comparison."}, "C": {"label": "❌ Incorrect", "text": "These flags are not mutually exclusive — but pointing them at the same directory is the bug."}, "D": {"label": "❌ Incorrect", "text": "Relative vs absolute path is not the issue here."}}, "key_rule": "**Don't point `--state` and `--target-path` at the same directory.** dbt overwrites `manifest.json` while parsing, which can lead to non-idempotent behavior. Use a separate path like `--state ./prod-manifest`."}, {"id": "q11_Q5", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 5, "high_yield": true, "subdomain_id": "10.5", "subdomain_topic": "`--defer-state` for split comparison and deferral", "question_text": "A team wants their CI slim build to compare modified nodes against the **production** manifest, but defer missing relations to the **staging** environment (which has fresher data). Which flag combination achieves this?", "is_multi_select": false, "options": {"A": "This is not possible in dbt; `--state` and deferral must use the same manifest.", "B": "Use `--state ./prod-manifest --defer` — dbt automatically defers to the staging environment when relations are missing.", "C": "Use `--defer-state ./staging-manifest` alone — this flag handles both comparison and deferral.", "D": "Use `--state ./prod-manifest --defer --defer-state ./staging-manifest` — `--state` drives comparison; `--defer-state` drives deferral resolution."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is exactly the use case `--defer-state` was designed for."}, "B": {"label": "❌ Incorrect", "text": "`--defer` alone defers to whatever manifest `--state` points to — there is no automatic environment detection."}, "C": {"label": "❌ Incorrect", "text": "`--defer-state` only controls deferral resolution, not state comparison. `--state` is still required for `state:modified`."}, "D": {"label": "✅ Correct", "text": "`--defer-state` is a separate flag that lets you specify a **different manifest** for deferral resolution than the one used for `state:modified` comparison. `--state` answers \"what changed?\" and `--defer-state` answers \"where do I find existing relations to defer to?\" This is ideal when production is the authoritative baseline but staging has more recent data."}}, "key_rule": "`--state` = comparison baseline for `state:modified`. `--defer-state` = separate manifest for deferral resolution. They can point to different manifests."}, {"id": "q11_Q6", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 6, "high_yield": true, "subdomain_id": "10.6", "subdomain_topic": "`--indirect-selection` modes", "question_text": "You run `dbt test --select model_a`. A `relationships` test references both `model_a` and `model_b`. Which mode restricts tests to those that **exclusively** reference selected nodes, so this test is left out?", "is_multi_select": false, "options": {"A": "`eager` (default)", "B": "`cautious`", "C": "`buildable`", "D": "`empty`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`eager` is the most inclusive. It runs tests if any parent is selected, even if they also reference unselected nodes."}, "B": {"label": "✅ Correct", "text": "`cautious` is the most exclusive mode. It restricts tests to those that exclusively reference selected nodes."}, "C": {"label": "❌ Incorrect", "text": "`buildable` is a middle ground: tests whose references are each within the selected nodes or their ancestors."}, "D": {"label": "❌ Incorrect", "text": "`empty` runs no tests at all, even ones attached directly to the selected node."}}, "key_rule": "`eager` = any parent selected. `buildable` = selected nodes or their ancestors. `cautious` = only selected nodes. `empty` = no tests."}, {"id": "q11_Q7", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 7, "high_yield": true, "subdomain_id": "10.7", "subdomain_topic": "`dbt build` unit test execution order", "question_text": "A data engineer adds a unit test to `model_x`. When `dbt build` runs, in what order does the unit test execute relative to the model materialization?", "is_multi_select": false, "options": {"A": "Unit tests run before model materialization; data tests run after materialization.", "B": "Unit tests and data tests both run after model materialization.", "C": "Unit tests run after model materialization, then data tests run last.", "D": "Unit tests run at the start of the entire `dbt build` job before any models are materialized."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "`dbt build` execution order per node: **unit tests → model materialization → data tests**. The docs say the model only materializes if its unit tests pass, which saves warehouse spend. Data tests run on the model after it's materialized."}, "B": {"label": "❌ Incorrect", "text": "Unit tests specifically run before materialization — that is their defining characteristic."}, "C": {"label": "❌ Incorrect", "text": "Unit tests do NOT run after materialization. Their entire purpose is to validate model logic before the model is written to the warehouse."}, "D": {"label": "❌ Incorrect", "text": "Unit tests respect the DAG order; they run for each node in dependency order, not all at once before the DAG starts."}}, "key_rule": "`dbt build` per-node sequence: **unit test → materialize → data test**. Unit test failure = model never runs. Data test failure = downstream nodes are skipped (not errored)."}, {"id": "q11_Q8", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 8, "high_yield": true, "subdomain_id": "10.8", "subdomain_topic": "`dbt build` upstream test failure behavior", "question_text": "A `dbt build` run executes `model_a` successfully, then `model_a`'s data tests fail. `model_b` depends on `model_a`. What is the outcome for `model_b`?", "is_multi_select": false, "options": {"A": "`model_b` runs anyway — test failures in upstream models do not block downstream builds.", "B": "`model_b` is skipped — test failures in upstream models cause downstream nodes to skip, not error.", "C": "`model_b` errors — the test failure propagates as an error to all downstream nodes.", "D": "`model_b` runs but its own tests are skipped as a precaution."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt build` is specifically designed to halt downstream work when upstream tests fail."}, "B": {"label": "✅ Correct", "text": "When an upstream data test fails in `dbt build`, all downstream nodes are **skipped** (status = `skipped`). This is intentional: if the upstream data cannot be trusted, there is no point materializing dependent models. The job completes with a non-zero exit code due to the test failure, and `dbt retry` can re-run from the failure point."}, "C": {"label": "❌ Incorrect", "text": "Downstream nodes receive `skipped` status, not `error`. The error is on the upstream test itself."}, "D": {"label": "❌ Incorrect", "text": "dbt does not selectively skip tests on downstream nodes — the entire downstream node is skipped."}}, "key_rule": "In `dbt build`, upstream test failure = downstream nodes **skip** (not error). Exit code is non-zero. Use `dbt retry` to resume from the failed test."}, {"id": "q11_Q9", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 9, "high_yield": true, "subdomain_id": "10.9", "subdomain_topic": "`dbt retry` and infrastructure failures", "question_text": "A dbt Cloud job fails due to a warehouse connectivity error before any nodes begin executing. The run results file shows zero nodes attempted. A developer runs `dbt retry`. What happens?", "is_multi_select": false, "options": {"A": "`dbt retry` re-runs all models in the project since no successful runs exist.", "B": "`dbt retry` raises an error and requires `--full-refresh` to proceed.", "C": "`dbt retry` falls back to running the full model selection defined in the job.", "D": "`dbt retry` is a no-op — if no nodes executed before the failure, there are no failed nodes to retry."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt retry` reads `run_results.json` to find failed/errored nodes — it does not infer a full run when results are empty."}, "B": {"label": "❌ Incorrect", "text": "`dbt retry` does not raise errors or require `--full-refresh` in this scenario."}, "C": {"label": "❌ Incorrect", "text": "`dbt retry` does not fall back to the job's original model selection. It is strictly `run_results.json`-driven."}, "D": {"label": "✅ Correct", "text": "`dbt retry` reads the `run_results.json` from the previous run and retries only nodes that `errored` or `failed`. If the failure was an infrastructure error before any nodes started (empty results), there is nothing to retry — `dbt retry` is effectively a **no-op**. The developer must re-run the job manually or fix the infrastructure issue first."}}, "key_rule": "`dbt retry` = replay only `errored`/`failed` nodes from `run_results.json`. Infrastructure failure with zero executed nodes = **no-op retry**. Must re-run the job from scratch."}, {"id": "q11_Q10", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 10, "high_yield": true, "subdomain_id": "10.10", "subdomain_topic": "`dbt clone` zero-copy behavior by platform", "question_text": "A team runs `dbt clone` to create a developer-scoped copy of production models for a hotfix branch. Their warehouse is Postgres. What does `dbt clone` create for each cloned model?", "is_multi_select": false, "options": {"A": "A schema-only empty table with no data.", "B": "A full materialized copy of each table, duplicating all data.", "C": "A view pointing to the production relation, acting as a lightweight proxy.", "D": "A zero-copy clone using Postgres's native table clone syntax."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt clone` creates a usable relation (view or clone), not an empty schema."}, "B": {"label": "❌ Incorrect", "text": "`dbt clone` explicitly avoids full data copies — full table copies defeat the purpose of fast developer environment setup."}, "C": {"label": "✅ Correct", "text": "The docs say that without zero-copy table cloning, dbt creates a simple **pointer view** (`select * from` the source object). It's a lightweight proxy, not a copy."}, "D": {"label": "❌ Incorrect", "text": "Postgres does not support zero-copy cloning (metadata pointer swaps). That capability is limited to Snowflake, Databricks, and BigQuery."}}, "key_rule": "`dbt clone` zero-copy support: **Snowflake** (CLONE), **Databricks** (shallow clone), **BigQuery** (table clone). **Postgres/Redshift** = pointer views. All behavior is automatic based on the adapter."}, {"id": "q11_Q11", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 11, "high_yield": false, "subdomain_id": "10.11", "subdomain_topic": "`dbt retry` after a successful run", "question_text": "A developer runs `dbt retry` right after a run where every node succeeded. What happens?", "is_multi_select": false, "options": {"A": "It finishes as \"no operation\". There's nothing to retry.", "B": "It re-runs every node in the project.", "C": "It errors and asks for `--full-refresh`.", "D": "It re-runs the last invocation's selection from the start."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say that if the previous run succeeded, retry finishes as no operation."}, "B": {"label": "❌ Incorrect", "text": "Retry resumes from the point of failure. It doesn't re-run everything."}, "C": {"label": "❌ Incorrect", "text": "No such requirement."}, "D": {"label": "❌ Incorrect", "text": "It only re-executes from the failure point, using `run_results.json`."}}, "key_rule": "`dbt retry` resumes from the failure via `run_results.json`. Previous run succeeded → no operation. Nothing ran before the failure → nothing to retry."}, {"id": "q11_Q12", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 12, "high_yield": true, "subdomain_id": "10.12", "subdomain_topic": "`dbt ls` vs `dbt compile` warehouse connection requirement", "question_text": "A developer in a CI pipeline wants to quickly list all modified models without running anything or touching the warehouse. Which command should they use?", "is_multi_select": false, "options": {"A": "`dbt parse --select state:modified`", "B": "`dbt run --select state:modified --dry-run`", "C": "`dbt compile --select state:modified`", "D": "`dbt ls --select state:modified --state ./prod-manifest`"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt parse` validates the project without a warehouse connection, but it doesn't list selected nodes."}, "B": {"label": "❌ Incorrect", "text": "`dbt run --dry-run` is not a valid dbt flag."}, "C": {"label": "❌ Incorrect", "text": "`dbt compile` needs a data platform connection (it can run introspective queries) and writes compiled SQL."}, "D": {"label": "✅ Correct", "text": "`dbt ls` reads your connection profile but doesn't connect to the database or run queries (dbt v2.0+). It lists the selected nodes. It is the correct tool for lightweight CI checks — listing nodes, validating selectors, or auditing the graph without touching the warehouse."}}, "key_rule": "`dbt ls` = no database connection (dbt v2.0+). `dbt compile` = connection required. Use `dbt ls` for CI checks, selector validation, and graph audits."}, {"id": "q11_Q13", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 13, "high_yield": true, "subdomain_id": "10.13", "subdomain_topic": "`dbt parse` and partial parsing in CI", "question_text": "After a large merge to the main branch that restructures several macros, a CI job's `dbt run` begins picking up stale compiled artifacts from prior runs. What is the most targeted fix?", "is_multi_select": false, "options": {"A": "Set `PARTIAL_PARSE: false` in the `dbt_project.yml`.", "B": "Run `dbt clean` before `dbt run` to clear the compiled artifacts.", "C": "Add `--no-partial-parse` to the `dbt run` command to force a full re-parse.", "D": "Delete the entire `target/` directory before every CI run."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say `PARTIAL_PARSE` is a global config set in `profiles.yml`, an environment variable or a CLI flag, not in `dbt_project.yml`."}, "B": {"label": "❌ Incorrect", "text": "`dbt clean` also removes the partial-parse cache, but it deletes more than needed."}, "C": {"label": "✅ Correct", "text": "`--no-partial-parse` tells dbt to **ignore the cached partial parse file** and re-parse the entire project from scratch. This is the recommended approach after macro restructuring or large merges where partial parse caching may be stale. It can be added to a dbt command: `dbt run --no-partial-parse`. dbt v2 job runs no longer support this flag."}, "D": {"label": "❌ Incorrect", "text": "Deleting the full `target/` directory is overly aggressive — it removes all artifacts including run results and compiled SQL that may be needed for other CI steps."}}, "key_rule": "Use `--no-partial-parse` (or `dbt parse --no-partial-parse` as a separate step) in CI after large merges to ensure a clean parse without stale cache artifacts."}, {"id": "q11_Q14", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 14, "high_yield": true, "subdomain_id": "10.14", "subdomain_topic": "Ephemeral models and deferral", "question_text": "A developer uses `--defer` on a feature branch. One of the referenced models, `int_orders_ephemeral`, is configured as `materialized: ephemeral`. The production manifest includes this model. What happens when the ephemeral model is referenced?", "is_multi_select": false, "options": {"A": "The ephemeral model is skipped and dbt builds a view proxy pointing to production instead.", "B": "Ephemeral models are never deferred — dbt always re-computes their CTE inline from source during the current run.", "C": "The command errors because ephemeral models cannot be used with `--defer`.", "D": "The ephemeral model is deferred to the production version, substituting the production CTE."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No proxy is created for ephemeral models — they are always inline CTEs."}, "B": {"label": "✅ Correct", "text": "Ephemeral models are compiled as **CTEs inlined into the models that reference them**. They have no persistent warehouse object. Therefore, `--defer` has no effect on them — dbt always recomputes the ephemeral CTE from its source SQL, regardless of what exists in the production manifest."}, "C": {"label": "❌ Incorrect", "text": "Using `--defer` with ephemeral models does not cause an error; the flag is simply ignored for ephemeral nodes."}, "D": {"label": "❌ Incorrect", "text": "Ephemeral models do not exist as warehouse objects — there is no production \"version\" to defer to."}}, "key_rule": "Ephemeral models are **never deferred** because they have no warehouse object. `--defer` only applies to models that produce persistent relations (tables, views, incremental models)."}, {"id": "q11_Q15", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 15, "high_yield": true, "subdomain_id": "10.15", "subdomain_topic": "`state:modified` seed tracking limitation", "question_text": "A team tracks state changes on seeds to avoid re-uploading large reference tables every CI run. One of their seeds is 1.5 MB. After changing several rows deep in the CSV, `state:modified` does not flag the seed as changed. Why?", "is_multi_select": false, "options": {"A": "Seeds are never tracked by `state:modified` — you must always use `--full-refresh` for seeds.", "B": "Seeds larger than 1 MB are tracked only by **file path**, not by content hash. Moving or renaming the file would trigger a change, but editing its rows would not.", "C": "`state:modified` compares seeds using row count only; adding rows is detected but modifying existing rows is not.", "D": "The seed tracking threshold is 10 MB; 1.5 MB seeds are tracked normally by content hash."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Seeds under 1 MB are tracked by content hash — only large seeds have this limitation."}, "B": {"label": "✅ Correct", "text": "dbt tracks seed changes using a content hash (checksum of the CSV), but **only for seeds under 1 MB**. Seeds larger than 1 MB are tracked by **file path only**. This means content edits — adding, removing, or changing rows — are invisible to `state:modified` for large seeds. Only renaming or moving the file (path change) would register as a change."}, "C": {"label": "❌ Incorrect", "text": "Row count is not used for seed tracking. The mechanism is content hash (for small seeds) or path (for large seeds)."}, "D": {"label": "❌ Incorrect", "text": "The threshold is 1 MB, not 10 MB."}}, "key_rule": "Seeds **> 1 MB** are tracked by **path only** in state comparison. Content edits are invisible. For large seeds, consider splitting the file or forcing a re-upload with an explicit seed selector."}, {"id": "q11_Q16", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 16, "high_yield": true, "subdomain_id": "10.16", "subdomain_topic": "Source freshness configuration", "question_text": "A team wants freshness checks on a BigQuery source. What does dbt need to check it?", "is_multi_select": false, "options": {"A": "`loaded_at_field`, always. Without it dbt can't compute freshness.", "B": "A `unique_key` on the source.", "C": "A `freshness` config with `warn_after` and/or `error_after`. `loaded_at_field` is optional.", "D": "`freshness: enabled: true` in the project config."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`loaded_at_field` is optional. Without it, dbt uses warehouse metadata tables when possible."}, "B": {"label": "❌ Incorrect", "text": "`unique_key` is for incremental models."}, "C": {"label": "✅ Correct", "text": "If neither `warn_after` nor `error_after` is set, dbt doesn't check that resource. Each needs a `count` and a `period`. With `loaded_at_field` dbt runs a select. `loaded_at_query` (v1.10+) is an alternative, and setting both is a parse error."}, "D": {"label": "❌ Incorrect", "text": "There's no such setting. `freshness: null` turns checks off for a table."}}, "key_rule": "Freshness = a `freshness` config with `warn_after` / `error_after`. `loaded_at_field` is optional (warehouse metadata is used otherwise). Stale = nonzero exit code."}, {"id": "q11_Q17", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 17, "high_yield": true, "subdomain_id": "10.17", "subdomain_topic": "`source_status:fresher+` selector", "question_text": "A CI job should rebuild only the models downstream of sources that have received new data since the last freshness check. Which selector achieves this?", "is_multi_select": false, "options": {"A": "`state:modified+ --select source:*`", "B": "`source:* --select +state:modified`", "C": "`result:fresher+`", "D": "`source_status:fresher+`"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This syntax mixes selection methods incorrectly and does not leverage source freshness results."}, "B": {"label": "❌ Incorrect", "text": "This is not valid selector syntax and conflates source selection with state comparison."}, "C": {"label": "❌ Incorrect", "text": "`result:fresher` is not a valid selector. The correct method uses `source_status:fresher`, not `result:`."}, "D": {"label": "✅ Correct", "text": "`source_status:fresher` selects sources that are **fresher than the last recorded state** (i.e., new data has arrived). The `+` suffix adds all downstream descendants. This selector requires a `--state` manifest from a prior `dbt source freshness` run (which produces `sources.json`). It enables data-arrival-driven pipelines: only rebuild when sources actually have new data."}}, "key_rule": "`source_status:fresher+` = sources with new data since last check + all downstream models. Requires `--state` pointing to a manifest from a prior `dbt source freshness` run."}, {"id": "q11_Q18", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 18, "high_yield": true, "subdomain_id": "10.18", "subdomain_topic": "`result:error` vs `result:fail` selectors", "question_text": "After a failed `dbt build`, a developer wants to retry only the nodes that **errored** (e.g., models that failed to compile or run) while explicitly excluding tests that failed due to data quality issues. Which selector is correct?", "is_multi_select": false, "options": {"A": "`result:error`", "B": "`state:modified.body`", "C": "`result:error result:fail`", "D": "`result:fail`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say `result:error` selects any resource that returned an error (models, tests, snapshots and so on)."}, "B": {"label": "❌ Incorrect", "text": "`state:modified.body` is a state comparison selector for detecting SQL body changes, not for retrying failed nodes."}, "C": {"label": "❌ Incorrect", "text": "The space between these selectors = union (either errored OR failed). This would re-run both failing models and failing tests — not the desired behavior if you want to exclude data quality test failures."}, "D": {"label": "❌ Incorrect", "text": "`result:fail` selects nodes with status `fail` — this is the status assigned to **tests** that fail (data quality assertion failures). It does not select errored models."}}, "key_rule": "`result:error` = any resource that errored. `result:fail` = test nodes only. To re-run the models behind failed tests: `1+result:fail+`."}, {"id": "q11_Q19", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 19, "high_yield": true, "subdomain_id": "10.19", "subdomain_topic": "`dbt compile --inline` for ad-hoc SQL", "question_text": "A developer wants to compile a Jinja SQL snippet that uses `{{ ref('orders') }}` without creating a model file. Which command accomplishes this?", "is_multi_select": false, "options": {"A": "`dbt compile --inline \"SELECT * FROM {{ ref('orders') }}\"`", "B": "`dbt run --inline \"SELECT * FROM {{ ref('orders') }}\"`", "C": "`dbt compile --ad-hoc \"SELECT * FROM {{ ref('orders') }}\"`", "D": "`dbt parse --inline \"SELECT * FROM {{ ref('orders') }}\"`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "`dbt compile --inline \"<sql>\"` compiles an ad-hoc Jinja SQL string without requiring a model file. It resolves `{{ ref() }}`, `{{ source() }}`, macros, and variables against the current project and target, then prints the compiled SQL. Useful for debugging Jinja expressions or quickly checking what a snippet compiles to. Note: requires a **warehouse connection** (like all `dbt compile` invocations)."}, "B": {"label": "❌ Incorrect", "text": "`dbt run` does not support `--inline`. It executes model files, not inline SQL."}, "C": {"label": "❌ Incorrect", "text": "`--ad-hoc` is not a valid dbt flag."}, "D": {"label": "❌ Incorrect", "text": "`dbt parse` does not support `--inline`. It parses project files, not inline SQL."}}, "key_rule": "`dbt compile --inline \"<jinja-sql>\"` = ad-hoc compilation of a SQL snippet. No model file needed, but warehouse connection required. Great for Jinja debugging."}, {"id": "q11_Q20", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 20, "high_yield": true, "subdomain_id": "10.20", "subdomain_topic": "`--favor-state` flag behavior", "question_text": "A developer runs `dbt run --select orders+ --defer --state ./prod-manifest`. For nodes that exist in both the dev target (partially built from yesterday) and the production manifest, which relation does dbt use by default? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "By default (no `--favor-state`), dbt prefers the **production manifest** relation always.", "B": "By default (no `--favor-state`), dbt prefers the **dev target** relation if it exists there.", "C": "Adding `--favor-state` causes dbt to prefer the **state manifest** (production) relation over the dev target.", "D": "Adding `--favor-state` causes dbt to prefer the **dev target** relation over the state manifest."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Without `--favor-state`, production is the fallback, not the preference. Dev target takes priority when a relation exists there."}, "B": {"label": "✅ Correct", "text": "The **default `--defer` behavior** prefers the developer's own target schema. If a relation exists in the dev target (even if outdated), dbt uses it — deferring to production only for relations that do NOT exist in dev at all."}, "C": {"label": "✅ Correct", "text": "`--favor-state` **flips the priority**: dbt now prefers the state manifest (production) relation over whatever is in the dev target. This ensures developers always work against production-fresh data even when stale dev relations exist."}, "D": {"label": "❌ Incorrect", "text": "This describes the default behavior (no `--favor-state`), not what `--favor-state` adds."}}, "key_rule": "Default `--defer` = dev target first → prod state as fallback. `--favor-state` = prod state first → dev target as fallback. Use `--favor-state` in CI or when dev relations may be stale."}, {"id": "q11_Q21", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 21, "high_yield": true, "subdomain_id": "10.21", "subdomain_topic": "`source:` vs `source_status:` selector methods", "question_text": "A platform team wants to build only the models downstream of sources whose raw data has actually arrived since the last run. They author a job with the step:\n\n```bash\ndbt build --select source:fresher+\n```\n\nThe job runs successfully but builds **zero models**, even though new data has clearly landed in some sources. What is the issue, and what is the correct command? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The job will work as written if the team upgrades to the Fusion engine, which auto-resolves `source:fresher+` as a freshness-state selector.", "B": "The correct selector method for \"sources with new data since the last freshness check\" is `source_status:fresher+`, which compares the current `sources.json` against a prior one provided via `--state`.", "C": "`source_status:` accepts multiple values such as `fresher`, `stale`, and `error` — the team should use `source_status:fresher,stale+` to capture all changes.", "D": "`source:fresher+` is interpreted as a **name lookup** for a source literally named `fresher`. Unless one exists, the selector matches nothing and the run is a silent no-op.", "E": "`source:fresher+` is the correct selector but requires the `--full-refresh` flag to register new freshness state."}, "correct_answers": ["B", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Fusion engine does not change selector method semantics. `source:` remains a name lookup regardless of engine."}, "B": {"label": "✅ Correct", "text": "The correct selector is **`source_status:fresher+`** — a state-aware selector that compares the current `sources.json` (from a fresh `dbt source freshness` run) against a prior one supplied via `--state path/to/previous/`. Sources whose `max_loaded_at` is newer in the current run are tagged `fresher` and selected, along with their downstream models. The full correct command is: `dbt build --select source_status:fresher+ --state path/to/previous/`. Without `--state`, this also resolves to zero nodes."}, "C": {"label": "❌ Incorrect", "text": "The docs document only the value `fresher` for `source_status:`."}, "D": {"label": "✅ Correct", "text": "`source:` is the **name-based** selector method — it expects a source's declared name (e.g., `source:snowplow+`). `source:fresher+` is interpreted as \"find a source literally **named** `fresher` plus its descendants.\" Since virtually no project defines a source by that name, the selector resolves to **zero nodes** and the run silently does nothing. This is one of the most common dbt selector traps."}, "E": {"label": "❌ Incorrect", "text": "`--full-refresh` controls incremental rebuild behavior — it has no relationship to freshness state detection. The underlying selector method is still wrong."}}, "key_rule": "`source:<name>+` = **name lookup** (no `--state` needed). `source_status:fresher+` = **state-aware freshness selector** (requires `--state` with prior `sources.json`; only `fresher` is documented). Mistyping `source_status` as `source` is a silent no-op, not an error."}, {"id": "q12_Q1", "file_id": "q12", "topic_num": "11", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 1, "high_yield": true, "subdomain_id": "11.1", "subdomain_topic": "`access: public` does not grant database permissions", "question_text": "In an Enterprise dbt Mesh, a consumer project's production job references a producer's `dim_customers` model via `{{ ref('jaffle_finance', 'dim_customers') }}`. The model is marked `access: public`, `dependencies.yml` is correct, and the job parses and compiles without error. At runtime, Snowflake returns `SQL access control error: Insufficient privileges to operate on table 'DIM_CUSTOMERS'`. What is the root cause?", "is_multi_select": false, "options": {"A": "Cross-project refs to public models require the consumer's service account to be added to the producer project's \"Cross-project Readers\" group in dbt Cloud.", "B": "`access: public` is a DAG-level governance control only — it does not grant warehouse SELECT privileges; grants must be configured separately via `grants`, post-hooks, or role-based access in the warehouse.", "C": "`access: public` requires the producer to add the consumer project to an `allowed_consumers` list in the model's YAML — without it, the warehouse layer blocks access.", "D": "The producer project is missing a Staging environment, so the consumer's Production job fell back to Production credentials that lack cross-project grants."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No such \"Cross-project Readers\" group exists in dbt Cloud. The concept conflates RBAC permissions with governance access, which are orthogonal."}, "B": {"label": "✅ Correct", "text": "`access` levels (`private`/`protected`/`public`) are purely **DAG-level governance** — they control whether `ref()` is permitted across groups/projects at parse/compile time. They do **not** touch warehouse permissions. The consumer's warehouse role still needs `USAGE` on the schema and `SELECT` on the table, configured via `grants:` in the producer's YAML, a post-hook, or direct role management."}, "C": {"label": "❌ Incorrect", "text": "No `allowed_consumers` config exists in dbt. `access: public` is unconditionally visible across projects — there is no per-consumer allowlist at the model level."}, "D": {"label": "❌ Incorrect", "text": "Staging environment fallback affects cross-project **ref resolution**, not warehouse permissions. The scenario states the job compiled successfully — resolution worked. The failure is at query execution, which is a warehouse grants issue."}}, "key_rule": "`access: public` = who can `ref()` you in code. Warehouse `GRANT SELECT` = who can query the underlying table. These are two independent layers — always configure both for cross-project Mesh consumers."}, {"id": "q12_Q2", "file_id": "q12", "topic_num": "11", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 2, "high_yield": true, "subdomain_id": "11.2", "subdomain_topic": "Package `restrict-access` default", "question_text": "A platform team publishes a dbt package containing both `protected` and `private` models intended for internal use only, plus a few `public` models. A downstream team installs the package via `packages.yml` and discovers they can successfully `ref()` the **protected** models from the installed package. The platform team expected only the `public` models to be accessible. What is the cause, and what is the fix?", "is_multi_select": false, "options": {"A": "The package manifest is stale — running `dbt deps --upgrade` in the consumer project will re-validate access levels and block the protected refs.", "B": "Packages do not participate in the governance access system. Protected/private only work within dbt Mesh `project_dependencies`, not via `packages.yml`.", "C": "This is expected behavior — `protected` access allows refs from any installed package by design. To prevent it, change the protected models to `private`.", "D": "By default, installed packages expose all non-private models to the consuming project. The platform team must set `restrict-access: True` in the package's `dbt_project.yml` to force consumers to only reference `public` models."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt deps --upgrade` refreshes package versions; it does not change access enforcement semantics."}, "B": {"label": "❌ Incorrect", "text": "Packages do participate in the access system — `protected` specifically permits refs from installed packages. The interaction is documented, not absent."}, "C": {"label": "❌ Incorrect", "text": "`protected` (the default) means \"same project or installed package\" — it deliberately permits refs from installed packages. Changing everything to `private` would break internal refs within the package itself across groups."}, "D": {"label": "✅ Correct", "text": "The default `protected` behavior intentionally treats an installed package as an extension of the consumer project. To enforce strict public-only sharing, the producing package must set **`restrict-access: True`** in its `dbt_project.yml`. This changes the effective boundary so consumers can only ref models explicitly marked `public`."}}, "key_rule": "`protected` + installed package = consumer can ref. To block that, producer sets `restrict-access: True` in its `dbt_project.yml`. This is distinct from Mesh `project_dependencies`, which already enforces public-only by default."}, {"id": "q12_Q3", "file_id": "q12", "topic_num": "11", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 3, "high_yield": true, "subdomain_id": "11.3", "subdomain_topic": "Migration path for breaking change on contracted public model", "question_text": "A public, contract-enforced model `dim_customers` (current `latest_version: 1`) must drop the `country_name` column. Three downstream Mesh consumer projects pin `v=1` in their refs. The architect needs a zero-downtime migration path. Which sequence is correct?", "is_multi_select": false, "options": {"A": "Update `dim_customers.sql` to drop the column, update the YAML `columns:` list to remove `country_name`, and deploy. The contract will allow it because SQL and YAML remain consistent.", "B": "Mark the model `access: protected` temporarily, drop the column, then flip back to `access: public` after all consumers redeploy.", "C": "Add a `v=2` with the column removed, bump `latest_version: 2`, set a `deprecation_date` on `v=1`, notify consumers to migrate their pinned refs, then remove `v=1` after the deprecation date. Never modify `v=1` in place.", "D": "Set `on_schema_change: sync_all_columns` on the model and deploy. The contract handles column removal automatically when this config is present."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Contracts do not just check SQL/YAML consistency — they treat column removal as a **breaking change** regardless of whether both sides are updated. The preflight check compares the new contract to the previous one and fails the build. For a **versioned** contracted model, removing it outright raises a hard error (vs a warning for unversioned)."}, "B": {"label": "❌ Incorrect", "text": "Flipping `access` does not suspend contract enforcement. The contract breaking change is detected at build time regardless of access level. Toggling access also doesn't give consumers any migration window — their pinned refs would still break."}, "C": {"label": "✅ Correct", "text": "This is the documented migration pattern: create `dim_customers_v2.sql` without the column, set `latest_version: 2`, add `deprecation_date` on `v=1` so dbt notifies consumers, let consumers migrate at their own pace, and only remove `v=1` once the deprecation date passes. This preserves downstream stability through the migration window."}, "D": {"label": "❌ Incorrect", "text": "`on_schema_change: sync_all_columns` is **not compatible** with contracts at all. Incremental + contract supports only `append_new_columns` or `fail`. This option would itself raise a configuration error."}}, "key_rule": "Breaking change on a contracted public model = **new version + `deprecation_date` + consumer migration + delete old version**. Never modify a contracted public model in place — the contract is designed to block exactly that."}, {"id": "q12_Q4", "file_id": "q12", "topic_num": "11", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 4, "high_yield": true, "subdomain_id": "11.4", "subdomain_topic": "`latest_version` implicit resolution and prerelease semantics", "question_text": "An architect declares two versions of `dim_customers` in YAML: `v=1` and `v=2`. They omit the `latest_version:` key. A separate model contains an unpinned `{{ ref('dim_customers') }}`. Later, the architect adds `latest_version: 1` explicitly to the YAML (while `v=2` still exists). What is the behavior in each state, and what is `v=2` considered in the second state?", "is_multi_select": false, "options": {"A": "State 1: parse error — `latest_version` is required when multiple versions exist. State 2: unpinned ref resolves to `v=1`; `v=2` is considered a **prerelease**.", "B": "State 1: unpinned ref resolves to `v=2` (highest version number by default). State 2: unpinned ref resolves to `v=1`; `v=2` is considered a **prerelease** and dbt emits a warning that unpinned refs will eventually resolve to it.", "C": "State 1: unpinned refs fail to compile without an explicit `latest_version`. State 2: `v=2` is silently ignored until `latest_version` is bumped.", "D": "State 1: unpinned ref resolves to `v=1` (alphabetical first). State 2: unpinned ref resolves to `v=1`. `v=2` is treated as deprecated."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`latest_version` is **not required**; dbt implicitly picks the highest numeric version. So State 1 parses fine and resolves to `v=2`."}, "B": {"label": "✅ Correct", "text": "**State 1** (no `latest_version` declared): dbt uses the numerically highest version → unpinned `ref()` resolves to `v=2`. **State 2** (`latest_version: 1` explicit, `v=2` exists): unpinned `ref()` resolves to `v=1`, and `v=2` is classified as a **prerelease**. dbt emits a warning like: \"A prerelease version 2 is available…this reference will resolve to v=2 when latest_version is bumped.\" This lets teams ship a new version in code and let consumers adopt it before cutting over."}, "C": {"label": "❌ Incorrect", "text": "Omitting `latest_version` does not cause compilation failure. `v=2` is never silently ignored — it becomes a prerelease, visible and refable by explicit pin."}, "D": {"label": "❌ Incorrect", "text": "Version resolution is **numeric**, not alphabetical. And `v=2` is not \"deprecated\" — deprecation requires an explicit `deprecation_date`."}}, "key_rule": "No `latest_version` → highest number wins. Explicit `latest_version` lower than the highest → newer versions are **prereleases** (shipped but not yet the default). Use this to stage a new version before flipping consumers over."}, {"id": "q12_Q5", "file_id": "q12", "topic_num": "11", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 5, "high_yield": true,
