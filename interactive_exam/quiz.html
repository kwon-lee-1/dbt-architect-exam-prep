: false, "options": {"A": "The custom `generate_schema_name` macro returns a name that doesn't keep the `dbt_cloud_pr_` prefix, so dbt doesn't drop the schema.", "B": "CI schema cleanup only works on Snowflake — the team must be using a different warehouse.", "C": "The CI job is missing the `--target-path` flag, preventing dbt from tracking the PR schema.", "D": "The PR was merged instead of closed — only closing (not merging) a PR triggers schema cleanup."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say that if you overrode `generate_schema_name` and it isn't using `dbt_cloud_pr_` as the prefix, the temporary schemas aren't dropped. ✅ `dbt_cloud_pr_123_456_marketing`, ❌ `marketing`."}, "B": {"label": "❌ Incorrect", "text": "CI schema auto-cleanup works across supported warehouses — it is not Snowflake-only."}, "C": {"label": "❌ Incorrect", "text": "`--target-path` controls where artifacts are written — it has no bearing on PR schema identification."}, "D": {"label": "❌ Incorrect", "text": "Both closing and merging a PR trigger schema cleanup — merge is the normal flow and cleanup is expected."}}, "key_rule": "An overridden `generate_schema_name` must keep the `dbt_cloud_pr_` prefix, or temp PR schemas are not dropped."}, {"id": "q03_Q5", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 5, "high_yield": true, "subdomain_id": "3.5", "subdomain_topic": "Connection profiles", "question_text": "A team needs a deployment environment to use different warehouse credentials. How do they change it?", "is_multi_select": false, "options": {"A": "They change it in the job's Advanced Settings.", "B": "They create a new dbt project.", "C": "They assign a different connection profile in the environment's settings (Edit → swap icon → Assign profile → Save).", "D": "They can't. Profiles can only be assigned when the environment is created."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The environment determines the settings its jobs run with. Jobs don't pick the profile."}, "B": {"label": "❌ Incorrect", "text": "Profiles live at the project level. No new project is needed."}, "C": {"label": "✅ Correct", "text": "Deployment environments get their connection and credentials from a project-level **profile**. Edit the environment, click the swap icon, pick a profile, Assign profile, Save."}, "D": {"label": "❌ Incorrect", "text": "The docs describe swapping the profile on an existing deployment environment."}}, "key_rule": "Profiles = project level, **deployment environments only** (not dev). Swap them in the environment settings. Older material says an environment's connection can't be changed; the current docs don't say that."}, {"id": "q03_Q6", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 6, "high_yield": true, "subdomain_id": "3.6", "subdomain_topic": "Staging environment and Mesh dev resolution", "question_text": "A platform team adds a Staging environment to an upstream project in their dbt Mesh. No deployment jobs have run in the new Staging environment yet. Immediately after creating it, downstream team developers report that their IDE jobs fail to resolve cross-project references that were working fine an hour ago. What happened?", "is_multi_select": false, "options": {"A": "dbt falls back to Production when Staging has no successful runs — the failure is caused by something else.", "B": "The Staging environment requires a manual \"activate\" step before dbt uses it for resolution.", "C": "The Staging environment has a configuration error — it should be deleted and re-created.", "D": "Once a Staging environment exists, dbt immediately routes all development cross-project ref resolution to it — even with no successful runs. With no metadata, resolution fails and does NOT fall back to Production."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is explicitly wrong. Fallback to Production only occurs when the Staging environment **type doesn't exist at all**. Once Staging exists (even empty), dbt routes to it and fails rather than falling back."}, "B": {"label": "❌ Incorrect", "text": "There is no \"activate\" step — creation and linking is automatic."}, "C": {"label": "❌ Incorrect", "text": "This is expected behavior — the Staging environment is not misconfigured."}, "D": {"label": "✅ Correct", "text": "The docs say dbt uses the Staging environment as soon as it exists, with no fail-over to Production, even if Staging has had no successful runs. Downstream refs then fail. Fix: run a successful deployment job in Staging. Safer order: create the environment without marking it Staging, run a job, then mark it Staging."}}, "key_rule": "Adding Staging = **immediate routing**. No fallback to Production. Create it unmarked, run a job, then mark it Staging."}, {"id": "q03_Q7", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 7, "high_yield": false, "subdomain_id": "3.7", "subdomain_topic": "Extended attributes and nested overrides", "question_text": "An architect tries to override a nested key in `profiles.yml` using an environment's extended attributes. They add a partial YAML snippet targeting only the nested key. The override does not apply. Why?", "is_multi_select": false, "options": {"A": "Extended attributes require a dbt Cloud restart to take effect.", "B": "Extended attributes accept top-level keys only. To change a sub-key, provide the entire top-level key as a JSON block.", "C": "Extended attributes only work for Snowflake environments — not for other warehouse types.", "D": "Nested overrides require the `+override: true` flag in the YAML snippet."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not a documented step."}, "B": {"label": "✅ Correct", "text": "The docs say only **top-level keys** are accepted. To change a specific sub-key, provide the entire top-level key as a JSON block (e.g. all of BigQuery `keyfile_json`)."}, "C": {"label": "❌ Incorrect", "text": "Extended attributes work across warehouse types — they're not Snowflake-specific."}, "D": {"label": "❌ Incorrect", "text": "There is no `+override: true` flag — this is not a dbt concept for extended attributes."}}, "key_rule": "Extended attributes = top-level keys only. To change a sub-key, give the whole top-level key as JSON."}, {"id": "q03_Q8", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 8, "high_yield": false, "subdomain_id": "3.8", "subdomain_topic": "Environment counts per project", "question_text": "Which of the following correctly describes how many of each environment type a single dbt project can have?", "is_multi_select": false, "options": {"A": "Development: 1, Production: 1, Staging: unlimited, General: unlimited.", "B": "Development: 1, Production: 1, Staging: 1, General: unlimited.", "C": "Development: unlimited, Production: 1, Staging: 1, General: unlimited.", "D": "Development: 1, Production: unlimited, Staging: unlimited, General: unlimited."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Staging is also limited to exactly 1 per project."}, "B": {"label": "✅ Correct", "text": "**Development: exactly 1** (IDE/CLI); **Production: exactly 1** (Catalog source of truth, cross-project ref resolver); **Staging: exactly 1** (pre-prod, optional); **General: unlimited** (experimental/non-critical)."}, "C": {"label": "❌ Incorrect", "text": "Development is limited to exactly 1 per project — it drives the IDE and controls which branch developers fork from. Multiple Development environments would create conflicts."}, "D": {"label": "❌ Incorrect", "text": "Production and Staging are each limited to exactly 1 — having multiples of either would create ambiguity in Catalog and cross-project resolution."}}, "key_rule": "Dev=1, Prod=1, Staging=1, General=unlimited."}, {"id": "q03_Q9", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 9, "high_yield": true, "subdomain_id": "3.9", "subdomain_topic": "What deferral compares against", "question_text": "A CI job is set to compare changes against the Production environment. Which run provides the state it compares against?", "is_multi_select": false, "options": {"A": "The latest successful run in Production, from any job that updates artifacts there.", "B": "The previous run of the CI job itself.", "C": "The most recent production run, even if it failed.", "D": "A specific production job picked by job ID."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say the latest successful run in the environment can come from any job that updates artifacts there."}, "B": {"label": "❌ Incorrect", "text": "That's the separate \"This Job\" (self-deferral) option."}, "C": {"label": "❌ Incorrect", "text": "The state comes from the latest **successful** run."}, "D": {"label": "❌ Incorrect", "text": "Built-in deferral targets an environment, not a hand-picked job ID."}}, "key_rule": "Deferral to an environment = state from the latest **successful** run there. You need a successful run first. CI jobs default to Production."}, {"id": "q03_Q10", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 10, "high_yield": false, "subdomain_id": "3.10", "subdomain_topic": "Release tracks", "question_text": "A team prioritizes stability and does not want to receive new dbt version upgrades until they've been thoroughly vetted. They manage a mission-critical production pipeline with strict change management processes. They are on dbt v1 and the Enterprise plan. Which release track should they choose?", "is_multi_select": false, "options": {"A": "Latest — ensures they always have the newest features and security patches.", "B": "Pinned — set a specific dbt version and never auto-upgrade.", "C": "Extended — the previous month's Compatible release (Enterprise/Enterprise+).", "D": "Compatible — a monthly release aligned with open source dbt v1."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Latest is a continuous release with early access to new features. It's the v1 default, not the cautious choice."}, "B": {"label": "❌ Incorrect", "text": "\"Pinned\" isn't a release track. The v1 tracks are Latest, Compatible, Extended and Fallback."}, "C": {"label": "✅ Correct", "text": "**Extended** is the previous month's Compatible release, so it gives the most testing time. Enterprise/Enterprise+ only."}, "D": {"label": "❌ Incorrect", "text": "Compatible is monthly (Starter and up). Extended trails it by a month."}}, "key_rule": "v1: Latest (default, continuous) → Compatible (monthly, Starter+) → Extended (previous month's Compatible, Enterprise+) → Fallback (Enterprise+, rollback). v2: Nightly, Stable (default), Extended, Fallback."}, {"id": "q03_Q11", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 11, "high_yield": false, "subdomain_id": "3.11", "subdomain_topic": "Custom branch behavior", "question_text": "A deploy job's environment has a custom branch set to `release/2024-q4`. What does this mean for how the job executes?", "is_multi_select": false, "options": {"A": "The custom branch setting only applies to the dbt Cloud IDE — deploy jobs always use `main`.", "B": "The job will merge `release/2024-q4` into `main` before running.", "C": "The job will create a new branch called `release/2024-q4` from `main` each time it runs.", "D": "The job will clone the `release/2024-q4` branch at runtime and run against that code — it does not merge into any other branch."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The custom branch setting on a deployment environment directly affects deploy jobs — it's not just an IDE setting."}, "B": {"label": "❌ Incorrect", "text": "dbt Cloud jobs do not perform git merges as part of job execution."}, "C": {"label": "❌ Incorrect", "text": "dbt never creates new branches as part of job execution."}, "D": {"label": "✅ Correct", "text": "For deployment environments, a custom branch specifies which branch is **cloned at job runtime** — dbt checks out that branch and runs against it. No merging occurs. The branch is used as-is."}}, "key_rule": "Deploy env custom branch = branch **cloned at runtime**. Dev env custom branch = branch devs **fork from** in IDE."}, {"id": "q03_Q12", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 12, "high_yield": false, "subdomain_id": "3.12", "subdomain_topic": "Environment variable precedence", "question_text": "A dbt project has an environment variable `DBT_TARGET_SCHEMA` set at three levels: project default = `analytics`, environment level = `analytics_staging`, and job-level override = `analytics_ci`. When the job runs, which value is used?", "is_multi_select": false, "options": {"A": "`analytics_staging` — environment-level settings override project defaults.", "B": "`analytics_ci` — job-level overrides always win; they are the most specific.", "C": "All three values are merged — the most recently set one takes precedence.", "D": "`analytics` — project-level defaults always win for consistency."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Environment level overrides project default, but is itself overridden by job level."}, "B": {"label": "✅ Correct", "text": "Precedence, highest first: job override (or personal IDE override) > environment > project default > the default argument in `env_var()`. There is no account-level scope."}, "C": {"label": "❌ Incorrect", "text": "Values are not merged — the most specific (highest precedence) level wins entirely."}, "D": {"label": "❌ Incorrect", "text": "Project default is the lowest precedence — it is overridden by environment and job levels."}}, "key_rule": "Env var precedence = **Job (or personal IDE) > Environment > Project default**. No account level. Names start with `DBT_` or `DBT_ENV_SECRET_`."}, {"id": "q03_Q13", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 13, "high_yield": false, "subdomain_id": "3.13", "subdomain_topic": "`target.name` vs environment type", "question_text": "A data engineer sets the **Target name** field in a dbt Cloud job's Advanced Settings to `prod`. They expect this to automatically designate the job as a \"Production\" environment type. An architect corrects them. What is the distinction?", "is_multi_select": false, "options": {"A": "`target.name` controls which dbt Cloud environment a job runs in. Setting it to `prod` routes the job to the Production environment.", "B": "Environment type is set via `target.name` — you must set `target.name = production` (full word, not abbreviation) for dbt Cloud to recognize the Production environment type.", "C": "`target.name` and environment type are synonyms — setting one automatically sets the other.", "D": "`target.name` is a string value in job Advanced Settings that feeds into Jinja macros (e.g., `generate_schema_name`). Environment type is a dbt Cloud concept controlling Catalog behavior and cross-project ref resolution. They are independent."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`target.name` is an arbitrary string — it does not route jobs to different environments. The job's environment is fixed at job creation."}, "B": {"label": "❌ Incorrect", "text": "`target.name` has no effect on environment type designation in dbt Cloud. The environment type is set in the environment configuration, not through any job field."}, "C": {"label": "❌ Incorrect", "text": "They are completely independent settings. Changing one has no effect on the other."}, "D": {"label": "✅ Correct", "text": "**`target.name`** is a runtime string you control, readable in Jinja as `target.name`. It is most commonly used in custom macros like `generate_schema_name` to distinguish dev from prod schema behavior. **Environment type** (Development, Production, Staging, General) is a dbt Cloud platform concept that determines which job is the Catalog source of truth, how cross-project refs resolve, and what the environment is used for. Setting `target.name = prod` on a job in a General environment does NOT make it a Production environment."}}, "key_rule": "`target.name` = runtime string for macro logic (set in job Advanced Settings). Environment type = dbt Cloud platform concept. Completely independent."}, {"id": "q03_Q14", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 14, "high_yield": false, "subdomain_id": "3.14", "subdomain_topic": "Dev cross-project ref with no upstream Staging", "question_text": "A dbt Mesh has a consumer project (`marketing`) and a producer project (`platform`). The `platform` project has only a **Production** environment — no Staging environment exists. A developer working in the `marketing` IDE opens a run and references a public model from `platform`. Which environment does the cross-project ref resolve against?", "is_multi_select": false, "options": {"A": "It resolves against the `platform` project's **Production** environment — this is the only scenario where a development IDE job resolves cross-project refs against Production.", "B": "The ref fails — development jobs cannot resolve against Production environments.", "C": "It resolves against the `marketing` project's Staging environment as a proxy.", "D": "It prompts the developer to select an environment from the `platform` project."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Cross-project ref resolution follows this rule: dev jobs resolve against **Staging if it exists**, else **Production**. When the upstream (`platform`) project has no Staging environment, the developer's IDE job resolves directly against `platform`'s **Production** environment. This is the **only** scenario where a development job legitimately resolves against Production. It is a data-access risk — developers may inadvertently query production data."}, "B": {"label": "❌ Incorrect", "text": "Dev jobs CAN resolve against Production — this is the documented fallback when no Staging environment exists in the upstream project."}, "C": {"label": "❌ Incorrect", "text": "The consumer project's Staging environment is irrelevant to resolving refs in the upstream project. Resolution is always within the upstream project."}, "D": {"label": "❌ Incorrect", "text": "Environment selection is automatic — there is no manual prompt."}}, "key_rule": "Dev cross-project ref → Staging (if exists) else Production. No upstream Staging = dev resolves against Production (only time this happens)."}, {"id": "q03_Q15", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 15, "high_yield": true, "subdomain_id": "3.15", "subdomain_topic": "Staging environment and dev resolution (no fallback)", "question_text": "An architect adds a **new Staging environment** to an upstream dbt Mesh project. No deployment jobs have been run in this Staging environment yet. What immediately happens to developer IDE jobs in downstream consumer projects that reference this upstream project?", "is_multi_select": false, "options": {"A": "Nothing changes immediately — downstream dev jobs continue resolving against Production until the first Staging job succeeds.", "B": "Downstream dev jobs now resolve against both Staging and Production simultaneously, merging metadata from both.", "C": "Downstream dev IDE jobs immediately start failing to resolve cross-project references because dbt routes all dev resolution to the new Staging environment, which has no metadata yet. There is no fallback to Production.", "D": "dbt detects the empty Staging environment and temporarily routes to Production until the first Staging run succeeds, then switches automatically."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The transition is immediate, not gradual. As soon as the Staging environment is created and linked to the metadata service, dbt routes to it — even with no runs."}, "B": {"label": "❌ Incorrect", "text": "dbt does not merge metadata from multiple environments. Resolution is to one environment only."}, "C": {"label": "✅ Correct", "text": "The moment a Staging environment exists and is linked to the metadata service, dbt **immediately** routes all downstream dev cross-project ref resolution to it — with **no fallback to Production**. Since no deployment jobs have run in Staging, there is no metadata for the upstream models, and resolution fails. This is a critical architect gotcha: always run at least one successful deployment job in the new Staging environment before downstream teams depend on it."}, "D": {"label": "❌ Incorrect", "text": "There is no automatic fallback mechanism once a Staging environment exists. The fallback to Production only applies when no Staging environment exists at all."}}, "key_rule": "Adding Staging immediately breaks downstream dev resolution if no jobs have run in it yet. Always run one successful job in Staging before downstream teams depend on it."}, {"id": "q03_Q16", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 16, "high_yield": false, "subdomain_id": "3.16", "subdomain_topic": "Deleting an environment", "question_text": "An architect plans to delete a General environment that was used for experimental jobs. Before deleting, what must they do to avoid data loss?", "is_multi_select": false, "options": {"A": "Export the run history to CSV, since it cannot be recovered after deletion.", "B": "Archive the environment first — dbt Cloud auto-archives all jobs before deletion.", "C": "Transfer all jobs configured in that environment to another environment first — deleting an environment deletes all jobs in it.", "D": "Nothing — job definitions are stored at the project level and persist after environment deletion."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Run history export is not a documented concern here — job definitions are the critical thing to preserve."}, "B": {"label": "❌ Incorrect", "text": "There is no auto-archive step — dbt Cloud does not preserve jobs in an archived state when an environment is deleted."}, "C": {"label": "✅ Correct", "text": "When an environment is deleted, **all jobs configured in that environment are also deleted**. There is no recovery path. The architect must **transfer jobs to another environment** before deleting. This is an irreversible action — always confirm there are no jobs you want to keep before proceeding."}, "D": {"label": "❌ Incorrect", "text": "Jobs are not stored at the project level independently of environments — they belong to an environment."}}, "key_rule": "Deleting an environment = all jobs in it are also deleted. Transfer jobs first — no recovery after deletion."}, {"id": "q03_Q17", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 17, "high_yield": false, "subdomain_id": "3.17", "subdomain_topic": "Snowflake key pair credentials", "question_text": "A team sets up Snowflake key pair authentication for a deployment environment. Where do the keys go?", "is_multi_select": false, "options": {"A": "The private key goes on the Snowflake user. The public key goes in dbt.", "B": "The private key goes in a dbt environment variable.", "C": "Both keys go in dbt.", "D": "The public key goes on the Snowflake user (`rsa_public_key`). The private key and passphrase go in the dbt Credentials page."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Reversed."}, "B": {"label": "❌ Incorrect", "text": "The docs say specifying the private key through an environment variable is not supported."}, "C": {"label": "❌ Incorrect", "text": "Only the private key (and passphrase) go in dbt."}, "D": {"label": "✅ Correct", "text": "`alter user jsmith set rsa_public_key='...'` on the Snowflake side. Then set **Private Key** and **Private Key Passphrase** on the dbt Credentials page."}}, "key_rule": "Public key → Snowflake user. Private key + passphrase → dbt Credentials. Key pair is the default for new Snowflake credentials. dbt v2 wants PKCS#8 with AES-256. Rotating via the Admin API is an exam objective, but the docs I found don't describe the steps."}, {"id": "q03_Q18", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 18, "high_yield": false, "subdomain_id": "3.18", "subdomain_topic": "Environment editable fields by platform", "question_text": "A team uses Postgres. They want to change a connection value for one deployment environment, but the environment settings show no connection section. What do they do?", "is_multi_select": false, "options": {"A": "Create a new Postgres connection for every environment.", "B": "Use extended attributes on the environment's profile.", "C": "It can't be done on Postgres.", "D": "Set the value in the job's Target name field."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not needed. Values come from the project connection and extended attributes override them."}, "B": {"label": "✅ Correct", "text": "The docs say the section doesn't appear for Postgres because all values are inferred from the project's connection. Use extended attributes to override them. The same goes for Redshift, BigQuery and Spark."}, "C": {"label": "❌ Incorrect", "text": "Extended attributes exist for this."}, "D": {"label": "❌ Incorrect", "text": "Target name is a string for macro logic. It doesn't change connection values."}}, "key_rule": "Snowflake = Role, Database, Warehouse. Databricks = Catalog (optional). Postgres, Redshift, BigQuery, Spark = no connection fields, use extended attributes."}, {"id": "q03_Q19", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 19, "high_yield": false, "subdomain_id": "3.19", "subdomain_topic": "Developer plan scheduling interval", "question_text": "A team on the **Developer plan** wants to schedule a dbt job to run every 5 minutes to keep their data as fresh as possible. Will this work?", "is_multi_select": false, "options": {"A": "No — the Developer plan has a minimum scheduling interval of **10 minutes**. A 5-minute schedule cannot be set.", "B": "Yes — 5-minute intervals are supported on Developer plan but require cron syntax.", "C": "Yes — there is no minimum scheduling interval documented for the Developer plan.", "D": "No — the Developer plan does not support scheduled jobs at all; only manual triggers are available."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The **Developer plan** enforces a minimum scheduling interval of **10 minutes**. A 5-minute schedule cannot be configured on this plan. Teams that need sub-10-minute freshness must upgrade or use an alternative triggering mechanism via the API. Starter, Enterprise, and Enterprise+ do not have a documented minimum scheduling interval."}, "B": {"label": "❌ Incorrect", "text": "Cron syntax does not bypass the 10-minute minimum on Developer plan."}, "C": {"label": "❌ Incorrect", "text": "A minimum interval is documented for the Developer plan."}, "D": {"label": "❌ Incorrect", "text": "Developer plan does support scheduled jobs — it just has a 10-minute minimum interval."}}, "key_rule": "Developer plan = 10-minute minimum scheduling interval. Other plans have no documented minimum."}, {"id": "q03_Q20", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 20, "high_yield": false, "subdomain_id": "3.20", "subdomain_topic": "Secrets in extended attributes", "question_text": "A team needs a password inside an environment's extended attributes. What is the recommended way?", "is_multi_select": false, "options": {"A": "Hardcode it. Extended attributes are encrypted and masked.", "B": "Reference an environment-scoped env var.", "C": "Reference a project-scoped env var with the `DBT_ENV_SECRET_` prefix: `password: '{{ env_var('DBT_ENV_SECRET_PASSWORD') }}'`.", "D": "Reference any env var name, e.g. `SNOWFLAKE_PASSWORD`."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say extended attributes don't mask secret values. They recommend avoiding secrets in the text box and logs."}, "B": {"label": "❌ Incorrect", "text": "Environment-scoped variables aren't available during connection tests, so they must be project-scoped."}, "C": {"label": "✅ Correct", "text": "Wrap secrets in an env var. `DBT_ENV_SECRET_` values are scrubbed from logs and never shown in the UI or artifacts. Variables used in extended attributes must be project-scoped."}, "D": {"label": "❌ Incorrect", "text": "Env var names must start with `DBT_`, `DBT_ENV_SECRET_` or `DBT_ENV_CUSTOM_ENV_`."}}, "key_rule": "Secrets → `DBT_ENV_SECRET_` env var, project-scoped, referenced from extended attributes. Snowflake private keys can't come from an env var at all."}, {"id": "q03_Q21", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 21, "high_yield": false, "subdomain_id": "3.21", "subdomain_topic": "Environment-level permissions", "question_text": "Developers should be able to create and run jobs in Staging but not write to Production. What do admins set up?", "is_multi_select": false, "options": {"A": "Environment-level permissions on the developers' group: write access for the Staging environment type, not Production.", "B": "A separate dbt account for production.", "C": "A read-only toggle in the Production environment's settings.", "D": "A separate project for each environment."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Admins give a group write access by environment **type** (Account settings → Groups & Licenses). The docs suggest locking Production and allowing Development, Staging and General."}, "B": {"label": "❌ Incorrect", "text": "Not needed. The docs do this inside one account and project."}, "C": {"label": "❌ Incorrect", "text": "Access is set on the group, not on the environment."}, "D": {"label": "❌ Incorrect", "text": "Not needed. The docs restrict Production within a single project."}}, "key_rule": "Environment-level permissions are per group and per environment **type**, not per single environment. Supported permission sets: Database admin, Git admin, Team admin, Analyst, Developer. Nothing selected = read-only. Developer defaults to **All environments**."}, {"id": "q04_Q1", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 1, "high_yield": true, "subdomain_id": "4.1", "subdomain_topic": "CI job concurrency", "question_text": "Two developers each open a separate PR at the same time against the same dbt project. What does dbt Cloud do with the two CI job runs?", "is_multi_select": false, "options": {"A": "Cancels the older run and starts only the newest one.", "B": "Queues them serially — the second run waits for the first to complete.", "C": "Runs them concurrently only if the account has more than 1 run slot.", "D": "Runs them concurrently — each gets its own isolated temp schema."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Smart cancellation (cancelling stale builds) applies when the *same PR* receives a new commit, not when two different PRs run simultaneously."}, "B": {"label": "❌ Incorrect", "text": "Serial queuing is the behavior for the *same PR* with multiple commits — not different PRs."}, "C": {"label": "❌ Incorrect", "text": "CI jobs bypass the slot system — concurrent CI does not depend on run slot count."}, "D": {"label": "✅ Correct", "text": "**Different PRs run concurrently** — each CI run gets its own isolated temp schema (`dbt_cloud_pr_<job_id>_<pr_id>`). CI jobs bypass the run slot system entirely, so this concurrency is not limited by available slots."}}, "key_rule": "Different PRs → concurrent CI (each isolated temp schema). Same PR → serial with smart cancellation."}, {"id": "q04_Q2", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 2, "high_yield": true, "subdomain_id": "4.2", "subdomain_topic": "Command ordering: dbt sl validate", "question_text": "A CI job is configured with the following command sequence:\n1. `dbt sl validate --select state:modified+`\n2. `dbt build --select state:modified+`\n\nThe CI job consistently fails on step 1. What is the cause?", "is_multi_select": false, "options": {"A": "`--select state:modified+` is not supported by `dbt sl validate`.", "B": "`dbt build` must run before `dbt sl validate` — that is the order the docs list.", "C": "`dbt sl validate` is not a valid command — the correct syntax is `dbt semantic-layer validate`.", "D": "`dbt sl validate` must run before `dbt build` so validation happens against pre-existing models."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`--select` flags are supported by `dbt sl validate`. The ordering, not the selector, is the issue."}, "B": {"label": "✅ Correct", "text": "The docs' CI setup lists `dbt build --select state:modified+` first, then `dbt sl validate --select state:modified+`."}, "C": {"label": "❌ Incorrect", "text": "`dbt sl validate` is the correct command syntax."}, "D": {"label": "❌ Incorrect", "text": "This has the order backwards and contradicts the actual requirement."}}, "key_rule": "`dbt build` goes **before** `dbt sl validate`. That's the order in the docs' CI setup."}, {"id": "q04_Q3", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 3, "high_yield": true, "subdomain_id": "4.3", "subdomain_topic": "Source freshness: checkbox vs command step", "question_text": "A deploy job has `dbt source freshness` configured as a **checkbox** (not a command step) and `dbt build` as a command step. The freshness check fails because a source table hasn't been updated in 3 days. What happens next?", "is_multi_select": false, "options": {"A": "The job immediately fails and `dbt build` does not run.", "B": "The job continues — `dbt build` runs normally because checkbox failures are isolated from the overall job.", "C": "The job pauses and waits for the source to be updated before continuing.", "D": "`dbt build` runs but only for models that do not depend on the stale source."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This would be the behavior if `dbt source freshness` were a **command step** — failures in command steps block all subsequent steps."}, "B": {"label": "✅ Correct", "text": "When `dbt source freshness` is configured as a **checkbox**, its failure is **isolated** — it does not propagate to the overall job status and does not prevent subsequent command steps from running. `dbt build` runs regardless of the freshness result. If you need stale sources to block the build, add `dbt source freshness` as a command step instead."}, "C": {"label": "❌ Incorrect", "text": "Jobs do not pause and wait — they proceed or fail."}, "D": {"label": "❌ Incorrect", "text": "`dbt build` runs the full selected scope — it does not intelligently filter out models with stale upstream sources."}}, "key_rule": "Checkbox failures are **isolated**. Source freshness as checkbox = won't fail the job. As command step = blocks all subsequent steps."}, {"id": "q04_Q4", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 4, "high_yield": true, "subdomain_id": "4.4", "subdomain_topic": "dbt retry on infrastructure failure", "question_text": "A production job fails before any models run because of a warehouse connection timeout during job initialization. An on-call engineer runs `dbt retry` to recover. What happens?", "is_multi_select": false, "options": {"A": "`dbt retry` re-runs the entire job from scratch since no nodes completed.", "B": "`dbt retry` automatically detects the infrastructure failure and increases the connection timeout before retrying.", "C": "`dbt retry` is a no-op — it reads `run_results.json` to find the failure point, but no nodes were recorded. The engineer must trigger a full job rerun manually.", "D": "`dbt retry` reconnects to the warehouse and resumes from the last successfully compiled node."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt retry` does not do a full rerun — it reads from `run_results.json` and resumes from the recorded failure point. If there's no recorded failure point, it has nothing to do."}, "B": {"label": "❌ Incorrect", "text": "`dbt retry` has no automatic timeout adjustment capability."}, "C": {"label": "✅ Correct", "text": "`dbt retry` reads `run_results.json` to find which nodes failed and resumes from that point. If the job failed before **any nodes executed** (infrastructure failure, connection error during init), `run_results.json` contains no nodes to resume from — `dbt retry` is a **no-op**. The engineer must trigger a full job rerun."}, "D": {"label": "❌ Incorrect", "text": "`dbt retry` works at the node level (compiled models), not at the connection level."}}, "key_rule": "`dbt retry` = no-op on infrastructure failures. Only works when nodes are recorded in `run_results.json`."}, {"id": "q04_Q5", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 5, "high_yield": true, "subdomain_id": "4.5", "subdomain_topic": "Scheduling: exact clock times", "question_text": "A team needs a job to run at exactly 4:05 AM UTC every day. Which schedule type should they use?", "is_multi_select": false, "options": {"A": "Intervals, every 24 hours.", "B": "Specific hours, `4`.", "C": "Cron, `5 4 * * *`.", "D": "Intervals, every 2 hours."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Intervals run every N hours counted from midnight UTC. You can't pick minute 5."}, "B": {"label": "❌ Incorrect", "text": "Specific hours takes a comma-separated list of whole UTC hours, so this would run at 4:00."}, "C": {"label": "✅ Correct", "text": "Cron gives exact times. `5 4 * * *` runs at 4:05 AM UTC. `L` (last day of month) and `MON#1` (first Monday) also work."}, "D": {"label": "❌ Incorrect", "text": "Intervals of 2 hours can't produce a 4:05 daily run."}}, "key_rule": "Intervals = every N hours from midnight UTC. Specific hours = whole UTC hours. Cron = exact times. Everything is UTC, with no daylight saving adjustment."}, {"id": "q04_Q6", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 6, "high_yield": true, "subdomain_id": "4.6", "subdomain_topic": "Advanced CI: event_time and false positives", "question_text": "Advanced CI (Compare Changes) is enabled on a CI job. After every PR, the Compare tab shows hundreds of \"deleted rows\" even though the production data hasn't changed. What configuration is missing?", "is_multi_select": false, "options": {"A": "The `dbt compare` toggle is set to \"Continue on error\" instead of \"Stop on error.\"", "B": "The model is missing a primary key constraint — without it, Advanced CI can't perform row-level comparison.", "C": "The CI and production environments are on different database hosts, preventing an accurate comparison.", "D": "`event_time` is not configured on the model. Without it, full tables are compared — the CI's smaller date window looks like deleted rows vs. production."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Stop/continue on error controls linting behavior — it has no effect on row comparison results."}, "B": {"label": "❌ Incorrect", "text": "Missing primary key would cause a \"Primary key missing\" error — not false \"deleted rows.\""}, "C": {"label": "❌ Incorrect", "text": "Different database hosts would cause the comparison to **fail completely**, not produce false deletion results."}, "D": {"label": "✅ Correct", "text": "Without `event_time`, dbt compares **full tables**. CI jobs typically build a smaller time window of data than production — all rows outside the CI window appear as \"deleted\" in production but not CI. With `event_time` configured, dbt filters both tables to the **overlapping time range** before comparing, eliminating false positives."}}, "key_rule": "Without `event_time` → full table comparison → CI's smaller date window = false \"deleted rows\" on every run."}, {"id": "q04_Q7", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 7, "high_yield": true, "subdomain_id": "4.7", "subdomain_topic": "Advanced CI: PII in cached rows", "question_text": "A company enables Advanced CI's Compare Changes feature. A security reviewer discovers that warehouse dynamic data masking policies are not being applied to the rows visible in the Compare tab. Is this expected behavior?", "is_multi_select": false, "options": {"A": "Yes — dynamic data masking does NOT apply to Advanced CI cached samples. All account users can see the unmasked cached rows.", "B": "No — users only see masked rows unless they have the warehouse masking policy bypass privilege.", "C": "No — this is a bug in Advanced CI. Report it to dbt Labs.", "D": "Yes — but masking is applied after the 30-day cache expiry when data is reloaded."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Advanced CI caches up to **100 rows per model** at query time and stores them encrypted in S3/Azure Blob. **Dynamic data masking does NOT apply** to these cached rows — the cached data is not dynamically masked, and the docs say all account users can view the comparison results and cached data. Restrict the CI environment's credentials, or use synthetic data."}, "B": {"label": "❌ Incorrect", "text": "The cached rows bypass masking entirely — it's not a per-user privilege question."}, "C": {"label": "❌ Incorrect", "text": "This is documented, expected behavior — not a bug."}, "D": {"label": "❌ Incorrect", "text": "After 30 days the cache expires — data becomes inaccessible entirely. Masking is not retroactively applied at expiry."}}, "key_rule": "Advanced CI cache = **no dynamic data masking**. Restrict the CI environment's credentials, or use synthetic data."}, {"id": "q04_Q8", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 8, "high_yield": false, "subdomain_id": "4.8", "subdomain_topic": "Cross-project refs in a job", "question_text": "A downstream project's models use `ref('platform', 'dim_customers')`, a public model in an upstream project. The job runs without rebuilding the upstream project. What resolves the ref?", "is_multi_select": false, "options": {"A": "dbt's metadata service, which points it at the upstream project's Production environment (or its Staging environment, for downstream Development and Staging runs, when Staging exists).", "B": "A `--state` flag pointing at the upstream project's `manifest.json`.", "C": "The downstream job rebuilds the upstream project first.", "D": "`dbt deps` copies the upstream models into the downstream project."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say dbt uses a metadata service to resolve references to public models in other projects on the fly. Downstream Production resolves to upstream Production. Downstream Staging and Development resolve to upstream Staging if it exists, otherwise Production."}, "B": {"label": "❌ Incorrect", "text": "Not how project dependencies work. The metadata service does the resolving."}, "C": {"label": "❌ Incorrect", "text": "Upstream models are not parsed or run in the downstream project."}, "D": {"label": "❌ Incorrect", "text": "`dbt deps` installs packages. Project dependencies go in `dependencies.yml`."}}, "key_rule": "Cross-project `ref('project', 'model')` resolves through the metadata service to the upstream's Production (or Staging). The upstream project is not rebuilt."}, {"id": "q04_Q9", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 9, "high_yield": false, "subdomain_id": "4.9", "subdomain_topic": "Fork PRs", "question_text": "A developer forks a dbt project repository on GitHub and submits a pull request from their fork. The job fails at the Clone Git Repository step with \"Failed to checkout to specified revision.\" What is the cause and fix?", "is_multi_select": false, "options": {"A": "The CI job needs `--select state:new` instead of `state:modified+` to detect commits from forks.", "B": "dbt Cloud cannot check out commits from fork repositories — the developer must push to the origin repository directly.", "C": "The developer's fork is on a different GitHub account — add that account as a collaborator.", "D": "Fork-based PRs require a service token with write access to the fork repository."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The selector has no bearing on whether dbt can access fork commits."}, "B": {"label": "✅ Correct", "text": "The docs say dbt can only check out commits that belong to the **original repository**, not commits that belong to a fork. Push the branch to the original repo."}, "C": {"label": "❌ Incorrect", "text": "Not a documented fix. dbt can only check out commits from the original repo."}, "D": {"label": "❌ Incorrect", "text": "Not a documented fix."}}, "key_rule": "dbt only checks out commits from the original repo. Push the branch there."}, {"id": "q04_Q10", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 10, "high_yield": false, "subdomain_id": "4.10", "subdomain_topic": "PrivateLink and CI hooks", "question_text": "A company enables PrivateLink for all dbt Cloud connections for security compliance. Shortly after, CI jobs stop running entirely and no error messages appear in the dbt Cloud UI. What is the cause?", "is_multi_select": false, "options": {"A": "PrivateLink requires a VPN client on each developer's machine, which blocks CI from running.", "B": "PrivateLink connections require the Enterprise+ plan for CI — the company is on Enterprise.", "C": "With ingress PrivateLink or IP allowlisting, CI hooks may not be available, and the job can fail silently.", "D": "PrivateLink automatically disables webhook triggers, which CI hooks rely on."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "PrivateLink is a server-side network configuration — it doesn't require VPN clients."}, "B": {"label": "❌ Incorrect", "text": "This is not a documented plan-level limitation specific to PrivateLink + CI."}, "C": {"label": "✅ Correct", "text": "The docs say that on Enterprise plans with ingress PrivateLink or IP allowlisting, registering CI hooks may not be available and can cause the job to fail silently."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink doesn't automatically disable webhooks at the networking level — the issue is at the CI hook layer specifically."}}, "key_rule": "Ingress PrivateLink or IP allowlisting: CI hooks may be unavailable → CI can fail **silently**."}, {"id": "q04_Q11", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 11, "high_yield": true, "subdomain_id": "4.11", "subdomain_topic": "Understanding when to use which type of job deferral", "question_text": "A deploy job has \"Compare changes against\" set to **Environment** instead of **This Job**. What does that change?", "is_multi_select": false, "options": {"A": "It defers to a hand-picked job ID in that environment.", "B": "It compares against the job's own last successful run.", "C": "It turns deferral off.", "D": "It compares against the latest successful run in that environment, from any deploy job that updates artifacts there."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say built-in deferral targets an environment, not a hand-picked job ID."}, "B": {"label": "❌ Incorrect", "text": "That is **This Job** (self-deferral), the older behavior."}, "C": {"label": "❌ Incorrect", "text": "Deferral off is **No deferral**, the default for deploy jobs."}, "D": {"label": "✅ Correct", "text": "Environment deferral considers all deploy jobs that run in the deferred environment. The docs call it more efficient and more accurate than deferring to one job."}}, "key_rule": "Deploy job default = No deferral. CI job default = Production environment. **Environment** (recommended) = latest successful run there from any job. **This Job** = that job's own last successful run."}, {"id": "q04_Q12", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 12, "high_yield": false, "subdomain_id": "4.12", "subdomain_topic": "State selector: --vars invisibility", "question_text": "A CI job uses `dbt build --select state:modified+ --defer --state /prod/manifest`. A developer changes only the value of a runtime variable in `dbt_project.yml` (e.g., changes `default_event_window: 30` to `default_event_window: 60`). The CI job runs but doesn't build any models. Why?", "is_multi_select": false, "options": {"A": "Variable changes require a `dbt compile` run before `state:modified` can detect them.", "B": "`state:modified` only detects SQL and YAML config changes, not Python or YAML variable changes.", "C": "dbt can't trace a `var()` value change into `state:modified`, so the affected models aren't flagged as modified.", "D": "The variable was changed in `dbt_project.yml` instead of via `--vars` flag — this is why it wasn't detected."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt compile` doesn't help — the issue is that variable values are not tracked as part of the manifest state diff."}, "B": {"label": "❌ Incorrect", "text": "YAML variable definitions are not tracked even though other YAML config changes are. Variable values are evaluated at runtime, not stored in the manifest diff."}, "C": {"label": "✅ Correct", "text": "The docs say that if a model uses a `var` or `env_var`, dbt can't identify that lineage in a way that puts the model in `state:modified` when the value changes. It's only likely to be marked modified if the change alters the model's configuration."}, "D": {"label": "❌ Incorrect", "text": "The location doesn't matter. The docs say `var` and `env_var` value changes can't be traced into `state:modified`."}}, "key_rule": "`var()` / `env_var()` value changes aren't traced by `state:modified`. A model is likely flagged only if its config changes."}, {"id": "q04_Q13", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 13, "high_yield": true, "subdomain_id": "4.13", "subdomain_topic": "Manifest overwrite: same --state and --target-path", "question_text": "A CI job is configured as:\n```bash\ndbt build --select state:modified+ --defer --state ./target --target-path ./target\n```\nDevelopers report that `state:modified` and `--defer` give inconsistent results. What is the root cause?", "is_multi_select": false, "options": {"A": "The `./target` directory does not exist before the first run, causing state comparison to fail.", "B": "The `--defer` flag conflicts with `--state` when they point to the same directory.", "C": "CI jobs require an absolute path for `--state` — relative paths cause state comparison failures.", "D": "`--state` and `--target-path` point to the same directory — dbt overwrites `manifest.json` during parse before state comparison runs, so it always compares against the freshly-written manifest."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A missing directory isn't what the docs describe."}, "B": {"label": "❌ Incorrect", "text": "`--defer` and `--state` don't conflict with each other — they're designed to be used together."}, "C": {"label": "❌ Incorrect", "text": "Relative paths work — the issue is the directory overlap, not the path format."}, "D": {"label": "✅ Correct", "text": "The docs say dbt overwrites `manifest.json` while parsing, so setting `--state` and `--target-path` to the same path with `--defer` or `state:modified` gives non-idempotent behavior. Fix: keep the saved manifest in its own folder, use a different `--target-path`, or pass `--no-write-json`."}}, "key_rule": "`--state` and `--target-path` must point to **separate directories**. Same dir = manifest overwritten = non-idempotent state comparison."}, {"id": "q04_Q14", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 14, "high_yield": false, "subdomain_id": "4.14", "subdomain_topic": "Graph operators", "question_text": "Which of the following correctly selects a model named `fct_orders` plus all of its downstream descendants AND all ancestors of those descendants (the full closure)?", "is_multi_select": false, "options": {"A": "`2+fct_orders+2`", "B": "`@fct_orders`", "C": "`fct_orders+`", "D": "`+fct_orders+`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`2+fct_orders+2` is bounded depth selection — up to 2 ancestors + `fct_orders` + up to 2 descendants. Not a full closure."}, "B": {"label": "✅ Correct", "text": "`@fct_orders` is the **full closure operator** — it selects: `fct_orders` + all descendants + all ancestors of those descendants. It ensures that everything needed to build the model AND all its downstream tests exists. Commonly used in CI scenarios."}, "C": {"label": "❌ Incorrect", "text": "`fct_orders+` selects: `fct_orders` + all descendants only. No ancestors included."}, "D": {"label": "❌ Incorrect", "text": "`+fct_orders+` selects: all ancestors of `fct_orders` + `fct_orders` + all descendants. It does NOT include ancestors of those descendants."}}, "key_rule": "`@model` = full closure (model + descendants + all ancestors of descendants). Use in CI to ensure all deps exist."}, {"id": "q04_Q15", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 15, "high_yield": true, "subdomain_id": "4.15", "subdomain_topic": "Default deferral for CI jobs", "question_text": "A new CI job is created. What is \"Compare changes against\" set to by default?", "is_multi_select": false, "options": {"A": "No deferral.", "B": "The Production environment, if one exists.", "C": "This Job.", "D": "The Staging environment."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No deferral is the default for **deploy** jobs."}, "B": {"label": "✅ Correct", "text": "The docs say it's set to the Production environment if you created one. This lets dbt check the PR's code against production so it only builds modified code."}, "C": {"label": "❌ Incorrect", "text": "This Job (self-deferral) is a separate, older option."}, "D": {"label": "❌ Incorrect", "text": "Not the default for CI jobs."}}, "key_rule": "CI job default = Production environment. Deploy job default = No deferral. State comparison needs a deferred environment selected."}, {"id": "q04_Q16", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 16, "high_yield": false, "subdomain_id": "4.16", "subdomain_topic": "Upstream test failure and downstream SKIP", "question_text": "A `dbt build` run is executing. A `not_null` test on the `stg_orders` model fails. What happens to all models that depend on `stg_orders`?", "is_multi_select": false, "options": {"A": "They run but are flagged as \"potentially unreliable\" in the run results.", "B": "They run normally — test failures don't affect downstream model execution.", "C": "They enter **SKIP** status — they do not run at all because an upstream dependency failed.", "D": "They fail with an ERROR status — inheriting the upstream test failure."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no \"potentially unreliable\" status in dbt run results."}, "B": {"label": "❌ Incorrect", "text": "Test failures on upstream models do block downstream execution in `dbt build`."}, "C": {"label": "✅ Correct", "text": "In `dbt build`, a failing test on an upstream model causes all downstream dependent models to enter **SKIP** status — they never run. To prevent this blocking behavior, set the test severity to `warn` instead of `error`."}, "D": {"label": "❌ Incorrect", "text": "Downstream models are not marked as ERROR — they are marked as SKIP. The error is attributed to the failing test, not the downstream models themselves."}}, "key_rule": "`dbt build` upstream test fail → downstream models = **SKIP** (not ERROR). Use `severity: warn` to prevent blocking."}, {"id": "q04_Q17", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 17, "high_yield": false, "subdomain_id": "4.17", "subdomain_topic": "Unit tests execution order", "question_text": "When does `dbt build` execute unit tests relative to model materialization?", "is_multi_select": false, "options": {"A": "Before model materialization — so unit tests catch logic errors before any expensive table builds.", "B": "Concurrently with model materialization — unit tests and builds run in parallel.", "C": "After all models are materialized — so unit tests validate the final output.", "D": "At the same time as data tests (schema tests) — all test types run in the same phase."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Unit tests run **before** model materialization in `dbt build`. If a unit test fails, the model never materializes — saving warehouse compute. This \"fail early, fail cheap\" design is intentional."}, "B": {"label": "❌ Incorrect", "text": "Unit tests run in a defined sequential phase, not concurrently with builds."}, "C": {"label": "❌ Incorrect", "text": "Running after materialization defeats the purpose of unit tests — you'd spend compute building a table that a unit test immediately invalidates."}, "D": {"label": "❌ Incorrect", "text": "Data tests (schema tests) run after materialization. Unit tests have their own earlier phase."}}, "key_rule": "Unit tests run **before** materialization. Fail early = cheaper. Data tests run after materialization."}, {"id": "q04_Q18", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 18, "high_yield": false, "subdomain_id": "4.18", "subdomain_topic": "Monorepo CI behavior", "question_text": "A company stores multiple dbt Cloud projects (Project A, Project B, Project C) in a single monorepo. A developer opens a PR that only modifies files in Project A. What does dbt Cloud do?", "is_multi_select": false, "options": {"A": "No CI jobs trigger — monorepo setups require separate repository connections per project.", "B": "CI jobs for all three projects (A, B, and C) trigger from the single PR.", "C": "Project A's CI job triggers immediately; B and C trigger only if A's CI passes.", "D": "Only Project A's CI job triggers — dbt detects which project's files changed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Monorepos are supported — each project has its own connection to the shared repository."}, "B": {"label": "✅ Correct", "text": "In a monorepo, a **single PR triggers CI jobs for ALL connected dbt projects** — even if only one project's files changed. This is a known limitation. Workaround: use project-specific target branches (e.g., `main-project-a`) to scope CI triggers."}, "C": {"label": "❌ Incorrect", "text": "There is no sequential triggering based on CI success in this scenario — all CI jobs trigger simultaneously."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not currently perform file-path-based filtering to limit CI triggers to the affected project in a monorepo."}}, "key_rule": "Monorepo = single PR triggers CI for **all** connected projects. Workaround: project-specific target branches."}, {"id": "q04_Q19", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 19, "high_yield": false, "subdomain_id": "4.19", "subdomain_topic": "Job chaining plan requirements", "question_text": "An architect wants Job B in Project B to run automatically after Job A in Project A completes. Which plans can do this?", "is_multi_select": false, "options": {"A": "Developer or Starter.", "B": "Starter and above, including cross-project chaining.", "C": "Enterprise-tier plans. Chaining needs Starter or above, but Starter and Developer are limited to one project each.", "D": "Enterprise+ only."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Developer doesn't support \"Run when another job finishes\", and neither plan allows a second project."}, "B": {"label": "❌ Incorrect", "text": "Chaining is Starter and above, but Starter is limited to one project, so it can't chain across two projects."}, "C": {"label": "✅ Correct", "text": "\"Run when another job finishes\" needs a Starter or Enterprise-tier plan. Starter and Developer are limited to one project each, so chaining between two projects needs an Enterprise-tier plan."}, "D": {"label": "❌ Incorrect", "text": "The docs don't limit chaining to Enterprise+."}}, "key_rule": "Chaining = Starter and above (not Developer). Cross-project chaining needs more than one project, so Enterprise-tier. \"Completes on\" = Success only, or all statuses."}, {"id": "q04_Q20", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 20, "high_yield": true, "subdomain_id": "4.20", "subdomain_topic": "Slim CI", "question_text": "A project has over 3,000 models and full CI runs take over an hour. Which change cuts CI time while still testing every changed model?", "is_multi_select": false, "options": {"A": "Run `dbt build` on every PR with more threads.", "B": "Disable all tests in CI and run them only after merge.", "C": "Increase the CI warehouse size.", "D": "Use a CI job with `dbt build --select state:modified+` that compares against the Production environment."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "It still builds every model."}, "B": {"label": "❌ Incorrect", "text": "That removes the safety net CI exists for."}, "C": {"label": "❌ Incorrect", "text": "Not a documented approach, and it doesn't cut the amount of work."}, "D": {"label": "✅ Correct", "text": "This is the default CI command. It builds only new or changed models and their downstream dependents, and deferring to Production means unmodified upstream models aren't rebuilt."}}, "key_rule": "Slim CI = `dbt build --select state:modified+` + compare against the Production environment."}, {"id": "q05_Q1", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 1, "high_yield": true, "subdomain_id": "4c.1", "subdomain_topic": "What `dbt clone` does", "question_text": "A team runs `dbt clone --state ./prod_artifacts` on a platform where a production model exists as a table. What does dbt create in the target schema?", "is_multi_select": false, "options": {"A": "A zero-copy clone, if the platform supports it (Snowflake, Databricks, BigQuery). Otherwise a pointer view (`select * from` the source).", "B": "Always a pointer view, on every platform.", "C": "A full physical copy of the table, on every platform.", "D": "Nothing, until `--defer` is passed."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say that if the platform supports zero-copy cloning of tables (Snowflake, Databricks, or BigQuery) and the model exists as a table in the source environment, dbt creates it as a clone. Otherwise it creates a simple pointer view."}, "B": {"label": "❌ Incorrect", "text": "Pointer views are the fallback, not the default on clone-capable platforms."}, "C": {"label": "❌ Incorrect", "text": "Zero-copy clones aren't full copies, and the fallback is a view."}, "D": {"label": "❌ Incorrect", "text": "`dbt clone` relies on `--defer` but doesn't need it passed in the dbt platform CLI."}}, "key_rule": "Clone = zero-copy on Snowflake, Databricks, BigQuery (when the model is a table). Otherwise a pointer view."}, {"id": "q05_Q2", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 2, "high_yield": true, "subdomain_id": "4c.2", "subdomain_topic": "Pre-existing relations", "question_text": "`dbt clone` skips several models that already exist in the target schema. How do you recreate them?", "is_multi_select": false, "options": {"A": "Add `--defer`.", "B": "Use `state:modified` in the selector.", "C": "Add `--full-refresh`.", "D": "Wait for the production job to finish."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`--defer` controls how unselected upstream nodes resolve, not whether existing relations are recreated."}, "B": {"label": "❌ Incorrect", "text": "Selectors choose nodes. They don't change the skip behavior."}, "C": {"label": "✅ Correct", "text": "By default `dbt clone` doesn't recreate pre-existing relations in the current target. `--full-refresh` recreates all of them."}, "D": {"label": "❌ Incorrect", "text": "Job timing isn't the cause."}}, "key_rule": "`dbt clone` skips existing relations by default. `--full-refresh` recreates them."}, {"id": "q05_Q3", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 3, "high_yield": false, "subdomain_id": "4c.3", "subdomain_topic": "Deferral with `dbt clone`", "question_text": "A developer runs `dbt clone` in the Studio IDE and the unselected upstream models aren't resolved against production. What should they check?", "is_multi_select": false, "options": {"A": "That `--full-refresh` is set.", "B": "That the \"Defer to production\" toggle is on. The dbt platform CLI includes `--defer` automatically.", "C": "That the job runs on a schedule.", "D": "That the project uses a staging environment."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`--full-refresh` only recreates existing relations."}, "B": {"label": "✅ Correct", "text": "`dbt clone` relies on `--defer`. The platform CLI includes the flag automatically. In the Studio IDE you enable the \"Defer to production\" toggle first."}, "C": {"label": "❌ Incorrect", "text": "Scheduling has nothing to do with it."}, "D": {"label": "❌ Incorrect", "text": "Not required for deferral."}}, "key_rule": "Platform CLI adds `--defer` automatically. Studio IDE needs the \"Defer to production\" toggle."}, {"id": "q05_Q4", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 4, "high_yield": true, "subdomain_id": "4c.4", "subdomain_topic": "Clone vs deferral", "question_text": "A BI team wants to test downstream dashboards against production-like data before a release. A separate team only needs to test dbt logic in CI and wants the cheapest option. Which choices fit?", "is_multi_select": false, "options": {"A": "Deferral for both.", "B": "Clone for both.", "C": "Deferral for the BI test, clone for CI.", "D": "Clone for the BI test, deferral for CI."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deferral only changes how dbt resolves `ref()`. A BI tool needs real objects in the warehouse."}, "B": {"label": "❌ Incorrect", "text": "Clone needs compute and creates additional objects. The docs say deferral is often a cheaper and simpler alternative."}, "C": {"label": "❌ Incorrect", "text": "Reversed."}, "D": {"label": "✅ Correct", "text": "The docs list \"testing code changes on downstream dependencies in your BI tool\" as a clone use case, and note that deferral is in many cases cheaper and simpler."}}, "key_rule": "Clone creates real warehouse objects (needs compute). Deferral is often cheaper and simpler."}, {"id": "q05_Q5", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 5, "high_yield": false, "subdomain_id": "4c.5", "subdomain_topic": "Documented clone use cases", "question_text": "Which of these is a documented use case for `dbt clone`?", "is_multi_select": false, "options": {"A": "Replacing `dbt test` in deployment jobs.", "B": "Handling incremental models in dbt CI jobs, on warehouses with zero-copy cloning.", "C": "Running snapshots in parallel.", "D": "Automatically reducing warehouse costs."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Clone doesn't run tests."}, "B": {"label": "✅ Correct", "text": "The docs list four uses: blue/green continuous deployment, cloning production into development schemas, handling incremental models in CI jobs, and testing downstream changes in your BI tool."}, "C": {"label": "❌ Incorrect", "text": "Not a documented use."}, "D": {"label": "❌ Incorrect", "text": "Clone actually needs compute and creates extra objects."}}, "key_rule": "Clone uses: blue/green, prod → dev schemas, incrementals in CI, BI testing."}, {"id": "q05_Q6", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 6, "high_yield": false, "subdomain_id": "4c.6", "subdomain_topic": "Incremental models in CI", "question_text": "In a Slim CI job, a modified incremental model builds in full because it doesn't exist in the PR schema yet. What do the docs suggest?", "is_multi_select": false, "options": {"A": "Run the job with `--full-refresh` always.", "B": "Clone production's incremental tables into the PR schema first, then build: `dbt clone --select state:modified+,config.materialized:incremental,state:old`.", "C": "Switch the model to a view in CI.", "D": "Disable `is_incremental()`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "That is the problem: it builds in full."}, "B": {"label": "✅ Correct", "text": "With the clone in place, the incremental model runs in incremental mode. `state:old` excludes brand-new incremental models that don't exist in production. It needs dbt 1.6+ and a warehouse with zero-copy cloning, otherwise you only get pointer views."}, "C": {"label": "❌ Incorrect", "text": "Not suggested."}, "D": {"label": "❌ Incorrect", "text": "Not suggested."}}, "key_rule": "Clone existing incrementals into the PR schema before `dbt build --select state:modified+`."}, {"id": "q05_Q7", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 7, "high_yield": true, "subdomain_id": "4c.7", "subdomain_topic": "Is blue/green built in?", "question_text": "A teammate says \"run the built-in blue/green command\". What's the accurate answer?", "is_multi_select": false, "options": {"A": "`dbt blue-green` exists in dbt v1.6+.", "B": "Blue/green is a setting on the Production environment.", "C": "The docs list blue/green as a use case for `dbt clone`. The database swap is a custom macro you run with `dbt run-operation`.", "D": "It's an Enterprise+ job type."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No such command."}, "B": {"label": "❌ Incorrect", "text": "No such environment setting."}, "C": {"label": "✅ Correct", "text": "The docs mention \"blue/green continuous deployment\" only as a `dbt clone` use case on zero-copy warehouses. The swap (for example Snowflake `alter database prod swap with stage`) is a macro you write and run via `dbt run-operation`."}, "D": {"label": "❌ Incorrect", "text": "Not a job type or plan feature."}}, "key_rule": "`swap_database` is a custom macro, not a built-in command."}, {"id": "q05_Q8", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 8, "high_yield": true, "subdomain_id": "4c.8", "subdomain_topic": "Job step order", "question_text": "Which job command order matches the community blue/green pattern?", "is_multi_select": false, "options": {"A": "`dbt run-operation swap_database` → `dbt run` → `dbt test`", "B": "`dbt test` → `dbt run` → `dbt run-operation swap_database`", "C": "`dbt run` → `dbt test` → `dbt run-operation swap_database`", "D": "`dbt run` → `dbt run-operation swap_database` → `dbt test`"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Swapping first promotes an unbuilt database."}, "B": {"label": "❌ Incorrect", "text": "Testing before building tests old data."}, "C": {"label": "✅ Correct", "text": "Build in the stage database, test it, then swap so the tested data becomes prod."}, "D": {"label": "❌ Incorrect", "text": "Swapping before testing puts untested data in prod."}}, "key_rule": "`dbt run` → `dbt test` → `dbt run-operation swap_database`."}, {"id": "q05_Q9", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 9, "high_yield": false, "subdomain_id": "4c.9", "subdomain_topic": "Test failure", "question_text": "In the same job, `dbt test` fails. What happens to the swap step?", "is_multi_select": false, "options": {"A": "It runs anyway.", "B": "It runs only for models whose tests passed.", "C": "It doesn't run. A failed step stops the job, so production is unchanged.", "D": "It runs but is flagged degraded."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A failed command stops the remaining steps."}, "B": {"label": "❌ Incorrect", "text": "The swap moves a whole database, not individual models."}, "C": {"label": "✅ Correct", "text": "The swap is the last step, so it never runs after a failure. Production stays as it was."}, "D": {"label": "❌ Incorrect", "text": "There's no degraded swap."}}, "key_rule": "Failed run or test stops the job, so no swap."}, {"id": "q05_Q10", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 10, "high_yield": false, "subdomain_id": "4c.10", "subdomain_topic": "Partial runs", "question_text": "An engineer runs `dbt run --select state:modified` in the stage database and then triggers the swap. What is the risk?", "is_multi_select": false, "options": {"A": "None. dbt tracks what was rebuilt.", "B": "The swap fails automatically.", "C": "Only modified models are swapped.", "D": "The swap moves the whole stage database. Anything not rebuilt may be stale or missing, so production gets an inconsistent state."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt doesn't check this. The swap is a custom macro."}, "B": {"label": "❌ Incorrect", "text": "It just swaps the databases."}, "C": {"label": "❌ Incorrect", "text": "A database swap isn't per model."}, "D": {"label": "✅ Correct", "text": "This follows from how a database swap works. Only swap after a full build."}}, "key_rule": "The swap moves the whole database. Swap only after a full build."}, {"id": "q05_Q11", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 11, "high_yield": true, "subdomain_id": "4c.11", "subdomain_topic": "Views after the swap", "question_text": "After a swap, views in the warehouse return stale data or fail with \"does not exist\" errors. What is the community fix?", "is_multi_select": false, "options": {"A": "Re-run `dbt test`.", "B": "Use `--full-refresh` on every model.", "C": "Override `ref` (and `source`) so compiled SQL doesn't include the database name.", "D": "Swap schemas instead of databases."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Tests don't change view definitions."}, "B": {"label": "❌ Incorrect", "text": "Rebuilding doesn't fix fully qualified names baked into views."}, "C": {"label": "✅ Correct", "text": "Fully qualified references in views point to a database name that now holds different data. Dropping the database name from `ref` and `source` fixes it."}, "D": {"label": "❌ Incorrect", "text": "The thread advises against schema swapping because it can break views and custom schemas."}}, "key_rule": "Override `ref` / `source` to drop the database name so views follow the swap."}, {"id": "q05_Q12", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments and dbt clone", "question_num": 12, "high_yield": false, "subdomain_id": "4c.12", "subdomain_topic": "Platforms", "question_text": "A team wants blue/green on BigQuery. What does the community thread say?", "is_multi_select": false, "options": {"A": "Use `alter database ... swap with`.", "B": "Datasets can't be renamed, so the thread links a workaround.", "C": "BigQuery doesn't support `dbt clone`.", "D": "Use `dbt clone` only, no swap needed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "That's Snowflake."}, "B": {"label": "✅ Correct", "text": "The Snowflake `swap with` doesn't exist for BigQuery datasets, so the thread links a workaround."}, "C": {"label": "❌ Incorrect", "text": "BigQuery is one of the zero-copy clone platforms."}, "D": {"label": "❌ Incorrect", "text": "Clone doesn't swap anything."}}, "key_rule": "Snowflake swaps databases. BigQuery datasets can't be renamed. Clone is zero-copy on Snowflake, Databricks, BigQuery."}, {"id": "q06_Q1", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 1, "high_yield": true, "subdomain_id": "5.1", "subdomain_topic": "IT license ignores group permissions", "question_text": "A new hire needs to manage users, groups, and SSO settings, but should have no access to the dbt IDE, jobs, or data. An admin assigns them an IT license and adds them to the Account Admin group. What level of access will this user have?", "is_multi_select": false, "options": {"A": "The assignment will fail — IT-licensed users cannot be added to the Account Admin group.", "B": "Full Account Admin access — the Account Admin group overrides license restrictions for IT users.", "C": "IT access plus the ability to run jobs since Account Admin includes job execution.", "D": "Fixed IT access only: Security Admin + Billing Admin + edit Connections. The Account Admin group assignment has zero effect."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Technically you can add IT-licensed users to any group — but the group membership has zero effect on their access."}, "B": {"label": "❌ Incorrect", "text": "IT and Read-Only licenses are the two license types that **do not inherit from any permission sets**. Group assignment is completely irrelevant for these users."}, "C": {"label": "❌ Incorrect", "text": "IT license does not inherit job execution from Account Admin group."}, "D": {"label": "✅ Correct", "text": "**IT-licensed users have fixed, non-overridable access**: Security Admin + Billing Admin + the ability to edit Connections. No matter which group they're in — including Account Admin — their access does not change. To get the admin's intended capability (user/group/SSO management), the IT license is actually correct for that purpose. But they'll never get IDE or job access."}}, "key_rule": "IT and Read-Only licenses **ignore all group assignments**. License type = fixed access, no override possible."}, {"id": "q06_Q2", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 2, "high_yield": true, "subdomain_id": "5.2", "subdomain_topic": "Read-Only license trap", "question_text": "A contractor needs view-only access to a specific project's models in dbt Catalog. An admin assigns them a Read-Only lice
