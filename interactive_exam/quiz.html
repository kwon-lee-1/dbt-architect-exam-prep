<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbt Architect Exam Quiz</title>
<style>
:root {
  --c-correct: #16a34a;
  --c-correct-bg: #f0fdf4;
  --c-wrong: #dc2626;
  --c-wrong-bg: #fef2f2;
  --c-sel: #2563eb;
  --c-sel-bg: #eff6ff;
  --c-rule-bg: #fefce8;
  --c-rule-border: #ca8a04;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f3f4f6;
  min-height: 100vh;
  color: #111827;
  line-height: 1.5;
}
#header {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 16px;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  max-width: 820px;
  margin-left: auto;
  margin-right: auto;
}
.score-badge {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  white-space: nowrap;
  min-width: 130px;
}
.progress-wrap {
  flex: 1;
  height: 6px;
  background: #e5e7eb;
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: #2563eb;
  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.header-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  max-width: 820px;
  margin: 0 auto;
  flex-wrap: wrap;
}
#filter-select {
  flex: 1;
  min-width: 180px;
  padding: 5px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  cursor: pointer;
  color: #374151;
}
#shuffle-btn {
  padding: 5px 14px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  cursor: pointer;
  color: #374151;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
#shuffle-btn.on { background: #2563eb; color: #fff; border-color: #2563eb; }
#main {
  max-width: 820px;
  margin: 20px auto 80px;
  padding: 0 16px;
}
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  padding: 28px 28px 24px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.topic-pill {
  font-size: 11px;
  font-weight: 500;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 2px 10px;
  color: #6b7280;
}
.star-badge {
  font-size: 11px;
  font-weight: 600;
  background: #fef9c3;
  border: 1px solid #fde047;
  border-radius: 999px;
  padding: 2px 8px;
  color: #713f12;
}
.q-counter {
  margin-left: auto;
  font-size: 13px;
  color: #9ca3af;
  font-weight: 500;
}
.subdomain {
  font-size: 11px;
  color: #9ca3af;
  margin-bottom: 14px;
  font-style: italic;
}
.question-text {
  font-size: 15px;
  line-height: 1.65;
  color: #111827;
  margin-bottom: 20px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}
.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  color: #111827;
  transition: border-color 0.12s, background 0.12s;
  font-family: inherit;
}
.opt:hover:not([disabled]) { border-color: #93c5fd; background: #f0f7ff; }
.opt[disabled] { cursor: default; }
.opt-letter { font-weight: 700; min-width: 18px; color: #9ca3af; flex-shrink: 0; }
.opt.selected { border-color: var(--c-sel); background: var(--c-sel-bg); }
.opt.selected .opt-letter { color: var(--c-sel); }
.opt.correct { border-color: var(--c-correct); background: var(--c-correct-bg); }
.opt.correct .opt-letter { color: var(--c-correct); }
.opt.wrong-sel { border-color: var(--c-wrong); background: var(--c-wrong-bg); }
.opt.wrong-sel .opt-letter { color: var(--c-wrong); }
.action-row { display: flex; align-items: center; gap: 12px; }
.btn-submit {
  padding: 9px 22px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-submit:hover:not([disabled]) { background: #1d4ed8; }
.btn-submit[disabled] { background: #9ca3af; cursor: default; }
.select-hint { font-size: 13px; color: #9ca3af; }
.divider { border: none; border-top: 1px solid #f3f4f6; margin: 20px 0; }
.expl-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.expl-item { border-radius: 8px; padding: 11px 14px; border-left: 3px solid transparent; }
.expl-item.correct { background: var(--c-correct-bg); border-left-color: var(--c-correct); }
.expl-item.wrong-sel { background: var(--c-wrong-bg); border-left-color: var(--c-wrong); }
.expl-item.neutral { background: #f9fafb; border-left-color: #e5e7eb; }
.expl-head { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.expl-text { font-size: 13px; color: #374151; line-height: 1.5; }
.key-rule {
  background: var(--c-rule-bg);
  border-left: 4px solid var(--c-rule-border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 16px;
}
.btn-next {
  padding: 9px 22px;
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-next:hover { background: #15803d; }
.kbd-hint { text-align: center; font-size: 11px; color: #d1d5db; margin-top: 14px; }
.end-wrap { text-align: center; padding: 60px 24px; }
.end-score { font-size: 56px; font-weight: 700; line-height: 1; color: #111827; margin-bottom: 8px; }
.end-pct { font-size: 28px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
.end-sub { font-size: 15px; color: #9ca3af; margin-bottom: 32px; }
.btn-restart {
  padding: 12px 36px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn-restart:hover { background: #1d4ed8; }
code {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 0.875em;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  border-radius: 3px;
  padding: 1px 4px;
}
strong { font-weight: 600; }
a { color: #2563eb; }
</style>
</head>
<body>

<div id="header">
  <div class="header-top">
    <span class="score-badge" id="score-badge">Score: —</span>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>
  <div class="header-controls">
    <select id="filter-select"></select>
    <button id="shuffle-btn">Shuffle: OFF</button>
  </div>
</div>

<div id="main">
  <div class="card" id="card"></div>
  <div class="kbd-hint" id="kbd-hint"></div>
</div>

<script>
const ALL_QUESTIONS = [{"id": "q01_Q1", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 1, "high_yield": false, "subdomain_id": "1.1", "subdomain_topic": "Snowflake account identifier format", "question_text": "A developer sets up a new Snowflake connection in dbt Cloud. They enter `db5261993.snowflakecomputing.com` as the account identifier. The connection test passes in the UI, but all scheduled jobs fail silently with a connection error. What is the most likely cause?", "is_multi_select": false, "options": {"A": "The Snowflake warehouse is suspended and needs to be resumed before dbt can connect.", "B": "The account identifier uses the full domain URL instead of the locator format, causing a silent connection failure.", "C": "The dbt Cloud IP addresses are not whitelisted in Snowflake's network policy.", "D": "The user account does not have the required `USAGE` privilege on the warehouse."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A suspended warehouse causes query errors, not a connection-level silent failure. The test would have caught a warehouse issue."}, "B": {"label": "✅ Correct", "text": "Snowflake requires the **locator format** (e.g., `db5261993.east-us-2.azure`), NOT the full `.snowflakecomputing.com` domain. Using the full URL causes a silent connection failure — the UI connection test may still pass but jobs fail."}, "C": {"label": "❌ Incorrect", "text": "Missing IP whitelist would cause an explicit network-level rejection, not a silent failure tied to the identifier format."}, "D": {"label": "❌ Incorrect", "text": "Missing privileges would cause permission errors on specific operations, not a connection-level failure."}}, "key_rule": "Snowflake account ID = locator format only (`db5261993.east-us-2.azure`). Never use the full `.snowflakecomputing.com` URL."}, {"id": "q01_Q2", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 2, "high_yield": false, "subdomain_id": "1.2", "subdomain_topic": "IP whitelisting", "question_text": "Your organization adds a new cloud region to its dbt Cloud account. Immediately after, Snowflake's network policy begins blocking dbt connections. No firewall rules were changed. What is the root cause?", "is_multi_select": false, "options": {"A": "The new region uses a different Snowflake driver that is incompatible with the existing network policy.", "B": "Raw IP addresses were hardcoded in the Snowflake network policy instead of using dbt-provided hostnames.", "C": "The dbt Cloud service account needs to be re-authenticated after a region change.", "D": "PrivateLink was not configured for the new region."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud uses consistent drivers across regions. Driver incompatibility is not a firewall issue."}, "B": {"label": "✅ Correct", "text": "dbt publishes **static hostnames** but the **underlying IPs are dynamic** (cloud infrastructure can reassign them). If you hardcode IPs, any infrastructure change — including adding a region — silently breaks the allowlist. Always use hostnames, not raw IPs."}, "C": {"label": "❌ Incorrect", "text": "Service account credentials don't change when a region is added."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink is a separate network architecture choice. The scenario describes a firewall rule failure, not a missing PrivateLink setup."}}, "key_rule": "Always use **hostnames** in firewall rules — never raw IPs. dbt's underlying IPs are dynamic."}, {"id": "q01_Q3", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 3, "high_yield": false, "subdomain_id": "1.3", "subdomain_topic": "PrivateLink", "question_text": "Which of the following accurately describes the requirements and behavior of dbt Cloud's PrivateLink feature? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "PrivateLink is available on all dbt Cloud plans including Starter.", "B": "PrivateLink provides VPC-to-VPC connectivity with no public internet traversal.", "C": "PrivateLink is region-specific — you must configure it separately for each region.", "D": "PrivateLink automatically configures IP whitelisting in your warehouse once enabled.", "E": "PrivateLink replaces the need for service accounts in production environments."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "PrivateLink is **Enterprise-only** — not available on Starter or Developer plans."}, "B": {"label": "✅ Correct", "text": "PrivateLink creates a VPC-to-VPC connection that routes entirely within the cloud provider's private network, bypassing the public internet."}, "C": {"label": "✅ Correct", "text": "PrivateLink is **region-specific** — each region requires its own configuration. A multi-region setup needs separate PrivateLink configurations per region."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink and IP whitelisting are separate mechanisms. PrivateLink doesn't auto-configure warehouse firewall rules."}, "E": {"label": "❌ Incorrect", "text": "PrivateLink is a network topology feature, completely unrelated to authentication methods like service accounts."}}, "key_rule": "PrivateLink = Enterprise-only, VPC-to-VPC, region-specific. Also note: CI hooks are NOT available with PrivateLink."}, {"id": "q01_Q4", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 4, "high_yield": true, "subdomain_id": "1.4", "subdomain_topic": "Snowflake Fusion key pair authentication", "question_text": "A team configures key pair authentication for a Snowflake connection using the dbt Fusion engine. The connection test fails with the error \"Could not deserialize key data.\" What is the most likely cause?", "is_multi_select": false, "options": {"A": "Key pair authentication is not supported by the Fusion engine — only username/password is allowed.", "B": "The private key was generated in 3DES format instead of PKCS#8 AES-256 format.", "C": "The public key was not uploaded to Snowflake before testing the connection.", "D": "The key pair passphrase contains special characters that dbt cannot parse."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Fusion engine does support key pair authentication — it specifically requires it."}, "B": {"label": "✅ Correct", "text": "Fusion requires **PKCS#8 AES-256** format. Legacy **3DES** format keys (and headerless keys) are rejected with exactly this error message: \"Could not deserialize key data.\""}, "C": {"label": "❌ Incorrect", "text": "Not uploading the public key to Snowflake would cause an authentication rejection from Snowflake — a different error, not a deserialization error on dbt's side."}, "D": {"label": "❌ Incorrect", "text": "The passphrase is a separate field and would produce a passphrase-related error, not a key deserialization error."}}, "key_rule": "Fusion key pair = **PKCS#8 AES-256 only**. 3DES format → \"Could not deserialize key data.\""}, {"id": "q01_Q5", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 5, "high_yield": false, "subdomain_id": "1.5", "subdomain_topic": "Connections are account-level", "question_text": "An organization has three dbt Cloud projects: `sales`, `marketing`, and `finance`. They want `sales` and `marketing` to use the same Snowflake account but with different warehouse names. Which of the following is true?", "is_multi_select": false, "options": {"A": "Each project must have its own dedicated connection — connections cannot be shared across projects.", "B": "A single connection can be shared across multiple projects; environment-level settings control warehouse overrides.", "C": "The connection must be duplicated per project, but the credentials can be the same.", "D": "Connections are project-level, so `sales` and `marketing` will automatically use different connections."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is the opposite of how dbt Cloud works. Connections are account-level and are explicitly designed to be shared."}, "B": {"label": "✅ Correct", "text": "Connections are **account-level** — shared across multiple projects. Different projects (or different environments within a project) can override warehouse-level settings at the environment level without needing separate connections."}, "C": {"label": "❌ Incorrect", "text": "There is no need to duplicate connections. The same connection object is referenced by multiple projects."}, "D": {"label": "❌ Incorrect", "text": "Connections are account-level, not project-level. Multiple projects can and do share the same connection."}}, "key_rule": "Connections are **account-level** (not project-level) — shared across projects. Each environment references exactly one connection."}, {"id": "q01_Q6", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 6, "high_yield": false, "subdomain_id": "1.6", "subdomain_topic": "BigQuery OAuth limitations", "question_text": "A team on a Starter plan wants to configure OAuth authentication for their BigQuery connection so developers can use their personal Google accounts in the dbt Cloud IDE. Will this work?", "is_multi_select": false, "options": {"A": "Yes — BigQuery OAuth is available on all plans including Starter.", "B": "No — BigQuery OAuth requires Enterprise tier and is unavailable on Starter.", "C": "Yes — OAuth works for IDE use on Starter but not for production jobs.", "D": "No — BigQuery does not support OAuth; only service account JSON files are supported."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "BigQuery OAuth in dbt Cloud is plan-gated — it is not available on Starter."}, "B": {"label": "✅ Correct", "text": "BigQuery OAuth (Client ID + Secret) is available for **development environments on Enterprise tier only**. Starter plan teams must use service account JSON or key-based auth."}, "C": {"label": "❌ Incorrect", "text": "There is no Starter-with-IDE-only exception. The restriction is plan-level regardless of environment type."}, "D": {"label": "❌ Incorrect", "text": "BigQuery does support OAuth in dbt Cloud — it's just gated to Enterprise plans."}}, "key_rule": "BigQuery OAuth = Enterprise tier only. After org setup, users link via **Profile Settings**."}, {"id": "q01_Q7", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 7, "high_yield": false, "subdomain_id": "1.7", "subdomain_topic": "Lineage graph: logical vs physical", "question_text": "A dbt Cloud project uses a Snowflake connection for the development environment and a different Snowflake connection for production. A data engineer expects to see two separate warehouse nodes in the lineage graph in dbt Catalog showing the physical data flow. What will they actually see?", "is_multi_select": false, "options": {"A": "Two separate warehouse nodes labeled with their respective connection names.", "B": "A single logical DAG based on `ref()` and `source()` calls, with no distinction between physical warehouses.", "C": "The lineage graph only shows the production connection since Catalog reflects production only.", "D": "An error — dbt Catalog does not support projects with multiple connections."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The lineage graph has no concept of connections or physical warehouses — it is purely logical."}, "B": {"label": "✅ Correct", "text": "The lineage graph in dbt Catalog is **logical** — it shows model dependencies based on `ref()` and `source()` calls in the DAG, not physical warehouse topology. It does not distinguish which connection ran a model or show cross-warehouse data movement."}, "C": {"label": "❌ Incorrect", "text": "While Catalog reflects production by default, the lineage graph's logical nature is a separate concept from which environment it reflects."}, "D": {"label": "❌ Incorrect", "text": "Multiple connections per project are fully supported. Catalog handles them without error."}}, "key_rule": "Lineage graph = **logical** (based on `ref()`/`source()`), not physical. Never shows warehouse topology."}, {"id": "q01_Q8", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 8, "high_yield": false, "subdomain_id": "1.8", "subdomain_topic": "Managed repositories", "question_text": "An architect is reviewing a team's setup. They find that a dbt Cloud project in active production use is configured with a managed (dbt-hosted) repository instead of a self-hosted Git repository. Which of the following is the primary concern?", "is_multi_select": false, "options": {"A": "Managed repositories cannot store dbt models larger than 100MB.", "B": "Managed repositories do not support pull requests, branching, or standard Git workflows — they are not suitable for production.", "C": "Managed repositories are only available on Enterprise plans.", "D": "Managed repositories cannot be connected to CI jobs."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "File size limits are not a documented concern with managed repositories."}, "B": {"label": "✅ Correct", "text": "Managed (dbt-hosted) repositories are intended for **trial/POC only**. They have no Git workflows, no pull requests, no branching, and no version history. dbt Labs explicitly advises against using them in production."}, "C": {"label": "❌ Incorrect", "text": "Managed repositories are available on all plans — they're the default option for new accounts getting started."}, "D": {"label": "❌ Incorrect", "text": "CI jobs are not the primary concern — the bigger issues are the lack of code review workflows, branching, and version history."}}, "key_rule": "Managed repos = POC/trial only. No PRs, no branching. Migrate to self-hosted before production."}, {"id": "q01_Q9", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 9, "high_yield": false, "subdomain_id": "1.9", "subdomain_topic": "Snowflake MFA authentication", "question_text": "A company wants to enforce multi-factor authentication (MFA) for all dbt Cloud connections to Snowflake, including production jobs. Is this possible?", "is_multi_select": false, "options": {"A": "Yes — MFA can be enforced for both development and production environments.", "B": "No — MFA is supported for development environments only; production environments must use service accounts or key pair authentication.", "C": "Yes — MFA is available for production environments when combined with PrivateLink.", "D": "No — dbt Cloud does not support MFA for any Snowflake connection type."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "MFA is explicitly limited to development environments. Production jobs cannot interactively prompt for a second factor."}, "B": {"label": "✅ Correct", "text": "Snowflake MFA is supported for **development environments only** in dbt Cloud. Production pipelines run unattended and cannot complete an interactive MFA challenge. Production should use service accounts or key pair authentication instead."}, "C": {"label": "❌ Incorrect", "text": "PrivateLink affects network routing, not authentication method limitations."}, "D": {"label": "❌ Incorrect", "text": "MFA is supported in dbt Cloud for development use — just not for production."}}, "key_rule": "Snowflake MFA = **dev environments only**. Production = service account or key pair."}, {"id": "q01_Q10", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 10, "high_yield": false, "subdomain_id": "1.10", "subdomain_topic": "Databricks connector", "question_text": "A data platform team has been running dbt models on Databricks using the `dbt-spark` connector for 18 months. They're upgrading to use Unity Catalog and Python models. What changes must they make? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Migrate from `dbt-spark` to `dbt-databricks` — `dbt-spark` is deprecated.", "B": "Upgrade to dbt version 1.1+ for Unity Catalog support.", "C": "Upgrade to dbt version 1.3+ for Python model support.", "D": "Upgrade to dbt version 2.0+ for Python model support.", "E": "Unity Catalog requires a Databricks Premium or Enterprise workspace tier."}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "`dbt-spark` is **deprecated**. All Databricks projects must migrate to `dbt-databricks`. This is required regardless of Unity Catalog usage."}, "B": {"label": "❌ Incorrect", "text": "Unity Catalog requires **dbt 1.1+** — this is correct for Unity Catalog but the question asks about *both* Python models and Unity Catalog. B is partially true but C supersedes it as the higher version requirement."}, "C": {"label": "✅ Correct", "text": "Python models on Databricks require **dbt 1.3+**. Since this team needs both Unity Catalog (1.1+) and Python models (1.3+), they must be on at least 1.3."}, "D": {"label": "❌ Incorrect", "text": "Python models require dbt 1.3+, not 2.0+."}, "E": {"label": "❌ Incorrect", "text": "Unity Catalog workspace tier requirements are a Databricks-side concern, not a dbt-side version constraint."}}, "key_rule": "Databricks: `dbt-spark` → deprecated. Unity Catalog = dbt 1.1+. Python models = dbt 1.3+."}, {"id": "q01_Q11", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 11, "high_yield": false, "subdomain_id": "1.11", "subdomain_topic": "Password rotation and OAuth advantage", "question_text": "A team uses username/password authentication for their Snowflake dbt Cloud connection. A security policy rotation forces all Snowflake passwords to be changed immediately. What is the impact on dbt, and what authentication method would have avoided it?", "is_multi_select": false, "options": {"A": "No impact — dbt caches credentials and continues running until the next job restart.", "B": "All dbt jobs immediately fail with authentication errors; the connection credential must be updated in Account Settings. OAuth would have avoided this.", "C": "Only CI jobs fail; deploy jobs use a separate service account that is unaffected.", "D": "Jobs fail only after the session expires; rotating to key pair authentication would have avoided it."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt does not cache credentials between job runs. Each connection attempt uses the stored credential, so a rotated password causes immediate failures."}, "B": {"label": "✅ Correct", "text": "Username/password auth stores the password in the dbt Cloud connection. When the Snowflake password changes, dbt jobs fail immediately — the admin must update the credential in Account Settings → Connections. With **OAuth**, credential revocation and rotation happen at the warehouse side; dbt uses OAuth tokens refreshed against the warehouse, so no dbt config change is required."}, "C": {"label": "❌ Incorrect", "text": "CI and deploy jobs share the same connection credentials. Both are affected equally by a password rotation."}, "D": {"label": "❌ Incorrect", "text": "There is no credential caching — failures are immediate, not session-expiry-delayed. Key pair authentication would also require a credential update on rotation; OAuth is the method that eliminates this manual step."}}, "key_rule": "Username/password rotation = manual update required in dbt. OAuth = revocation is warehouse-side; no dbt config change needed."}, {"id": "q01_Q12", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 12, "high_yield": false, "subdomain_id": "1.12", "subdomain_topic": "Developer OAuth vs service token auth", "question_text": "A developer configures BigQuery OAuth so they can use their personal Google account in the dbt Cloud IDE. They then try to configure a CI service token to also use the same OAuth credentials for automated jobs. What is the correct understanding of how OAuth works in dbt Cloud?", "is_multi_select": false, "options": {"A": "OAuth can be shared between human users and service tokens by linking the OAuth app in Account Settings once.", "B": "OAuth in dbt Cloud is user-level — each developer links their personal account via Profile Settings. Service tokens cannot use OAuth; they authenticate at the connection level using service account credentials.", "C": "Service tokens use OAuth automatically once the organization-level OAuth app is configured.", "D": "OAuth is available for all authentication scenarios in dbt Cloud, but requires Enterprise tier for service tokens."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "OAuth credentials are not shareable between users and service tokens. OAuth in dbt Cloud is strictly user-level."}, "B": {"label": "✅ Correct", "text": "dbt Cloud OAuth is a **user-level** feature. Each developer links their personal warehouse account via **Profile Settings → Linked Accounts**. Service tokens are account-level automation credentials — they authenticate at the **connection level** using service account JSON, key pair, or username/password. Service tokens cannot use OAuth."}, "C": {"label": "❌ Incorrect", "text": "Configuring the OAuth app at the org level enables it for human users only. Service tokens are not affected by this setup."}, "D": {"label": "❌ Incorrect", "text": "OAuth for service tokens is not a supported feature on any tier. The restriction is architectural, not plan-based."}}, "key_rule": "OAuth in dbt = user-level (Profile Settings). Service tokens = connection-level (service account / key pair). These are separate systems."}, {"id": "q01_Q13", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 13, "high_yield": false, "subdomain_id": "1.13", "subdomain_topic": "Snowflake custom domain", "question_text": "A company uses a custom vanity domain (`analytics.company.com`) for their Snowflake account instead of the standard locator URL. A developer configures the dbt Cloud connection using `analytics.company.com` in the Account field. The connection test fails. What is the correct way to configure this?", "is_multi_select": false, "options": {"A": "Use the full URL `https://analytics.company.com` in the Account field.", "B": "Contact Snowflake support to get the locator-format account ID that maps to the custom domain.", "C": "Enter the locator-format account ID in the Account field and add `host: https://analytics.company.com` as an extended attribute on the environment.", "D": "Custom domains are not supported in dbt Cloud Snowflake connections — the locator format must always be used directly."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Account field expects a locator-format ID, not a full HTTPS URL — this will cause a parsing error or silent failure."}, "B": {"label": "❌ Incorrect", "text": "While the locator ID exists, Snowflake custom domains can be configured in dbt without needing to abandon the custom domain."}, "C": {"label": "✅ Correct", "text": "For Snowflake custom domains, the **Account field** must still contain the locator-format account ID. The custom domain is specified separately using the extended attribute `host: https://your_custom_domain.com` on the environment. Both pieces are needed."}, "D": {"label": "❌ Incorrect", "text": "Custom domains are supported — they require the `host` extended attribute alongside the locator-format account ID."}}, "key_rule": "Snowflake custom domain = locator ID in Account field + `host: https://custom_domain.com` in extended attributes."}, {"id": "q01_Q14", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 14, "high_yield": false, "subdomain_id": "1.14", "subdomain_topic": "Snowflake minimum permissions", "question_text": "A new Snowflake service account is created for dbt Cloud. An admin grants only `USAGE` on the warehouse, database, and schema, plus `SELECT` on all tables. After connecting successfully, the dbt jobs fail when trying to materialize models. What is the most likely missing permission?", "is_multi_select": false, "options": {"A": "`MONITOR` on the warehouse — required to track query execution.", "B": "`CREATE TABLE` and `CREATE VIEW` on the schema — required for dbt to materialize models.", "C": "`SYSADMIN` role — required for dbt to manage schemas.", "D": "`OWNERSHIP` on the target schema — required for model creation."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`MONITOR` on the warehouse is not in the documented minimum permission set for dbt."}, "B": {"label": "✅ Correct", "text": "`SELECT` alone is insufficient. dbt materializes models by creating or replacing tables and views. The minimum permissions include `USAGE` on warehouse/database/schema **plus** `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `INSERT`, `UPDATE`, `DELETE`, `TRUNCATE`, and `DROP` on the schema. Without `CREATE TABLE` and `CREATE VIEW`, model materialization fails."}, "C": {"label": "❌ Incorrect", "text": "`SYSADMIN` is far more permissive than needed and is not a documented requirement. A purpose-built role with specific grants is the best practice."}, "D": {"label": "❌ Incorrect", "text": "`OWNERSHIP` is also overly permissive. dbt only needs specific DML/DDL grants, not ownership."}}, "key_rule": "Snowflake minimum = `USAGE` (warehouse/DB/schema) + `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `INSERT`, `UPDATE`, `DELETE`, `TRUNCATE`, `DROP`."}, {"id": "q01_Q15", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 15, "high_yield": false, "subdomain_id": "1.15", "subdomain_topic": "BigQuery OAuth setup flow", "question_text": "An Enterprise-tier team successfully configures BigQuery OAuth at the organization level in dbt Cloud Account Settings. A developer on the team opens the dbt Cloud IDE but gets an authentication error even though the org-level OAuth app is configured. What step is the developer missing?", "is_multi_select": false, "options": {"A": "The developer must request an IT admin to link their account — individual users cannot complete this step themselves.", "B": "The developer must link their personal BigQuery account via **Profile Settings → Linked Accounts** in dbt Cloud.", "C": "The developer must log out and back in so dbt Cloud re-reads the org-level OAuth configuration.", "D": "The developer must be assigned the Database Admin permission set before OAuth becomes active for their profile."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Individual developers complete this step themselves in their own profile — it is not an admin-delegated action."}, "B": {"label": "✅ Correct", "text": "Org-level OAuth setup is only step one. Each developer must independently link their personal BigQuery Google account by navigating to **Profile Settings → Linked Accounts** in dbt Cloud. Until they do, the IDE falls back to the connection-level service account credentials, or fails if none are configured."}, "C": {"label": "❌ Incorrect", "text": "Logging out does not trigger the personal OAuth linking flow. The developer must explicitly navigate to Profile Settings."}, "D": {"label": "❌ Incorrect", "text": "OAuth personal linking is not gated on any specific permission set — any developer with IDE access can complete this step."}}, "key_rule": "BigQuery OAuth = two steps: (1) admin sets up org OAuth app; (2) each developer links personal account via Profile Settings → Linked Accounts."}, {"id": "q01_Q16", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 16, "high_yield": false, "subdomain_id": "1.16", "subdomain_topic": "Databricks Unity Catalog naming and permissions", "question_text": "A team migrates their Databricks dbt project to Unity Catalog. After enabling the Catalog field in their dbt Cloud environment and running their models, they notice model references in SQL use two-part names (`schema.model`) instead of three-part names. They also get `USE CATALOG` permission errors. What explains both issues?", "is_multi_select": false, "options": {"A": "Three-part naming requires dbt 1.6+ — the team is on an older version.", "B": "Unity Catalog three-part naming (`catalog.schema.model`) is only enabled automatically when `dbt-databricks` is used. The `USE CATALOG` error occurs because the service account lacks `USE CATALOG` and `USE SCHEMA` privileges.", "C": "The Catalog field in the environment must be set to the catalog name; three-part naming then becomes automatic, and `USE CATALOG` is granted by the `SYSADMIN` role automatically.", "D": "Three-part naming must be enabled manually in `dbt_project.yml` using the `quoting` config block."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Unity Catalog support was added in dbt 1.1+ — version is not the root cause here."}, "B": {"label": "✅ Correct", "text": "With `dbt-databricks` and a Catalog field set in the environment, Unity Catalog **three-part naming** (`catalog.schema.model`) is enabled automatically. The `USE CATALOG` error confirms the service account is missing required Unity Catalog permissions: `USE CATALOG`, `USE SCHEMA`, `SELECT`, `CREATE TABLE`, `CREATE VIEW`, and `MODIFY` must all be granted explicitly."}, "C": {"label": "❌ Incorrect", "text": "`SYSADMIN` does not auto-grant Unity Catalog permissions — these must be explicitly granted via `GRANT` statements in Databricks."}, "D": {"label": "❌ Incorrect", "text": "Three-part naming is controlled by the Catalog field in the environment, not `dbt_project.yml` quoting config."}}, "key_rule": "Databricks Unity Catalog = three-part naming auto-enabled when Catalog field is set. Required permissions: `USE CATALOG`, `USE SCHEMA`, `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `MODIFY`."}, {"id": "q01_Q17", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 17, "high_yield": false, "subdomain_id": "1.17", "subdomain_topic": "Databricks required connection fields", "question_text": "An architect is documenting the minimum required fields for a Databricks connection in dbt Cloud. Which two fields are always required regardless of whether Unity Catalog is used?", "is_multi_select": false, "options": {"A": "Server Hostname and Catalog", "B": "Server Hostname and HTTP Path", "C": "HTTP Path and Token", "D": "Catalog and Token"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Catalog is **optional** — it is only needed when using Unity Catalog. It is not a required field."}, "B": {"label": "✅ Correct", "text": "**Server Hostname** (the Databricks workspace URL) and **HTTP Path** (the SQL warehouse or cluster endpoint) are always required for any Databricks connection. The Token (personal access token or service principal credential) is also required for authentication, but Catalog is optional and only used for Unity Catalog."}, "C": {"label": "❌ Incorrect", "text": "HTTP Path + Token alone are insufficient — Server Hostname is also required and is one of the two most fundamental fields."}, "D": {"label": "❌ Incorrect", "text": "Catalog is optional, and Token alone without Server Hostname and HTTP Path is not sufficient to establish a connection."}}, "key_rule": "Databricks required fields = **Server Hostname** + **HTTP Path**. Catalog is optional (Unity Catalog only). Token is required for auth."}, {"id": "q01_Q18", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 18, "high_yield": false, "subdomain_id": "1.18", "subdomain_topic": "Platform-specific editable environment fields", "question_text": "A team uses Redshift as their data warehouse. An architect wants to use the environment UI to override the schema that a production deployment job writes to, separate from the connection-level schema. They navigate to the environment settings but find no editable schema field. What is the correct approach?", "is_multi_select": false, "options": {"A": "The schema field is hidden by default — enable \"Advanced mode\" in the environment settings to reveal it.", "B": "Redshift environment settings have no editable connection fields in the UI; schema overrides must be done via extended attributes on the environment.", "C": "Redshift schema overrides must be set at the job level using environment variables, not at the environment level.", "D": "Redshift connections require the schema to be defined at the connection level — it cannot be overridden per environment."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no \"Advanced mode\" toggle that reveals hidden Redshift environment fields."}, "B": {"label": "✅ Correct", "text": "For **Postgres, Redshift, BigQuery, and Spark**, the environment UI has **no editable connection fields** — all settings are inferred from the project connection. To override values like schema, use **extended attributes** (a YAML snippet in the environment settings that overrides `profiles.yml` top-level keys). Snowflake is the exception — it exposes Role, Database, and Warehouse as editable fields directly in the environment UI."}, "C": {"label": "❌ Incorrect", "text": "While job-level environment variables can influence schema naming via custom macros, the canonical override mechanism at the environment level is extended attributes."}, "D": {"label": "❌ Incorrect", "text": "Redshift schemas can be overridden per environment — just not via a UI field. Extended attributes are the mechanism."}}, "key_rule": "Snowflake = editable Role/Database/Warehouse in environment UI. Postgres/Redshift/BigQuery/Spark = no UI fields; use extended attributes."}, {"id": "q01_Q19", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 19, "high_yield": false, "subdomain_id": "1.19", "subdomain_topic": "Single-warehouse constraint per job", "question_text": "An architect proposes a dbt Cloud architecture where a single production job writes transformed models to both a Snowflake data warehouse and a Redshift warehouse simultaneously, using two separate connections defined in the same project. Is this possible?", "is_multi_select": false, "options": {"A": "Yes — dbt Cloud supports multi-warehouse jobs by specifying multiple target profiles in the job configuration.", "B": "Yes — but only on Enterprise+ plan where multiple connections per job are supported.", "C": "No — each environment references exactly one connection, and a single job cannot write to two warehouses simultaneously.", "D": "No — but the same job can write to two schemas within the same warehouse using the `schema` config on individual models."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not support specifying multiple target profiles for a single job. Each job runs against one environment, which has one connection."}, "B": {"label": "❌ Incorrect", "text": "Multi-warehouse jobs are not a feature on any dbt Cloud plan."}, "C": {"label": "✅ Correct", "text": "A dbt Cloud environment references **exactly one connection**, and a job runs in exactly one environment. Therefore, a single job cannot write to two different warehouses simultaneously. Different environments (e.g., dev on Snowflake, prod on Redshift) can use different connections, but each environment is single-warehouse. Splitting writes across warehouses requires separate projects and separate jobs."}, "D": {"label": "❌ Incorrect", "text": "While models can write to different schemas within one warehouse, this answer sidesteps the actual question about cross-warehouse writes, which remain unsupported."}}, "key_rule": "One environment = one connection = one warehouse. A single job cannot write to two warehouses simultaneously."}, {"id": "q01_Q20", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 20, "high_yield": false, "subdomain_id": "1.20", "subdomain_topic": "Managed repository migration", "question_text": "A startup used a dbt-managed (dbt-hosted) repository to prototype their first dbt project over three months. The project is now ready for production. An architect reviews the setup and insists they must migrate before going live. Which of the following is NOT a valid reason to migrate away from a managed repository?", "is_multi_select": false, "options": {"A": "Managed repositories do not support pull requests or code review workflows.", "B": "Managed repositories cannot be connected to external CI/CD systems.", "C": "Managed repositories do not support branching or Git version history.", "D": "Managed repositories cannot be exported to a self-hosted Git provider."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Not the answer", "text": "This IS a valid reason — managed repos have no PR or code review workflow, making them unsuitable for production team collaboration. (A valid reason to migrate.)"}, "B": {"label": "❌ Not the answer", "text": "This IS a valid reason — without a real Git provider, external CI/CD integration is not possible. (A valid reason to migrate.)"}, "C": {"label": "❌ Not the answer", "text": "This IS a valid reason — managed repos have no branching, no version history, and no Git workflow capabilities. (A valid reason to migrate.)"}, "D": {"label": "✅ Correct (NOT a valid reason)", "text": "Managed repositories **can** be exported to a self-hosted Git provider at any time. This is explicitly supported. So \"cannot be exported\" is false — it is NOT a valid reason to urgently migrate. The urgency comes from the lack of PR workflows, branching, and version history, not from being trapped."}}, "key_rule": "Managed repos = no PRs, no branching, no version history — not for production. BUT they CAN be exported to self-hosted at any time."}, {"id": "q02_Q1", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 1, "high_yield": true, "subdomain_id": "2.1", "subdomain_topic": "GitLab personal repos", "question_text": "A developer on a team sets up a GitLab OAuth connection in dbt Cloud pointing to a repository under their personal GitLab account (e.g., `gitlab.com/alice/my-dbt-project`). The OAuth connection succeeds and CI jobs trigger, but no CI runs execute in dbt. What is the root cause?", "is_multi_select": false, "options": {"A": "The developer used `read_api` scope instead of `api` scope for the GitLab OAuth app.", "B": "GitLab repos must belong to a **GitLab group** — personal account repos are not supported for native integration.", "C": "The developer does not have Maintainer role on the repository.", "D": "CI triggers are only supported for GitLab Pro and higher — not GitLab Free."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Using `read_api` instead of `api` scope would prevent the OAuth app from functioning entirely, not just cause CI runs to fail silently. However, the question states the connection \"succeeds\" — suggesting scope is not the issue here."}, "B": {"label": "✅ Correct", "text": "dbt Cloud's GitLab native integration only works with repos that belong to a **GitLab group** (e.g., `gitlab.com/my-org/repo`). Personal user account repos (`gitlab.com/alice/repo`) are not supported — the integration will appear to connect but CI will not execute."}, "C": {"label": "❌ Incorrect", "text": "Maintainer role is required to *set up* the connection, but once it's configured, lacking this role would not cause silent CI failures if the integration was previously established."}, "D": {"label": "❌ Incorrect", "text": "CI jobs trigger on GitLab Free — the limitation on Free is that **status is not posted back** to Merge Requests, not that CI won't trigger."}}, "key_rule": "GitLab repos must be in a **GitLab group**, not a personal account. Personal repos are unsupported."}, {"id": "q02_Q2", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 2, "high_yield": true, "subdomain_id": "2.2", "subdomain_topic": "Azure DevOps plan requirements", "question_text": "A company on the dbt Cloud Starter plan connects their Azure DevOps repository using deploy keys. Developers complain that CI jobs never trigger automatically when PRs are opened. The team asks if upgrading to Enterprise would fix this. Is it correct?", "is_multi_select": false, "options": {"A": "No — CI triggers with Azure DevOps are available on all plans; the deploy key setup is likely misconfigured.", "B": "Yes — Azure DevOps native integration (which enables automatic CI triggers) is **Enterprise-only**. Starter can only use deploy keys, which don't support auto CI.", "C": "Yes — but only if they also switch from deploy keys to Service Principal authentication.", "D": "No — Azure DevOps CI triggers require a separate webhook configuration regardless of plan."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deploy keys intentionally do not support automatic CI triggers on any plan. This is not a misconfiguration — it's a plan limitation."}, "B": {"label": "✅ Correct", "text": "Azure DevOps **native integration** (which enables automatic CI triggers and PR status checks) is **Enterprise/Enterprise+ only**. On Starter, teams are limited to deploy keys, which require manual CI triggering via the API."}, "C": {"label": "❌ Incorrect", "text": "While Service Principal is the recommended auth method for Azure DevOps on Enterprise, the issue in the question is the plan limitation — not the auth method."}, "D": {"label": "❌ Incorrect", "text": "Webhooks are part of the native integration — not an additional manual step that works on all plans."}}, "key_rule": "Azure DevOps native integration = **Enterprise/Enterprise+ only**. Starter/Developer = deploy keys, no auto CI."}, {"id": "q02_Q3", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 3, "high_yield": false, "subdomain_id": "2.3", "subdomain_topic": "GitHub native app installation", "question_text": "A company sets up the GitHub native app integration in dbt Cloud. The account admin completes the dbt Cloud side of the setup, but developers report that CI jobs are not triggering on their pull requests. What is the most likely missing step?", "is_multi_select": false, "options": {"A": "The GitHub App was not approved by GitHub's internal review team, causing a 24-hour delay.", "B": "Each developer must link their personal GitHub profile in dbt Cloud separately — org-level setup alone is insufficient.", "C": "The dbt Cloud account needs to be on Enterprise plan for GitHub CI triggers to work.", "D": "The GitHub repository must be set to public for CI triggers to function."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "GitHub Apps don't require review after installation. There is no 24-hour approval delay."}, "B": {"label": "✅ Correct", "text": "Even after the org-level GitHub native app is installed (requiring both a GitHub org owner AND a dbt Account Admin/Owner), **each developer must separately link their personal GitHub account** in dbt Cloud via their Profile settings. Without this, their PRs won't trigger CI."}, "C": {"label": "❌ Incorrect", "text": "GitHub CI triggers are available on all plans that support CI jobs — not just Enterprise."}, "D": {"label": "❌ Incorrect", "text": "Private repositories are fully supported for CI triggers with the GitHub native integration."}}, "key_rule": "GitHub native app requires two steps: org-level install (org owner + dbt admin) AND each developer links personal profile separately."}, {"id": "q02_Q4", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 4, "high_yield": false, "subdomain_id": "2.4", "subdomain_topic": "GitLab Free Plan CI status", "question_text": "A team migrates their Git provider from GitHub to GitLab Free. After the migration, dbt CI jobs run successfully in dbt Cloud and tests pass, but developers say they see no green checkmark on their Merge Requests in GitLab. What is the cause?", "is_multi_select": false, "options": {"A": "The OAuth app is missing the `api` scope — only `read_api` was granted, preventing status write-back.", "B": "dbt CI runs on GitLab Free don't post status checks back to Merge Requests — this is a Free plan limitation.", "C": "The GitLab repo is set to private, blocking dbt from writing status back.", "D": "Status checks only appear in GitLab after the MR is merged, not while it's open."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "If `api` scope was missing, CI would not trigger at all — not trigger but fail to post status. The question states CI runs succeed."}, "B": {"label": "✅ Correct", "text": "**GitLab Free** has a known limitation: CI jobs trigger and run in dbt Cloud, but **CI status is not posted back to Merge Requests**. Developers see no green/red check in the GitLab UI. This requires GitLab Pro or higher, or switching providers."}, "C": {"label": "❌ Incorrect", "text": "Private repository visibility doesn't affect dbt's ability to post status back once the OAuth connection is authorized."}, "D": {"label": "❌ Incorrect", "text": "On GitLab Pro+, status checks appear in real-time on open MRs — not after merge. The behavior described is a plan limitation, not intended functionality."}}, "key_rule": "GitLab Free → CI triggers work but **no status posted back to MRs**. Upgrade to Pro for status checks."}, {"id": "q02_Q5", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 5, "high_yield": false, "subdomain_id": "2.5", "subdomain_topic": "Case-sensitive repository names", "question_text": "A dbt Cloud account admin connects a GitHub repository named `Analytics-Core` to a project. The connection is configured as `analytics-core` (all lowercase) in the dbt Cloud UI. CI jobs are set up and appear functional. What is the likely outcome?", "is_multi_select": false, "options": {"A": "dbt Cloud normalizes repository names to lowercase automatically — no issue will occur.", "B": "The connection will experience silent clone failures because repository names are case-sensitive in the dbt UI.", "C": "CI jobs will fail with an explicit \"repository not found\" error, making the issue easy to diagnose.", "D": "Git connections are case-insensitive on GitHub, so the mismatch will have no effect."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not normalize repository names. The exact string is used as entered."}, "B": {"label": "✅ Correct", "text": "Repository names in the dbt UI are **case-sensitive**. A mismatch between `Analytics-Core` and `analytics-core` causes **silent clone failures** — not an obvious error, making this a difficult bug to diagnose."}, "C": {"label": "❌ Incorrect", "text": "The failure is described as \"silent\" in dbt documentation — it doesn't always produce a clear error message, which is what makes it a notable gotcha."}, "D": {"label": "❌ Incorrect", "text": "While GitHub itself may be case-insensitive in some contexts, the dbt UI performs an exact string match — case mismatches cause failures."}}, "key_rule": "Repo name is **case-sensitive** in dbt UI. `Analytics-Core` ≠ `analytics-core` → silent clone failure."}, {"id": "q02_Q6", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 6, "high_yield": false, "subdomain_id": "2.6", "subdomain_topic": "BitBucket and CodeCommit", "question_text": "An organization uses AWS CodeCommit for version control. They want to set up automated CI in dbt Cloud so that jobs trigger on every pull request. Which approach is required?", "is_multi_select": false, "options": {"A": "Use the dbt Cloud native CodeCommit integration available in Account Settings → Integrations.", "B": "Use the Git URL (deploy key) method to connect the repo, then manually trigger CI via the dbt Admin API when PRs are opened.", "C": "CodeCommit PRs cannot trigger dbt CI under any configuration — use GitHub or GitLab instead.", "D": "CodeCommit CI works automatically when using an IAM role-based connection in dbt Cloud."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is **no native CodeCommit integration** in dbt Cloud. It is not listed in Account Settings integrations."}, "B": {"label": "✅ Correct", "text": "For CodeCommit (and BitBucket), the only option is the **Git URL / deploy key** method for the repo connection. To trigger CI automatically, teams must set up a webhook or pipeline in CodeCommit that calls the **dbt Admin API** to trigger a job run. This is a manual integration."}, "C": {"label": "❌ Incorrect", "text": "It is *possible* to trigger CI — just not automatically via a native integration. The API-based approach enables it with extra engineering effort."}, "D": {"label": "❌ Incorrect", "text": "dbt Cloud does not support IAM role-based authentication for CodeCommit connections."}}, "key_rule": "BitBucket and CodeCommit = **no native integration**. Use Git clone + dbt Admin API to trigger CI manually."}, {"id": "q02_Q7", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 7, "high_yield": false, "subdomain_id": "2.7", "subdomain_topic": "Azure DevOps Server (on-premises)", "question_text": "A large enterprise runs Azure DevOps Server on-premises. They are evaluating upgrading to dbt Cloud Enterprise to get the Azure DevOps native integration. Will the upgrade enable native integration for their on-premises instance?", "is_multi_select": false, "options": {"A": "Yes — dbt Cloud Enterprise enables native Azure DevOps integration for both cloud-hosted and on-premises instances.", "B": "No — Azure DevOps Server (on-premises) has no native dbt Cloud integration on any plan. They must use the Git URL method.", "C": "Yes — but only if the on-premises server is accessible via a public FQDN.", "D": "No — on-premises Azure DevOps requires PrivateLink before native integration can be configured."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Enterprise Azure DevOps native integration only works with the **cloud-hosted** Azure DevOps (dev.azure.com). On-premises Azure DevOps Server is explicitly excluded."}, "B": {"label": "✅ Correct", "text": "**Azure DevOps Server (on-premises)** has **no native dbt Cloud integration on any plan** — not even Enterprise+. Teams using on-premises ADO must connect via the Git URL/deploy key method regardless of their dbt Cloud plan tier."}, "C": {"label": "❌ Incorrect", "text": "Public FQDN accessibility is not a documented path to native integration for on-prem ADO."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink is a network feature — it doesn't unlock native provider integrations."}}, "key_rule": "Azure DevOps Server (on-prem) = **no native integration on any plan**. Cloud ADO = Enterprise/Enterprise+ only."}, {"id": "q02_Q8", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 8, "high_yield": false, "subdomain_id": "2.8", "subdomain_topic": "GitLab OAuth setup requirements", "question_text": "A company on dbt Cloud Enterprise is setting up GitLab as their Git provider. Which of the following steps are required? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The GitLab OAuth app must be granted the `api` scope (not just `read_api`).", "B": "The repository must be in a GitLab group, not under a personal user account.", "C": "The dbt user must have the Owner role on the GitLab project.", "D": "The GitLab instance must be version 14.0 or higher.", "E": "The OAuth app credentials must be added to each project individually, not at the account level."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "The GitLab OAuth app requires the **`api` scope** — not just `read_api`. The `api` scope grants read/write access to the API including posting CI status back to MRs. Using only `read_api` breaks CI status write-back."}, "B": {"label": "✅ Correct", "text": "Repositories must belong to a **GitLab group** (e.g., `gitlab.com/my-org/repo`). Personal account repos are not supported for the native integration."}, "C": {"label": "❌ Incorrect", "text": "The required role is **Maintainer**, not Owner. Owner is more permissive than required."}, "D": {"label": "❌ Incorrect", "text": "There is no documented GitLab version requirement at 14.0+ — this is not a listed constraint."}, "E": {"label": "❌ Incorrect", "text": "On Enterprise, an admin creates a group-owned OAuth app and adds the Application ID + Secret to **Account Settings → Integrations** — it's configured once at the account level."}}, "key_rule": "GitLab = `api` scope (not `read_api`) + repo must be in a **GitLab group** + **Maintainer role** required."}, {"id": "q02_Q9", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 9, "high_yield": false, "subdomain_id": "2.9", "subdomain_topic": "GitLab OAuth scope", "question_text": "A team sets up GitLab integration in dbt Cloud using an OAuth app configured with `read_api` scope. CI jobs trigger successfully and runs execute, but developers report that after a CI run completes, no status check (pass/fail indicator) appears on their GitLab Merge Requests. What is the cause?", "is_multi_select": false, "options": {"A": "GitLab Free Plan does not allow status checks regardless of OAuth scope.", "B": "The OAuth app was configured with `read_api` scope instead of `api` scope — dbt cannot post status back to MRs without write API access.", "C": "MR status checks require the GitLab native integration, which is only available on Enterprise tier.", "D": "Status checks are only posted for `job.run.completed` webhook events, not for CI runs."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "GitLab Free Plan does suppress status checks — but that is a separate scenario. This question states runs execute, suggesting a paid plan. The proximate cause here is the OAuth scope."}, "B": {"label": "✅ Correct", "text": "The GitLab OAuth app **requires `api` scope**, not just `read_api`. The `api` scope grants read/write API access, which is needed for dbt to write CI status back to Merge Requests. `read_api` only allows reading — dbt can trigger and run jobs but cannot post status checks to the MR."}, "C": {"label": "❌ Incorrect", "text": "GitLab native integration is available on multiple tiers. The issue here is OAuth scope, not plan tier."}, "D": {"label": "❌ Incorrect", "text": "CI status checks are posted directly from the dbt Cloud CI system to GitLab via the API, not via webhooks."}}, "key_rule": "GitLab OAuth app must have **`api` scope** (not `read_api`). Without it, dbt can run CI but cannot post status back to Merge Requests."}, {"id": "q02_Q10", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 10, "high_yield": false, "subdomain_id": "2.10", "subdomain_topic": "GitLab Maintainer role", "question_text": "A developer with **Developer** role (not Maintainer) on a GitLab group repository attempts to set up the GitLab OAuth connection in dbt Cloud. The connection setup fails. What is the reason?", "is_multi_select": false, "options": {"A": "GitLab Developer role cannot read repository contents, which dbt requires.", "B": "Setting up the GitLab native integration requires **Maintainer** role on the repository — Developer role is insufficient.", "C": "Only GitLab group Owners can connect repositories to external tools like dbt Cloud.", "D": "The Developer role in GitLab cannot generate OAuth tokens at all."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "GitLab Developer role has read access to repository contents. Read access is not the issue."}, "B": {"label": "✅ Correct", "text": "The dbt Cloud GitLab native integration requires **Maintainer role** on the repository or group. Developer role is insufficient. The Maintainer role is needed to configure hooks and OAuth app settings that enable CI integration."}, "C": {"label": "❌ Incorrect", "text": "Owner is not required — Maintainer is sufficient."}, "D": {"label": "❌ Incorrect", "text": "Any GitLab user can generate personal OAuth tokens. The restriction is around what the token can do based on role, not whether a token can be generated."}}, "key_rule": "GitLab integration requires **Maintainer role** minimum. Developer role is insufficient."}, {"id": "q02_Q11", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 11, "high_yield": false, "subdomain_id": "2.11", "subdomain_topic": "GitLab Enterprise vs Starter setup flow", "question_text": "An organization on dbt Cloud Enterprise is setting up GitLab integration. A developer on the same account who is on a personal Starter project is also trying to connect to GitLab. Which statement correctly distinguishes the two setup flows?", "is_multi_select": false, "options": {"A": "Both flows are identical — all plans use personal GitLab OAuth apps connected via Profile Settings.", "B": "On Enterprise, an admin creates a **group-owned OAuth app** and configures it in Account Settings → Integrations. On Starter/Developer, each user connects their personal GitLab account via Profile Settings → Linked Accounts.", "C": "On Enterprise, dbt Cloud uses a pre-built GitLab app that doesn't need manual OAuth configuration. On Starter, a manual deploy key must be used.", "D": "On Starter, the group-owned OAuth app method is used. On Enterprise, personal OAuth apps are used for greater isolation."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The flows differ significantly between Enterprise and Starter/Developer tiers."}, "B": {"label": "✅ Correct", "text": "**Enterprise**: A dbt Cloud admin creates a **group-owned GitLab OAuth app**, then adds the Application ID and Secret to **Account Settings → Integrations**. All users in the account share this app. **Starter/Developer**: Each user connects their personal GitLab account individually via **Profile Settings → Linked Accounts**. There is no account-level shared app setup."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not provide a pre-built GitLab app — admins must create their own OAuth app in GitLab."}, "D": {"label": "❌ Incorrect", "text": "This reverses the actual behavior. Enterprise uses the shared group-owned app; personal account linking is for Starter/Developer."}}, "key_rule": "GitLab Enterprise = admin creates group OAuth app → Account Settings → Integrations. Starter/Developer = each user links personally via Profile Settings."}, {"id": "q02_Q12", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 12, "high_yield": false, "subdomain_id": "2.12", "subdomain_topic": "Azure DevOps recommended authentication", "question_text": "A platform team is setting up Azure DevOps native integration in dbt Cloud for the first time. They are choosing between two authentication methods: **Service User** and **Service Principal**. Which should they choose, and why?", "is_multi_select": false, "options": {"A": "Service User — it provides more granular permissions than Service Principal.", "B": "Service Principal (via Microsoft Entra ID) — it is the recommended method; Service User is a legacy approach.", "C": "Either method is acceptable — the choice depends on whether the team uses Entra ID or Active Directory.", "D": "Service User — Service Principal requires Enterprise+ while Service User works on Enterprise."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Service User is actually the older, less preferred method. Service Principal provides better security through Entra ID-managed credentials."}, "B": {"label": "✅ Correct", "text": "**Service Principal** (configured through Microsoft Entra ID) is the **recommended authentication method** for Azure DevOps integration in dbt Cloud. Service User is a legacy approach that dbt still supports but does not recommend for new setups. Service Principal offers better credential management and aligns with modern Azure security practices."}, "C": {"label": "❌ Incorrect", "text": "dbt explicitly recommends Service Principal over Service User — this is not a neutral choice."}, "D": {"label": "❌ Incorrect", "text": "There is no plan-tier difference between these two auth methods. Both are available on Enterprise."}}, "key_rule": "Azure DevOps auth = **Service Principal** (recommended) via Entra ID. Service User = legacy, not recommended for new setups."}, {"id": "q02_Q13", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 13, "high_yield": false, "subdomain_id": "2.13", "subdomain_topic": "Azure DevOps admin coordination", "question_text": "An organization wants to enable dbt Cloud's native Azure DevOps integration. A project manager says \"just have the dbt admin configure it.\" An architect pushes back, saying it requires coordination across multiple teams. Who is correct, and which teams are involved?", "is_multi_select": false, "options": {"A": "The project manager — only the dbt Account Admin needs to configure the integration from Account Settings.", "B": "The architect — setup requires coordination across three admin teams: dbt admins, Azure Entra ID admins, and Azure DevOps admins.", "C": "The architect — setup requires both the dbt admin and the Azure DevOps admin, but Entra ID is not involved.", "D": "The project manager — if Service User auth is chosen, only one admin is needed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The dbt admin alone cannot complete the setup — Azure-side configuration is required in systems the dbt admin does not control."}, "B": {"label": "✅ Correct", "text": "Azure DevOps native integration in dbt Cloud requires **three admin teams**: (1) **dbt admins** to configure the integration in dbt Cloud Account Settings; (2) **Azure Entra ID admins** to register the Service Principal app and manage credentials; (3) **Azure DevOps admins** to grant the Service Principal access to the DevOps organization and repositories. Attempting to do this without all three will fail."}, "C": {"label": "❌ Incorrect", "text": "Entra ID is central to the recommended Service Principal method and must be involved."}, "D": {"label": "❌ Incorrect", "text": "Even with Service User auth, Azure DevOps admin involvement is required to create and grant the user. The three-team coordination is inherent to the integration."}}, "key_rule": "Azure DevOps native integration = 3-team coordination: dbt admins + Azure Entra ID admins + Azure DevOps admins."}, {"id": "q02_Q14", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 14, "high_yield": false, "subdomain_id": "2.14", "subdomain_topic": "BitBucket and CodeCommit CI setup", "question_text": "A team uses BitBucket as their Git provider. They want CI jobs to trigger automatically on every pull request in dbt Cloud. What is the required approach?", "is_multi_select": false, "options": {"A": "Enable the BitBucket native integration in dbt Cloud Account Settings → Integrations.", "B": "Use the git URL / deploy key method to connect the repo and configure the dbt Admin API to trigger CI jobs manually on each PR via a BitBucket webhook.", "C": "BitBucket is not supported by dbt Cloud in any configuration.", "D": "Use BitBucket Pipelines to call `dbt build` directly — no dbt Cloud CI setup is needed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no native BitBucket integration in dbt Cloud. BitBucket (like AWS CodeCommit) has no native dbt Cloud support."}, "B": {"label": "✅ Correct", "text": "BitBucket and AWS CodeCommit have **no native dbt Cloud integration** on any plan. The workaround: connect the repo via **git URL + deploy key**, then configure a BitBucket webhook that calls the **dbt Admin API** to programmatically trigger CI job runs on pull request events. This mimics the auto-trigger behavior but requires custom setup."}, "C": {"label": "❌ Incorrect", "text": "BitBucket repos can connect to dbt Cloud via the git URL method — they're just not natively integrated with auto-triggers."}, "D": {"label": "❌ Incorrect", "text": "Calling `dbt build` via BitBucket Pipelines bypasses dbt Cloud entirely and would not populate dbt Cloud run history, artifacts, or UI features."}}, "key_rule": "BitBucket + CodeCommit = no native integration on any plan. Use git URL/deploy key + dbt Admin API calls to trigger CI."}, {"id": "q02_Q15", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 15, "high_yield": false, "subdomain_id": "2.15", "subdomain_topic": "GitHub personal profile linking", "question_text": "A company sets up the GitHub native app integration in dbt Cloud and all CI jobs are configured. A new developer joins the team, is granted dbt Cloud access, and tries to open a PR. The CI job fails with an authentication error when trying to post status back to GitHub. What is the likely cause?", "is_multi_select": false, "options": {"A": "The new developer's GitHub account is not in the GitHub organization and must be added by the org owner.", "B": "The new developer has not linked their personal GitHub account to their dbt Cloud profile via Profile Settings.", "C": "The GitHub app installation only covers the initial admin — new team members require the app to be re-installed.", "D": "The CI job needs to be reconfigured with the new developer's GitHub credentials."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "GitHub org membership is separate from dbt Cloud profile linking. Being in the GitHub org does not automatically link the account in dbt."}, "B": {"label": "✅ Correct", "text": "Even after the org-level GitHub app is installed, **each developer must individually link their personal GitHub account** to their dbt Cloud profile via **Profile Settings**. This linking enables dbt to authenticate actions (like posting PR status) on behalf of that developer. Failing to link results in authentication errors for that individual."}, "C": {"label": "❌ Incorrect", "text": "The GitHub app installation is account-level and covers all users — it does not need to be re-installed per user."}, "D": {"label": "❌ Incorrect", "text": "CI jobs are not reconfigured per developer. The CI job runs under the shared app credential; the developer linking is for personal activity attribution."}}, "key_rule": "GitHub native app = org-level install (once) + each developer must separately link their personal GitHub profile via Profile Settings."}, {"id": "q02_Q16", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 16, "high_yield": false, "subdomain_id": "2.16", "subdomain_topic": "GitHub org owner requirement", "question_text": "A dbt Cloud account admin tries to set up the GitHub native app integration but is not the GitHub organization owner — they are only a repository admin. They complete the dbt Cloud side of the setup but CI jobs never trigger. What is the root cause?", "is_multi_select": false, "options": {"A": "Repository admins can install GitHub apps — the issue must be elsewhere in the CI job configuration.", "B": "GitHub requires the dbt app to be installed by a GitHub **org owner**. A repository admin cannot install org-level GitHub apps, so the app was never actually installed.", "C": "The GitHub app requires a separate token from the repo admin to authorize CI triggers.", "D": "GitHub apps only work with GitHub Enterprise, not GitHub.com accounts."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Repository admins cannot install organization-level GitHub apps — only org owners can."}, "B": {"label": "✅ Correct", "text": "The GitHub native app must be installed by a **GitHub organization owner**. Repository admins lack the permissions to install apps at the org level. If the org owner hasn't installed the app, the integration appears to complete on the dbt side but no CI triggers fire because GitHub never registered the app."}, "C": {"label": "❌ Incorrect", "text": "No separate token from the repo admin is required. The org-level app installation handles authorization."}, "D": {"label": "❌ Incorrect", "text": "The GitHub native app works with github.com. GitHub Enterprise on non-`ghe.com` domains requires a different approach (git URL / deploy key), but standard GitHub.com is fully supported."}}, "key_rule": "GitHub native app must be installed by the **GitHub org owner** — repository admin is insufficient."}, {"id": "q02_Q17", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 17, "high_yield": false, "subdomain_id": "2.17", "subdomain_topic": "Fork PR CI failure", "question_text": "A contributor forks a dbt Cloud-connected GitHub repository and opens a pull request from their fork. The CI job immediately fails with \"unable to check out commit.\" What is the cause and how should the team handle it?", "is_multi_select": false, "options": {"A": "The contributor's fork is private — they must make it public before dbt can access it.", "B": "dbt Cloud cannot check out commits from fork repositories — the contributor must push their branch directly to the origin repository instead.", "C": "Fork PRs require a deploy key to be added to the fork repository before CI can run.", "D": "The CI job needs to be reconfigured with \"allow fork PRs\" enabled in the job's Git Trigger settings."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Repository visibility is not the issue. dbt Cloud fundamentally cannot check out commits from any fork, public or private."}, "B": {"label": "✅ Correct", "text": "dbt Cloud CI cannot check out commits from **forked repositories** — this is an architectural limitation. The contributor must push their branch directly to the origin (upstream) repository. Org teams should document this in their contribution guide: fork PRs are not supported for dbt Cloud CI."}, "C": {"label": "❌ Incorrect", "text": "Deploy keys on the fork do not resolve this — the limitation is that dbt Cloud only has access credentials for the origin repo, not forks."}, "D": {"label": "❌ Incorrect", "text": "There is no \"allow fork PRs\" toggle in dbt Cloud job settings. Fork-based CI is simply not supported."}}, "key_rule": "Fork PRs = dbt CI cannot check out commits. Contributors must push branches directly to the origin repo."}, {"id": "q02_Q18", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 18, "high_yield": false, "subdomain_id": "2.18", "subdomain_topic": "Azure DevOps reused branch", "question_text": "A developer on an Azure DevOps project closes a pull request without merging and then opens a new PR using the exact same branch name. The CI job does not trigger for the new PR. What is the cause?", "is_multi_select": false, "options": {"A": "Azure DevOps requires CI jobs to be manually re-enabled after a PR is closed without merging.", "B": "dbt Cloud CI will not trigger on a new PR that reuses the same branch name from a previously closed or abandoned PR.", "C": "The branch protection rule is preventing new PRs from being opened on used branches.", "D": "This
