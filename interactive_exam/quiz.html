explanations": {"A": {"label": "❌ Incorrect", "text": "`{{ target.schema }}` is the primary target schema, not the full list of all schemas written to during the run."}, "B": {"label": "✅ Correct", "text": "Two `on-run-end`-specific variables: **`{{ schemas }}`** — a list of all schemas written to during the run (useful for generating per-schema grants or reports). **`{{ results }}`** — a list of result objects for every resource that ran, each with `res.node.unique_id`, `res.status`, and `res.message`. Additionally, `{{ database_schemas }}` provides (database, schema) tuples for cross-database runs. These variables are ONLY available in `on-run-end` — they return `None` in pre-hook or post-hook."}, "C": {"label": "❌ Incorrect", "text": "`{{ run_results }}` is not the documented variable name — it is `{{ results }}`."}, "D": {"label": "❌ Incorrect", "text": "`{{ this }}` is a pre/post-hook variable representing the current model — it is not available in `on-run-end`."}}, "key_rule": "`on-run-end` variables: `{{ schemas }}` (list of schemas), `{{ results }}` (list of result objects), `{{ database_schemas }}` (tuples). All return `None` in pre/post-hooks."}, {"id": "q10_Q13", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 13, "high_yield": false, "subdomain_id": "9.13", "subdomain_topic": "Operations require run_query", "question_text": "A developer writes a macro to clean up temporary tables:\n```sql\n{% macro cleanup_temp_tables() %}\n  DROP TABLE IF EXISTS {{ target.schema }}.tmp_staging;\n{% endmacro %}\n```\nThey run `dbt run-operation cleanup_temp_tables`. The command succeeds but the table is still there. Why?", "is_multi_select": false, "options": {"A": "`dbt run-operation` can only call macros that are in the `macros/` directory, not in `models/`.", "B": "The macro must use `run_query()` or a `{% call statement() %}` block to execute SQL — simply returning a SQL string from a macro does not execute it.", "C": "`DROP TABLE` requires a separate `--force` flag when called via `run-operation`.", "D": "Macros called via `run-operation` run in read-only mode by default."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Macros for `run-operation` are in the `macros/` directory — this is correct. Location is not the issue."}, "B": {"label": "✅ Correct", "text": "A macro called via `dbt run-operation` does **not** auto-execute SQL simply by returning a string. The macro must explicitly execute SQL using **`run_query()`** or a `{% call statement() %}` block. A macro that just templates SQL as a return value produces no warehouse side effect. Fix: `{% do run_query(\"DROP TABLE IF EXISTS \" ~ target.schema ~ \".tmp_staging\") %}`."}, "C": {"label": "❌ Incorrect", "text": "There is no `--force` flag for `dbt run-operation`."}, "D": {"label": "❌ Incorrect", "text": "`run-operation` macros run with full write access to the warehouse — there is no read-only default mode."}}, "key_rule": "Operations don't auto-execute SQL return values. Must use `run_query()` or `{% call statement() %}` to actually execute SQL."}, {"id": "q10_Q14", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 14, "high_yield": false, "subdomain_id": "9.14", "subdomain_topic": "dbt run-operation syntax", "question_text": "A macro named `grant_schema_access` accepts two parameters: `role` and `schema_name`. How is this macro correctly invoked using `dbt run-operation`?", "is_multi_select": false, "options": {"A": "`dbt run-operation grant_schema_access role=analyst schema_name=core`", "B": "`dbt run-operation grant_schema_access --args '{role: analyst, schema_name: core}'`", "C": "`dbt run-operation grant_schema_access --params '{\"role\": \"analyst\", \"schema_name\": \"core\"}'`", "D": "`dbt run-operation --macro grant_schema_access --args role=analyst --args schema_name=core`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Positional or keyword arguments passed directly after the macro name are not valid syntax for `dbt run-operation`."}, "B": {"label": "✅ Correct", "text": "`dbt run-operation` passes arguments via the **`--args` flag** as a **YAML dictionary**: `dbt run-operation grant_schema_access --args '{role: analyst, schema_name: core}'`. Both YAML and JSON dict formats are accepted. The keys must exactly match the macro's parameter names."}, "C": {"label": "❌ Incorrect", "text": "The flag is `--args`, not `--params`."}, "D": {"label": "❌ Incorrect", "text": "The `--macro` flag does not exist. The macro name is a positional argument directly after `run-operation`."}}, "key_rule": "`dbt run-operation <macro_name> --args '{key: value, key2: value2}'`. Args as YAML/JSON dict. Keys match macro parameter names exactly."}, {"id": "q10_Q15", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 15, "high_yield": false, "subdomain_id": "9.15", "subdomain_topic": "Operations vs hooks", "question_text": "A team needs to grant `SELECT` on all tables in the production schema to a `reporter` role. This grant must run once after each **full** deployment job (not per model). They are deciding between a `post-hook` and a `dbt run-operation`. Which approach is more appropriate and why?", "is_multi_select": false, "options": {"A": "A `post-hook` on every model — this grants per table as each model builds.", "B": "An `on-run-end` hook in `dbt_project.yml` — it fires once per dbt command, granting on all schemas after the job completes.", "C": "A `dbt run-operation` step added to the job's command list — it is explicitly invoked once after the build completes, running an ad-hoc grant across all tables.", "D": "Either approach works identically — the choice is stylistic."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Per-model post-hooks grant per table as each model builds — this works but means hundreds of individual GRANT statements rather than one bulk grant."}, "B": {"label": "✅ Correct", "text": "An **`on-run-end` hook** configured in `dbt_project.yml` fires **once per dbt command** — after all models have built. It can run `GRANT SELECT ON ALL TABLES IN SCHEMA {{ target.schema }} TO ROLE reporter` in a single statement. This is more efficient than per-model grants and guarantees the grant runs after the full job, not piecemeal. `on-run-end` is specifically designed for this \"run-level\" automation pattern. (A `dbt run-operation` step in the job command list also works, but `on-run-end` is the idiomatic automated approach.)"}, "C": {"label": "❌ Incorrect", "text": "A `run-operation` step works, but `on-run-end` is the more idiomatic automated pattern for tasks tied to the job lifecycle. Operations are better for ad-hoc or one-time tasks."}, "D": {"label": "❌ Incorrect", "text": "The approaches differ in automation (hooks are automatic) vs explicitness (operations are manual command steps)."}}, "key_rule": "Use `on-run-end` for automated run-level tasks (once per job). Use `run-operation` for ad-hoc or one-time commands."}, {"id": "q10_Q16", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 16, "high_yield": false, "subdomain_id": "9.16", "subdomain_topic": "on-run-start/end fire frequency", "question_text": "A team configures an `on-run-start` hook to log the run start time to an audit table. They run `dbt build` which executes 50 models. How many times does the `on-run-start` hook fire?", "is_multi_select": false, "options": {"A": "50 times — once per model", "B": "1 time — once per dbt command invocation", "C": "2 times — once at the start of `dbt run` and once at the start of `dbt test` (since `dbt build` internally executes both)", "D": "0 times — `on-run-start` only fires for `dbt run`, not `dbt build`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`on-run-start` fires once per command invocation — not per model. Per-model execution is for `pre-hook`/`post-hook`."}, "B": {"label": "✅ Correct", "text": "`on-run-start` fires **once per dbt command invocation** — regardless of how many models are in the run. For `dbt build` with 50 models, it fires exactly **once**. The same applies to `on-run-end`. These are project-level hooks, not resource-level. Also note: `on-run-start`/`on-run-end` fire for **every dbt command** that executes project resources — `dbt run`, `dbt build`, `dbt test`, `dbt seed`, `dbt snapshot`, `dbt compile`, `dbt docs generate`."}, "C": {"label": "❌ Incorrect", "text": "`dbt build` is a single command invocation — it does not fire separate `on-run-start` hooks for its internal run and test phases."}, "D": {"label": "❌ Incorrect", "text": "`on-run-start` fires for `dbt build`, `dbt run`, and all other resource-executing dbt commands."}}, "key_rule": "`on-run-start`/`on-run-end` = once per dbt command, not per model. Fires for all resource-executing commands (run, build, test, seed, snapshot, compile)."}, {"id": "q10_Q17", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 17, "high_yield": false, "subdomain_id": "9.17", "subdomain_topic": "GRANT post-hooks on Snowflake", "question_text": "A data platform team wants to automatically grant `SELECT` on every model to a `reporter` role after each model builds in Snowflake. They want this to apply to all models in the project. What is the recommended configuration?", "is_multi_select": false, "options": {"A": "Add a `post-hook` to each model's `config()` block individually.", "B": "Configure a `post-hook` in `dbt_project.yml` at the top level so it applies to all models globally, using `{{ this }}` to reference the current model's relation.", "C": "Use `on-run-end` with `{{ schemas }}` to grant access to all schemas at once.", "D": "Create a separate `dbt run-operation` step in every job's command list."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Per-model `config()` blocks require updating every model individually — not scalable for project-wide grants."}, "B": {"label": "✅ Correct", "text": "The standard pattern for project-wide Snowflake grants is a **`post-hook` in `dbt_project.yml`** at the top level under `models:`: `post_hook: \"GRANT SELECT ON {{ this }} TO ROLE reporter\"`. This applies to every model in the project. `{{ this }}` resolves to the fully-qualified relation of each model. It's idiomatic, DRY, and requires no changes per model. This is one of the most common production hook patterns."}, "C": {"label": "❌ Incorrect", "text": "`on-run-end` with `{{ schemas }}` grants on all tables in a schema at once — a valid bulk approach but less granular than per-model `{{ this }}` grants. The `post-hook` in `dbt_project.yml` is the more idiomatic per-model pattern."}, "D": {"label": "❌ Incorrect", "text": "A `run-operation` per job requires manual setup in every job — not automatic and not recommended for routine operational grants."}}, "key_rule": "Project-wide Snowflake GRANT = `post-hook` in `dbt_project.yml` with `GRANT SELECT ON {{ this }} TO ROLE reporter`."}, {"id": "q10_Q18", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 18, "high_yield": false, "subdomain_id": "9.18", "subdomain_topic": "Calling macros from hooks", "question_text": "A team has a macro `my_grant(relation, role)` that generates a GRANT statement. They want to call it from a `post-hook` on a model. What is the correct hook syntax?", "is_multi_select": false, "options": {"A": "`post_hook: \"my_grant(this, 'reporter')\"`", "B": "`post_hook: \"{{ my_grant(this, 'reporter') }}\"`", "C": "`post_hook: \"{{ my_grant({{ this }}, 'reporter') }}\"`", "D": "`post_hook: my_grant(this, 'reporter')`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Without Jinja delimiters (`{{ }}`), the string is passed literally without macro evaluation."}, "B": {"label": "✅ Correct", "text": "Hooks are strings evaluated as Jinja templates. To call a macro, wrap the entire call in Jinja: `\"{{ my_grant(this, 'reporter') }}\"`. The outer `{{ }}` tells dbt to evaluate the Jinja expression. Inside, `this` is the relation context variable (no extra curly braces needed). dbt evaluates the hook string as Jinja at runtime, calls `my_grant(this, 'reporter')`, and executes the returned SQL."}, "C": {"label": "❌ Incorrect", "text": "`{{ {{ this }} }}` is invalid nested Jinja — it causes a compilation error. `this` inside a Jinja expression does not need extra `{{ }}`."}, "D": {"label": "❌ Incorrect", "text": "Without Jinja delimiters, this is a literal string, not a macro call."}}, "key_rule": "Macro call in hook = `\"{{ macro_name(this, 'arg') }}\"`. `this` inside `{{ }}` needs no additional delimiters."}, {"id": "q10_Q19", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 19, "high_yield": false, "subdomain_id": "9.19", "subdomain_topic": "Hook accumulation", "question_text": "A project uses a dbt package that defines a `post-hook` on all models. The `dbt_project.yml` also defines a `post-hook`. A model's `config()` block additionally defines a `post-hook`. A developer expects the model-level `config()` hook to override and replace the others. What actually happens?", "is_multi_select": false, "options": {"A": "The model-level `config()` hook overrides all others — only the model's config() hook runs.", "B": "The `dbt_project.yml` hook overrides the package hook, and the config() hook overrides both — only one hook runs.", "C": "All three post-hooks run — hooks from all scopes **accumulate**, and no scope overrides another.", "D": "The package hook is disabled when `dbt_project.yml` defines any hook, regardless of model config."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Model-level hooks do not override higher-scope hooks — they add to them."}, "B": {"label": "❌ Incorrect", "text": "No hook scope overrides another. They all accumulate."}, "C": {"label": "✅ Correct", "text": "Hooks in dbt **accumulate across all scopes** — they do not override each other. All three hooks run: the package hook, the `dbt_project.yml` hook, and the model's `config()` hook. They execute in order: package → project.yml → config() block. If you have 3 hooks at project level and 2 at model level, all 5 execute. This is an important distinction from how configs work in dbt (where more specific configs override less specific ones). Hooks are additive, not override-based."}, "D": {"label": "❌ Incorrect", "text": "Package hooks are not disabled by project-level hook definitions."}}, "key_rule": "Hooks **accumulate** — they never override. All hooks from all scopes run. Configs override; hooks add."}, {"id": "q10_Q20", "file_id": "q10", "topic_num": "9", "topic_name": "Hooks & Operations", "question_num": 20, "high_yield": false, "subdomain_id": "9.20", "subdomain_topic": "on-run-end results object", "question_text": "An `on-run-end` hook sends a summary notification. A developer needs to count how many models succeeded and how many errored. They use `{{ results }}` in the hook. What is the structure of each object in `results`, and how do they filter for errors?", "is_multi_select": false, "options": {"A": "Each result is a string like `\"model_name: success\"` — filter with `if 'error' in res`.", "B": "Each result object has `res.node.unique_id`, `res.status` (values: `success`, `error`, `skipped`), and `res.message`. Filter errors with `{% if res.status == 'error' %}`.", "C": "`results` is a dictionary keyed by model name — access error status with `results['model_name']['status']`.", "D": "Each result has `res.model` (name) and `res.passed` (boolean) — filter with `{% if not res.passed %}`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Results are not string values. They are structured objects with named properties."}, "B": {"label": "✅ Correct", "text": "Each object in `{{ results }}` has: **`res.node.unique_id`** (e.g., `model.project.model_name`), **`res.status`** (one of `success`, `error`, `skipped`, `warn`, `pass`, `fail`), and **`res.message`** (error or completion message). To count errors: `{% set error_count = results | selectattr(\"status\", \"equalto\", \"error\") | list | length %}`. The results list includes all resources that ran, even partial failures — making it ideal for run-level reporting in `on-run-end`."}, "C": {"label": "❌ Incorrect", "text": "`results` is a list, not a dictionary. Access is by iteration, not by key."}, "D": {"label": "❌ Incorrect", "text": "`res.passed` is not a documented property. The status field uses string values, not a boolean."}}, "key_rule": "`results` list — each item has `res.node.unique_id`, `res.status` (`success`/`error`/`skipped`), `res.message`. Filter: `selectattr(\"status\", \"equalto\", \"error\")`."}, {"id": "q11_Q1", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 1, "high_yield": true, "subdomain_id": "10.1", "subdomain_topic": "`@` graph operator vs `+model+`", "question_text": "A data engineer wants to run `model_x` and all of its descendants, but also wants to ensure that every ancestor of every descendant is included so that the full graph is self-consistent. Which selector achieves this?", "is_multi_select": false, "options": {"A": "`+model_x+`", "B": "`model_x+`", "C": "`@model_x`", "D": "`model_x*`"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`+model_x+` = all ancestors of `model_x` **plus** all descendants of `model_x`. It does NOT include ancestors of the descendants — only ancestors of `model_x` itself."}, "B": {"label": "❌ Incorrect", "text": "`model_x+` = `model_x` and all its descendants, but none of their ancestors."}, "C": {"label": "✅ Correct", "text": "`@model_x` is the **full closure operator**. It expands to: `model_x` + all descendants of `model_x` + all ancestors of every one of those descendants. Use it when you need a complete, self-contained subgraph — everything needed to rebuild `model_x` and validate all downstream consumers."}, "D": {"label": "❌ Incorrect", "text": "`model_x*` is not valid dbt selector syntax."}}, "key_rule": "`@model` = model + descendants + **all ancestors of descendants**. `+model+` = model's own ancestors + model + model's own descendants. The `@` operator is uniquely needed for full-closure subgraph runs."}, {"id": "q11_Q2", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 2, "high_yield": true, "subdomain_id": "10.2", "subdomain_topic": "Set operator: union vs intersection", "question_text": "A CI job needs to run only models that are both modified AND tagged `nightly`. Which dbt selector syntax correctly expresses this intersection?", "is_multi_select": false, "options": {"A": "`state:modified tag:nightly`", "B": "`state:modified,tag:nightly`", "C": "`state:modified+tag:nightly`", "D": "`state:modified & tag:nightly`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A **space** between selectors = **union**. This runs models that are modified OR tagged `nightly` (whichever set is larger)."}, "B": {"label": "✅ Correct", "text": "A **comma** between selectors = **intersection**. `state:modified,tag:nightly` selects only the nodes that satisfy BOTH conditions simultaneously. This is the correct syntax for \"modified AND tagged\"."}, "C": {"label": "❌ Incorrect", "text": "The `+` attached to a selector adds graph depth (parents/children), not set intersection. This is invalid for combining two different selectors."}, "D": {"label": "❌ Incorrect", "text": "`&` is not valid dbt set operator syntax."}}, "key_rule": "**Space = union** (either/or). **Comma = intersection** (both/and). This is one of the most commonly confused distinctions in dbt node selection."}, {"id": "q11_Q3", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 3, "high_yield": true, "subdomain_id": "10.3", "subdomain_topic": "`state:modified` cannot detect `--vars` changes", "question_text": "A team uses CI slim builds with `dbt run --select state:modified+ --state ./prod-manifest`. They discover that changing a variable value passed via `--vars` never triggers the dependent models to rebuild — even models that use `{{ var('some_var') }}` in their SQL. Why?", "is_multi_select": false, "options": {"A": "`state:modified` compares compiled SQL, so any variable change would be detected.", "B": "`state:modified` compares node configurations in the manifest, and `--vars` runtime values are not stored in the manifest.", "C": "`--vars` changes are detected only when using `state:modified.configs`, not `state:modified`.", "D": "The `--state` flag must be combined with `--vars` for variable changes to be tracked."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`state:modified` compares the **manifest at parse time**, not compiled SQL. Compiled SQL is only generated by `dbt compile` or during `dbt run`."}, "B": {"label": "✅ Correct", "text": "`state:modified` checks `manifest.json` contents. `--vars` values are passed at **runtime**, after the manifest is written, so they are **never captured** in the manifest. dbt has no mechanism to detect that a variable value changed between runs. This is a documented limitation."}, "C": {"label": "❌ Incorrect", "text": "`state:modified.configs` checks model-level config blocks (e.g., `materialized`, `tags`), not runtime variable values either."}, "D": {"label": "❌ Incorrect", "text": "Combining `--vars` with `--state` has no effect on change detection for variable values."}}, "key_rule": "`--vars` changes are **invisible to `state:modified`**. If you need variable-driven model changes detected in CI, consider encoding the variable into a config or tag, or explicitly naming the affected models."}, {"id": "q11_Q4", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 4, "high_yield": true, "subdomain_id": "10.4", "subdomain_topic": "Manifest overwrite problem", "question_text": "A CI pipeline runs `dbt run --select state:modified+ --state ./target --target-path ./target`. The team notices the slim CI always builds every model, not just modified ones. What is the root cause?", "is_multi_select": false, "options": {"A": "`--state` and `--target-path` cannot be used together; they are mutually exclusive flags.", "B": "When `--state` and `--target-path` point to the same directory, dbt overwrites `manifest.json` during the parse phase before it can be used for comparison.", "C": "The `state:modified` selector requires a separate `--profiles-dir` to work correctly.", "D": "`--target-path` must point to an absolute path, not a relative path, for state comparison to work."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "These flags are not mutually exclusive — but pointing them at the same directory is the bug."}, "B": {"label": "✅ Correct", "text": "At the start of every dbt invocation, dbt parses the project and **writes a new `manifest.json`** to `--target-path`. If `--state` points to the same directory, the **fresh manifest overwrites the comparison baseline** before state comparison can happen. Result: no nodes appear modified, so either everything or nothing is selected (depending on the command). Always keep `--state` pointing to a **separate directory** containing the production manifest."}, "C": {"label": "❌ Incorrect", "text": "`--profiles-dir` is unrelated to state comparison."}, "D": {"label": "❌ Incorrect", "text": "Relative vs absolute path is not the issue here."}}, "key_rule": "**Never point `--state` and `--target-path` at the same directory.** dbt overwrites `manifest.json` on parse, destroying the comparison baseline. Use a separate path like `--state ./prod-manifest`."}, {"id": "q11_Q5", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 5, "high_yield": true, "subdomain_id": "10.5", "subdomain_topic": "`--defer-state` for split comparison and deferral", "question_text": "A team wants their CI slim build to compare modified nodes against the **production** manifest, but defer missing relations to the **staging** environment (which has fresher data). Which flag combination achieves this?", "is_multi_select": false, "options": {"A": "Use `--state ./prod-manifest --defer` — dbt automatically defers to the staging environment when relations are missing.", "B": "Use `--state ./prod-manifest --defer --defer-state ./staging-manifest` — `--state` drives comparison; `--defer-state` drives deferral resolution.", "C": "Use `--defer-state ./staging-manifest` alone — this flag handles both comparison and deferral.", "D": "This is not possible in dbt; `--state` and deferral must use the same manifest."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`--defer` alone defers to whatever manifest `--state` points to — there is no automatic environment detection."}, "B": {"label": "✅ Correct", "text": "`--defer-state` is a separate flag that lets you specify a **different manifest** for deferral resolution than the one used for `state:modified` comparison. `--state` answers \"what changed?\" and `--defer-state` answers \"where do I find existing relations to defer to?\" This is ideal when production is the authoritative baseline but staging has more recent data."}, "C": {"label": "❌ Incorrect", "text": "`--defer-state` only controls deferral resolution, not state comparison. `--state` is still required for `state:modified`."}, "D": {"label": "❌ Incorrect", "text": "This is exactly the use case `--defer-state` was designed for."}}, "key_rule": "`--state` = comparison baseline for `state:modified`. `--defer-state` = separate manifest for deferral resolution. They can point to different manifests."}, {"id": "q11_Q6", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 6, "high_yield": true, "subdomain_id": "10.6", "subdomain_topic": "`--indirect-selection` modes", "question_text": "A test selects only `model_a` using `dbt test --select model_a`. The project has a `relationships` test between `model_a` and `model_b`. Which `--indirect-selection` mode would **exclude** that relationships test?", "is_multi_select": false, "options": {"A": "`eager` (default)", "B": "`buildable`", "C": "`cautious`", "D": "`empty`"}, "correct_answers": ["A"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`eager` (default) = include a test if **any** of its parents are selected. `model_a` is selected, so the relationship test IS included."}, "B": {"label": "❌ Incorrect", "text": "`buildable` = include a test if it can be executed given the selected models and their ancestors. The relationship test would still run if `model_b` is upstream or available."}, "C": {"label": "✅ Correct", "text": "`cautious` = include a test only if **all** its parents are selected. Since `model_b` is NOT in the selection, the `relationships` test (which references both `model_a` and `model_b`) is excluded."}, "D": {"label": "✅ Correct", "text": "`empty` = **no indirect tests** are selected at all — only tests that directly belong to a selected node. All multi-node tests like `relationships` are excluded."}}, "key_rule": "`eager` = any parent selected → run test. `cautious` = all parents selected → run test. `empty` = no indirect tests ever. Use `cautious` or `empty` in CI to avoid cross-environment false failures from relationship tests."}, {"id": "q11_Q7", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 7, "high_yield": true, "subdomain_id": "10.7", "subdomain_topic": "`dbt build` unit test execution order", "question_text": "A data engineer adds a unit test to `model_x`. When `dbt build` runs, in what order does the unit test execute relative to the model materialization?", "is_multi_select": false, "options": {"A": "Unit tests run after model materialization, then data tests run last.", "B": "Unit tests run before model materialization; data tests run after materialization.", "C": "Unit tests and data tests both run after model materialization.", "D": "Unit tests run at the start of the entire `dbt build` job before any models are materialized."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Unit tests do NOT run after materialization. Their entire purpose is to validate model logic before the model is written to the warehouse."}, "B": {"label": "✅ Correct", "text": "`dbt build` execution order per node: **unit tests → model materialization → data tests**. Unit tests run on mock input data (no warehouse read) before the model is materialized. If a unit test fails, the model is never materialized. Data (schema) tests run after the model exists in the warehouse."}, "C": {"label": "❌ Incorrect", "text": "Unit tests specifically run before materialization — that is their defining characteristic."}, "D": {"label": "❌ Incorrect", "text": "Unit tests respect the DAG order; they run for each node in dependency order, not all at once before the DAG starts."}}, "key_rule": "`dbt build` per-node sequence: **unit test → materialize → data test**. Unit test failure = model never runs. Data test failure = downstream nodes are skipped (not errored)."}, {"id": "q11_Q8", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 8, "high_yield": true, "subdomain_id": "10.8", "subdomain_topic": "`dbt build` upstream test failure behavior", "question_text": "A `dbt build` run executes `model_a` successfully, then `model_a`'s data tests fail. `model_b` depends on `model_a`. What is the outcome for `model_b`?", "is_multi_select": false, "options": {"A": "`model_b` runs anyway — test failures in upstream models do not block downstream builds.", "B": "`model_b` errors — the test failure propagates as an error to all downstream nodes.", "C": "`model_b` is skipped — test failures in upstream models cause downstream nodes to skip, not error.", "D": "`model_b` runs but its own tests are skipped as a precaution."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt build` is specifically designed to halt downstream work when upstream tests fail."}, "B": {"label": "❌ Incorrect", "text": "Downstream nodes receive `skipped` status, not `error`. The error is on the upstream test itself."}, "C": {"label": "✅ Correct", "text": "When an upstream data test fails in `dbt build`, all downstream nodes are **skipped** (status = `skipped`). This is intentional: if the upstream data cannot be trusted, there is no point materializing dependent models. The job completes with a non-zero exit code due to the test failure, and `dbt retry` can re-run from the failure point."}, "D": {"label": "❌ Incorrect", "text": "dbt does not selectively skip tests on downstream nodes — the entire downstream node is skipped."}}, "key_rule": "In `dbt build`, upstream test failure = downstream nodes **skip** (not error). Exit code is non-zero. Use `dbt retry` to resume from the failed test."}, {"id": "q11_Q9", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 9, "high_yield": true, "subdomain_id": "10.9", "subdomain_topic": "`dbt retry` and infrastructure failures", "question_text": "A dbt Cloud job fails due to a warehouse connectivity error before any nodes begin executing. The run results file shows zero nodes attempted. A developer runs `dbt retry`. What happens?", "is_multi_select": false, "options": {"A": "`dbt retry` re-runs all models in the project since no successful runs exist.", "B": "`dbt retry` is a no-op — if no nodes executed before the failure, there are no failed nodes to retry.", "C": "`dbt retry` falls back to running the full model selection defined in the job.", "D": "`dbt retry` raises an error and requires `--full-refresh` to proceed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt retry` reads `run_results.json` to find failed/errored nodes — it does not infer a full run when results are empty."}, "B": {"label": "✅ Correct", "text": "`dbt retry` reads the `run_results.json` from the previous run and retries only nodes that `errored` or `failed`. If the failure was an infrastructure error before any nodes started (empty results), there is nothing to retry — `dbt retry` is effectively a **no-op**. The developer must re-run the job manually or fix the infrastructure issue first."}, "C": {"label": "❌ Incorrect", "text": "`dbt retry` does not fall back to the job's original model selection. It is strictly `run_results.json`-driven."}, "D": {"label": "❌ Incorrect", "text": "`dbt retry` does not raise errors or require `--full-refresh` in this scenario."}}, "key_rule": "`dbt retry` = replay only `errored`/`failed` nodes from `run_results.json`. Infrastructure failure with zero executed nodes = **no-op retry**. Must re-run the job from scratch."}, {"id": "q11_Q10", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 10, "high_yield": true, "subdomain_id": "10.10", "subdomain_topic": "`dbt clone` zero-copy behavior by platform", "question_text": "A team runs `dbt clone` to create a developer-scoped copy of production models for a hotfix branch. Their warehouse is Postgres. What does `dbt clone` create for each cloned model?", "is_multi_select": false, "options": {"A": "A zero-copy clone using Postgres's native table clone syntax.", "B": "A full materialized copy of each table, duplicating all data.", "C": "A view pointing to the production relation, acting as a lightweight proxy.", "D": "A schema-only empty table with no data."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Postgres does not support zero-copy cloning (metadata pointer swaps). That capability is limited to Snowflake, Databricks, and BigQuery."}, "B": {"label": "❌ Incorrect", "text": "`dbt clone` explicitly avoids full data copies — full table copies defeat the purpose of fast developer environment setup."}, "C": {"label": "✅ Correct", "text": "On platforms without zero-copy clone support (Postgres, Redshift), `dbt clone` creates a **pointer view** — a `CREATE VIEW AS SELECT * FROM <production_relation>`. It's a lightweight proxy, not a copy. Reads go through to the underlying production table."}, "D": {"label": "❌ Incorrect", "text": "`dbt clone` creates a usable relation (view or clone), not an empty schema."}}, "key_rule": "`dbt clone` zero-copy support: **Snowflake** (CLONE), **Databricks** (shallow clone), **BigQuery** (dataset copy). **Postgres/Redshift** = pointer views. All behavior is automatic based on the adapter."}, {"id": "q11_Q11", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 11, "high_yield": true, "subdomain_id": "10.11", "subdomain_topic": "`dbt clone` auto-includes `--defer`", "question_text": "A developer runs `dbt clone --select my_new_model` on a feature branch. `my_new_model` does not yet exist in the production environment. What happens to the clone operation for that model?", "is_multi_select": false, "options": {"A": "The command errors — `dbt clone` requires all selected models to exist in the production environment.", "B": "`dbt clone` skips the model and logs a warning, but continues cloning other selected models.", "C": "`dbt clone` automatically includes `--defer` behavior, so new models with no production counterpart are simply not cloned and dbt continues without error.", "D": "`dbt clone` creates an empty placeholder table in the developer schema for the new model."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt clone` is specifically designed for branch environments where some models are new and don't yet exist in production."}, "B": {"label": "❌ Incorrect", "text": "The behavior is more nuanced than a simple skip-and-warn."}, "C": {"label": "✅ Correct", "text": "`dbt clone` **automatically includes `--defer` logic**. For each selected model, it looks for a production counterpart in the state manifest. If no counterpart exists (the model is new), dbt simply does not clone that model — no error, no placeholder. The developer would then run `dbt run --select my_new_model` to build that new model from scratch."}, "D": {"label": "❌ Incorrect", "text": "`dbt clone` does not create empty placeholder tables."}}, "key_rule": "`dbt clone` always defers automatically. New models without a production counterpart = silently skipped (not an error). Run `dbt run` separately for net-new models."}, {"id": "q11_Q12", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 12, "high_yield": true, "subdomain_id": "10.12", "subdomain_topic": "`dbt ls` vs `dbt compile` warehouse connection requirement", "question_text": "A developer in a CI pipeline wants to quickly list all modified models without running anything or touching the warehouse. Which command should they use?", "is_multi_select": false, "options": {"A": "`dbt compile --select state:modified`", "B": "`dbt run --select state:modified --dry-run`", "C": "`dbt ls --select state:modified --state ./prod-manifest`", "D": "`dbt parse --select state:modified`"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt compile` **requires a warehouse connection** (to resolve `{{ ref() }}` and `{{ source() }}` against the database catalog). It also writes compiled SQL, making it heavier than needed for just listing nodes."}, "B": {"label": "❌ Incorrect", "text": "`dbt run --dry-run` is not a valid dbt flag."}, "C": {"label": "✅ Correct", "text": "`dbt ls` requires **no warehouse connection**. It parses the project, applies node selection logic, and outputs matching node names/paths. It is the correct tool for lightweight CI checks — listing nodes, validating selectors, or auditing the graph without touching the warehouse."}, "D": {"label": "❌ Incorrect", "text": "`dbt parse` does not accept `--select` for filtering output; it parses the whole project and writes a manifest. It also does not natively support state-based selection."}}, "key_rule": "`dbt ls` = **no warehouse connection needed**. `dbt compile` = **warehouse connection required**. Use `dbt ls` for CI checks, selector validation, and graph audits."}, {"id": "q11_Q13", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 13, "high_yield": true, "subdomain_id": "10.13", "subdomain_topic": "`dbt parse` and partial parsing in CI", "question_text": "After a large merge to the main branch that restructures several macros, a CI job's `dbt run` begins picking up stale compiled artifacts from prior runs. What is the most targeted fix?", "is_multi_select": false, "options": {"A": "Delete the entire `target/` directory before every CI run.", "B": "Add `--no-partial-parse` to the `dbt run` command to force a full re-parse.", "C": "Run `dbt clean` before `dbt run` to clear the compiled artifacts.", "D": "Set `PARTIAL_PARSE: false` in the `dbt_project.yml`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deleting the full `target/` directory is overly aggressive — it removes all artifacts including run results and compiled SQL that may be needed for other CI steps."}, "B": {"label": "✅ Correct", "text": "`--no-partial-parse` tells dbt to **ignore the cached partial parse file** and re-parse the entire project from scratch. This is the recommended approach after macro restructuring or large merges where partial parse caching may be stale. It can be added to any dbt command: `dbt run --no-partial-parse`."}, "C": {"label": "❌ Incorrect", "text": "`dbt clean` removes the entire `target/` and `dbt_packages/` directories — a sledgehammer approach that also removes package installations and logs."}, "D": {"label": "❌ Incorrect", "text": "`PARTIAL_PARSE` is not a `dbt_project.yml` setting. The flag is `--no-partial-parse` at the CLI level or `partial_parse: false` in `profiles.yml`."}}, "key_rule": "Use `--no-partial-parse` (or `dbt parse --no-partial-parse` as a separate step) in CI after large merges to ensure a clean parse without stale cache artifacts."}, {"id": "q11_Q14", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 14, "high_yield": true, "subdomain_id": "10.14", "subdomain_topic": "Ephemeral models and deferral", "question_text": "A developer uses `--defer` on a feature branch. One of the referenced models, `int_orders_ephemeral`, is configured as `materialized: ephemeral`. The production manifest includes this model. What happens when the ephemeral model is referenced?", "is_multi_select": false, "options": {"A": "The ephemeral model is deferred to the production version, substituting the production CTE.", "B": "Ephemeral models are never deferred — dbt always re-computes their CTE inline from source during the current run.", "C": "The command errors because ephemeral models cannot be used with `--defer`.", "D": "The ephemeral model is skipped and dbt builds a view proxy pointing to production instead."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Ephemeral models do not exist as warehouse objects — there is no production \"version\" to defer to."}, "B": {"label": "✅ Correct", "text": "Ephemeral models are compiled as **CTEs inlined into the models that reference them**. They have no persistent warehouse object. Therefore, `--defer` has no effect on them — dbt always recomputes the ephemeral CTE from its source SQL, regardless of what exists in the production manifest."}, "C": {"label": "❌ Incorrect", "text": "Using `--defer` with ephemeral models does not cause an error; the flag is simply ignored for ephemeral nodes."}, "D": {"label": "❌ Incorrect", "text": "No proxy is created for ephemeral models — they are always inline CTEs."}}, "key_rule": "Ephemeral models are **never deferred** because they have no warehouse object. `--defer` only applies to models that produce persistent relations (tables, views, incremental models)."}, {"id": "q11_Q15", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 15, "high_yield": true, "subdomain_id": "10.15", "subdomain_topic": "`state:modified` seed tracking limitation", "question_text": "A team tracks state changes on seeds to avoid re-uploading large reference tables every CI run. One of their seeds is 1.5 MB. After changing several rows deep in the CSV, `state:modified` does not flag the seed as changed. Why?", "is_multi_select": false, "options": {"A": "Seeds are never tracked by `state:modified` — you must always use `--full-refresh` for seeds.", "B": "Seeds larger than 1 MB are tracked only by **file path**, not by content hash. Moving or renaming the file would trigger a change, but editing its rows would not.", "C": "`state:modified` compares seeds using row count only; adding rows is detected but modifying existing rows is not.", "D": "The seed tracking threshold is 10 MB; 1.5 MB seeds are tracked normally by content hash."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Seeds under 1 MB are tracked by content hash — only large seeds have this limitation."}, "B": {"label": "✅ Correct", "text": "dbt tracks seed changes using a content hash (checksum of the CSV), but **only for seeds under 1 MB**. Seeds larger than 1 MB are tracked by **file path only**. This means content edits — adding, removing, or changing rows — are invisible to `state:modified` for large seeds. Only renaming or moving the file (path change) would register as a change."}, "C": {"label": "❌ Incorrect", "text": "Row count is not used for seed tracking. The mechanism is content hash (for small seeds) or path (for large seeds)."}, "D": {"label": "❌ Incorrect", "text": "The threshold is 1 MB, not 10 MB."}}, "key_rule": "Seeds **> 1 MB** are tracked by **path only** in state comparison. Content edits are invisible. For large seeds, consider splitting the file or forcing a re-upload with an explicit seed selector."}, {"id": "q11_Q16", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 16, "high_yield": true, "subdomain_id": "10.16", "subdomain_topic": "`dbt source freshness` requirements", "question_text": "An architect wants to add `dbt source freshness` checks for a source table in BigQuery. Which of the following is a hard requirement for freshness checks to work?", "is_multi_select": false, "options": {"A": "The source table must have a `unique_key` defined in `sources.yml`.", "B": "The source table must have a `loaded_at_field` defined in `sources.yml` pointing to a timestamp column.", "C": "The source must be configured with `freshness: enabled: true` in the project-level config.", "D": "The BigQuery service account must have the `bigquery.tables.getData` permission."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`unique_key` is used for incremental models, not source freshness."}, "B": {"label": "✅ Correct", "text": "`loaded_at_field` is the **required field** for source freshness. It tells dbt which column to `MAX()` to determine when the source was last loaded. Without it, dbt cannot compute freshness. The column is typically a timestamp like `_loaded_at` or `updated_at`. The `warn_after` and `error_after` thresholds are configured alongside it. Results are written to `target/sources.json`."}, "C": {"label": "❌ Incorrect", "text": "There is no `freshness: enabled: true` project-level config. Freshness is enabled by adding `loaded_at_field` and threshold blocks to the source definition."}, "D": {"label": "❌ Incorrect", "text": "While permissions matter for general warehouse access, they are not a specific requirement that distinguishes freshness checks."}}, "key_rule": "`dbt source freshness` requires `loaded_at_field` (timestamp column) + `warn_after`/`error_after` thresholds in `sources.yml`. Results → `target/sources.json`."}, {"id": "q11_Q17", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 17, "high_yield": true, "subdomain_id": "10.17", "subdomain_topic": "`source_status:fresher+` selector", "question_text": "A CI job should rebuild only the models downstream of sources that have received new data since the last freshness check. Which selector achieves this?", "is_multi_select": false, "options": {"A": "`state:modified+ --select source:*`", "B": "`source_status:fresher+`", "C": "`source:* --select +state:modified`", "D": "`result:fresher+`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This syntax mixes selection methods incorrectly and does not leverage source freshness results."}, "B": {"label": "✅ Correct", "text": "`source_status:fresher` selects sources that are **fresher than the last recorded state** (i.e., new data has arrived). The `+` suffix adds all downstream descendants. This selector requires a `--state` manifest from a prior `dbt source freshness` run (which produces `sources.json`). It enables data-arrival-driven pipelines: only rebuild when sources actually have new data."}, "C": {"label": "❌ Incorrect", "text": "This is not valid selector syntax and conflates source selection with state comparison."}, "D": {"label": "❌ Incorrect", "text": "`result:fresher` is not a valid selector. The correct method uses `source_status:fresher`, not `result:`."}}, "key_rule": "`source_status:fresher+` = sources with new data since last check + all downstream models. Requires `--state` pointing to a manifest from a prior `dbt source freshness` run."}, {"id": "q11_Q18", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 18, "high_yield": true, "subdomain_id": "10.18", "subdomain_topic": "`result:error` vs `result:fail` selectors", "question_text": "After a failed `dbt build`, a developer wants to retry only the nodes that **errored** (e.g., models that failed to compile or run) while explicitly excluding tests that failed due to data quality issues. Which selector is correct?", "is_multi_select": false, "options": {"A": "`result:fail`", "B": "`result:error`", "C": "`result:error result:fail`", "D": "`state:modified.body`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`result:fail` selects nodes with status `fail` — this is the status assigned to **tests** that fail (data quality assertion failures). It does not select errored models."}, "B": {"label": "✅ Correct", "text": "`result:error` selects nodes with status `error` — this is the status assigned to **models, seeds, and snapshots** that encounter execution errors (bad SQL, permission denied, compile errors). Tests that error (not fail) are also included. Use `result:error` to retry failed model execution without re-running passing tests or skipping data-failing tests."}, "C": {"label": "❌ Incorrect", "text": "The space between these selectors = union (either errored OR failed). This would re-run both failing models and failing tests — not the desired behavior if you want to exclude data quality test failures."}, "D": {"label": "❌ Incorrect", "text": "`state:modified.body` is a state comparison selector for detecting SQL body changes, not for retrying failed nodes."}}, "key_rule": "`result:error` = execution failures (models, commands). `result:fail` = assertion failures (tests). These are distinct statuses. `dbt retry` internally uses `result:error+result:fail` to catch both."}, {"id": "q11_Q19", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 19, "high_yield": true, "subdomain_id": "10.19", "subdomain_topic": "`dbt compile --inline` for ad-hoc SQL", "question_text": "A developer wants to compile a Jinja SQL snippet that uses `{{ ref('orders') }}` without creating a model file. Which command accomplishes this?", "is_multi_select": false, "options": {"A": "`dbt run --inline \"SELECT * FROM {{ ref('orders') }}\"`", "B": "`dbt compile --inline \"SELECT * FROM {{ ref('orders') }}\"`", "C": "`dbt parse --inline \"SELECT * FROM {{ ref('orders') }}\"`", "D": "`dbt compile --ad-hoc \"SELECT * FROM {{ ref('orders') }}\"`"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt run` does not support `--inline`. It executes model files, not inline SQL."}, "B": {"label": "✅ Correct", "text": "`dbt compile --inline \"<sql>\"` compiles an ad-hoc Jinja SQL string without requiring a model file. It resolves `{{ ref() }}`, `{{ source() }}`, macros, and variables against the current project and target, then prints the compiled SQL. Useful for debugging Jinja expressions or quickly checking what a snippet compiles to. Note: requires a **warehouse connection** (like all `dbt compile` invocations)."}, "C": {"label": "❌ Incorrect", "text": "`dbt parse` does not support `--inline`. It parses project files, not inline SQL."}, "D": {"label": "❌ Incorrect", "text": "`--ad-hoc` is not a valid dbt flag."}}, "key_rule": "`dbt compile --inline \"<jinja-sql>\"` = ad-hoc compilation of a SQL snippet. No model file needed, but warehouse connection required. Great for Jinja debugging."}, {"id": "q11_Q20", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 20, "high_yield": true, "subdomain_id": "10.20", "subdomain_topic": "`--favor-state` flag behavior", "question_text": "A developer runs `dbt run --select orders+ --defer --state ./prod-manifest`. For nodes that exist in both the dev target (partially built from yesterday) and the production manifest, which relation does dbt use by default? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "By default (no `--favor-state`), dbt prefers the **dev target** relation if it exists there.", "B": "By default (no `--favor-state`), dbt prefers the **production manifest** relation always.", "C": "Adding `--favor-state` causes dbt to prefer the **state manifest** (production) relation over the dev target.", "D": "Adding `--favor-state` causes dbt to prefer the **dev target** relation over the state manifest."}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "The **default `--defer` behavior** prefers the developer's own target schema. If a relation exists in the dev target (even if outdated), dbt uses it — deferring to production only for relations that do NOT exist in dev at all."}, "B": {"label": "❌ Incorrect", "text": "Without `--favor-state`, production is the fallback, not the preference. Dev target takes priority when a relation exists there."}, "C": {"label": "✅ Correct", "text": "`--favor-state` **flips the priority**: dbt now prefers the state manifest (production) relation over whatever is in the dev target. This ensures developers always work against production-fresh data even when stale dev relations exist."}, "D": {"label": "❌ Incorrect", "text": "This describes the default behavior (no `--favor-state`), not what `--favor-state` adds."}}, "key_rule": "Default `--defer` = dev target first → prod state as fallback. `--favor-state` = prod state first → dev target as fallback. Use `--favor-state` in CI or when dev relations may be stale."}, {"id": "q11_Q21", "file_id": "q11", "topic_num": "10", "topic_name": "dbt Commands & Node Selection", "question_num": 21, "high_yield": true, "subdomain_id": "10.21", "subdomain_topic": "`source:` vs `source_status:` selector methods", "question_text": "A platform team wants to build only the models downstream of sources whose raw data has actually arrived since the last run. They author a job with the step:\n\n```bash\ndbt build --select source:fresher+\n```\n\nThe job runs successfully but builds **zero models**, even though new data has clearly landed in some sources. What is the issue, and what is the correct command? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "`source:fresher+` is interpreted as a **name lookup** for a source literally named `fresher`. Unless one exists, the selector matches nothing and the run is a silent no-op.", "B": "The correct selector method for \"sources with new data since the last freshness check\" is `source_status:fresher+`, which compares the current `sources.json` against a prior one provided via `--state`.", "C": "`source:fresher+` is the correct selector but requires the `--full-refresh` flag to register new freshness state.", "D": "`source_status:` accepts multiple values such as `fresher`, `stale`, and `error` — the team should use `source_status:fresher,stale+` to capture all changes.", "E": "The job will work as written if the team upgrades to the Fusion engine, which auto-resolves `source:fresher+` as a freshness-state selector."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "`source:` is the **name-based** selector method — it expects a source's declared name (e.g., `source:snowplow+`). `source:fresher+` is interpreted as \"find a source literally **named** `fresher` plus its descendants.\" Since virtually no project defines a source by that name, the selector resolves to **zero nodes** and the run silently does nothing. This is one of the most common dbt selector traps."}, "B": {"label": "✅ Correct", "text": "The correct selector is **`source_status:fresher+`** — a state-aware selector that compares the current `sources.json` (from a fresh `dbt source freshness` run) against a prior one supplied via `--state path/to/previous/`. Sources whose `max_loaded_at` is newer in the current run are tagged `fresher` and selected, along with their downstream models. The full correct command is: `dbt build --select source_status:fresher+ --state path/to/previous/`. Without `--state`, this also resolves to zero nodes."}, "C": {"label": "❌ Incorrect", "text": "`--full-refresh` controls incremental rebuild behavior — it has no relationship to freshness state detection. The underlying selector method is still wrong."}, "D": {"label": "❌ Incorrect", "text": "`source_status:` accepts **only one value: `fresher`**. There is no `stale` or `error` variant. (Errors and staleness are surfaced by `dbt source freshness` exit codes, not by this selector.)"}, "E": {"label": "❌ Incorrect", "text": "The Fusion engine does not change selector method semantics. `source:` remains a name lookup regardless of engine."}}, "key_rule": "`source:<name>+` = **name lookup** (no `--state` needed). `source_status:fresher+` = **state-aware freshness selector** (requires `--state` with prior `sources.json`; `fresher` is the only valid value). Mistyping `source_status` as `source` is a silent no-op, not an error."}, {"id": "q12_Q1", "file_id": "q12", "topic_num": "10", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 1, "high_yield": true, "subdomain_id": "10.1", "subdomain_topic": "`access: public` does not grant database permissions", "question_text": "In an Enterprise dbt Mesh, a consumer project's production job references a producer's `dim_customers` model via `{{ ref('jaffle_finance', 'dim_customers') }}`. The model is marked `access: public`, `dependencies.yml` is correct, and the job parses and compiles without error. At runtime, Snowflake returns `SQL access control error: Insufficient privileges to operate on table 'DIM_CUSTOMERS'`. What is the root cause?", "is_multi_select": false, "options": {"A": "`access: public` requires the producer to add the consumer project to an `allowed_consumers` list in the model's YAML — without it, the warehouse layer blocks access.", "B": "The producer project is missing a Staging environment, so the consumer's Production job fell back to Production credentials that lack cross-project grants.", "C": "`access: public` is a DAG-level governance control only — it does not grant warehouse SELECT privileges; grants must be configured separately via `grants`, post-hooks, or role-based access in the warehouse.", "D": "Cross-project refs to public models require the consumer's service account to be added to the producer project's \"Cross-project Readers\" group in dbt Cloud."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No `allowed_consumers` config exists in dbt. `access: public` is unconditionally visible across projects — there is no per-consumer allowlist at the model level."}, "B": {"label": "❌ Incorrect", "text": "Staging environment fallback affects cross-project **ref resolution**, not warehouse permissions. The scenario states the job compiled successfully — resolution worked. The failure is at query execution, which is a warehouse grants issue."}, "C": {"label": "✅ Correct", "text": "`access` levels (`private`/`protected`/`public`) are purely **DAG-level governance** — they control whether `ref()` is permitted across groups/projects at parse/compile time. They do **not** touch warehouse permissions. The consumer's warehouse role still needs `USAGE` on the schema and `SELECT` on the table, configured via `grants:` in the producer's YAML, a post-hook, or direct role management."}, "D": {"label": "❌ Incorrect", "text": "No such \"Cross-project Readers\" group exists in dbt Cloud. The concept conflates RBAC permissions with governance access, which are orthogonal."}}, "key_rule": "`access: public` = who can `ref()` you in code. Warehouse `GRANT SELECT` = who can query the underlying table. These are two independent layers — always configure both for cross-project Mesh consumers."}, {"id": "q12_Q2", "file_id": "q12", "topic_num": "10", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 2, "high_yield": true, "subdomain_id": "10.2", "subdomain_topic": "Package `restrict-access` default", "question_text": "A platform team publishes a dbt package containing both `protected` and `private` models intended for internal use only, plus a few `public` models. A downstream team installs the package via `packages.yml` and discovers they can successfully `ref()` the **protected** models from the installed package. The platform team expected only the `public` models to be accessible. What is the cause, and what is the fix?", "is_multi_select": false, "options": {"A": "This is expected behavior — `protected` access allows refs from any installed package by design. To prevent it, change the protected models to `private`.", "B": "By default, installed packages expose all non-private models to the consuming project. The platform team must set `restrict-access: True` in the package's `dbt_project.yml` to force consumers to only reference `public` models.", "C": "The package manifest is stale — running `dbt deps --upgrade` in the consumer project will re-validate access levels and block the protected refs.", "D": "Packages do not participate in the governance access system. Protected/private only work within dbt Mesh `project_dependencies`, not via `packages.yml`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`protected` (the default) means \"same project or installed package\" — it deliberately permits refs from installed packages. Changing everything to `private` would break internal refs within the package itself across groups."}, "B": {"label": "✅ Correct", "text": "The default `protected` behavior intentionally treats an installed package as an extension of the consumer project. To enforce strict public-only sharing, the producing package must set **`restrict-access: True`** in its `dbt_project.yml`. This changes the effective boundary so consumers can only ref models explicitly marked `public`."}, "C": {"label": "❌ Incorrect", "text": "`dbt deps --upgrade` refreshes package versions; it does not change access enforcement semantics."}, "D": {"label": "❌ Incorrect", "text": "Packages do participate in the access system — `protected` specifically permits refs from installed packages. The interaction is documented, not absent."}}, "key_rule": "`protected` + installed package = consumer can ref. To block that, producer sets `restrict-access: True` in its `dbt_project.yml`. This is distinct from Mesh `project_dependencies`, which already enforces public-only by default."}, {"id": "q12_Q3", "file_id": "q12", "topic_num": "10", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 3, "high_yield": true, "subdomain_id": "10.3", "subdomain_topic": "Migration path for breaking change on contracted public model", "question_text": "A public, contract-enforced model `dim_customers` (current `latest_version: 1`) must drop the `country_name` column. Three downstream Mesh consumer projects pin `v=1` in their refs. The architect needs a zero-downtime migration path. Which sequence is correct?", "is_multi_select": false, "options": {"A": "Update `dim_customers.sql` to drop the column, update the YAML `columns:` list to remove `country_name`, and deploy. The contract will allow it because SQL and YAML remain consistent.", "B": "Set `on_schema_change: sync_all_columns` on the model and deploy. The contract handles column removal automatically when this config is present.", "C": "Add a `v=2` with the column removed, bump `latest_version: 2`, set a `deprecation_date` on `v=1`, notify consumers to migrate their pinned refs, then remove `v=1` after the deprecation date. Never modify `v=1` in place.", "D": "Mark the model `access: protected` temporarily, drop the column, then flip back to `access: public` after all consumers redeploy."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Contracts do not just check SQL/YAML consistency — they treat column removal as a **breaking change** regardless of whether both sides are updated. The preflight check compares the new contract to the previous one and fails the build. For a **versioned** contracted model, removing it outright raises a hard error (vs a warning for unversioned)."}, "B": {"label": "❌ Incorrect", "text": "`on_schema_change: sync_all_columns` is **not compatible** with contracts at all. Incremental + contract supports only `append_new_columns` or `fail`. This option would itself raise a configuration error."}, "C": {"label": "✅ Correct", "text": "This is the documented migration pattern: create `dim_customers_v2.sql` without the column, set `latest_version: 2`, add `deprecation_date` on `v=1` which triggers warnings for pinned consumers, let consumers migrate at their own pace, and only remove `v=1` once the deprecation date passes. This preserves downstream stability through the migration window."}, "D": {"label": "❌ Incorrect", "text": "Flipping `access` does not suspend contract enforcement. The contract breaking change is detected at build time regardless of access level. Toggling access also doesn't give consumers any migration window — their pinned refs would still break."}}, "key_rule": "Breaking change on a contracted public model = **new version + `deprecation_date` + consumer migration + delete old version**. Never modify a contracted public model in place — the contract is designed to block exactly that."}, {"id": "q12_Q4", "file_id": "q12", "topic_num": "10", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 4, "high_yield": true, "subdomain_id": "10.4", "subdomain_topic": "`latest_version` implicit resolution and prerelease semantics", "question_text": "An architect declares two versions of `dim_customers` in YAML: `v=1` and `v=2`. They omit the `latest_version:` key. A separate model contains an unpinned `{{ ref('dim_customers') }}`. Later, the architect adds `latest_version: 1` explicitly to the YAML (while `v=2` still exists). What is the behavior in each state, and what is `v=2` considered in the second state?", "is_multi_select": false, "options": {"A": "State 1: unpinned ref resolves to `v=1` (alphabetical first). State 2: unpinned ref resolves to `v=1`. `v=2` is treated as deprecated.", "B": "State 1: parse error — `latest_version` is required when multiple versions exist. State 2: unpinned ref resolves to `v=1`; `v=2` is considered a **prerelease**.", "C": "State 1: unpinned ref resolves to `v=2` (highest version number by default). State 2: unpinned ref resolves to `v=1`; `v=2` is considered a **prerelease** and dbt emits a warning that unpinned refs will eventually resolve to it.", "D": "State 1: unpinned refs fail to compile without an explicit `latest_version`. State 2: `v=2` is silently ignored until `latest_version` is bumped."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Version resolution is **numeric**, not alphabetical. And `v=2` is not \"deprecated\" — deprecation requires an explicit `deprecation_date`."}, "B": {"label": "❌ Incorrect", "text": "`latest_version` is **not required**; dbt implicitly picks the highest numeric version. So State 1 parses fine and resolves to `v=2`."}, "C": {"label": "✅ Correct", "text": "**State 1** (no `latest_version` declared): dbt uses the numerically highest version → unpinned `ref()` resolves to `v=2`. **State 2** (`latest_version: 1` explicit, `v=2` exists): unpinned `ref()` resolves to `v=1`, and `v=2` is classified as a **prerelease**. dbt emits a warning like: \"A prerelease version 2 is available…this reference will resolve to v=2 when latest_version is bumped.\" This lets teams ship a new version in code and let consumers adopt it before cutting over."}, "D": {"label": "❌ Incorrect", "text": "Omitting `latest_version` does not cause compilation failure. `v=2` is never silently ignored — it becomes a prerelease, visible and refable by explicit pin."}}, "key_rule": "No `latest_version` → highest number wins. Explicit `latest_version` lower than the highest → newer versions are **prereleases** (shipped but not yet the default). Use this to stage a new version before flipping consumers over."}, {"id": "q12_Q5", "file_id": "q12", "topic_num": "10", "topic_name": "Model Governance (Access, Contracts, Versions, Groups)", "question_num": 5, "high_yield": true, "subdomain_id": "10.5", "subdomain_topic": "Model group gotchas", "question_text": "Which of the following statements about model **governance groups** (not RBAC user groups) are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The `owner:` property on a group requires **both** `name` and `email` — omitting either causes a parse error.", "B": "A model can belong to **exactly one** group; attempting to assign multiple groups via both `dbt_project.yml` and an in-file `{{ config() }}` causes the most specific declaration (in-file) to win, not a merge.", "C": "Referencing a `private` model from outside its group causes a `DbtReferenceError` at **parse time**, not at runtime — the model never builds.", "D": "Group assignments defined in `dbt_project.yml` (via `+group:`) cannot be overridden by schema.yml or inline `config()` — they are locked at the project level.", "E": "The list of users in a dbt Cloud RBAC group named `finance` is automatically synced to the governance group `finance`, granting those users the ability to ref private models in the `finance` governance group."}, "correct_answers": ["B", "C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The `owner:` property requires `name` **OR** `email` — either one is sufficient. Both are not mandatory."}, "B": {"label": "✅ Correct", "text": "A model belongs to exactly one group. The three assignment methods (`+group:` in `dbt_project.yml`, `group:` in schema.yml, `{{ config(group='...') }}` in-file) follow dbt's standard config precedence: **in-file > schema.yml > project-level**. The most specific declaration wins — there is no merging of groups."}, "C": {"label": "✅ Correct", "text": "Private access violations are caught at **parse time** (during `dbt compile` or the manifest build), not at runtime. dbt raises a `DbtReferenceError`: \"the referenced node is private to the [group name].\" The offending model never gets to the database. This early detection is the core value of governance groups."}, "D": {"label": "❌ Incorrect", "text": "This is the opposite of dbt's config precedence. Project-level `+group:` provides a default that can be overridden by more specific declarations in schema.yml or in-file config — the same pattern as all other dbt config."}, "E": {"label": "❌ Incorrect", "text": "Governance groups (defined in dbt YAML, control which models can ref private models) and RBAC user groups (defined in dbt Cloud, control which humans can access the UI/IDE/jobs) are **completely orthogonal**. Matching names is pure coincidence and creates no linkage — governance membership is a property of models, not users."}}, "key_rule": "Governance groups are code-level model ownership boundaries with standard dbt config precedence (in-file > schema.yml > project). Violations caught at parse time. Never conflate them with RBAC user groups — they share nothing but naming conventions."}];

// ── State ─────────────────────────────────────────────────────────────────────
const state = {
  qs: [],
  idx: 0,
  sel: [],
  done: false,
  score: { ok: 0, total: 0 },
  filter: 'all',
  shuffle: false,
};

// ── Utilities ─────────────────────────────────────────────────────────────────
function fisherYates(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function md(text) {
  return esc(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// ── Filter / shuffle ──────────────────────────────────────────────────────────
function applyFilter() {
  let pool = ALL_QUESTIONS;
  if (state.filter === 'hy') pool = pool.filter(q => q.high_yield);
  else if (state.filter !== 'all') pool = pool.filter(q => q.file_id === state.filter);
  state.qs = state.shuffle ? fisherYates(pool) : pool.slice();
  state.idx = 0;
  state.sel = [];
  state.done = false;
  state.score = { ok: 0, total: 0 };
}

// ── Header ────────────────────────────────────────────────────────────────────
function renderHeader() {
  const { ok, total } = state.score;
  const pct = total ? Math.round(ok / total * 100) : null;
  document.getElementById('score-badge').textContent =
    total === 0 ? 'Score: —' : 'Score: ' + ok + '/' + total + ' (' + pct + '%)';
  const progress = state.qs.length ? (state.idx / state.qs.length * 100) : 0;
  document.getElementById('progress-bar').style.width = progress + '%';
}

// ── Question card ─────────────────────────────────────────────────────────────
function renderQ() {
  const card = document.getElementById('card');
  const q = state.qs[state.idx];
  if (!q) { renderEnd(); return; }

  const letters = Object.keys(q.options).sort();

  const optHtml = letters.map(function(letter) {
    const isCorrect = q.correct_answers.indexOf(letter) >= 0;
    const isSel = state.sel.indexOf(letter) >= 0;
    let cls = 'opt';
    if (state.done) {
      if (isCorrect) cls += ' correct';
      else if (isSel) cls += ' wrong-sel';
    } else if (isSel) {
      cls += ' selected';
    }
    return '<button class="' + cls + '" data-l="' + letter + '"' +
           (state.done ? ' disabled' : '') + '>' +
           '<span class="opt-letter">' + letter + '</span>' +
           '<span>' + md(q.options[letter]) + '</span>' +
           '</button>';
  }).join('');

  const hint = q.is_multi_select ? 'Select 2 answers' : 'Select 1 answer';
  const canSub = state.sel.length > 0;
  const actionHtml = state.done ? '' :
    '<div class="action-row">' +
    '<button class="btn-submit" id="sub-btn"' + (canSub ? '' : ' disabled') + '>Submit</button>' +
    '<span class="select-hint">' + hint + '</span>' +
    '</div>';

  let explHtml = '';
  if (state.done) {
    const items = letters.map(function(letter) {
      const isCorrect = q.correct_answers.indexOf(letter) >= 0;
      const isSel = state.sel.indexOf(letter) >= 0;
      const expl = q.explanations[letter] || {};
      const label = expl.label || (isCorrect ? '\u2705 Correct' : '\u274c Incorrect');
      const text = expl.text || '';
      let cls = 'expl-item ';
      if (isCorrect) cls += 'correct';
      else if (isSel) cls += 'wrong-sel';
      else cls += 'neutral';
      return '<div class="' + cls + '">' +
             '<div class="expl-head">' + letter + ') ' + md(label) + '</div>' +
             '<div class="expl-text">' + md(text) + '</div>' +
             '</div>';
    }).join('');

    const ruleHtml = q.key_rule
      ? '<div class="key-rule">💡 <strong>Key rule:</strong> ' + md(q.key_rule) + '</div>'
      : '';

    const isLast = state.idx >= state.qs.length - 1;
    explHtml = '<hr class="divider">' +
               '<div class="expl-list">' + items + '</div>' +
               ruleHtml +
               '<button class="btn-next" id="next-btn">' + (isLast ? 'See Results' : 'Next →') + '</button>';
  }

  card.innerHTML =
    '<div class="card-meta">' +
    '<span class="topic-pill">Topic ' + esc(q.topic_num) + ': ' + esc(q.topic_name) + '</span>' +
    (q.high_yield ? '<span class="star-badge">\u2b50 High-Yield</span>' : '') +
    '<span class="q-counter">Q' + (state.idx + 1) + ' / ' + state.qs.length + '</span>' +
    '</div>' +
    '<div class="subdomain">' + esc(q.subdomain_id) + ' — ' + md(q.subdomain_topic) + '</div>' +
    '<div class="question-text">' + md(q.question_text) + '</div>' +
    '<div class="options">' + optHtml + '</div>' +
    actionHtml +
    explHtml;

  card.querySelectorAll('.opt').forEach(function(btn) {
    btn.addEventListener('click', function() { toggleOpt(btn.dataset.l); });
  });
  const subBtn = document.getElementById('sub-btn');
  if (subBtn) subBtn.addEventListener('click', submit);
  const nextBtn = document.getElementById('next-btn');
  if (nextBtn) nextBtn.addEventListener('click', nextQ);

  document.getElementById('kbd-hint').textContent = state.done
    ? 'Enter or → to continue'
    : 'Keys: 1–' + letters.length + ' select · Enter submit';

  renderHeader();
}

// ── Interactions ──────────────────────────────────────────────────────────────
function toggleOpt(letter) {
  if (state.done) return;
  const q = state.qs[state.idx];
  if (q.is_multi_select) {
    const i = state.sel.indexOf(letter);
    if (i >= 0) state.sel.splice(i, 1);
    else state.sel.push(letter);
  } else {
    state.sel = [letter];
  }
  renderQ();
}

function submit() {
  if (state.done || state.sel.length === 0) return;
  const q = state.qs[state.idx];
  const correct = q.correct_answers.slice().sort().join(',');
  const selected = state.sel.slice().sort().join(',');
  state.done = true;
  state.score.total++;
  if (selected === correct) state.score.ok++;
  renderQ();
}

function nextQ() {
  if (state.idx >= state.qs.length - 1) { renderEnd(); return; }
  state.idx++;
  state.sel = [];
  state.done = false;
  renderQ();
}

// ── End screen ────────────────────────────────────────────────────────────────
function renderEnd() {
  const { ok, total } = state.score;
  const pct = total ? Math.round(ok / total * 100) : 0;
  const grade = pct >= 80 ? '\u2705 Pass' : pct >= 60 ? '\u26a0\ufe0f Close' : '\u274c Keep studying';
  document.getElementById('card').innerHTML =
    '<div class="end-wrap">' +
    '<div class="end-score">' + ok + '/' + total + '</div>' +
    '<div class="end-pct">' + pct + '%</div>' +
    '<div class="end-sub">' + grade + ' · ' + total + ' questions answered</div>' +
    '<button class="btn-restart" id="restart-btn">Try Again</button>' +
    '</div>';
  document.getElementById('progress-bar').style.width = '100%';
  document.getElementById('kbd-hint').textContent = '';
  document.getElementById('restart-btn').addEventListener('click', function() {
    applyFilter();
    renderQ();
  });
}

// ── Keyboard ──────────────────────────────────────────────────────────────────
document.addEventListener('keydown', function(e) {
  if (document.activeElement === document.getElementById('filter-select')) return;
  const q = state.qs[state.idx];
  if (!q) return;
  const letters = Object.keys(q.options).sort();
  const numMap = { '1': 0, '2': 1, '3': 2, '4': 3, '5': 4 };
  if (!state.done) {
    if (e.key in numMap) {
      const letter = letters[numMap[e.key]];
      if (letter) { toggleOpt(letter); e.preventDefault(); }
    } else if (e.key === 'Enter' && state.sel.length > 0) {
      submit(); e.preventDefault();
    }
  } else {
    if (e.key === 'Enter' || e.key === 'ArrowRight' || e.key === 'n') {
      nextQ(); e.preventDefault();
    }
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', function() {
  const topicMap = {};
  let hyCount = 0;
  ALL_QUESTIONS.forEach(function(q) {
    if (q.high_yield) hyCount++;
    if (!topicMap[q.file_id]) {
      topicMap[q.file_id] = { num: q.topic_num, name: q.topic_name, count: 0 };
    }
    topicMap[q.file_id].count++;
  });

  const sel = document.getElementById('filter-select');
  sel.innerHTML =
    '<option value="all">All Topics (' + ALL_QUESTIONS.length + ')</option>' +
    '<option value="hy">\u2b50 High-Yield (' + hyCount + ')</option>' +
    Object.keys(topicMap).map(function(fid) {
      const t = topicMap[fid];
      return '<option value="' + fid + '">Topic ' + esc(t.num) + ': ' + esc(t.name) + ' (' + t.count + ')</option>';
    }).join('');

  sel.addEventListener('change', function(e) {
    state.filter = e.target.value;
    applyFilter();
    renderQ();
  });

  const shuffleBtn = document.getElementById('shuffle-btn');
  shuffleBtn.addEventListener('click', function() {
    state.shuffle = !state.shuffle;
    shuffleBtn.textContent = 'Shuffle: ' + (state.shuffle ? 'ON' : 'OFF');
    shuffleBtn.classList.toggle('on', state.shuffle);
    applyFilter();
    renderQ();
  });

  applyFilter();
  renderQ();
});
</script>
