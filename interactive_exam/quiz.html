 is a billing issue — the organization has exceeded its CI run quota for the month."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no manual re-enable step required for CI jobs after a PR is closed."}, "B": {"label": "✅ Correct", "text": "dbt Cloud has a known CI behavior with Azure DevOps: if a branch name was used in a **previously closed or abandoned PR**, opening a new PR with the **same branch name** (or using the same commit SHA) will not trigger CI. Always use a new branch name for new PRs to ensure CI triggers reliably."}, "C": {"label": "❌ Incorrect", "text": "Branch protection rules are an Azure DevOps configuration — they would block PR creation entirely, not just CI triggering."}, "D": {"label": "❌ Incorrect", "text": "CI run quotas are not a documented dbt Cloud billing constraint."}}, "key_rule": "Azure DevOps CI won't trigger on new PRs that reuse a branch name from an abandoned/closed PR. Always use a fresh branch name."}, {"id": "q02_Q19", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 19, "high_yield": false, "subdomain_id": "2.19", "subdomain_topic": "Deploy key limitations", "question_text": "An organization on a Starter plan uses a deploy key to connect their GitHub repository to dbt Cloud. They want CI jobs to trigger automatically on every pull request. What is the limitation they will encounter?", "is_multi_select": false, "options": {"A": "Deploy keys expire after 90 days and must be rotated, causing periodic CI outages.", "B": "Deploy keys provide read-only repository access — they support manual job triggers but not automatic CI triggers on pull requests.", "C": "Deploy keys only work with GitHub and not with GitLab or Azure DevOps.", "D": "Deploy keys require a self-hosted dbt runner to function."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deploy keys do not have a 90-day expiration by default unless set explicitly. Key rotation is best practice but not a hard limitation on CI triggering."}, "B": {"label": "✅ Correct", "text": "Deploy keys provide **read-only repository access** for dbt to clone the code — they do not give dbt the ability to receive PR webhook events or post status checks back to the Git provider. Automatic CI triggers on pull requests require a **native integration** (GitHub App, Azure DevOps native, GitLab OAuth) — not deploy keys. Starter plan on Azure DevOps is the classic example: deploy keys work for manual runs but auto-CI requires upgrading to Enterprise."}, "C": {"label": "❌ Incorrect", "text": "Deploy keys work with GitHub, GitLab, Azure DevOps, and other providers — they're a standard Git mechanism, not GitHub-specific."}, "D": {"label": "❌ Incorrect", "text": "Deploy keys work with dbt Cloud-hosted runners — no self-hosted runner is required."}}, "key_rule": "Deploy keys = repo clone access only. No automatic PR-triggered CI. Native integration required for auto-triggers."}, {"id": "q02_Q20", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 20, "high_yield": false, "subdomain_id": "2.20", "subdomain_topic": "GitHub Enterprise on non-ghe.com domain", "question_text": "A company runs GitHub Enterprise Server on their own domain (`github.company.com` — not a `ghe.com` subdomain). They want to connect it to dbt Cloud. Which connection method is required?", "is_multi_select": false, "options": {"A": "GitHub native app integration — it supports any GitHub Enterprise domain.", "B": "Azure DevOps native integration, since on-premises GitHub requires a Microsoft product for integration.", "C": "Git URL / deploy key method — GitHub Enterprise on non-`ghe.com` domains does not support the native GitHub app integration.", "D": "PrivateLink — required for any on-premises Git provider."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The GitHub native app integration supports GitHub.com and GitHub Enterprise on `ghe.com` (GitHub's hosted enterprise offering) — but NOT self-hosted GitHub Enterprise on custom domains."}, "B": {"label": "❌ Incorrect", "text": "Azure DevOps native integration is for Azure DevOps, not GitHub Enterprise."}, "C": {"label": "✅ Correct", "text": "GitHub Enterprise Server on a **custom domain** (e.g., `github.company.com`) that is not a `ghe.com` subdomain requires the **git URL / deploy key** connection method. The native GitHub app integration only supports `github.com` and `*.ghe.com` domains. Custom on-premises GitHub Enterprise instances fall back to the deploy key approach."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink is a network topology feature for VPC-to-VPC connectivity — it is not a Git connection method."}}, "key_rule": "GitHub Enterprise on custom domain (not `ghe.com`) = git URL / deploy key only. Native app = github.com and `*.ghe.com` only."}, {"id": "q03_Q1", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 1, "high_yield": true, "subdomain_id": "3.1", "subdomain_topic": "Default schema generation behavior", "question_text": "A developer's dbt Cloud IDE is configured with a target schema of `dbt_alice`. A model has the following config:\n\n```yaml\nconfig:\n  schema: 'finance'\n```\n\nWhen the developer runs this model in the IDE, which schema does the model land in?", "is_multi_select": false, "options": {"A": "`finance` — the custom schema replaces the target schema.", "B": "`dbt_alice` — the custom schema config is ignored in development.", "C": "`dbt_alice_finance` — the default macro prepends the target schema.", "D": "`dbt_finance` — the target schema prefix is shortened to match the `dbt_` prefix convention."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "In the default `generate_schema_name` macro, custom schema does NOT replace target schema — it appends to it. Replacing would cause multi-developer collisions."}, "B": {"label": "❌ Incorrect", "text": "The custom schema config IS honored — it just appends rather than replaces."}, "C": {"label": "✅ Correct", "text": "Default behavior: `<target.schema>_<custom_schema>` = `dbt_alice_finance`. This ensures isolation when multiple developers have models with the same `schema: finance` config — `dbt_alice_finance` and `dbt_bob_finance` are distinct."}, "D": {"label": "❌ Incorrect", "text": "There is no `dbt_` prefix shortening behavior in dbt's default logic."}}, "key_rule": "Default formula = `<target.schema>_<custom_schema>`. Custom schema APPENDS, does NOT replace."}, {"id": "q03_Q2", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 2, "high_yield": true, "subdomain_id": "3.2", "subdomain_topic": "Schema generation override for production", "question_text": "A team wants models with `schema: 'core'` to land in the `core` schema in production (not `analytics_core`), while still having developer isolation in dev. Where must the override macro be placed and what logic should it use?", "is_multi_select": false, "options": {"A": "Override `generate_target_schema` in `dbt_project.yml` using an environment variable check.", "B": "Override `generate_schema_name` in `macros/` — check `target.name == 'prod'` and return only `custom_schema_name` in that case.", "C": "Override `generate_schema_name` in `dbt_project.yml` — check the environment type and return only `custom_schema_name` for production.", "D": "Set `schema: 'core'` directly in `dbt_project.yml` under the `models:` key for the production environment."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no `generate_target_schema` macro in dbt. The macro to override is `generate_schema_name`."}, "B": {"label": "✅ Correct", "text": "Place `generate_schema_name` in the `macros/` directory (any `.sql` filename — dbt detects by macro name). The correct logic: when `target.name == 'prod'`, return `custom_schema_name \\| trim` only. Otherwise return `default_schema ~ '_' ~ custom_schema_name`. The `target.name` is set via the job's Advanced Settings → Target name field."}, "C": {"label": "❌ Incorrect", "text": "Macros cannot be defined in `dbt_project.yml`. Macro overrides must live in the `macros/` directory as `.sql` files."}, "D": {"label": "❌ Incorrect", "text": "Setting `schema: 'core'` in `dbt_project.yml` still goes through the same `generate_schema_name` logic — it doesn't bypass it."}}, "key_rule": "Override location = `macros/generate_schema_name.sql`. Signal = `target.name` set in job Advanced Settings."}, {"id": "q03_Q3", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 3, "high_yield": false, "subdomain_id": "3.3", "subdomain_topic": "Developer collision with custom schema override", "question_text": "A developer overrides `generate_schema_name` to always return only `custom_schema_name` (stripping the target schema prefix entirely) in all environments. Two developers — Alice (`dbt_alice`) and Bob (`dbt_bob`) — both have models with `schema: 'finance'`. What is the consequence?", "is_multi_select": false, "options": {"A": "Alice and Bob's models will land in `dbt_alice_finance` and `dbt_bob_finance` respectively, as intended.", "B": "Both developers' models will write to the same `finance` schema — they will overwrite each other's data.", "C": "dbt will throw a compile-time error when two developers use the same custom schema.", "D": "Models will land in `dbt_alice` and `dbt_bob` respectively because the custom schema config is ignored."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The override strips the target schema prefix entirely — so it returns `finance`, not `dbt_alice_finance`."}, "B": {"label": "✅ Correct", "text": "When the prefix is stripped, all developers with `schema: 'finance'` write to the exact same `finance` schema. Alice's run overwrites Bob's models and vice versa. This is the core reason the default macro preserves the `target.schema` prefix in development."}, "C": {"label": "❌ Incorrect", "text": "dbt does not detect multi-user collisions at compile time — it only runs for one user at a time. The collision is a runtime data problem."}, "D": {"label": "❌ Incorrect", "text": "The custom schema config is respected by the override — the override returns `finance`, not the target schema."}}, "key_rule": "Always preserve `target.schema` as a prefix in dev. Stripping it causes multi-developer schema collisions."}, {"id": "q03_Q4", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 4, "high_yield": true, "subdomain_id": "3.4", "subdomain_topic": "CI PR schema cleanup and custom macros", "question_text": "After merging a PR, a team notices that the temporary CI schema (`dbt_cloud_pr_123_456`) is not being deleted from the warehouse. They recently added a custom `generate_schema_name` macro. What is the most likely cause?", "is_multi_select": false, "options": {"A": "CI schema cleanup only works on Snowflake — the team must be using a different warehouse.", "B": "The custom `generate_schema_name` macro returns a name that doesn't match the expected `dbt_cloud_pr_<job_id>_<pr_id>` pattern, so dbt cannot identify the schema to delete.", "C": "The PR was merged instead of closed — only closing (not merging) a PR triggers schema cleanup.", "D": "The CI job is missing the `--target-path` flag, preventing dbt from tracking the PR schema."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "CI schema auto-cleanup works across supported warehouses — it is not Snowflake-only."}, "B": {"label": "✅ Correct", "text": "dbt auto-deletes the PR temp schema on PR close/merge by matching the schema name to the `dbt_cloud_pr_<job_id>_<pr_id>` pattern. If a custom `generate_schema_name` macro overrides the naming to something else (e.g., `ci_schema`), dbt cannot identify the PR schema and leaves it orphaned in the warehouse."}, "C": {"label": "❌ Incorrect", "text": "Both closing and merging a PR trigger schema cleanup — merge is the normal flow and cleanup is expected."}, "D": {"label": "❌ Incorrect", "text": "`--target-path` controls where artifacts are written — it has no bearing on PR schema identification."}}, "key_rule": "Custom schema macros that change CI schema naming break auto-cleanup → orphaned PR schemas in the warehouse."}, {"id": "q03_Q5", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 5, "high_yield": true, "subdomain_id": "3.5", "subdomain_topic": "Connection immutability", "question_text": "A production environment is currently connected to Redshift. The team has decided to migrate to Snowflake. An admin tries to edit the production environment to change the connection from Redshift to Snowflake. What will happen?", "is_multi_select": false, "options": {"A": "The admin can change the connection via Account Settings → Connections, and the existing environment will update automatically.", "B": "The connection field is immutable after environment creation — the admin must create a new Snowflake environment, migrate all jobs, and delete the Redshift environment.", "C": "The connection can be changed in the environment's Edit screen by selecting a new connection from the dropdown.", "D": "The admin must delete the environment and re-create it with the new connection — existing jobs can be migrated using the dbt API."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Changing the connection object in Account Settings does not cascade to environments — environments hold an immutable reference to the connection they were created with."}, "B": {"label": "✅ Correct", "text": "Once a connection is assigned to an environment, it **cannot be changed** — there is no \"edit connection\" option on an existing environment. The correct migration path: create a new environment with the Snowflake connection → migrate all jobs to the new environment → delete the old Redshift environment."}, "C": {"label": "❌ Incorrect", "text": "The connection dropdown is not editable on an existing environment's Edit screen — the field is greyed out or absent."}, "D": {"label": "❌ Incorrect", "text": "Deleting and recreating the environment is operationally the same as B, but B is more precise — it correctly identifies immutability as the reason and the migration pattern."}}, "key_rule": "Connection = **immutable** after environment creation. To change: create new env → migrate jobs → delete old env."}, {"id": "q03_Q6", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 6, "high_yield": true, "subdomain_id": "3.6", "subdomain_topic": "Staging environment and Mesh dev resolution", "question_text": "A platform team adds a Staging environment to an upstream project in their dbt Mesh. No deployment jobs have run in the new Staging environment yet. Immediately after creating it, downstream team developers report that their IDE jobs fail to resolve cross-project references that were working fine an hour ago. What happened?", "is_multi_select": false, "options": {"A": "The Staging environment has a configuration error — it should be deleted and re-created.", "B": "Once a Staging environment exists, dbt immediately routes all development cross-project ref resolution to it — even with no successful runs. With no metadata, resolution fails and does NOT fall back to Production.", "C": "dbt falls back to Production when Staging has no successful runs — the failure is caused by something else.", "D": "The Staging environment requires a manual \"activate\" step before dbt uses it for resolution."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is expected behavior — the Staging environment is not misconfigured."}, "B": {"label": "✅ Correct", "text": "The critical gotcha: the moment a Staging environment is created and linked to the metadata service, dbt **immediately routes all development cross-project ref resolution to it** — with zero fallback to Production. Because no jobs have populated Staging's metadata, all cross-project refs fail outright. Fix: run at least one successful deployment job in Staging before downstream teams rely on it."}, "C": {"label": "❌ Incorrect", "text": "This is explicitly wrong. Fallback to Production only occurs when the Staging environment **type doesn't exist at all**. Once Staging exists (even empty), dbt routes to it and fails rather than falling back."}, "D": {"label": "❌ Incorrect", "text": "There is no \"activate\" step — creation and linking is automatic."}}, "key_rule": "Adding Staging = **immediate routing**. No fallback to Production. Run at least one successful job in Staging immediately after creating it."}, {"id": "q03_Q7", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 7, "high_yield": false, "subdomain_id": "3.7", "subdomain_topic": "Extended attributes and nested overrides", "question_text": "An architect tries to override a nested key in `profiles.yml` using an environment's extended attributes. They add a partial YAML snippet targeting only the nested key. The override does not apply. Why?", "is_multi_select": false, "options": {"A": "Extended attributes only work for Snowflake environments — not for other warehouse types.", "B": "Extended attributes accept top-level keys only. Partial nested overrides are **silently ignored** — the entire parent key must be provided as a JSON object.", "C": "Extended attributes require a dbt Cloud restart to take effect.", "D": "Nested overrides require the `+override: true` flag in the YAML snippet."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Extended attributes work across warehouse types — they're not Snowflake-specific."}, "B": {"label": "✅ Correct", "text": "Extended attributes (YAML snippets that override `profiles.yml`) only accept **top-level keys**. If you try to override a nested key directly, the change is **silently ignored** — no error is raised. To override a nested value, you must provide the entire parent key block as a complete JSON object."}, "C": {"label": "❌ Incorrect", "text": "Extended attributes take effect at job runtime — no restart required."}, "D": {"label": "❌ Incorrect", "text": "There is no `+override: true` flag — this is not a dbt concept for extended attributes."}}, "key_rule": "Extended attributes = top-level keys only. Partial nested overrides = **silently ignored**. Provide full parent block."}, {"id": "q03_Q8", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 8, "high_yield": false, "subdomain_id": "3.8", "subdomain_topic": "Environment counts per project", "question_text": "Which of the following correctly describes how many of each environment type a single dbt project can have?", "is_multi_select": false, "options": {"A": "Development: unlimited, Production: 1, Staging: 1, General: unlimited.", "B": "Development: 1, Production: 1, Staging: 1, General: unlimited.", "C": "Development: 1, Production: unlimited, Staging: unlimited, General: unlimited.", "D": "Development: 1, Production: 1, Staging: unlimited, General: unlimited."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Development is limited to exactly 1 per project — it drives the IDE and controls which branch developers fork from. Multiple Development environments would create conflicts."}, "B": {"label": "✅ Correct", "text": "**Development: exactly 1** (IDE/CLI); **Production: exactly 1** (Catalog source of truth, cross-project ref resolver); **Staging: exactly 1** (pre-prod, mandatory in Mesh); **General: unlimited** (experimental/non-critical)."}, "C": {"label": "❌ Incorrect", "text": "Production and Staging are each limited to exactly 1 — having multiples of either would create ambiguity in Catalog and cross-project resolution."}, "D": {"label": "❌ Incorrect", "text": "Staging is also limited to exactly 1 per project."}}, "key_rule": "Dev=1, Prod=1, Staging=1, General=unlimited. Environment type field is greyed out in UI if that type already exists."}, {"id": "q03_Q9", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 9, "high_yield": true, "subdomain_id": "3.9", "subdomain_topic": "Deferral breaks on failed last run", "question_text": "A CI job is configured with deferral against the Production environment. The production deployment job failed 4 days ago and has not run successfully since. A developer opens a new PR and the CI job builds the entire DAG instead of only modified models. What is the cause?", "is_multi_select": false, "options": {"A": "Deferral is not supported for CI jobs — only for deploy jobs.", "B": "The deferral is misconfigured — it must point to a General environment, not Production.", "C": "Deferral requires a successful manifest from the reference environment. With no recent successful run, there is no valid manifest — CI falls back to a full DAG build.", "D": "The developer's PR contains too many modified files, exceeding the deferral threshold."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deferral is explicitly a CI job feature — it's the primary use case for CI optimization."}, "B": {"label": "❌ Incorrect", "text": "Deferral against Production is the standard configuration for CI jobs."}, "C": {"label": "✅ Correct", "text": "Deferral works by reading the `manifest.json` from the reference environment's last **successful** run. If the production job last failed, there is no valid manifest to defer against — dbt falls back to building the full DAG. This is a critical operational concern: a failed prod job breaks CI optimization."}, "D": {"label": "❌ Incorrect", "text": "There is no \"deferral threshold\" based on number of modified files."}}, "key_rule": "Deferral requires a **successful** manifest. Failed last run = no valid manifest = full rebuild."}, {"id": "q03_Q10", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 10, "high_yield": false, "subdomain_id": "3.10", "subdomain_topic": "Release tracks", "question_text": "A team prioritizes stability and does not want to receive new dbt version upgrades until they've been thoroughly vetted. They manage a mission-critical production pipeline with strict change management processes. Which release track should they choose?", "is_multi_select": false, "options": {"A": "Latest — ensures they always have the newest features and security patches.", "B": "Compatible — lags slightly behind Latest; the standard choice for most teams.", "C": "Extended — the slowest to upgrade; longest support window; designed for strict change management.", "D": "Pinned — set a specific dbt version and never auto-upgrade."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Latest auto-upgrades immediately to every new release — the highest change frequency, not suitable for strict change management."}, "B": {"label": "❌ Incorrect", "text": "Compatible is the default for most teams but still upgrades ahead of Extended. It's suitable for most teams but not for strictest change management."}, "C": {"label": "✅ Correct", "text": "**Extended** is the slowest to upgrade and has the longest support window. It's designed for risk-averse teams with strict change management processes — upgrades happen last, giving maximum time to validate changes in other environments first."}, "D": {"label": "❌ Incorrect", "text": "\"Pinned\" is not a named release track in dbt Cloud — the three options are Latest, Compatible, and Extended."}}, "key_rule": "Latest = always newest; Compatible = slight lag (most teams); Extended = slowest, longest support (strictest change management)."}, {"id": "q03_Q11", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 11, "high_yield": false, "subdomain_id": "3.11", "subdomain_topic": "Custom branch behavior", "question_text": "A deploy job's environment has a custom branch set to `release/2024-q4`. What does this mean for how the job executes?", "is_multi_select": false, "options": {"A": "The job will merge `release/2024-q4` into `main` before running.", "B": "The job will clone the `release/2024-q4` branch at runtime and run against that code — it does not merge into any other branch.", "C": "The job will create a new branch called `release/2024-q4` from `main` each time it runs.", "D": "The custom branch setting only applies to the dbt Cloud IDE — deploy jobs always use `main`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud jobs do not perform git merges as part of job execution."}, "B": {"label": "✅ Correct", "text": "For deployment environments, a custom branch specifies which branch is **cloned at job runtime** — dbt checks out that branch and runs against it. No merging occurs. The branch is used as-is."}, "C": {"label": "❌ Incorrect", "text": "dbt never creates new branches as part of job execution."}, "D": {"label": "❌ Incorrect", "text": "The custom branch setting on a deployment environment directly affects deploy jobs — it's not just an IDE setting."}}, "key_rule": "Deploy env custom branch = branch **cloned at runtime**. Dev env custom branch = branch devs **fork from** in IDE."}, {"id": "q03_Q12", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 12, "high_yield": false, "subdomain_id": "3.12", "subdomain_topic": "Environment variable precedence", "question_text": "A dbt project has an environment variable `DBT_TARGET_SCHEMA` set at three levels: project default = `analytics`, environment level = `analytics_staging`, and job-level override = `analytics_ci`. When the job runs, which value is used?", "is_multi_select": false, "options": {"A": "`analytics` — project-level defaults always win for consistency.", "B": "`analytics_staging` — environment-level settings override project defaults.", "C": "`analytics_ci` — job-level overrides always win; they are the most specific.", "D": "All three values are merged — the most recently set one takes precedence."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Project default is the lowest precedence — it is overridden by environment and job levels."}, "B": {"label": "❌ Incorrect", "text": "Environment level overrides project default, but is itself overridden by job level."}, "C": {"label": "✅ Correct", "text": "Environment variable precedence (highest to lowest): **Job > Environment > Project > Account**. The job-level override always wins when present."}, "D": {"label": "❌ Incorrect", "text": "Values are not merged — the most specific (highest precedence) level wins entirely."}}, "key_rule": "Env var precedence = **Job > Environment > Project > Account**. Job always wins."}, {"id": "q03_Q13", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 13, "high_yield": false, "subdomain_id": "3.13", "subdomain_topic": "`target.name` vs environment type", "question_text": "A data engineer sets the **Target name** field in a dbt Cloud job's Advanced Settings to `prod`. They expect this to automatically designate the job as a \"Production\" environment type. An architect corrects them. What is the distinction?", "is_multi_select": false, "options": {"A": "`target.name` and environment type are synonyms — setting one automatically sets the other.", "B": "`target.name` is a string value in job Advanced Settings that feeds into Jinja macros (e.g., `generate_schema_name`). Environment type is a dbt Cloud concept controlling Catalog behavior and cross-project ref resolution. They are independent.", "C": "`target.name` controls which dbt Cloud environment a job runs in. Setting it to `prod` routes the job to the Production environment.", "D": "Environment type is set via `target.name` — you must set `target.name = production` (full word, not abbreviation) for dbt Cloud to recognize the Production environment type."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "They are completely independent settings. Changing one has no effect on the other."}, "B": {"label": "✅ Correct", "text": "**`target.name`** is a runtime string you control, readable in Jinja as `target.name`. It is most commonly used in custom macros like `generate_schema_name` to distinguish dev from prod schema behavior. **Environment type** (Development, Production, Staging, General) is a dbt Cloud platform concept that determines which job is the Catalog source of truth, how cross-project refs resolve, and what the environment is used for. Setting `target.name = prod` on a job in a General environment does NOT make it a Production environment."}, "C": {"label": "❌ Incorrect", "text": "`target.name` is an arbitrary string — it does not route jobs to different environments. The job's environment is fixed at job creation."}, "D": {"label": "❌ Incorrect", "text": "`target.name` has no effect on environment type designation in dbt Cloud. The environment type is set in the environment configuration, not through any job field."}}, "key_rule": "`target.name` = runtime string for macro logic (set in job Advanced Settings). Environment type = dbt Cloud platform concept. Completely independent."}, {"id": "q03_Q14", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 14, "high_yield": false, "subdomain_id": "3.14", "subdomain_topic": "Dev cross-project ref with no upstream Staging", "question_text": "A dbt Mesh has a consumer project (`marketing`) and a producer project (`platform`). The `platform` project has only a **Production** environment — no Staging environment exists. A developer working in the `marketing` IDE opens a run and references a public model from `platform`. Which environment does the cross-project ref resolve against?", "is_multi_select": false, "options": {"A": "The ref fails — development jobs cannot resolve against Production environments.", "B": "It resolves against the `platform` project's **Production** environment — this is the only scenario where a development IDE job resolves cross-project refs against Production.", "C": "It resolves against the `marketing` project's Staging environment as a proxy.", "D": "It prompts the developer to select an environment from the `platform` project."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Dev jobs CAN resolve against Production — this is the documented fallback when no Staging environment exists in the upstream project."}, "B": {"label": "✅ Correct", "text": "Cross-project ref resolution follows this rule: dev jobs resolve against **Staging if it exists**, else **Production**. When the upstream (`platform`) project has no Staging environment, the developer's IDE job resolves directly against `platform`'s **Production** environment. This is the **only** scenario where a development job legitimately resolves against Production. It is a data-access risk — developers may inadvertently query production data."}, "C": {"label": "❌ Incorrect", "text": "The consumer project's Staging environment is irrelevant to resolving refs in the upstream project. Resolution is always within the upstream project."}, "D": {"label": "❌ Incorrect", "text": "Environment selection is automatic — there is no manual prompt."}}, "key_rule": "Dev cross-project ref → Staging (if exists) else Production. No upstream Staging = dev resolves against Production (only time this happens)."}, {"id": "q03_Q15", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 15, "high_yield": true, "subdomain_id": "3.15", "subdomain_topic": "Staging environment and dev resolution (no fallback)", "question_text": "An architect adds a **new Staging environment** to an upstream dbt Mesh project. No deployment jobs have been run in this Staging environment yet. What immediately happens to developer IDE jobs in downstream consumer projects that reference this upstream project?", "is_multi_select": false, "options": {"A": "Nothing changes immediately — downstream dev jobs continue resolving against Production until the first Staging job succeeds.", "B": "Downstream dev IDE jobs immediately start failing to resolve cross-project references because dbt routes all dev resolution to the new Staging environment, which has no metadata yet. There is no fallback to Production.", "C": "Downstream dev jobs now resolve against both Staging and Production simultaneously, merging metadata from both.", "D": "dbt detects the empty Staging environment and temporarily routes to Production until the first Staging run succeeds, then switches automatically."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The transition is immediate, not gradual. As soon as the Staging environment is created and linked to the metadata service, dbt routes to it — even with no runs."}, "B": {"label": "✅ Correct", "text": "The moment a Staging environment exists and is linked to the metadata service, dbt **immediately** routes all downstream dev cross-project ref resolution to it — with **no fallback to Production**. Since no deployment jobs have run in Staging, there is no metadata for the upstream models, and resolution fails. This is a critical architect gotcha: always run at least one successful deployment job in the new Staging environment before downstream teams depend on it."}, "C": {"label": "❌ Incorrect", "text": "dbt does not merge metadata from multiple environments. Resolution is to one environment only."}, "D": {"label": "❌ Incorrect", "text": "There is no automatic fallback mechanism once a Staging environment exists. The fallback to Production only applies when no Staging environment exists at all."}}, "key_rule": "Adding Staging immediately breaks downstream dev resolution if no jobs have run in it yet. Always run one successful job in Staging before downstream teams depend on it."}, {"id": "q03_Q16", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 16, "high_yield": false, "subdomain_id": "3.16", "subdomain_topic": "Deleting an environment", "question_text": "An architect plans to delete a General environment that was used for experimental jobs. Before deleting, what must they do to avoid data loss?", "is_multi_select": false, "options": {"A": "Archive the environment first — dbt Cloud auto-archives all jobs before deletion.", "B": "Transfer all jobs configured in that environment to another environment first — deleting an environment deletes all jobs in it.", "C": "Export the run history to CSV, since it cannot be recovered after deletion.", "D": "Nothing — job definitions are stored at the project level and persist after environment deletion."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no auto-archive step — dbt Cloud does not preserve jobs in an archived state when an environment is deleted."}, "B": {"label": "✅ Correct", "text": "When an environment is deleted, **all jobs configured in that environment are also deleted**. There is no recovery path. The architect must **transfer jobs to another environment** before deleting. This is an irreversible action — always confirm there are no jobs you want to keep before proceeding."}, "C": {"label": "❌ Incorrect", "text": "Run history export is not a documented concern here — job definitions are the critical thing to preserve."}, "D": {"label": "❌ Incorrect", "text": "Jobs are not stored at the project level independently of environments — they belong to an environment."}}, "key_rule": "Deleting an environment = all jobs in it are also deleted. Transfer jobs first — no recovery after deletion."}, {"id": "q03_Q17", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 17, "high_yield": false, "subdomain_id": "3.17", "subdomain_topic": "Service account key pair rotation", "question_text": "A platform team needs to rotate the key pair used by a production service account Snowflake connection. An admin looks in the dbt Cloud UI under Account Settings → Connections but cannot find a way to update the key. What is the correct process?", "is_multi_select": false, "options": {"A": "Delete and recreate the connection with the new key pair.", "B": "Key pair rotation for service accounts must be done via the **dbt Admin API** — there is no UI path.", "C": "Update the key in the environment's Extended Attributes field.", "D": "Key pair rotation is automatic in dbt Cloud — the system generates new keys on a 90-day cycle."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deleting and recreating the connection would break all environments and jobs referencing it. This is not the recommended approach."}, "B": {"label": "✅ Correct", "text": "Service account key pair rotation has **no UI path** in dbt Cloud. The rotation flow must go through the **dbt Admin API**: generate a new key pair → POST the new public key to the API → verify → invalidate the old key. This is a documented operational procedure for production key management."}, "C": {"label": "❌ Incorrect", "text": "Extended attributes override `profiles.yml` fields at the environment level, but key pair credentials for service accounts are not configurable via extended attributes."}, "D": {"label": "❌ Incorrect", "text": "Key pair rotation is not automatic — it is a manual process initiated by the team."}}, "key_rule": "Service account key pair rotation = **dbt Admin API only**. No UI path exists."}, {"id": "q03_Q18", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 18, "high_yield": false, "subdomain_id": "3.18", "subdomain_topic": "Environment editable fields by platform", "question_text": "A team uses a **BigQuery** connection in their dbt Cloud project. They want to override the BigQuery dataset (the equivalent of a schema) at the environment level for a staging environment, so staging models land in a different dataset than production. They navigate to the environment's connection settings but see no editable dataset field. What should they do?", "is_multi_select": false, "options": {"A": "The dataset field for BigQuery is found under the Environment Credentials section, not the Connection Settings section.", "B": "BigQuery environments have no editable connection fields in the UI — the dataset override must be configured using **extended attributes** in the environment settings.", "C": "BigQuery dataset overrides require creating a separate BigQuery connection per environment.", "D": "Use the `target_schema` environment variable to override the BigQuery dataset."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "BigQuery environment credentials have a Dataset field, but the question is about the connection-level override. The deployment credentials dataset field IS editable — but this question is testing knowledge of the environment connection settings section, where BigQuery has no editable fields."}, "B": {"label": "✅ Correct", "text": "For **BigQuery, Postgres, Redshift, and Spark**, the environment connection settings panel has **no editable fields** — everything is inferred from the project-level connection. To override values like the target dataset, use **extended attributes** (a YAML snippet in the environment settings). Snowflake is the exception, with editable Role, Database, and Warehouse fields."}, "C": {"label": "❌ Incorrect", "text": "A separate connection is not required — extended attributes are the correct override mechanism."}, "D": {"label": "❌ Incorrect", "text": "There is no built-in `target_schema` environment variable that overrides the BigQuery dataset."}}, "key_rule": "BigQuery/Postgres/Redshift/Spark = no UI editable fields in environment connection settings. Use extended attributes to override."}, {"id": "q03_Q19", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 19, "high_yield": false, "subdomain_id": "3.19", "subdomain_topic": "Developer plan scheduling interval", "question_text": "A team on the **Developer plan** wants to schedule a dbt job to run every 5 minutes to keep their data as fresh as possible. Will this work?", "is_multi_select": false, "options": {"A": "Yes — there is no minimum scheduling interval documented for the Developer plan.", "B": "No — the Developer plan has a minimum scheduling interval of **10 minutes**. A 5-minute schedule cannot be set.", "C": "No — the Developer plan does not support scheduled jobs at all; only manual triggers are available.", "D": "Yes — 5-minute intervals are supported on Developer plan but require cron syntax."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A minimum interval is documented for the Developer plan."}, "B": {"label": "✅ Correct", "text": "The **Developer plan** enforces a minimum scheduling interval of **10 minutes**. A 5-minute schedule cannot be configured on this plan. Teams that need sub-10-minute freshness must upgrade or use an alternative triggering mechanism via the API. Starter, Enterprise, and Enterprise+ do not have a documented minimum scheduling interval."}, "C": {"label": "❌ Incorrect", "text": "Developer plan does support scheduled jobs — it just has a 10-minute minimum interval."}, "D": {"label": "❌ Incorrect", "text": "Cron syntax does not bypass the 10-minute minimum on Developer plan."}}, "key_rule": "Developer plan = 10-minute minimum scheduling interval. Other plans have no documented minimum."}, {"id": "q03_Q20", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 20, "high_yield": false, "subdomain_id": "3.20", "subdomain_topic": "Credential security in environment settings", "question_text": "While reviewing a team's dbt Cloud setup, an architect finds that Snowflake passwords are hardcoded directly in the environment's deployment credentials form. What is the risk and what is the recommended practice?", "is_multi_select": false, "options": {"A": "There is no risk — credentials in the deployment credentials form are encrypted at rest and never exposed.", "B": "Hardcoded secrets in the credentials form may appear in build logs and are harder to rotate. The best practice is to reference **environment variables** instead of hardcoding values.", "C": "Credentials in the deployment form are visible to all Account Admin users, creating an insider threat risk.", "D": "Hardcoded credentials automatically expire after 30 days in dbt Cloud, creating operational risk."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Hardcoded credentials can surface in build logs or debug output, especially if extended attributes or profiles are printed during verbose logging. Encryption at rest does not prevent runtime exposure."}, "B": {"label": "✅ Correct", "text": "The best practice is to **wrap credential values in environment variables** (e.g., `{{ env_var('SNOWFLAKE_PASSWORD') }}`) rather than hardcoding them. This reduces the risk of secrets appearing in logs, simplifies credential rotation (update the env var, not the form), and follows the principle of least exposure. This applies especially to passwords, private keys, and tokens."}, "C": {"label": "❌ Incorrect", "text": "While access control is important, this is not the primary documented risk. The key concern is log exposure and rotation complexity."}, "D": {"label": "❌ Incorrect", "text": "Hardcoded credentials do not auto-expire in dbt Cloud."}}, "key_rule": "Wrap secrets in environment variables — never hardcode passwords or keys in credential forms. Values can appear in logs."}, {"id": "q04_Q1", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 1, "high_yield": true, "subdomain_id": "4.1", "subdomain_topic": "CI job concurrency", "question_text": "Two developers each open a separate PR at the same time against the same dbt project. What does dbt Cloud do with the two CI job runs?", "is_multi_select": false, "options": {"A": "Queues them serially — the second run waits for the first to complete.", "B": "Cancels the older run and starts only the newest one.", "C": "Runs them concurrently — each gets its own isolated temp schema.", "D": "Runs them concurrently only if the account has more than 1 run slot."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Serial queuing is the behavior for the *same PR* with multiple commits — not different PRs."}, "B": {"label": "❌ Incorrect", "text": "Smart cancellation (cancelling stale builds) applies when the *same PR* receives a new commit, not when two different PRs run simultaneously."}, "C": {"label": "✅ Correct", "text": "**Different PRs run concurrently** — each CI run gets its own isolated temp schema (`dbt_cloud_pr_<job_id>_<pr_id>`). CI jobs bypass the run slot system entirely, so this concurrency is not limited by available slots."}, "D": {"label": "❌ Incorrect", "text": "CI jobs bypass the slot system — concurrent CI does not depend on run slot count."}}, "key_rule": "Different PRs → concurrent CI (each isolated temp schema). Same PR → serial with smart cancellation."}, {"id": "q04_Q2", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 2, "high_yield": true, "subdomain_id": "4.2", "subdomain_topic": "Command ordering: dbt sl validate", "question_text": "A CI job is configured with the following command sequence:\n1. `dbt sl validate --select state:modified+`\n2. `dbt build --select state:modified+`\n\nThe CI job consistently fails on step 1. What is the cause?", "is_multi_select": false, "options": {"A": "`dbt sl validate` is not a valid command — the correct syntax is `dbt semantic-layer validate`.", "B": "`dbt sl validate` must run before `dbt build` so validation happens against pre-existing models.", "C": "`dbt build` must run before `dbt sl validate` — models must be materialized in the CI schema before semantic validation can run.", "D": "`--select state:modified+` is not supported by `dbt sl validate`."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt sl validate` is the correct command syntax."}, "B": {"label": "❌ Incorrect", "text": "This has the order backwards and contradicts the actual requirement."}, "C": {"label": "✅ Correct", "text": "`dbt sl validate` validates the Semantic Layer against **materialized models in the CI schema**. If `dbt build` hasn't run yet, the models don't exist in the CI schema and semantic validation has nothing to validate against — it fails. `dbt build` must always precede `dbt sl validate`."}, "D": {"label": "❌ Incorrect", "text": "`--select` flags are supported by `dbt sl validate`. The ordering, not the selector, is the issue."}}, "key_rule": "`dbt build` must **precede** `dbt sl validate`. Models must exist in CI schema before semantic validation."}, {"id": "q04_Q3", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 3, "high_yield": true, "subdomain_id": "4.3", "subdomain_topic": "Source freshness: checkbox vs command step", "question_text": "A deploy job has `dbt source freshness` configured as a **checkbox** (not a command step) and `dbt build` as a command step. The freshness check fails because a source table hasn't been updated in 3 days. What happens next?", "is_multi_select": false, "options": {"A": "The job immediately fails and `dbt build` does not run.", "B": "The job continues — `dbt build` runs normally because checkbox failures are isolated from the overall job.", "C": "`dbt build` runs but only for models that do not depend on the stale source.", "D": "The job pauses and waits for the source to be updated before continuing."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This would be the behavior if `dbt source freshness` were a **command step** — failures in command steps block all subsequent steps."}, "B": {"label": "✅ Correct", "text": "When `dbt source freshness` is configured as a **checkbox**, its failure is **isolated** — it does not propagate to the overall job status and does not prevent subsequent command steps from running. `dbt build` runs regardless of the freshness result. If you need stale sources to block the build, add `dbt source freshness` as a command step instead."}, "C": {"label": "❌ Incorrect", "text": "`dbt build` runs the full selected scope — it does not intelligently filter out models with stale upstream sources."}, "D": {"label": "❌ Incorrect", "text": "Jobs do not pause and wait — they proceed or fail."}}, "key_rule": "Checkbox failures are **isolated**. Source freshness as checkbox = won't fail the job. As command step = blocks all subsequent steps."}, {"id": "q04_Q4", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 4, "high_yield": true, "subdomain_id": "4.4", "subdomain_topic": "dbt retry on infrastructure failure", "question_text": "A production job fails before any models run because of a warehouse connection timeout during job initialization. An on-call engineer runs `dbt retry` to recover. What happens?", "is_multi_select": false, "options": {"A": "`dbt retry` re-runs the entire job from scratch since no nodes completed.", "B": "`dbt retry` is a no-op — it reads `run_results.json` to find the failure point, but no nodes were recorded. The engineer must trigger a full job rerun manually.", "C": "`dbt retry` automatically detects the infrastructure failure and increases the connection timeout before retrying.", "D": "`dbt retry` reconnects to the warehouse and resumes from the last successfully compiled node."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt retry` does not do a full rerun — it reads from `run_results.json` and resumes from the recorded failure point. If there's no recorded failure point, it has nothing to do."}, "B": {"label": "✅ Correct", "text": "`dbt retry` reads `run_results.json` to find which nodes failed and resumes from that point. If the job failed before **any nodes executed** (infrastructure failure, connection error during init), `run_results.json` contains no nodes to resume from — `dbt retry` is a **no-op**. The engineer must trigger a full job rerun."}, "C": {"label": "❌ Incorrect", "text": "`dbt retry` has no automatic timeout adjustment capability."}, "D": {"label": "❌ Incorrect", "text": "`dbt retry` works at the node level (compiled models), not at the connection level."}}, "key_rule": "`dbt retry` = no-op on infrastructure failures. Only works when nodes are recorded in `run_results.json`."}, {"id": "q04_Q5", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 5, "high_yield": true, "subdomain_id": "4.5", "subdomain_topic": "Scheduling drift", "question_text": "A team schedules a dbt job to run \"every 2 hours\" using interval scheduling. The first run starts at 3:05 AM. When will the next two runs start?", "is_multi_select": false, "options": {"A": "4:00 AM and 6:00 AM — interval mode aligns to clock hours.", "B": "5:05 AM and 7:05 AM — interval mode tracks elapsed time from the previous run start.", "C": "5:05 AM and 7:05 AM only if the previous run completed within 2 hours.", "D": "4:05 AM and 6:05 AM — the 2-hour interval starts from when the previous run completes, not when it starts."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Interval mode does NOT align to clock hours. That behavior requires cron syntax."}, "B": {"label": "✅ Correct", "text": "Interval scheduling measures **elapsed time from the previous run start** — it is not clock-aligned. A first run at 3:05 AM → next at 5:05 AM → next at 7:05 AM. This \"scheduling drift\" is why teams that need exact clock-aligned schedules should use **cron syntax** instead of interval mode."}, "C": {"label": "❌ Incorrect", "text": "The interval is from run *start*, not run *completion*. Though if a run exceeds the interval, the scheduler cancels queued runs and keeps only the newest."}, "D": {"label": "❌ Incorrect", "text": "The interval is from run start, not completion."}}, "key_rule": "Interval scheduling **drifts** — it's elapsed time, not clock-aligned. Use **cron syntax** for fixed clock times."}, {"id": "q04_Q6", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 6, "high_yield": true, "subdomain_id": "4.6", "subdomain_topic": "Advanced CI: event_time and false positives", "question_text": "Advanced CI (Compare Changes) is enabled on a CI job. After every PR, the Compare tab shows hundreds of \"deleted rows\" even though the production data hasn't changed. What configuration is missing?", "is_multi_select": false, "options": {"A": "The model is missing a primary key constraint — without it, Advanced CI can't perform row-level comparison.", "B": "`event_time` is not configured on the model. Without it, full tables are compared — the CI's smaller date window looks like deleted rows vs. production.", "C": "The CI and production environments are on different database hosts, preventing an accurate comparison.", "D": "The `dbt compare` toggle is set to \"Continue on error\" instead of \"Stop on error.\""}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Missing primary key would cause a \"Primary key missing\" error — not false \"deleted rows.\""}, "B": {"label": "✅ Correct", "text": "Without `event_time`, dbt compares **full tables**. CI jobs typically build a smaller time window of data than production — all rows outside the CI window appear as \"deleted\" in production but not CI. With `event_time` configured, dbt filters both tables to the **overlapping time range** before comparing, eliminating false positives."}, "C": {"label": "❌ Incorrect", "text": "Different database hosts would cause the comparison to **fail completely**, not produce false deletion results."}, "D": {"label": "❌ Incorrect", "text": "Stop/continue on error controls linting behavior — it has no effect on row comparison results."}}, "key_rule": "Without `event_time` → full table comparison → CI's smaller date window = false \"deleted rows\" on every run."}, {"id": "q04_Q7", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 7, "high_yield": true, "subdomain_id": "4.7", "subdomain_topic": "Advanced CI: PII in cached rows", "question_text": "A company enables Advanced CI's Compare Changes feature. A security reviewer discovers that warehouse dynamic data masking policies are not being applied to the rows visible in the Compare tab. Is this expected behavior?", "is_multi_select": false, "options": {"A": "No — this is a bug in Advanced CI. Report it to dbt Labs.", "B": "Yes — dynamic data masking does NOT apply to Advanced CI cached samples. All users with job access see the same unmasked cached rows.", "C": "No — users only see masked rows unless they have the warehouse masking policy bypass privilege.", "D": "Yes — but masking is applied after the 30-day cache expiry when data is reloaded."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is documented, expected behavior — not a bug."}, "B": {"label": "✅ Correct", "text": "Advanced CI caches up to **100 rows per model** at query time and stores them encrypted in S3/Azure Blob. **Dynamic data masking does NOT apply** to these cached rows — all users with job access see the same unmasked data regardless of their warehouse masking privileges. Sensitive models containing PII should be excluded from Advanced CI comparisons using `--exclude tag:pii`."}, "C": {"label": "❌ Incorrect", "text": "The cached rows bypass masking entirely — it's not a per-user privilege question."}, "D": {"label": "❌ Incorrect", "text": "After 30 days the cache expires — data becomes inaccessible entirely. Masking is not retroactively applied at expiry."}}, "key_rule": "Advanced CI cache = **no dynamic data masking**. Exclude PII models with `--exclude tag:pii`."}, {"id": "q04_Q8", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 8, "high_yield": false, "subdomain_id": "4.8", "subdomain_topic": "Implementing run commands in the correct order", "question_text": "You are managing a dbt Mesh architecture with an upstream \"Platform\" project and a downstream \"Marketing\" project. The Marketing project's CI job fails because an upstream public model in Platform was dropped. You need to adjust the Marketing CI/CD pipeline to handle upstream dependencies without rebuilding the Platform project. Which command configuration is correct?", "is_multi_select": false, "options": {"A": "Use `dbt clone` to copy the Platform project into the Marketing directory before running.", "B": "Run `dbt deps` followed by `dbt run` — dbt will automatically build the upstream Platform models.", "C": "Configure the Marketing CI job to use `dbt build --defer --state ...` pointing to the Platform production manifest. This allows Marketing models to read from Platform's production tables without rebuilding them.", "D": "Add a step to run `dbt run --select source:platform+` to rebuild the upstream dependencies."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt clone` creates zero-copy clones of existing tables in a target schema — it is not designed to copy cross-project source code or manage cross-project manifest references in a Mesh architecture."}, "B": {"label": "❌ Incorrect", "text": "`dbt deps` only installs package code. Running `dbt run` in Marketing will not build Platform models — `dbt build --select` does NOT trigger upstream project builds across project boundaries."}, "C": {"label": "✅ Correct", "text": "Using `--defer --state` pointing to the Platform project's production `manifest.json` allows unbuilt upstream models (in Platform) to be resolved against their **production tables** without rebuilding them. This is the standard Mesh CI pattern for consuming downstream projects."}, "D": {"label": "❌ Incorrect", "text": "`source:platform+` targets source nodes, not cross-project public model nodes. And even if it could, rebuilding Platform in Marketing's CI environment is not the goal."}}, "key_rule": "Mesh CI pattern = `--defer --state <upstream_manifest>` to resolve cross-project refs against production tables."}, {"id": "q04_Q9", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 9, "high_yield": false, "subdomain_id": "4.9", "subdomain_topic": "Fork PRs", "question_text": "A developer forks a dbt project repository on GitHub and submits a pull request from their fork. The CI job fails with an error saying it cannot check out the commit. What is the cause and fix?", "is_multi_select": false, "options": {"A": "The developer's fork is on a different GitHub account — add that account as a collaborator.", "B": "dbt Cloud cannot check out commits from fork repositories — the developer must push to the origin repository directly.", "C": "The CI job needs `--select state:new` instead of `state:modified+` to detect commits from forks.", "D": "Fork-based PRs require a service token with write access to the fork repository."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Adding as a collaborator doesn't resolve the fundamental limitation — dbt cannot check out fork commits regardless of permissions."}, "B": {"label": "✅ Correct", "text": "dbt Cloud cannot check out commits from **forked repositories** — this is a documented limitation. Contributors must push their changes to the **origin (upstream) repository** directly, either as a branch or with write access. Fork-based PRs are not supported for CI."}, "C": {"label": "❌ Incorrect", "text": "The selector has no bearing on whether dbt can access fork commits."}, "D": {"label": "❌ Incorrect", "text": "Service tokens don't enable fork checkout — the limitation is architectural, not credential-based."}}, "key_rule": "Fork PRs = unsupported. Contributors must push to origin repo directly."}, {"id": "q04_Q10", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 10, "high_yield": false, "subdomain_id": "4.10", "subdomain_topic": "PrivateLink and CI hooks", "question_text": "A company enables PrivateLink for all dbt Cloud connections for security compliance. Shortly after, CI jobs stop running entirely and no error messages appear in the dbt Cloud UI. What is the cause?", "is_multi_select": false, "options": {"A": "PrivateLink requires a VPN client on each developer's machine, which blocks CI from running.", "B": "CI hooks are not available with Virtual Private dbt (PrivateLink) — jobs fail silently.", "C": "PrivateLink automatically disables webhook triggers, which CI hooks rely on.", "D": "PrivateLink connections require the Enterprise+ plan for CI — the company is on Enterprise."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "PrivateLink is a server-side network configuration — it doesn't require VPN clients."}, "B": {"label": "✅ Correct", "text": "CI hooks (the mechanism that triggers CI jobs from git provider events) are **not available with Virtual Private dbt (PrivateLink)**. The jobs fail silently — no error messages appear in the dbt UI. Check the PrivateLink security settings to identify the conflict."}, "C": {"label": "❌ Incorrect", "text": "PrivateLink doesn't automatically disable webhooks at the networking level — the issue is at the CI hook layer specifically."}, "D": {"label": "❌ Incorrect", "text": "This is not a documented plan-level limitation specific to PrivateLink + CI."}}, "key_rule": "PrivateLink + CI = hooks not available → CI fails **silently**. Plan ahead before enabling PrivateLink."}, {"id": "q04_Q11", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 11, "high_yield": true, "subdomain_id": "4.11", "subdomain_topic": "Understanding when to use which type of job deferral", "question_text": "An organization is implementing a dbt Mesh architecture with three separate dbt projects: `staging`, `marts`, and `finance_specific`. The `marts` project depends on models from `staging`. A developer makes a change to a model in the `staging` project. Which of the following is required to correctly implement deferral in the `staging` project's CI job to test the change against the production versions of its downstream dependencies? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The `dbt_project.yml` of the `staging` project must define the `marts` and `finance_specific` projects in its `dependencies.yml` file.", "B": "Deferral cannot be used across different dbt projects; each project's entire dependency chain must be fully rebuilt within its own CI job.", "C": "The CI job command must use the `--state` flag to point to the production `manifest.json` artifacts of `marts` and `finance_specific`.", "D": "The CI job must execute a command that includes the `--defer` flag."}, "correct_answers": ["C", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "In a Mesh architecture, the upstream project (`staging`) does not list its consumers in `dependencies.yml`. The downstream project (`marts`) lists its dependencies. The upstream project's CI job simply tests its own changes."}, "B": {"label": "❌ Incorrect", "text": "Cross-project deferral is a fundamental feature of dbt Mesh — specifically designed to allow independent projects to interact and test against each other's production state without a monolithic rebuild."}, "C": {"label": "✅ Correct", "text": "The `--state` flag is used to specify the directory containing the production `manifest.json` artifacts. In dbt Mesh, providing the state of downstream projects allows the CI job to reference production `manifest.json` artifacts of `marts` and `finance_specific`."}, "D": {"label": "✅ Correct", "text": "The `--defer` flag is used to specify that unselected upstream parents should be resolved against production tables (not rebuilt). This is the core mechanism for deferral in any CI job."}}, "key_rule": "Standard CI deferral pattern = `dbt build --select state:modified+ --defer --state /path/to/prod/manifest`. Both `--defer` AND `--state` are required."}, {"id": "q04_Q12", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 12, "high_yield": false, "subdomain_id": "4.12", "subdomain_topic": "State selector: --vars invisibility", "question_text": "A CI job uses `dbt build --select state:modified+ --defer --state /prod/manifest`. A developer changes only the value of a runtime variable in `dbt_project.yml` (e.g., changes `default_event_window: 30` to `default_event_window: 60`). The CI job runs but doesn't build any models. Why?", "is_multi_select": false, "options": {"A": "Variable changes require a `dbt compile` run before `state:modified` can detect them.", "B": "`--vars` and `dbt_project.yml` variable changes are **invisible to `state:modified`** — dbt cannot diff variable values between manifests.", "C": "The variable was changed in `dbt_project.yml` instead of via `--vars` flag — this is why it wasn't detected.", "D": "`state:modified` only detects SQL and YAML config changes, not Python or YAML variable changes."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt compile` doesn't help — the issue is that variable values are not tracked as part of the manifest state diff."}, "B": {"label": "✅ Correct", "text": "`state:modified` compares node-level SQL content and configs — it **cannot detect changes to variable values** in `dbt_project.yml` or via `--vars`. Only SQL body changes, config changes, or structural changes are diffable. If only a var value changes, affected models will not appear as modified and will not rebuild."}, "C": {"label": "❌ Incorrect", "text": "The location of the variable change (`dbt_project.yml` vs `--vars`) doesn't matter — neither is tracked by `state:modified`."}, "D": {"label": "❌ Incorrect", "text": "YAML variable definitions are not tracked even though other YAML config changes are. Variable values are evaluated at runtime, not stored in the manifest diff."}}, "key_rule": "`--vars` / variable changes are **invisible to `state:modified`**. Only SQL body, configs, and structure are diffable."}, {"id": "q04_Q13", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 13, "high_yield": true, "subdomain_id": "4.13", "subdomain_topic": "Manifest overwrite: same --state and --target-path", "question_text": "A CI job is configured as:\n```bash\ndbt build --select state:modified+ --defer --state ./target --target-path ./target\n```\nDevelopers report that every CI run rebuilds the full DAG regardless of how many models were changed. What is the root cause?", "is_multi_select": false, "options": {"A": "The `./target` directory does not exist before the first run, causing state comparison to fail.", "B": "`--state` and `--target-path` point to the same directory — dbt overwrites `manifest.json` during parse before state comparison runs, so it always compares against the freshly-written manifest.", "C": "The `--defer` flag conflicts with `--state` when they point to the same directory.", "D": "CI jobs require an absolute path for `--state` — relative paths cause state comparison failures."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "If the directory doesn't exist, the job would fail with an error — not rebuild the full DAG silently."}, "B": {"label": "✅ Correct", "text": "This is a critical gotcha: dbt writes a **new `manifest.json`** to `--target-path` during the parse phase, *before* comparing against `--state`. When both point to the same directory, dbt overwrites the production manifest with the freshly-compiled manifest — then compares the fresh manifest against itself. Result: zero differences detected → `state:modified` selects nothing → full build is triggered as fallback. Fix: use **separate directories** for `--state` and `--target-path`."}, "C": {"label": "❌ Incorrect", "text": "`--defer` and `--state` don't conflict with each other — they're designed to be used together."}, "D": {"label": "❌ Incorrect", "text": "Relative paths work — the issue is the directory overlap, not the path format."}}, "key_rule": "`--state` and `--target-path` must point to **separate directories**. Same dir = manifest overwrite = no diff detected."}, {"id": "q04_Q14", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 14, "high_yield": false, "subdomain_id": "4.14", "subdomain_topic": "Graph operators", "question_text": "Which of the following correctly selects a model named `fct_orders` plus all of its downstream descendants AND all ancestors of those descendants (the full closure)?", "is_multi_select": false, "options": {"A": "`+fct_orders+`", "B": "`fct_orders+`", "C": "`@fct_orders`", "D": "`2+fct_orders+2`"}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`+fct_orders+` selects: all ancestors of `fct_orders` + `fct_orders` + all descendants. It does NOT include ancestors of those descendants."}, "B": {"label": "❌ Incorrect", "text": "`fct_orders+` selects: `fct_orders` + all descendants only. No ancestors included."}, "C": {"label": "✅ Correct", "text": "`@fct_orders` is the **full closure operator** — it selects: `fct_orders` + all descendants + all ancestors of those descendants. It ensures that everything needed to build the model AND all its downstream tests exists. Commonly used in CI scenarios."}, "D": {"label": "❌ Incorrect", "text": "`2+fct_orders+2` is bounded depth selection — up to 2 ancestors + `fct_orders` + up to 2 descendants. Not a full closure."}}, "key_rule": "`@model` = full closure (model + descendants + all ancestors of descendants). Use in CI to ensure all deps exist."}, {"id": "q04_Q15", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 15, "high_yield": true, "subdomain_id": "4.15", "subdomain_topic": "Self-deferral", "question_text": "A new CI job is configured with self-deferral (defers against its own previous successful run). On its very first execution, what happens?", "is_multi_select": false, "options": {"A": "The job fails with an error because no prior manifest exists to defer against.", "B": "The job runs successfully but builds only the models that `state:modified` identifies.", "C": "The job falls back to a full DAG build because there is no prior manifest from a previous run of the same job.", "D": "The job skips deferral and uses the production environment's manifest instead."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The job does not fail — it falls back gracefully to a full build."}, "B": {"label": "❌ Incorrect", "text": "Without a prior manifest, `state:modified` has nothing to compare against — it cannot selectively identify modified models."}, "C": {"label": "✅ Correct", "text": "Self-deferral requires a prior successful run of the **same job** to produce a manifest. On the first-ever run, no manifest exists — the job falls back to a full DAG build. This is expected behavior, not an error."}, "D": {"label": "❌ Incorrect", "text": "Self-deferral does not fall back to the production environment's manifest — it falls back to a full build."}}, "key_rule": "Self-deferral first run = **full DAG build** (no prior manifest). Cost savings only kick in from run 2 onward."}, {"id": "q04_Q16", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 16, "high_yield": false, "subdomain_id": "4.16", "subdomain_topic": "Upstream test failure and downstream SKIP", "question_text": "A `dbt build` run is executing. A `not_null` test on the `stg_orders` model fails. What happens to all models that depend on `stg_orders`?", "is_multi_select": false, "options": {"A": "They run normally — test failures don't affect downstream model execution.", "B": "They fail with an ERROR status — inheriting the upstream test failure.", "C": "They enter **SKIP** status — they do not run at all because an upstream dependency failed.", "D": "They run but are flagged as \"potentially unreliable\" in the run results."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Test failures on upstream models do block downstream execution in `dbt build`."}, "B": {"label": "❌ Incorrect", "text": "Downstream models are not marked as ERROR — they are marked as SKIP. The error is attributed to the failing test, not the downstream models themselves."}, "C": {"label": "✅ Correct", "text": "In `dbt build`, a failing test on an upstream model causes all downstream dependent models to enter **SKIP** status — they never run. To prevent this blocking behavior, set the test severity to `warn` instead of `error`."}, "D": {"label": "❌ Incorrect", "text": "There is no \"potentially unreliable\" status in dbt run results."}}, "key_rule": "`dbt build` upstream test fail → downstream models = **SKIP** (not ERROR). Use `severity: warn` to prevent blocking."}, {"id": "q04_Q17", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 17, "high_yield": false, "subdomain_id": "4.17", "subdomain_topic": "Unit tests execution order", "question_text": "When does `dbt build` execute unit tests relative to model materialization?", "is_multi_select": false, "options": {"A": "After all models are materialized — so unit tests validate the final output.", "B": "Before model materialization — so unit tests catch logic errors before any expensive table builds.", "C": "Concurrently with model materialization — unit tests and builds run in parallel.", "D": "At the same time as data tests (schema tests) — all test types run in the same phase."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Running after materialization defeats the purpose of unit tests — you'd spend compute building a table that a unit test immediately invalidates."}, "B": {"label": "✅ Correct", "text": "Unit tests run **before** model materialization in `dbt build`. If a unit test fails, the model never materializes — saving warehouse compute. This \"fail early, fail cheap\" design is intentional."}, "C": {"label": "❌ Incorrect", "text": "Unit tests run in a defined sequential phase, not concurrently with builds."}, "D": {"label": "❌ Incorrect", "text": "Data tests (schema tests) run after materialization. Unit tests have their own earlier phase."}}, "key_rule": "Unit tests run **before** materialization. Fail early = cheaper. Data tests run after materialization."}, {"id": "q04_Q18", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 18, "high_yield": false, "subdomain_id": "4.18", "subdomain_topic": "Monorepo CI behavior", "question_text": "A company stores multiple dbt Cloud projects (Project A, Project B, Project C) in a single monorepo. A developer opens a PR that only modifies files in Project A. What does dbt Cloud do?", "is_multi_select": false, "options": {"A": "Only Project A's CI job triggers — dbt detects which project's files changed.", "B": "CI jobs for all three projects (A, B, and C) trigger from the single PR.", "C": "No CI jobs trigger — monorepo setups require separate repository connections per project.", "D": "Project A's CI job triggers immediately; B and C trigger only if A's CI passes."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not currently perform file-path-based filtering to limit CI triggers to the affected project in a monorepo."}, "B": {"label": "✅ Correct", "text": "In a monorepo, a **single PR triggers CI jobs for ALL connected dbt projects** — even if only one project's files changed. This is a known limitation. Workaround: use project-specific target branches (e.g., `main-project-a`) to scope CI triggers."}, "C": {"label": "❌ Incorrect", "text": "Monorepos are supported — each project has its own connection to the shared repository."}, "D": {"label": "❌ Incorrect", "text": "There is no sequential triggering based on CI success in this scenario — all CI jobs trigger simultaneously."}}, "key_rule": "Monorepo = single PR triggers CI for **all** connected projects. Workaround: project-specific target branches."}, {"id": "q04_Q19", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 19, "high_yield": false, "subdomain_id": "4.19", "subdomain_topic": "Job chaining plan requirements", "question_text": "An architect wants to configure Job B in Project B to automatically trigger after Job A in Project A completes. What is the minimum dbt Cloud plan required for this configuration?", "is_multi_select": false, "options": {"A": "Developer plan — job chaining is available on all plans.", "B": "Starter plan — job chaining is available on Starter and above.", "C": "Enterprise plan — cross-project job chaining requires Enterprise.", "D": "Enterprise+ plan — cross-project references require Enterprise+."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Developer plan does **not** support job chaining — it's explicitly excluded."}, "B": {"label": "✅ Correct", "text": "Job chaining (triggering a job when another job finishes) is available on **Starter and above** — including cross-project chaining. Developer plan is the only tier that doesn't support it."}, "C": {"label": "❌ Incorrect", "text": "Enterprise is not required — Starter is sufficient for job chaining."}, "D": {"label": "❌ Incorrect", "text": "Enterprise+ is required for cross-project *ref resolution* (dbt Mesh), not for job chaining. These are different features."}}, "key_rule": "Job chaining = **Starter+** (not Developer). Can chain across projects. Cross-project *refs* = Enterprise+."}, {"id": "q04_Q20", "file_id": "q04", "topic_num": "4", "topic_name": "Jobs & CI/CD", "question_num": 20, "high_yield": true, "subdomain_id": "4.20", "subdomain_topic": "Configuring Advanced CI", "question_text": "An organization's dbt project has grown to over 3,000 models, and the full CI run on every pull request now takes over an hour. An architect needs to implement a \"Slim CI\" strategy to drastically reduce run times while ensuring data quality and integrity for all changes. Which of the following actions should the architect take? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Cache the `dbt_packages` and `target` directories between CI runs to speed up dependency installation and compilation.", "B": "Implement a CI job that runs the command `dbt build --select state:modified+ --defer --state ./prod_manifest`.", "C": "Configure the CI job to only run `dbt test` for pull requests, relying on developers to test locally.", "D": "Increase the size of the data warehouse used for the CI environment to improve query performance.", "E": "Disable all tests in the CI environment and run them only in the production job after merging."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "Caching `dbt_packages` avoids repeti
