tive downloads via `dbt deps`, which can take several minutes. Caching the `target` directory enables \"Partial Parsing\" — dbt only re-parses modified files, significantly reducing compilation phase time."}, "B": {"label": "✅ Correct", "text": "`dbt build --select state:modified+` runs only modified models and their downstream dependents. `--defer --state` resolves unmodified upstream parents against production tables instead of rebuilding them. This is the canonical \"Slim CI\" command."}, "C": {"label": "❌ Incorrect", "text": "Relying on developers to test locally is not a robust strategy for a project of this size. CI ensures project-wide integrity and prevents human error or environmental inconsistencies from entering the production branch."}, "D": {"label": "❌ Incorrect", "text": "Scaling up the warehouse is a brute-force approach that addresses query speed but not the architectural inefficiency. It also increases costs significantly."}, "E": {"label": "❌ Incorrect", "text": "Disabling tests in CI removes the safety net that prevents broken code from reaching production. Tests are the point of CI."}}, "key_rule": "Slim CI = `state:modified+` + `--defer --state` + package/target caching for fastest feedback loop."}, {"id": "q05_Q1", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 1, "high_yield": true, "subdomain_id": "4c.1", "subdomain_topic": "Views breaking after swap", "question_text": "After a successful blue/green deployment and database swap on Snowflake, downstream BI tools begin returning stale data even though the swap completed without errors. What is the most likely cause?", "is_multi_select": false, "options": {"A": "The swap operation didn't complete atomically — some tables were swapped while others were not.", "B": "Views in downstream BI tools were compiled with hardcoded database names. After the swap, the hardcoded name refers to the old (demoted) blue database.", "C": "Snowflake's `SWAP WITH` command has a replication lag of several minutes before BI tools see updated data.", "D": "The blue/green swap only works for tables — views must be manually recreated after each swap."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Snowflake's `SWAP WITH` is atomic — it swaps metadata pointers in a single operation. Partial swaps don't occur."}, "B": {"label": "✅ Correct", "text": "When dbt compiles views, it includes the fully-qualified database name by default. After the swap, the database that was blue becomes green and vice versa — views with hardcoded names now point to the **demoted** (old blue) database, returning stale data. **Fix**: override `ref()` and `source()` macros to exclude the database qualifier using `builtins.ref(model).include(database=false)`."}, "C": {"label": "❌ Incorrect", "text": "Snowflake's atomic swap is instantaneous — there is no documented replication lag."}, "D": {"label": "❌ Incorrect", "text": "Views are affected by the swap (they reference the old database name), but they don't need manual recreation — the fix is in the macro override, not manual recreation."}}, "key_rule": "Override `ref()` and `source()` to exclude database qualifier: `builtins.ref(model).include(database=false)`."}, {"id": "q05_Q2", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 2, "high_yield": true, "subdomain_id": "4c.2", "subdomain_topic": "Snapshots and blue/green", "question_text": "After several blue/green deployments, the team notices gaps in snapshot history — `dbt_valid_to` records show unexpected null values and overlapping periods. What caused this?", "is_multi_select": false, "options": {"A": "Snapshot tables were included in the database swap — `dbt_valid_to` continuity tracking breaks when the snapshot table's physical database changes.", "B": "The blue/green swap runs `dbt snapshot` on the wrong environment during the swap phase.", "C": "Snapshots require `--full-refresh` after every blue/green swap to rebuild the history.", "D": "The swap operation drops and recreates snapshot tables, losing all historical records."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Snapshots maintain `dbt_valid_from` and `dbt_valid_to` continuity by tracking changes to a single physical table location. When a blue/green swap moves the snapshot table to a different database, the SCD tracking mechanism is disrupted — subsequent snapshot runs don't recognize the continuity, causing gaps and overlaps. **Fix**: store snapshots in a **dedicated, non-swapped database** with a custom `ref_snapshot()` macro that always routes to that fixed location."}, "B": {"label": "❌ Incorrect", "text": "The swap operation doesn't run `dbt snapshot` — it's a metadata pointer swap."}, "C": {"label": "❌ Incorrect", "text": "`--full-refresh` on snapshots destroys all history — that's worse than the problem."}, "D": {"label": "❌ Incorrect", "text": "`SWAP WITH` swaps metadata pointers — it doesn't drop tables."}}, "key_rule": "Snapshots must live in a **dedicated non-swapped database**. Include them in the swap = broken `dbt_valid_to` continuity."}, {"id": "q05_Q3", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 3, "high_yield": false, "subdomain_id": "4c.3", "subdomain_topic": "Incremental models after swap", "question_text": "An incremental model is part of a blue/green deployment pipeline. After a swap, the next deployment run shows the incremental model is missing rows that were processed in the previous deployment. Why?", "is_multi_select": false, "options": {"A": "Incremental models always require `--full-refresh` in blue/green deployments — they can't be used incrementally.", "B": "After the swap, the demoted blue database becomes the new staging baseline. The incremental model's next run adds only rows newer than the stale demoted state, potentially missing rows from the last production window.", "C": "The swap operation resets the incremental model's high-water mark to the initial load date.", "D": "Incremental models are incompatible with the atomic swap mechanism on all platforms."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Incremental models can be used in blue/green, but require special handling — they don't always need `--full-refresh`."}, "B": {"label": "✅ Correct", "text": "After a swap, the old blue becomes the new green (staging). The incremental table it contains represents the state from the **deployment before last**. The next green deployment runs incrementally on top of this stale baseline — rows processed in the most recent (now-production) blue run may not exist in the new green baseline, causing apparent missing data. **Fix**: run `dbt run --full-refresh --select <incremental_models>` after each swap, or maintain a high-water mark in a non-swapped table."}, "C": {"label": "❌ Incorrect", "text": "The swap doesn't reset high-water marks — it just changes which table is in which database."}, "D": {"label": "❌ Incorrect", "text": "Incremental models are not incompatible — they just require careful handling post-swap."}}, "key_rule": "Post-swap: incremental models have stale baseline. Run `--full-refresh` on incrementals after each swap."}, {"id": "q05_Q4", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 4, "high_yield": false, "subdomain_id": "4c.4", "subdomain_topic": "Platform support for blue/green", "question_text": "A data team using Amazon Redshift proposes implementing blue/green deployments to achieve zero-downtime releases. What is the fundamental problem with this approach?", "is_multi_select": false, "options": {"A": "Redshift's `CLONE` command is too slow for production-scale blue/green deployments.", "B": "Redshift does not support database/schema renaming or atomic swap operations — blue/green is not viable without downtime.", "C": "Blue/green deployments on Redshift require the Advanced CI plan feature.", "D": "Redshift's blue/green support is in beta and not yet recommended for production use."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Redshift doesn't have a `CLONE` command equivalent for zero-copy table cloning — the issue isn't speed, it's the absence of the feature."}, "B": {"label": "✅ Correct", "text": "**Redshift does not support database/schema renaming or atomic swap operations**. Blue/green deployments require an atomic swap (like Snowflake's `SWAP WITH`) to achieve zero downtime. Without this capability, any \"swap\" on Redshift involves sequential DDL operations that create a downtime window. Blue/green is **not viable on Redshift**."}, "C": {"label": "❌ Incorrect", "text": "Blue/green is an architectural deployment pattern — it's not a dbt Cloud plan feature."}, "D": {"label": "❌ Incorrect", "text": "This is not a beta limitation — Redshift simply lacks the required database primitives."}}, "key_rule": "Redshift = **no atomic swap** = blue/green not viable. Snowflake ✅, Databricks ✅, BigQuery ✅ (with workarounds)."}, {"id": "q05_Q5", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 5, "high_yield": true, "subdomain_id": "4c.5", "subdomain_topic": "dbt clone vs deferral", "question_text": "Before a blue/green cutover, a BI team wants to validate dashboards against the staging (green) data before the swap executes. Should they use `dbt clone` or deferral for this validation?", "is_multi_select": false, "options": {"A": "Deferral — it's faster and cheaper since no data is physically copied.", "B": "`dbt clone` — it creates real relations in the staging schema that BI tools can query, whereas deferral is invisible to external tools.", "C": "Either approach works — deferral and clone are interchangeable for BI validation.", "D": "Neither — BI validation must be done after the swap, not before."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Deferral resolves `ref()` calls within dbt — it does not create physical tables visible to external BI tools. BI tools querying the warehouse won't benefit from deferral."}, "B": {"label": "✅ Correct", "text": "`dbt clone` creates **real relations** (zero-copy clones on Snowflake, pointer views on other platforms) in the staging schema. BI tools can connect to these real tables/views and validate dashboards against green data before the swap executes. Deferral is a dbt-internal mechanism — external tools are unaware of it."}, "C": {"label": "❌ Incorrect", "text": "They serve fundamentally different purposes — clone creates physical objects visible to external tools; deferral is internal to dbt's DAG resolution."}, "D": {"label": "❌ Incorrect", "text": "Pre-swap BI validation is precisely the use case for `dbt clone` — it enables pre-cutover validation without committing to the swap."}}, "key_rule": "Use `dbt clone` when BI/apps need realistic data before cutover. Use deferral for dbt-internal CI cost optimization."}, {"id": "q05_Q6", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 6, "high_yield": false, "subdomain_id": "4c.6", "subdomain_topic": "Partial run swap risk", "question_text": "A team uses blue/green deployments. An on-call engineer triggers the `swap_database` operation after running only a subset of models (`dbt run --select state:modified`). What is the risk?", "is_multi_select": false, "options": {"A": "The swap will fail because `swap_database` requires a full run artifact to verify completion.", "B": "The green (staging) database will be incomplete — some models reflect new code while others are from the previous deployment. Swapping makes this incomplete state production.", "C": "Only the modified models will swap — unmodified models stay in the blue database automatically.", "D": "The swap is safe because dbt tracks which models were built in this run vs the previous run."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`dbt run-operation swap_database` is a custom macro — it doesn't validate run completeness before executing."}, "B": {"label": "✅ Correct", "text": "`swap_database` swaps the **entire database** — not individual models. If only a subset of models was built in green, the swap promotes an incomplete state to production. Some models will have new code, others stale code from the previous deployment cycle. Blue/green swaps must only be executed after a **complete full run** of all models against green."}, "C": {"label": "❌ Incorrect", "text": "The swap is at the database level — it does not selectively swap individual models."}, "D": {"label": "❌ Incorrect", "text": "dbt does not validate run completeness before allowing a swap operation."}}, "key_rule": "**Never swap after a partial `--select` run.** Green must be fully built before `swap_database` is safe."}, {"id": "q05_Q7", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 7, "high_yield": false, "subdomain_id": "4c.7", "subdomain_topic": "Failure safety", "question_text": "A blue/green deployment job runs `dbt run` followed by `dbt test` in the green environment. Three data quality tests fail. What happens to the production (blue) environment?", "is_multi_select": false, "options": {"A": "Production is automatically rolled back to the previous deployment.", "B": "Production remains unchanged — the swap never executes because tests failed, so blue stays live.", "C": "Production is partially affected — the models that passed testing are swapped.", "D": "Production is swapped but flagged as degraded in the dbt Catalog health signals."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is nothing to roll back — production was never touched. Blue/green's design is that blue is untouched until the explicit swap command runs."}, "B": {"label": "✅ Correct", "text": "If `dbt test` fails in green, the job aborts before `dbt run-operation swap_database` executes. **Blue (production) remains live and completely unchanged**. This is the core safety guarantee of blue/green deployments — failures are safe by design. Only after a full successful run AND all tests passing does the swap execute."}, "C": {"label": "❌ Incorrect", "text": "The swap is all-or-nothing — there is no partial swap of \"passing\" models."}, "D": {"label": "❌ Incorrect", "text": "The swap does not execute — nothing about production changes."}}, "key_rule": "Blue/green failure = **safe**. Test failure aborts before swap. Blue stays live. No partial swaps."}, {"id": "q05_Q8", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 8, "high_yield": false, "subdomain_id": "4c.8", "subdomain_topic": "dbt clone behavior", "question_text": "A team uses `dbt clone` to populate the staging (green) environment before a blue/green deployment. They run `dbt clone --state ./prod_artifacts` but notice that several models already present in the staging schema are not recreated. What is the default behavior and how can they force recreation?", "is_multi_select": false, "options": {"A": "`dbt clone` always recreates all models — if some are skipped, the state artifacts are stale.", "B": "By default, `dbt clone` **skips pre-existing relations** in the target schema. Use `--full-refresh` to force recreation of existing clones.", "C": "`dbt clone` only creates new models (`state:new`) — use `state:modified` to include modified clones.", "D": "Pre-existing relations are skipped because they are locked by the production job. Wait for the production job to complete before running `dbt clone`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The default behavior is to skip pre-existing relations — not recreate all. This is intentional to avoid unnecessary work."}, "B": {"label": "✅ Correct", "text": "By default, `dbt clone` **skips pre-existing relations** in the target schema. To force all clones to be recreated (useful when you want the staging environment to be a fresh copy of production), add the `--full-refresh` flag: `dbt clone --state ./prod_artifacts --full-refresh`."}, "C": {"label": "❌ Incorrect", "text": "`dbt clone` is not driven by `state:new` or `state:modified` — it clones selected models from the source state to the target schema."}, "D": {"label": "❌ Incorrect", "text": "Locking is not the cause — `dbt clone` uses zero-copy cloning which doesn't require the source table to be idle."}}, "key_rule": "`dbt clone` default = **skips pre-existing relations**. Add `--full-refresh` to recreate them."}, {"id": "q05_Q9", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 9, "high_yield": false, "subdomain_id": "4c.9", "subdomain_topic": "Blue/green core problem", "question_text": "What core deployment problem does the blue/green strategy solve that standard dbt deployments cannot?", "is_multi_select": false, "options": {"A": "It eliminates the need for test runs since both environments are always validated.", "B": "It prevents mid-run data inconsistency — in a standard deployment, a job failure leaves live queries hitting partially-built tables. Blue/green builds everything in staging first and only swaps to production after all tests pass.", "C": "It reduces warehouse compute costs by running models only on changed data.", "D": "It enables cross-warehouse deployments by maintaining two separate warehouse connections simultaneously."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Blue/green still requires test runs — in fact, tests must pass in the green environment before the swap is allowed. It does not eliminate tests."}, "B": {"label": "✅ Correct", "text": "In a **standard deployment**, if a dbt job fails mid-run, live queries are hitting a mix of old and new (partially-built) tables — data inconsistency is immediate. **Blue/green** solves this by building all models in the green (staging) environment while blue (production) remains fully live and untouched. Only after all models build and all tests pass does an **atomic swap** occur. Live queries never hit a partial state."}, "C": {"label": "❌ Incorrect", "text": "Blue/green deploys the full model set in green — it does not optimize for incremental computation. Cost reduction is not the primary motivation."}, "D": {"label": "❌ Incorrect", "text": "Blue/green operates within a single warehouse (e.g., two databases in Snowflake). It does not involve cross-warehouse deployments."}}, "key_rule": "Blue/green solves mid-run inconsistency: standard deployment = partial tables live during run. Blue/green = atomic swap, production never partially updated."}, {"id": "q05_Q10", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 10, "high_yield": false, "subdomain_id": "4c.10", "subdomain_topic": "Databricks blue/green viability", "question_text": "A team using Databricks as their data warehouse wants to implement blue/green deployments. A colleague claims Databricks doesn't support it. Is this correct?", "is_multi_select": false, "options": {"A": "Correct — Databricks does not support zero-copy cloning or atomic swaps.", "B": "Incorrect — Databricks supports blue/green using **shallow clone** for zero-copy cloning and a schema swap for the atomic cutover. It is fully viable.", "C": "Partially correct — Databricks supports zero-copy cloning but requires brief downtime during the swap step.", "D": "Incorrect — Databricks supports blue/green but only when using Delta Live Tables, not standard dbt models."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Databricks does support both zero-copy cloning and atomic schema swaps."}, "B": {"label": "✅ Correct", "text": "Databricks is fully viable for blue/green deployments. It supports **shallow clone** (zero-copy cloning of Delta tables) and **schema swap** for the atomic cutover. This makes it one of the preferred platforms for blue/green alongside Snowflake. The non-viable platforms are Redshift and Postgres, which lack rename/swap support."}, "C": {"label": "❌ Incorrect", "text": "The schema swap on Databricks is atomic — there is no documented brief downtime window."}, "D": {"label": "❌ Incorrect", "text": "Blue/green on Databricks works with standard dbt models and does not require Delta Live Tables."}}, "key_rule": "Databricks = viable for blue/green (shallow clone + schema swap). Non-viable: Redshift (no rename/swap), Postgres (sequential DDL only)."}, {"id": "q05_Q11", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 11, "high_yield": false, "subdomain_id": "4c.11", "subdomain_topic": "BigQuery blue/green viability", "question_text": "A team using BigQuery wants to implement a blue/green deployment. Which of the following accurately describes BigQuery's blue/green support?", "is_multi_select": false, "options": {"A": "BigQuery is not viable for blue/green — it has no support for dataset cloning or swapping.", "B": "BigQuery supports blue/green using native table cloning and a dataset-level swap workaround. It is viable but requires more configuration than Snowflake.", "C": "BigQuery is fully equivalent to Snowflake for blue/green — it uses identical `CLONE` and `SWAP WITH` syntax.", "D": "BigQuery supports blue/green only in Enterprise+ accounts where dataset-level permissions can be swapped atomically."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "BigQuery does support table cloning and has a dataset swap workaround — it is viable."}, "B": {"label": "✅ Correct", "text": "BigQuery supports **table clone** (zero-copy) and uses a **dataset swap workaround** (not a native `SWAP` command like Snowflake's `SWAP WITH`). This makes it viable for blue/green but with more complexity. It is in the \"supported with workarounds\" category — unlike Snowflake and Databricks, which have more native support."}, "C": {"label": "❌ Incorrect", "text": "BigQuery uses table clone syntax, not Snowflake's `CLONE` or `SWAP WITH` commands. The approach is similar in outcome but different in syntax and atomicity guarantees."}, "D": {"label": "❌ Incorrect", "text": "BigQuery blue/green is not gated on dbt Cloud Enterprise+ — it is a warehouse-side capability, not a dbt plan feature."}}, "key_rule": "BigQuery = viable for blue/green with dataset swap workaround (not native `SWAP WITH`). Snowflake and Databricks have more native support."}, {"id": "q05_Q12", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 12, "high_yield": false, "subdomain_id": "4c.12", "subdomain_topic": "swap_database operation", "question_text": "After all models build and tests pass in the green environment, an engineer runs `dbt run-operation swap_database`. What does this operation do?", "is_multi_select": false, "options": {"A": "It copies all data from green to blue, making green's data available in the production blue schema.", "B": "It executes a custom macro that performs an **atomic database swap** — green becomes production and blue becomes the new staging. No data is copied; only metadata pointers change.", "C": "It deletes the blue database and renames green to blue.", "D": "It runs a final test suite in both environments before permitting the swap."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "No data is copied — that would be slow and expensive. The swap changes metadata pointers, not data."}, "B": {"label": "✅ Correct", "text": "`dbt run-operation swap_database` executes a **custom macro** (e.g., using Snowflake's `ALTER DATABASE ... SWAP WITH`) that performs an **atomic metadata pointer swap**. Green becomes the live production database; blue becomes the new staging for the next deployment. Because it's a metadata operation (not a data copy), it is near-instantaneous — this is the \"zero downtime\" mechanism."}, "C": {"label": "❌ Incorrect", "text": "Blue is not deleted — it becomes the new staging, which is immediately available as a rollback point."}, "D": {"label": "❌ Incorrect", "text": "Tests must already have passed before `swap_database` is called — it does not trigger additional tests."}}, "key_rule": "`swap_database` = atomic metadata pointer swap (no data copy). Green → production. Blue → new staging (rollback point)."}, {"id": "q05_Q13", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 13, "high_yield": false, "subdomain_id": "4c.13", "subdomain_topic": "Blue/green rollback", "question_text": "A blue/green deployment swap completes successfully. Ten minutes later, the data team discovers a critical data quality issue in the newly promoted green environment (now production). What is the rollback procedure?", "is_multi_select": false, "options": {"A": "Restore from a warehouse snapshot that was taken before the swap.", "B": "Re-run the full dbt deployment job against the old blue database to rebuild it.", "C": "Execute `swap_database` again — the old blue database (now staging) is still intact and becomes production instantly.", "D": "Manually copy tables from the staging database back to production."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Warehouse snapshots are slower and more complex than the blue/green rollback mechanism. They're a last resort, not the designed rollback path."}, "B": {"label": "❌ Incorrect", "text": "Rebuilding the old blue database is unnecessary — it was not destroyed during the swap. It exists intact as the current staging database."}, "C": {"label": "✅ Correct", "text": "One of blue/green's key benefits is **instant rollback**: after a swap, the **old blue database is preserved as the new staging** and contains the last known-good production state. Running `swap_database` again swaps them back — the old blue (now staging) becomes production again. This is near-instantaneous and requires no data rebuild."}, "D": {"label": "❌ Incorrect", "text": "Manual table copying is slow, error-prone, and unnecessary given the atomic swap mechanism."}}, "key_rule": "Blue/green rollback = run `swap_database` again. Old blue is preserved as staging — swap back is instant."}, {"id": "q05_Q14", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 14, "high_yield": false, "subdomain_id": "4c.14", "subdomain_topic": "Storage implications", "question_text": "A CTO asks why the data team's Snowflake storage costs doubled after adopting blue/green deployments. What is the explanation?", "is_multi_select": false, "options": {"A": "dbt clone creates full physical copies of every table, doubling storage permanently.", "B": "Blue/green requires maintaining both the blue (production) and green (staging) databases simultaneously, which doubles storage requirements compared to a single-database setup.", "C": "The swap operation leaves orphaned temporary tables in both databases that accumulate over time.", "D": "dbt now runs two job runs per deployment cycle instead of one, creating twice as many warehouse query logs."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "On Snowflake, `dbt clone` uses **zero-copy cloning** — it creates metadata pointers, not physical copies. Storage is only consumed when data diverges from the original."}, "B": {"label": "✅ Correct", "text": "Blue/green deployments require maintaining **two complete databases** at all times — the current production (blue) and the staging being built (green). This inherently requires approximately **2× the storage** of a standard single-database setup. This is a known trade-off: the cost of zero-downtime deployment is double the storage. Teams should factor this into their warehouse cost planning."}, "C": {"label": "❌ Incorrect", "text": "The swap operation is a metadata operation and does not leave orphaned tables."}, "D": {"label": "❌ Incorrect", "text": "Query logs do not meaningfully contribute to storage costs compared to the data tables themselves."}}, "key_rule": "Blue/green = **2× storage** required (blue + green databases both exist simultaneously). This is a known trade-off for zero-downtime deployments."}, {"id": "q05_Q15", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 15, "high_yield": false, "subdomain_id": "4c.15", "subdomain_topic": "Zero-copy clone platforms", "question_text": "A team wants to use `dbt clone` to populate their green (staging) environment with production data before a blue/green deployment. They are concerned about warehouse compute cost during this step. On which platforms does `dbt clone` perform a **zero-copy clone** (no data scanning or movement)?", "is_multi_select": false, "options": {"A": "All platforms supported by dbt Cloud — zero-copy cloning is a dbt feature, not platform-specific.", "B": "Snowflake (using `CLONE`) and Databricks (using shallow clone) — these support zero-copy cloning natively.", "C": "Only Snowflake supports zero-copy cloning in dbt.", "D": "Snowflake, Databricks, and Redshift all support zero-copy cloning."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Zero-copy cloning is a **warehouse feature**, not a dbt feature. It is only available on platforms that natively support it."}, "B": {"label": "✅ Correct", "text": "**Snowflake** supports zero-copy cloning via the `CLONE` command — it creates metadata pointers with no data movement. **Databricks** supports it via **shallow clone** on Delta tables. BigQuery supports table clone (also zero-copy). On platforms that don't support native cloning (Redshift, Postgres), `dbt clone` falls back to creating **pointer views** (`SELECT * FROM source`) — no data copy, but also no independent data — rather than physical clones."}, "C": {"label": "❌ Incorrect", "text": "Databricks also supports zero-copy cloning via shallow clone, and BigQuery supports table clone."}, "D": {"label": "❌ Incorrect", "text": "Redshift does **not** support zero-copy cloning. `dbt clone` on Redshift falls back to pointer views."}}, "key_rule": "Zero-copy clone: Snowflake (`CLONE`), Databricks (shallow clone), BigQuery (table clone). Redshift/Postgres = pointer views (no native clone)."}, {"id": "q05_Q16", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 16, "high_yield": false, "subdomain_id": "4c.16", "subdomain_topic": "dbt clone fallback behavior", "question_text": "A team uses `dbt clone` to populate their green environment on a **Postgres** warehouse. After the clone command runs, they notice the cloned models are simple views pointing to the source tables rather than independent copies. They expected separate physical tables. Why did this happen?", "is_multi_select": false, "options": {"A": "`dbt clone` always creates views — it never creates physical copies regardless of platform.", "B": "Postgres does not support native zero-copy table cloning, so `dbt clone` falls back to creating **pointer views** (`SELECT * FROM source_table`) in the target schema.", "C": "The `--full-refresh` flag was missing, causing dbt to create views instead of tables.", "D": "dbt clone creates views until the `--materialize` flag is passed."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "On platforms that support native cloning (Snowflake, Databricks), `dbt clone` creates actual zero-copy clones, not views."}, "B": {"label": "✅ Correct", "text": "Postgres (and Redshift) do not support native zero-copy table cloning. On these platforms, `dbt clone` automatically **falls back to creating pointer views** — simple `CREATE VIEW AS SELECT * FROM <source>` statements. The views point to the original production tables, so they reflect production data but are not independent copies. This is important to understand: cloned \"data\" on Postgres is actually just pass-through views."}, "C": {"label": "❌ Incorrect", "text": "`--full-refresh` controls whether existing relations are recreated, not whether they become tables vs views."}, "D": {"label": "❌ Incorrect", "text": "There is no `--materialize` flag for `dbt clone`."}}, "key_rule": "`dbt clone` on Redshift/Postgres = pointer views (not physical copies). On Snowflake/Databricks = true zero-copy clones."}, {"id": "q05_Q17", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 17, "high_yield": false, "subdomain_id": "4c.17", "subdomain_topic": "dbt clone includes defer", "question_text": "A team runs `dbt clone --select \"tag:finance\" --state ./prod_artifacts` to populate only the finance models in their green environment. They notice that upstream models NOT tagged `finance` are automatically resolved against production rather than being cloned. Why?", "is_multi_select": false, "options": {"A": "`dbt clone` only processes selected nodes — upstream models outside the selection are ignored entirely and cause resolution errors.", "B": "`dbt clone` automatically includes `--defer` behavior — unselected upstream nodes are resolved against the source state (production) rather than being cloned.", "C": "The `--state` flag automatically applies deferral to all unselected nodes as a separate mechanism from `dbt clone`.", "D": "This behavior requires explicitly passing `--defer` alongside `dbt clone`."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Unselected upstream nodes do not cause errors — they are resolved against the source state automatically."}, "B": {"label": "✅ Correct", "text": "`dbt clone` **automatically includes `--defer` behavior** — it is built in. When you clone a subset of models, any upstream nodes that were not selected are automatically resolved against the source state (production) rather than being cloned or failing. You do not need to explicitly add `--defer`. This makes partial clone operations safe and efficient."}, "C": {"label": "❌ Incorrect", "text": "The `--state` flag provides the comparison manifest; it does not by itself apply deferral. The deferral is built into `dbt clone`'s default behavior."}, "D": {"label": "❌ Incorrect", "text": "`--defer` is already included in `dbt clone` implicitly. Adding it explicitly is redundant but not harmful."}}, "key_rule": "`dbt clone` auto-includes `--defer` — unselected upstream nodes resolve against source state automatically."}, {"id": "q05_Q18", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 18, "high_yield": false, "subdomain_id": "4c.18", "subdomain_topic": "Partial run before swap", "question_text": "An on-call engineer is under pressure to deploy a hotfix quickly. Instead of running the full dbt job, they run `dbt run --select state:modified` to rebuild only the changed models in the green environment, then immediately trigger `swap_database`. What is the risk?", "is_multi_select": false, "options": {"A": "None — running only modified models is a valid optimization for blue/green deployments.", "B": "The green environment will be incomplete — unmodified models in green may be stale or missing, so after the swap, production serves a mix of new and old data.", "C": "The `swap_database` operation will fail if the green environment is incomplete.", "D": "The partial run means only the modified models get tested before the swap, but the overall risk is low if the modified models pass."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Partial runs before a swap are explicitly called out as a risk in the blue/green pattern."}, "B": {"label": "✅ Correct", "text": "`swap_database` swaps the **entire green database** to production — not just the modified models. If green was only partially rebuilt, the swapped production environment will contain a mix of newly-built models and whatever stale or missing models existed in green from prior deployments. The swap itself always succeeds (it's just a metadata operation), but the resulting production state may be inconsistent. **Only trigger `swap_database` after a full `dbt run`** covering all models."}, "C": {"label": "❌ Incorrect", "text": "`swap_database` is a metadata operation that doesn't validate whether green is complete. It will execute regardless."}, "D": {"label": "❌ Incorrect", "text": "The risk is not low — downstream models in green that weren't rebuilt may reference stale data after the swap."}}, "key_rule": "Never swap after a partial run. `swap_database` promotes the entire green database — if green is incomplete, production becomes inconsistent."}, {"id": "q05_Q19", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 19, "high_yield": false, "subdomain_id": "4c.19", "subdomain_topic": "Failure safety", "question_text": "A blue/green deployment job runs `dbt run` in the green environment, then `dbt test`. Five tests fail. The job is configured to run `dbt run-operation swap_database` as the final step. What happens to the production (blue) environment?", "is_multi_select": false, "options": {"A": "The swap proceeds anyway — the test failures are logged but do not block the swap step.", "B": "Production (blue) remains live and untouched — because `dbt test` failed, dbt Cloud stops the job before the `swap_database` step executes.", "C": "Production (blue) is rolled back to its state from before the green build started.", "D": "The swap proceeds for models whose tests passed; only the failed models are excluded from the swap."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Test failures are not just logged — they cause the job step to fail, which stops subsequent steps from executing."}, "B": {"label": "✅ Correct", "text": "dbt Cloud job commands run **sequentially** — a failure at any step stops all subsequent steps. If `dbt test` fails, the job stops immediately. The `dbt run-operation swap_database` step never executes. Production (blue) remains **completely untouched and live**. This is one of the key safety properties of blue/green: failure is safe by design."}, "C": {"label": "❌ Incorrect", "text": "Blue was never modified during the green build — there is nothing to roll back. Blue has been live and unchanged throughout."}, "D": {"label": "❌ Incorrect", "text": "`swap_database` is an all-or-nothing operation — it swaps the entire database. There is no selective per-model swap."}}, "key_rule": "Blue/green failure is safe — test failures stop the job before swap executes. Blue production stays live and untouched."}, {"id": "q05_Q20", "file_id": "q05", "topic_num": "4c", "topic_name": "Blue/Green Deployments", "question_num": 20, "high_yield": true, "subdomain_id": "4c.20", "subdomain_topic": "Recommended job sequence", "question_text": "Which of the following represents the **correct recommended command sequence** for a blue/green deployment job in dbt Cloud?", "is_multi_select": false, "options": {"A": "`dbt run-operation swap_database` → `dbt run` → `dbt test`", "B": "`dbt test` → `dbt run` → `dbt run-operation swap_database`", "C": "`dbt run` → `dbt run-operation swap_database` → `dbt test`", "D": "`dbt run` → `dbt test` → `dbt run-operation swap_database`"}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Swapping before building is catastrophically wrong — production would be swapped to an empty or stale green environment before any models run."}, "B": {"label": "❌ Incorrect", "text": "Running tests before building models means testing against the previous state in green, not the newly-built models."}, "C": {"label": "❌ Incorrect", "text": "Swapping before testing means production is promoted to green before quality is validated. If tests subsequently fail, production already has the potentially bad data."}, "D": {"label": "✅ Correct", "text": "The recommended sequence is: (1) **`dbt run`** — build all models in the green environment; (2) **`dbt test`** — validate all data quality tests against the freshly-built green data; (3) **`dbt run-operation swap_database`** — only after tests pass, atomically swap green to production. This ensures production is only ever promoted to a tested, complete state."}}, "key_rule": "Blue/green sequence = `dbt run` → `dbt test` → `dbt run-operation swap_database`. Never swap before tests pass."}, {"id": "q06_Q1", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 1, "high_yield": true, "subdomain_id": "5.1", "subdomain_topic": "IT license ignores group permissions", "question_text": "A new hire needs to manage users, groups, and SSO settings, but should have no access to the dbt IDE, jobs, or data. An admin assigns them an IT license and adds them to the Account Admin group. What level of access will this user have?", "is_multi_select": false, "options": {"A": "Full Account Admin access — the Account Admin group overrides license restrictions for IT users.", "B": "Fixed IT access only: Security Admin + Billing Admin + edit Connections. The Account Admin group assignment has zero effect.", "C": "IT access plus the ability to run jobs since Account Admin includes job execution.", "D": "The assignment will fail — IT-licensed users cannot be added to the Account Admin group."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "IT and Read-Only licenses are the two license types that **do not inherit from any permission sets**. Group assignment is completely irrelevant for these users."}, "B": {"label": "✅ Correct", "text": "**IT-licensed users have fixed, non-overridable access**: Security Admin + Billing Admin + the ability to edit Connections. No matter which group they're in — including Account Admin — their access does not change. To get the admin's intended capability (user/group/SSO management), the IT license is actually correct for that purpose. But they'll never get IDE or job access."}, "C": {"label": "❌ Incorrect", "text": "IT license does not inherit job execution from Account Admin group."}, "D": {"label": "❌ Incorrect", "text": "Technically you can add IT-licensed users to any group — but the group membership has zero effect on their access."}}, "key_rule": "IT and Read-Only licenses **ignore all group assignments**. License type = fixed access, no override possible."}, {"id": "q06_Q2", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 2, "high_yield": true, "subdomain_id": "5.2", "subdomain_topic": "Read-Only license trap", "question_text": "A contractor needs view-only access to a specific project's models in dbt Catalog. An admin assigns them a Read-Only license and adds them to the Developer group for that project. Can they now edit models in the IDE?", "is_multi_select": false, "options": {"A": "Yes — the Developer group grants IDE access, which the Read-Only license allows at the project level.", "B": "No — Read-Only license users do not inherit from any permission sets. They can only view artifacts and the deploy section, regardless of group membership.", "C": "Yes — but only in the IDE's read-only mode (no execution, no saves).", "D": "No — they can't access the IDE, but the Developer group gives them access to dbt Cloud's API."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Developer group cannot elevate a Read-Only license — the license type always overrides group permissions."}, "B": {"label": "✅ Correct", "text": "**Read-Only license users do not inherit rights from any permission sets**. Their access is identical regardless of which groups they belong to: view artifacts and the deploy section (jobs, runs, schedules) only. No IDE access, no job execution, no editing. The Developer group assignment has zero effect."}, "C": {"label": "❌ Incorrect", "text": "There is no \"read-only IDE mode\" — IDE access is binary, and Read-Only license users cannot access it at all."}, "D": {"label": "❌ Incorrect", "text": "Read-Only license does not grant any elevated API access through group membership."}}, "key_rule": "Read-Only license = **fixed access only** (view artifacts + deploy section). Groups irrelevant. Identical access for all Read-Only users."}, {"id": "q06_Q3", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 3, "high_yield": true, "subdomain_id": "5.3", "subdomain_topic": "Service token: one-time visibility", "question_text": "An admin creates a new service token to use in a CI/CD pipeline. They close the dialog before saving the token value. How can they recover the token?", "is_multi_select": false, "options": {"A": "The token value can be retrieved from Account Settings → API Tokens at any time.", "B": "The token can be re-revealed by clicking \"Show Token\" in the service token settings.", "C": "The token value is shown only once — it cannot be recovered. Delete it, create a new one, and update all integrations.", "D": "Contact dbt Cloud support with the token name to retrieve the value."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "After the initial creation dialog is closed, the token value is not stored in a retrievable form in the UI."}, "B": {"label": "❌ Incorrect", "text": "There is no \"Show Token\" button after initial creation — the value is permanently obscured."}, "C": {"label": "✅ Correct", "text": "Service token values are shown **exactly once** at creation time. If the dialog is closed before saving the value, it is permanently unrecoverable. The only path forward is to delete the existing token, create a new one, and update all integrations that used the old token."}, "D": {"label": "❌ Incorrect", "text": "dbt Labs support cannot reveal stored token values — they are not stored in recoverable form."}}, "key_rule": "Service token = **one-time reveal**. Save immediately. Lost token = delete → create new → update all integrations."}, {"id": "q06_Q4", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 4, "high_yield": true, "subdomain_id": "5.4", "subdomain_topic": "Service token 403 error", "question_text": "A service token is configured correctly and has the right permission sets, but all API calls return `403 Forbidden`. The token was created recently and the credentials haven't changed. What is the most likely cause?", "is_multi_select": false, "options": {"A": "The service token has expired — tokens expire after 90 days by default.", "B": "The service token was created before the last SSO configuration change and needs to be rotated.", "C": "The calling IP address is not on the account's IP allowlist — service tokens honor IP restrictions just like human logins.", "D": "The service token needs to be assigned to a specific project before it can make API calls."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Service tokens do not have a 90-day expiration — they don't expire on a time schedule (unlike OAuth tokens)."}, "B": {"label": "❌ Incorrect", "text": "SSO configuration changes do not invalidate service tokens — service tokens are separate from SSO."}, "C": {"label": "✅ Correct", "text": "**Service tokens honor IP restriction allowlists** exactly like human user logins. If the CI server or automation tool's IP is not on the account's allowlist, all API calls will return `403 Forbidden` — even if the token itself is valid and correctly permissioned."}, "D": {"label": "❌ Incorrect", "text": "Service tokens can be scoped to projects, but a missing project assignment would result in a permissions error on project-specific endpoints, not a blanket `403` on all API calls."}}, "key_rule": "Service token `403` = check **IP allowlist** first. Service tokens respect IP restrictions."}, {"id": "q06_Q5", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 5, "high_yield": true, "subdomain_id": "5.5", "subdomain_topic": "Security Admin cannot trigger jobs", "question_text": "During an incident, a Security Admin is the only person available. They need to manually trigger a production job to restore data. They find they cannot access the Jobs page at all. Why?", "is_multi_select": false, "options": {"A": "Security Admin requires 2FA to access the Jobs page during an incident.", "B": "Security Admin has zero access to jobs, runs, or environments — it is purely an administrative role for user/group/SSO/IP management.", "C": "Jobs can only be triggered by the Account Owner during incidents.", "D": "The Security Admin needs to be temporarily added to the Job Runner group."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "2FA for incident access is not a documented dbt Cloud requirement."}, "B": {"label": "✅ Correct", "text": "**Security Admin has zero data access** — no IDE, no jobs, no runs, no environments. It is scoped purely to: managing users, groups, licenses, SSO configuration, and IP restrictions. To trigger jobs in an incident, the correct role is **Job Admin** or **Job Runner**."}, "C": {"label": "❌ Incorrect", "text": "Job triggering is not exclusive to Account Owners."}, "D": {"label": "❌ Incorrect", "text": "This suggestion reflects the correct fix but the question asks why they can't currently trigger jobs — Security Admin's scope doesn't include jobs."}}, "key_rule": "Security Admin = **zero data access**. No IDE, no jobs, no runs. For job execution: Job Admin or Job Runner."}, {"id": "q06_Q6", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 6, "high_yield": false, "subdomain_id": "5.6", "subdomain_topic": "Database Admin and IDE access", "question_text": "A Database Admin user wants to write a quick SQL fix directly in the dbt Cloud IDE. Can they?", "is_multi_select": false, "options": {"A": "Yes — Database Admin includes read/write IDE access for all projects they manage.", "B": "Yes — but only in view mode; they cannot execute queries.", "C": "No — Database Admin manages data platform configs and Semantic Layer settings but has no IDE access.", "D": "Yes — Database Admin includes IDE access equivalent to the Developer role."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Database Admin is explicitly a non-IDE role focused on platform configuration."}, "B": {"label": "❌ Incorrect", "text": "There is no \"view mode\" IDE access — IDE access is binary based on role."}, "C": {"label": "✅ Correct", "text": "**Database Admin does not include IDE access**. The role is scoped to: data platform configurations, environment variables, and Semantic Layer configuration. To write code in the IDE, a user needs the Developer, Analyst, or Admin permission set. This is a common trap — \"Database Admin\" sounds like it should have more data access than it does."}, "D": {"label": "❌ Incorrect", "text": "Database Admin ≠ Developer. They are distinct roles with different scopes."}}, "key_rule": "Database Admin = **no IDE**. IDE access requires: Developer, Analyst, Admin, or Account Admin."}, {"id": "q06_Q7", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 7, "high_yield": true, "subdomain_id": "5.7", "subdomain_topic": "Project Admin cannot create projects", "question_text": "A project-level Admin user needs to create a new dbt project for a new data team. They navigate to the account settings but find the \"Create New Project\" button is greyed out. Why?", "is_multi_select": false, "options": {"A": "The user needs to be in the Owner group to create projects.", "B": "Creating projects is restricted to Account Admin and Project Creator roles — project-level Admin cannot create new projects.", "C": "New project creation is disabled after the account reaches its project limit on the current plan.", "D": "The user needs to log out and back in to see the new project creation option."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The Owner group doesn't directly map to \"create projects\" permission — the specific roles that enable this are Account Admin and Project Creator."}, "B": {"label": "✅ Correct", "text": "**Project-level Admin cannot create new projects** — Admin gives full control within *existing* projects only. Creating new projects requires **Account Admin** (account-level) or the **Project Creator** (account-level) permission set. This is one of the most important Admin vs Account Admin distinctions on the exam."}, "C": {"label": "❌ Incorrect", "text": "While plan limits exist, the question describes a permissions issue (greyed out button), not a plan limit error."}, "D": {"label": "❌ Incorrect", "text": "This is a permissions issue, not a session issue."}}, "key_rule": "**Admin ≠ Account Admin**. Admin = full control of existing projects. Create new projects = **Account Admin** or **Project Creator** only."}, {"id": "q06_Q8", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 8, "high_yield": false, "subdomain_id": "5.8", "subdomain_topic": "SSO enforced, admin locked out", "question_text": "An organization enforces SSO for all dbt Cloud users. The Identity Provider (IdP) goes down and all users are locked out. Can administrators still access dbt Cloud?", "is_multi_select": false, "options": {"A": "No — when SSO is enforced, all users including admins must use SSO. IdP downtime = complete lockout.", "B": "Yes — admins retain password-based login access by default even when SSO is enforced.", "C": "Yes — but only if they previously enabled the \"Admin Password Bypass\" setting in Account Settings.", "D": "No — but they can contact dbt Cloud support to temporarily disable SSO enforcement."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Full lockout would be a catastrophic single point of failure. dbt explicitly preserves admin access via password when SSO is enforced."}, "B": {"label": "✅ Correct", "text": "By default, **admins retain password-based login** even when SSO is enforced for the organization. This is a deliberate design to prevent admin lockout during IdP outages. (Admins can choose to explicitly restrict their own access to SSO-only, but this is not the default.)"}, "C": {"label": "❌ Incorrect", "text": "There is no \"Admin Password Bypass\" setting that must be explicitly enabled — it's the default behavior."}, "D": {"label": "❌ Incorrect", "text": "Support escalation may be a last resort, but admins have a built-in path (password login) that doesn't require support intervention."}}, "key_rule": "SSO enforced + IdP down = **admins can still log in with password** (default behavior, unless explicitly restricted)."}, {"id": "q06_Q9", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 9, "high_yield": false, "subdomain_id": "5.9", "subdomain_topic": "SCIM sync timing", "question_text": "A team uses SCIM with Okta to manage dbt Cloud users. An employee is offboarded — their Okta account is deprovisioned. How quickly is their dbt Cloud access removed?", "is_multi_select": false, "options": {"A": "Immediately — SCIM propagates changes in real-time between Okta and dbt Cloud.", "B": "Within 15 minutes — SCIM syncs on a scheduled interval.", "C": "On their next login attempt — SCIM syncs on user login, not in real-time.", "D": "After 24 hours — dbt Cloud re-authenticates all SSO sessions every 24 hours."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "SCIM in dbt Cloud does NOT sync in real-time — this is a key gotcha."}, "B": {"label": "❌ Incorrect", "text": "SCIM is not on a fixed 15-minute interval in dbt Cloud."}, "C": {"label": "✅ Correct", "text": "SCIM syncs **on user login**, not in real-time. A deprovisioned user's dbt Cloud access is not immediately revoked — it's removed when they next attempt to log in and SCIM validation fires. This is an important security consideration: for immediate access revocation, manually deactivate the user in dbt Cloud as well."}, "D": {"label": "❌ Incorrect", "text": "The 24-hour figure refers to SSO re-authentication frequency — not SCIM sync timing."}}, "key_rule": "SCIM syncs **on login** — not real-time. For immediate offboarding: manually deactivate in dbt Cloud too."}, {"id": "q06_Q10", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 10, "high_yield": false, "subdomain_id": "5.10", "subdomain_topic": "Default groups and new user access", "question_text": "A company wants all new contractors to join the organization without automatically receiving any project access. Currently, new users are being added to projects as soon as they're created. What setting must the admin change?", "is_multi_select": false, "options": {"A": "Disable the **\"Add all new users by default\"** setting on the **Everyone** group.", "B": "Set the Member group to have no permissions.", "C": "Require manual approval for all new user accounts before they're activated.", "D": "Change the default license type from Developer to Read-Only."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "New users are automatically added to **both the Member AND Everyone groups**. If the Everyone group has project permissions, all new users inherit them. Disabling **\"Add all new users by default\"** on the Everyone group prevents automatic access assignment — new users must be manually added to groups."}, "B": {"label": "❌ Incorrect", "text": "Setting Member group to no permissions would affect all existing members, not just new contractors. Also, new users land in both Member AND Everyone — just fixing Member is insufficient."}, "C": {"label": "❌ Incorrect", "text": "Manual account approval is not a built-in dbt Cloud feature."}, "D": {"label": "❌ Incorrect", "text": "Changing the default license type would affect what features users can access, but the root issue is group membership auto-assignment."}}, "key_rule": "New users → auto-added to **both Member AND Everyone**. Disable \"Add all new users\" on Everyone for RBAC isolation."}, {"id": "q06_Q11", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 11, "high_yield": false, "subdomain_id": "5.11", "subdomain_topic": "Most permissive group wins", "question_text": "A user is in two groups: \"ReadOnly-Team\" (Stakeholder permissions) and \"Data-Team\" (Developer permissions). What is their effective access level?", "is_multi_select": false, "options": {"A": "Stakeholder — the most restrictive group wins to protect data.", "B": "Developer — the most permissive group wins.", "C": "A blend of both — they get read access everywhere but write access only in Data-Team projects.", "D": "The last group they were added to determines their access."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt uses most-permissive, not most-restrictive. This is the opposite of some IAM systems and is an important gotcha."}, "B": {"label": "✅ Correct", "text": "When a user belongs to multiple groups, the **most permissive group wins**. The Developer permission set from \"Data-Team\" overrides the Stakeholder from \"ReadOnly-Team\". This means adding a user to any high-permission group grants them that access — you cannot restrict someone with a low-access group if they're also in a high-access group."}, "C": {"label": "❌ Incorrect", "text": "Permissions are not blended or intersected — the most permissive set wins in full."}, "D": {"label": "❌ Incorrect", "text": "Membership order has no effect — it's always the most permissive group."}}, "key_rule": "**Most permissive group wins**. A user in both a restrictive and permissive group gets the permissive access."}, {"id": "q06_Q12", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 12, "high_yield": false, "subdomain_id": "5.12", "subdomain_topic": "Stakeholder vs Viewer", "question_text": "A data governance officer needs read-only access to dbt Cloud **including the full sensitive audit log** (which contains user actions and PII-adjacent activity). Which role should they be assigned?", "is_multi_select": false, "options": {"A": "Stakeholder (project-level) — read-only access to everything including the audit log.", "B": "Viewer (account-level) — read-only across the entire account including the full sensitive audit log.", "C": "Read-Only license — provides access to all audit log entries.", "D": "Security Admin — provides access to the audit log for compliance purposes."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Stakeholder is project-level and the audit log it provides access to **excludes sensitive information**. Not suitable for full compliance audit access."}, "B": {"label": "✅ Correct", "text": "**Viewer** is an account-level role that provides read-only access across the entire account, including the **full sensitive audit log**. This is distinct from Stakeholder (project-level, limited audit log) and is the correct role for audit/compliance purposes."}, "C": {"label": "❌ Incorrect", "text": "Read-Only license users have fixed access to artifacts and deploy section only — not the full audit log."}, "D": {"label": "❌ Incorrect", "text": "Security Admin provides administrative access to security settings but is not the designated role for read-only audit log access."}}, "key_rule": "Viewer (account-level) = full audit log including sensitive. Stakeholder (project-level) = limited audit log."}, {"id": "q06_Q13", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 13, "high_yield": true, "subdomain_id": "5.13", "subdomain_topic": "Semantic Layer service token", "question_text": "A team needs to create a service token that allows an external BI tool to query the dbt Semantic Layer. Which permission set should be assigned to this service token?", "is_multi_select": false, "options": {"A": "Job Admin — gives access to run jobs and query data.", "B": "Developer — gives full project access including Semantic Layer queries.", "C": "Semantic Layer — the only permission set scoped to Semantic Layer queries; service token exclusive.", "D": "Database Admin — manages data platform configs including Semantic Layer."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Job Admin does not include Semantic Layer query access — it manages jobs and runs."}, "B": {"label": "❌ Incorrect", "text": "Developer cannot be assigned to a service token — it's a user-only permission set. Service tokens have their own set of assignable permission sets."}, "C": {"label": "✅ Correct", "text": "The **Semantic Layer** permission set is specifically designed for this purpose — it allows querying the Semantic Layer API and nothing else. It is also **service token exclusive** — it cannot be assigned to human users (they'd use normal project access)."}, "D": {"label": "❌ Incorrect", "text": "Database Admin manages configuration, not query execution via the Semantic Layer."}}, "key_rule": "Semantic Layer queries via API = **Semantic Layer permission set** on a service token. Service token only — cannot assign to users."}, {"id": "q06_Q14", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 14, "high_yield": false, "subdomain_id": "5.14", "subdomain_topic": "Who can create projects", "question_text": "Which of the following users can create a new dbt Cloud project? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "A user with the Account Admin role.", "B": "A user with the project-level Admin role.", "C": "A user with the Project Creator role.", "D": "A user with the Security Admin role.", "E": "A user with the Developer license and Analyst role."}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "**Account Admin** has full account-level access including project creation."}, "B": {"label": "❌ Incorrect", "text": "Project-level **Admin** cannot create new projects — it only manages existing ones. This is the most critical distinction between Admin and Account Admin."}, "C": {"label": "✅ Correct", "text": "**Project Creator** is an account-level role specifically designed to allow project creation and configuration without requiring full Account Admin access."}, "D": {"label": "❌ Incorrect", "text": "Security Admin manages users, groups, SSO, and IP restrictions — not project creation."}, "E": {"label": "❌ Incorrect", "text": "Neither the Developer license nor the Analyst role grants project creation ability."}}, "key_rule": "Create projects = **Account Admin** OR **Project Creator**. Project-level Admin cannot create new projects."}, {"id": "q06_Q15", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 15, "high_yield": false, "subdomain_id": "5.15", "subdomain_topic": "Service token rotation", "question_text": "A company wants to rotate an existing service token used in multiple integrations. What is the correct rotation procedure?", "is_multi_select": false, "options": {"A": "Click \"Rotate Token\" on the existing token — the value updates in place and integrations continue working.", "B": "Create a new service token → update all integrations with the new token value → delete the old token.", "C": "Edit the existing token → change the \"Expiry\" field to extend its validity → save.", "D": "Contact dbt Labs support to rotate the token cryptographically while preserving the existing value."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no in-place rotation — service tokens cannot be updated to generate a new value while maintaining the same token identifier."}, "B": {"label": "✅ Correct", "text": "Service tokens have **no in-place rotation mechanism**. The correct pattern is: create a new token → copy the value → update every integration that uses the old token → delete the old token. This zero-downtime rotation ensures continuous integration availability."}, "C": {"label": "❌ Incorrect", "text": "Service tokens don't have a user-configurable expiry field — and changing expiry wouldn't constitute rotation anyway."}, "D": {"label": "❌ Incorrect", "text": "Token rotation is a self-service operation in dbt Cloud — support is not involved."}}, "key_rule": "Token rotation = **create new → update integrations → delete old**. No in-place rotation."}, {"id": "q06_Q16", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 16, "high_yield": false, "subdomain_id": "5.16", "subdomain_topic": "Environment access vs permission set", "question_text": "A dbt Cloud admin configures a user group called \"Ops Team\" with the **Stakeholder** (read-only) permission set. A team lead then grants the Ops Team group **write access to the Production environment** (allowing job runs and run management). A member of the Ops Team successfully triggers a production job run. Is this expected behavior?", "is_multi_select": false, "options": {"A": "No — Stakeholder permission set prevents any job execution, including through environment write access.", "B": "Yes — environment write access (job/run operations) and permission set read-only are **independent controls**. A group can have read-only permissions but still be granted write access to specific environment types.", "C": "No — write access to the Production environment requires at least a Developer permission set.", "D": "Yes — but only because Stakeholder is a project-level role that doesn't apply to environment-level actions."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Stakeholder permission set restricts project/IDE/model access but does not automatically restrict environment-level job run operations."}, "B": {"label": "✅ Correct", "text": "**Environment write access** (the ability to create/manage runs and jobs within an environment type) and **permission set read-only** are **independent controls** in dbt Cloud. A group can hold a read-only permission set AND be granted write access to environment types. This means an Ops Team with Stakeholder permissions can still trigger production job runs if their group is granted environment write access — even without Developer-level project permissions."}, "C": {"label": "❌ Incorrect", "text": "There is no documented requirement that environment write access requires a Developer permission set."}, "D": {"label": "❌ Incorrect", "text": "The independence of these controls is not because of a scope distinction — it is by design in dbt Cloud's RBAC model."}}, "key_rule": "Environment write access (job/run ops) and permission set level are independent. Read-only permission set does not block environment write access."}, {"id": "q06_Q17", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 17, "high_yield": false, "subdomain_id": "5.17", "subdomain_topic": "SCIM sync timing and case sensitivity", "question_text": "An organization uses SCIM with Okta to manage dbt Cloud users. An admin renames a dbt Cloud group from `data-team` to `Data-Team` (capitalizing the D). The corresponding Okta group is still named `data-team` (lowercase). No members are immediately removed. Two weeks later, a user logs in and is unexpectedly removed from the `Data-Team` group in dbt. What are the two root causes?", "is_multi_select": false, "options": {"A": "SCIM syncs in real-time — the mismatch should have been detected immediately.", "B": "SCIM group name matching is **case-sensitive** — `data-team` and `Data-Team` are treated as different groups. SCIM syncs happen **on user login**, not in real-time, which is why the effect was delayed until the user next authenticated.", "C": "SCIM only syncs group membership changes, not group name changes — the rename is ignored entirely.", "D": "The delay was caused by a 14-day SCIM reconciliation cycle that runs automatically."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "SCIM does NOT sync in real-time — it syncs on user login."}, "B": {"label": "✅ Correct", "text": "Two root causes: (1) **Case sensitivity** — SCIM group names must match **exactly** between the IdP (Okta) and dbt Cloud. `data-team` ≠ `Data-Team`. When the user logs in, SCIM sees no matching Okta group named `Data-Team`, so the user is not mapped to it. (2) **Sync on login** — SCIM changes only propagate when the user next authenticates, not in real-time. The 2-week delay is explained by the user not having logged in during that period. Fix: ensure group names match exactly (case-sensitive) in both systems."}, "C": {"label": "❌ Incorrect", "text": "SCIM does process group name changes — the mismatch is interpreted as the user leaving one group and joining another."}, "D": {"label": "❌ Incorrect", "text": "There is no documented 14-day reconciliation cycle. SCIM sync is triggered by user login."}}, "key_rule": "SCIM group names = **case-sensitive** exact match. Sync happens **on user login** only — not real-time."}, {"id": "q06_Q18", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 18, "high_yield": false, "subdomain_id": "5.18", "subdomain_topic": "Analyst vs Developer role", "question_text": "A team lead needs to assign a role to a data analyst who needs to **write and run models in the dbt Cloud IDE** AND **view existing job run history** — but should NOT be able to create new jobs or edit existing ones. Which role is most appropriate?", "is_multi_select": false, "options": {"A": "Developer — they need IDE access and can view runs.", "B": "Analyst — they have IDE access, can run models interactively, and can view jobs/runs/environments without being able to create or edit jobs.", "C": "Job Viewer — specifically designed for viewing job run history.", "D": "Database Admin — provides read access to all platform configurations including job history."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Developer has IDE access but is explicitly designed for model builders — Developers cannot create/edit jobs, but the Analyst role is the better fit here as it explicitly includes the ability to view jobs/runs/environments as part of its scope."}, "B": {"label": "✅ Correct", "text": "**Analyst** is the correct role. Analysts have: IDE access (write and run models), the ability to view jobs/runs/environments, but **cannot create jobs or edit environments**. This exactly matches the requirement. Developer is similar but Analyst's design intent is for data consumers who need IDE access plus observability into job outcomes — not job management."}, "C": {"label": "❌ Incorrect", "text": "Job Viewer has no IDE access — they can only view job results and logs, not write or run models."}, "D": {"label": "❌ Incorrect", "text": "Database Admin manages platform configurations and has no IDE access for writing dbt code."}}, "key_rule": "Analyst = IDE access + view jobs/runs/environments. Cannot create/edit jobs. Developer = IDE + personal credentials. Job Viewer = read-only job results, no IDE."}, {"id": "q06_Q19", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 19, "high_yield": false, "subdomain_id": "5.19", "subdomain_topic": "Default group auto-add behavior", "question_text": "A company discovers that every new user invited to their dbt Cloud account automatically gains read access to all projects in the account. An admin investigates and finds no explicit project permission assignments. What is the most likely cause?", "is_multi_select": false, "options": {"A": "dbt Cloud grants all users read access by default — this must be manually revoked per project.", "B": "New users are automatically added to both the **Member** and **Everyone** groups, which are configured with broad default permissions including project read access.", "C": "New users inherit the permissions of the user who invited them.", "D": "The account is on Developer plan, which grants all users full read access."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt Cloud does not grant read access as a platform default. The auto-add behavior of default groups is the mechanism."}, "B": {"label": "✅ Correct", "text": "New users in dbt Cloud are automatically added to **both the Member group AND the Everyone group** by default. These two default groups typically have broad permissions that may include project read access. Since both Member and Everyone have \"Add all new users by default\" enabled, any new invite immediately inherits both groups' permissions. The fix: customize Member and Everyone permissions, or disable \"Add all new users by default\" on both groups to enforce proper RBAC isolation."}, "C": {"label": "❌ Incorrect", "text": "Permissions are not inherited from the inviting user."}, "D": {"label": "❌ Incorrect", "text": "Plan tier does not grant blanket read access. The default group behavior is plan-agnostic."}}, "key_rule": "New users auto-join **both Member AND Everyone** groups. Disable \"Add all new users by default\" on both to enforce RBAC isolation."}, {"id": "q06_Q20", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 20, "high_yield": false, "subdomain_id": "5.20", "subdomain_topic": "Owner group immutability", "question_text": "A dbt Cloud Account Admin attempts to remove the Account Admin permission set from the **Owner group** to limit what account owners can do. They find the option is greyed out. Why?", "is_multi_select": false, "options": {"A": "The Owner group permissions can only be changed by dbt Labs support, not by account admins.", "B": "The Owner group has **immutable permissions** — they cannot be changed by anyone, including Account Admins. This is by design to ensure the account always has at least one fully-privileged group.", "C": "The Owner group permissions are locked until all Owner members approve the change via a majority vote workflow.", "D": "The Owner group is a managed group — it can only be edited during the initial account setup period."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "This is not a support escalation scenario. The immutability is a product constraint, not an access control issue."}, "B": {"label": "✅ Correct", "text": "The **Owner group** in dbt Cloud has **immutable permissions** — its permission sets cannot be changed by anyone, including Account Admins. This is intentional: the Owner group always retains full Account Admin access to ensure the account always has at least one group capable of managing everything. Contrast with the Member and Everyone groups, which are mutable and can be customized."}, "C": {"label": "❌ Incorrect", "text": "There is no majority vote or approval workflow for group permission changes in dbt Cloud."}, "D": {"label": "❌ Incorrect", "text": "There is no \"initial account setup period\" after which groups become locked. The Owner group is permanently immutable."}}, "key_rule": "Owner group = **immutable permissions**. Cannot be changed by anyone. Member and Everyone groups are mutable."}, {"id": "q06_Q21", "file_id": "q06", "topic_num": "5", "topic_name": "Security & Licenses", "question_num": 21, "high_yield": true, "subdomain_id": "5.21", "subdomain_topic": "PAT vs Service Token in production", "question_text": "A dbt Cloud Account Admin notices that a critical production CI/CD job has been failing with `401 Unauthorized` for the past 24 hours. Investigation shows:\n\n- The job authenticates against the dbt Cloud API using a token created by a senior data engineer who left the company two days ago.\n- The engineer's user account was deactivated as part of standard offboarding.\n- No one rotated the token before the engineer's departure.\n\nWhat kind of token was almost certainly in use, and what is the correct architectural fix? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The token was a **personal access token (PAT)** — PATs are tied to a specific user and inherit that user's permissions. When the user is deactivated, all of their PATs are revoked, breaking any integration that depended on them.", "B": "The token was a **service token** — service tokens are tied to the user who created them and die when that user is deactivated.", "C": "The correct fix is to replace the PAT with a **service token** scoped to the minimum permission set needed for the job (e.g., Job Admin on the relevant project plus Read-Only as needed). Service tokens are account-level and persist independently of any individual user.", "D": "The correct fix is to reactivate the engineer's account and grant their PAT to a different user via the \"Transfer PAT ownership\" workflow.", "E": "The correct fix is to add the new user to the same RBAC group as the departed engineer — this automatically restores any PATs created under the old account."}, "correct_answers": ["A", "C"], "explanations": {"A": {"label": "✅ Correct", "text": "This is the canonical \"production job fails after employee X leaves\" trap. **PATs are tied to a specific user** and inherit the user's license + group permissions. When the user is deactivated, **all of their PATs are revoked simultaneously**. PATs should never be used to authenticate production automation for exactly th
