<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dbt Architect Exam Quiz</title>
<style>
:root {
  --c-correct: #16a34a;
  --c-correct-bg: #f0fdf4;
  --c-wrong: #dc2626;
  --c-wrong-bg: #fef2f2;
  --c-sel: #2563eb;
  --c-sel-bg: #eff6ff;
  --c-rule-bg: #fefce8;
  --c-rule-border: #ca8a04;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #f3f4f6;
  min-height: 100vh;
  color: #111827;
  line-height: 1.5;
}
#header {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid #e5e7eb;
  padding: 10px 16px;
  z-index: 100;
}
.header-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  max-width: 820px;
  margin-left: auto;
  margin-right: auto;
}
.score-badge {
  font-size: 13px;
  font-weight: 600;
  color: #374151;
  white-space: nowrap;
  min-width: 130px;
}
.progress-wrap {
  flex: 1;
  height: 6px;
  background: #e5e7eb;
  border-radius: 3px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: #2563eb;
  border-radius: 3px;
  transition: width 0.3s ease;
  width: 0%;
}
.header-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  max-width: 820px;
  margin: 0 auto;
  flex-wrap: wrap;
}
#filter-select {
  flex: 1;
  min-width: 180px;
  padding: 5px 10px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  cursor: pointer;
  color: #374151;
}
#shuffle-btn {
  padding: 5px 14px;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 13px;
  background: #fff;
  cursor: pointer;
  color: #374151;
  white-space: nowrap;
  transition: background 0.15s, color 0.15s;
}
#shuffle-btn.on { background: #2563eb; color: #fff; border-color: #2563eb; }
#main {
  max-width: 820px;
  margin: 20px auto 80px;
  padding: 0 16px;
}
.card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
  padding: 28px 28px 24px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.topic-pill {
  font-size: 11px;
  font-weight: 500;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  border-radius: 999px;
  padding: 2px 10px;
  color: #6b7280;
}
.star-badge {
  font-size: 11px;
  font-weight: 600;
  background: #fef9c3;
  border: 1px solid #fde047;
  border-radius: 999px;
  padding: 2px 8px;
  color: #713f12;
}
.q-counter {
  margin-left: auto;
  font-size: 13px;
  color: #9ca3af;
  font-weight: 500;
}
.subdomain {
  font-size: 11px;
  color: #9ca3af;
  margin-bottom: 14px;
  font-style: italic;
}
.question-text {
  font-size: 15px;
  line-height: 1.65;
  color: #111827;
  margin-bottom: 20px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 18px;
}
.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  border: 2px solid #e5e7eb;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  color: #111827;
  transition: border-color 0.12s, background 0.12s;
  font-family: inherit;
}
.opt:hover:not([disabled]) { border-color: #93c5fd; background: #f0f7ff; }
.opt[disabled] { cursor: default; }
.opt-letter { font-weight: 700; min-width: 18px; color: #9ca3af; flex-shrink: 0; }
.opt.selected { border-color: var(--c-sel); background: var(--c-sel-bg); }
.opt.selected .opt-letter { color: var(--c-sel); }
.opt.correct { border-color: var(--c-correct); background: var(--c-correct-bg); }
.opt.correct .opt-letter { color: var(--c-correct); }
.opt.wrong-sel { border-color: var(--c-wrong); background: var(--c-wrong-bg); }
.opt.wrong-sel .opt-letter { color: var(--c-wrong); }
.action-row { display: flex; align-items: center; gap: 12px; }
.btn-submit {
  padding: 9px 22px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-submit:hover:not([disabled]) { background: #1d4ed8; }
.btn-submit[disabled] { background: #9ca3af; cursor: default; }
.select-hint { font-size: 13px; color: #9ca3af; }
.divider { border: none; border-top: 1px solid #f3f4f6; margin: 20px 0; }
.expl-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.expl-item { border-radius: 8px; padding: 11px 14px; border-left: 3px solid transparent; }
.expl-item.correct { background: var(--c-correct-bg); border-left-color: var(--c-correct); }
.expl-item.wrong-sel { background: var(--c-wrong-bg); border-left-color: var(--c-wrong); }
.expl-item.neutral { background: #f9fafb; border-left-color: #e5e7eb; }
.expl-head { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.expl-text { font-size: 13px; color: #374151; line-height: 1.5; }
.key-rule {
  background: var(--c-rule-bg);
  border-left: 4px solid var(--c-rule-border);
  border-radius: 8px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.55;
  margin-bottom: 16px;
}
.btn-next {
  padding: 9px 22px;
  background: #16a34a;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.12s;
}
.btn-next:hover:not([disabled]) { background: #15803d; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.kbd-hint { text-align: center; font-size: 11px; color: #d1d5db; margin-top: 14px; }
.end-wrap { text-align: center; padding: 60px 24px; }
.end-score { font-size: 56px; font-weight: 700; line-height: 1; color: #111827; margin-bottom: 8px; }
.end-pct { font-size: 28px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
.end-sub { font-size: 15px; color: #9ca3af; margin-bottom: 32px; }
.btn-restart {
  padding: 12px 36px;
  background: #2563eb;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.btn-restart:hover { background: #1d4ed8; }
code {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  font-size: 0.875em;
  background: #f3f4f6;
  border: 1px solid #e5e7eb;
  border-radius: 3px;
  padding: 1px 4px;
}
strong { font-weight: 600; }
a { color: #2563eb; }
</style>
</head>
<body>

<div id="header">
  <div class="header-top">
    <span class="score-badge" id="score-badge">Score: —</span>
    <div class="progress-wrap">
      <div class="progress-bar" id="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
  </div>
  <div class="header-controls">
    <label for="filter-select" class="sr-only">Filter questions</label>
    <select id="filter-select"></select>
    <button id="shuffle-btn" aria-pressed="false">Shuffle: OFF</button>
  </div>
</div>

<div id="main">
  <div class="card" id="card"></div>
  <div class="kbd-hint" id="kbd-hint"></div>
</div>

<script>
const ALL_QUESTIONS = [{"id": "q01_Q1", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 1, "high_yield": false, "subdomain_id": "1.1", "subdomain_topic": "Snowflake account identifier format", "question_text": "A developer sets up a new Snowflake connection in dbt Cloud. They enter `db5261993.snowflakecomputing.com` as the account identifier. The connection test fails. What is the most likely cause?", "is_multi_select": false, "options": {"A": "The user account does not have the required `USAGE` privilege on the warehouse.", "B": "The dbt Cloud IP addresses are not whitelisted in Snowflake's network policy.", "C": "The Account value still includes the `snowflakecomputing.com` domain.", "D": "The Snowflake warehouse is suspended and needs to be resumed before dbt can connect."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Missing privileges would cause permission errors on specific operations, not a connection-level failure."}, "B": {"label": "❌ Incorrect", "text": "A blocked IP is a different problem. The docs name the Account value as the most common cause."}, "C": {"label": "✅ Correct", "text": "Use `db5261993` or `db5261993.east-us-2.azure`, not the full `.snowflakecomputing.com` domain. The docs say the most common cause of a failed connection test is an Account value that still includes `snowflakecomputing.com`."}, "D": {"label": "❌ Incorrect", "text": "A suspended warehouse is not what the docs name as the most common cause."}}, "key_rule": "Snowflake account ID = locator format only (`db5261993.east-us-2.azure`). Never use the full `.snowflakecomputing.com` URL."}, {"id": "q01_Q2", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 2, "high_yield": false, "subdomain_id": "1.2", "subdomain_topic": "IP allowlisting", "question_text": "A team allowlists dbt IP addresses in their warehouse firewall. The docs warn that those IPs can change occasionally. What do the docs recommend as the stable reference?", "is_multi_select": false, "options": {"A": "dbt platform hostnames (for example `abc123.us1.dbt.com`).", "B": "Allowlist the cloud provider's entire IP range.", "C": "Re-check the IP list every quarter.", "D": "Switch to PrivateLink on the Starter plan."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say to use dbt platform hostnames, which stay consistent even if the underlying IPs change."}, "B": {"label": "❌ Incorrect", "text": "Not a documented recommendation."}, "C": {"label": "❌ Incorrect", "text": "Not a documented recommendation."}, "D": {"label": "❌ Incorrect", "text": "Private connectivity is for Enterprise+ and Virtual Private plans, not Starter."}}, "key_rule": "Multi-tenant IPs are listed per region (Project Settings → Connection → Settings). They can change occasionally, so use hostnames as the stable reference. Single-tenant: ask Support for your IPs."}, {"id": "q01_Q3", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 3, "high_yield": false, "subdomain_id": "1.3", "subdomain_topic": "PrivateLink", "question_text": "Which statements about dbt's private connectivity (PrivateLink) are correct? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "It connects dbt to your warehouse without traversing the public internet.", "B": "Private endpoint settings can be set with environment variables.", "C": "It is available on all plans including Starter.", "D": "dbt and the data platform must be hosted on the same cloud provider.", "E": "It automatically configures IP allowlisting in your warehouse."}, "correct_answers": ["A", "D"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs describe it as connectivity between dbt and your data platform without traversing the public internet."}, "B": {"label": "❌ Incorrect", "text": "Environment variables aren't supported for private endpoint settings. Use extended attributes."}, "C": {"label": "❌ Incorrect", "text": "Private connectivity is for **Enterprise+** and **Virtual Private** plans."}, "D": {"label": "✅ Correct", "text": "Both dbt and the server (like Snowflake) must be on the same cloud provider. dbt on AWS can't reach a service on Azure."}, "E": {"label": "❌ Incorrect", "text": "Not documented. The docs don't say it changes IP allowlisting."}}, "key_rule": "Private connectivity = Enterprise+ / Virtual Private, same cloud on both sides. With ingress PrivateLink or IP allowlisting, CI hooks may be unavailable and CI can fail silently."}, {"id": "q01_Q4", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 4, "high_yield": true, "subdomain_id": "1.4", "subdomain_topic": "Snowflake key pair errors", "question_text": "A team configures Snowflake key pair authentication. The connection fails with the error \"Could not deserialize key data.\" What is the most likely cause?", "is_multi_select": false, "options": {"A": "The public key wasn't set on the Snowflake user.", "B": "The private key was pasted incorrectly, for example missing dashes or the BEGIN/END lines.", "C": "The passphrase is too long.", "D": "Key pair authentication isn't supported for Snowflake in dbt."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "A wrong or missing public key points to a `JWT token is invalid` error instead."}, "B": {"label": "✅ Correct", "text": "The docs say this error usually comes from mistakes like not copying correctly, missing dashes, or leaving out the commented lines. Verify the key in a text editor before pasting."}, "C": {"label": "❌ Incorrect", "text": "Not a documented cause."}, "D": {"label": "❌ Incorrect", "text": "Key pair is the default for new Snowflake credentials, in development and deployment."}}, "key_rule": "\"Could not deserialize key data\" = bad paste (missing dashes / BEGIN-END lines). dbt v2 (Fusion) wants PKCS#8 + AES-256 and doesn't support 3DES or headerless keys. The private key can't come from an env var."}, {"id": "q01_Q5", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 5, "high_yield": false, "subdomain_id": "1.5", "subdomain_topic": "Connections are account-level", "question_text": "An organization has three dbt Cloud projects: `sales`, `marketing`, and `finance`. They want `sales` and `marketing` to use the same Snowflake account but with different warehouse names. Which of the following is true?", "is_multi_select": false, "options": {"A": "The connection must be duplicated per project, but the credentials can be the same.", "B": "Connections are project-level, so `sales` and `marketing` will automatically use different connections.", "C": "Each project must have its own dedicated connection — connections cannot be shared across projects.", "D": "A single connection can be shared across multiple projects; environment-level settings control warehouse overrides."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no need to duplicate connections. The same connection object is referenced by multiple projects."}, "B": {"label": "❌ Incorrect", "text": "Connections are account-level, not project-level. Multiple projects can and do share the same connection."}, "C": {"label": "❌ Incorrect", "text": "This is the opposite of how dbt Cloud works. Connections are account-level and are explicitly designed to be shared."}, "D": {"label": "✅ Correct", "text": "Connections are **account-level** — shared across multiple projects. Different projects (or different environments within a project) can override warehouse-level settings at the environment level without needing separate connections."}}, "key_rule": "Connections are **account-level** (not project-level) — shared across projects. Each environment references exactly one connection."}, {"id": "q01_Q6", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 6, "high_yield": false, "subdomain_id": "1.6", "subdomain_topic": "BigQuery OAuth limitations", "question_text": "A team on a Starter plan wants to configure OAuth authentication for their BigQuery connection so developers can use their personal Google accounts in the dbt Cloud IDE. Will this work?", "is_multi_select": false, "options": {"A": "Yes — BigQuery OAuth is available on all plans including Starter.", "B": "No — BigQuery OAuth requires Enterprise tier and is unavailable on Starter.", "C": "Yes — OAuth works for IDE use on Starter but not for production jobs.", "D": "No — BigQuery does not support OAuth; only service account JSON files are supported."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "BigQuery OAuth in dbt Cloud is plan-gated — it is not available on Starter."}, "B": {"label": "✅ Correct", "text": "BigQuery OAuth is available for **development environments on Enterprise-tier plans only**. Starter teams use a service JSON keyfile."}, "C": {"label": "❌ Incorrect", "text": "There is no Starter-with-IDE-only exception. The restriction is plan-level regardless of environment type."}, "D": {"label": "❌ Incorrect", "text": "BigQuery does support OAuth in dbt Cloud — it's just gated to Enterprise plans."}}, "key_rule": "BigQuery OAuth = development only, Enterprise tier. After org setup, each user connects under **Credentials → Native OAuth**."}, {"id": "q01_Q7", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 7, "high_yield": true, "subdomain_id": "1.7", "subdomain_topic": "Adding the OAuth Client ID and Secret", "question_text": "An Enterprise team has created a BigQuery OAuth client in Google Cloud. Where do they add the client ID and secret in dbt?", "is_multi_select": false, "options": {"A": "Account settings → Connections → the BigQuery connection → OAuth 2.0 Settings.", "B": "Account settings → Integrations.", "C": "An environment variable.", "D": "Each developer's Credentials page."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "Add the client ID and secret under **OAuth 2.0 Settings** on the connection. The token URI default is `https://oauth2.googleapis.com/token`. The Redirect URI you give Google comes from the connection's Development OAuth section."}, "B": {"label": "❌ Incorrect", "text": "Integrations is where Git providers go, not warehouse OAuth."}, "C": {"label": "❌ Incorrect", "text": "Not documented."}, "D": {"label": "❌ Incorrect", "text": "Developers use their Credentials page afterwards, to connect with Native OAuth."}}, "key_rule": "Client ID + Secret go on the **connection** (Account settings → Connections). Snowflake works the same way: edit the connection and enter them. Both need Enterprise/Enterprise+."}, {"id": "q01_Q8", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 8, "high_yield": false, "subdomain_id": "1.8", "subdomain_topic": "Managed repositories", "question_text": "An architect is reviewing a team's setup. They find that a dbt Cloud project in active production use is configured with a managed (dbt-hosted) repository instead of a self-hosted Git repository. Which of the following is the primary concern?", "is_multi_select": false, "options": {"A": "Managed repositories are only available on Enterprise plans.", "B": "Managed repositories cannot be connected to CI jobs.", "C": "Managed repositories can't use Git features like pull requests, and dbt Labs recommends against them in production.", "D": "Managed repositories cannot store dbt models larger than 100MB."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Plan availability isn't the documented concern."}, "B": {"label": "❌ Incorrect", "text": "CI jobs are not the primary concern — the bigger issues are the lack of code review workflows, branching, and version history."}, "C": {"label": "✅ Correct", "text": "The docs describe managed repositories as a way to trial dbt. You can't use Git features like pull requests, and dbt Labs recommends against using one in production."}, "D": {"label": "❌ Incorrect", "text": "File size limits are not a documented concern with managed repositories."}}, "key_rule": "Managed repos = for trials. No pull requests. dbt Labs recommends against production. You can export any time."}, {"id": "q01_Q9", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 9, "high_yield": false, "subdomain_id": "1.9", "subdomain_topic": "Snowflake authentication methods", "question_text": "A team tries to create new Snowflake credentials in dbt using username and password. What happens?", "is_multi_select": false, "options": {"A": "It works for deployment credentials only.", "B": "It works for development credentials only.", "C": "It works, with MFA enforced.", "D": "It isn't allowed. Key pair is the default for new development and deployment credentials."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not for new credentials. Deployment uses key pair."}, "B": {"label": "❌ Incorrect", "text": "Not for new credentials. Snowflake OAuth is the development-only option (Enterprise)."}, "C": {"label": "❌ Incorrect", "text": "New username/password credentials can't be created."}, "D": {"label": "✅ Correct", "text": "The docs say you cannot create new Snowflake credentials with username and password. New credentials default to key pair."}}, "key_rule": "New = key pair (dev + deploy) or Snowflake OAuth (dev only, Enterprise). Existing username/password + MFA credentials remain, but can't be saved until switched. MFA uses `authenticator: username_password_mfa` in the dev environment."}, {"id": "q01_Q10", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 10, "high_yield": false, "subdomain_id": "1.10", "subdomain_topic": "Databricks connector", "question_text": "A data platform team has been running dbt models on Databricks using the `dbt-spark` connector for 18 months. They're upgrading to use Unity Catalog and Python models. What changes must they make? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "Migrate from `dbt-spark` to `dbt-databricks` — `dbt-spark` is deprecated.", "B": "Upgrade to dbt version 1.3+ for Python model support.", "C": "Upgrade to dbt version 2.0+ for Python model support.", "D": "Unity Catalog requires a Databricks Premium or Enterprise workspace tier.", "E": "Upgrade to dbt version 1.6+ for Unity Catalog support."}, "correct_answers": ["A", "B"], "explanations": {"A": {"label": "✅ Correct", "text": "`dbt-spark` is **deprecated**. All Databricks projects must migrate to `dbt-databricks`. This is required regardless of Unity Catalog usage."}, "B": {"label": "✅ Correct", "text": "Python models are available starting with **dbt 1.3**."}, "C": {"label": "❌ Incorrect", "text": "Python models require dbt 1.3+, not 2.0+."}, "D": {"label": "❌ Incorrect", "text": "Unity Catalog workspace tier requirements are a Databricks-side concern, not a dbt-side version constraint."}, "E": {"label": "❌ Incorrect", "text": "Unity Catalog is available starting with dbt 1.1. There is no 1.6 requirement."}}, "key_rule": "Databricks: `dbt-spark` → deprecated. Unity Catalog = dbt 1.1+. Python models = dbt 1.3+."}, {"id": "q01_Q11", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 11, "high_yield": false, "subdomain_id": "1.11", "subdomain_topic": "Existing password credentials", "question_text": "A Snowflake deployment environment still uses username/password credentials. An admin wants to edit and save them. What must happen first?", "is_multi_select": false, "options": {"A": "Nothing. Password credentials can be edited freely.", "B": "Enable PrivateLink.", "C": "Add `authenticator: username_password_mfa` to extended attributes.", "D": "Switch the Auth method to key pair (or OAuth). Password credentials can't be saved."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say you can view existing password credentials but can't save changes until you switch the Auth method."}, "B": {"label": "❌ Incorrect", "text": "Unrelated to authentication."}, "C": {"label": "❌ Incorrect", "text": "That attribute is for MFA with username/password in the dev environment. It doesn't let you save."}, "D": {"label": "✅ Correct", "text": "Switch to key pair. Snowflake OAuth is development-only."}}, "key_rule": "Password credentials are legacy. Key pair is the default for new dev and deploy credentials."}, {"id": "q01_Q12", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 12, "high_yield": false, "subdomain_id": "1.12", "subdomain_topic": "OAuth vs deployment credentials", "question_text": "Developers use BigQuery OAuth in the IDE. How does a production job authenticate to BigQuery?", "is_multi_select": false, "options": {"A": "With a native OAuth login shared by all users.", "B": "With a service JSON keyfile (or Workload Identity Federation on Enterprise) set on the connection.", "C": "With a dbt service token.", "D": "With the developer's OAuth token."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "OAuth is per user. Service-to-service OAuth isn't supported."}, "B": {"label": "✅ Correct", "text": "Deployment environments use Service JSON, or Workload Identity Federation (Enterprise, Entra ID only)."}, "C": {"label": "❌ Incorrect", "text": "Service tokens authenticate to the dbt API for system-level integrations. They don't log in to the warehouse."}, "D": {"label": "❌ Incorrect", "text": "Native OAuth applies to development. Every developer connects with their own account."}}, "key_rule": "OAuth = development, per user. Deployment = service JSON / WIF (BigQuery) or key pair (Snowflake). Service tokens are for the dbt API."}, {"id": "q01_Q13", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 13, "high_yield": false, "subdomain_id": "1.13", "subdomain_topic": "Snowflake custom domain", "question_text": "A company uses a custom vanity domain (`analytics.company.com`) for their Snowflake account instead of the standard locator URL. A developer configures the dbt Cloud connection using `analytics.company.com` in the Account field. The connection test fails. What is the correct way to configure this?", "is_multi_select": false, "options": {"A": "Enter the locator-format account ID in the Account field and add `host: https://analytics.company.com` as an extended attribute on the environment.", "B": "Custom domains are not supported in dbt Cloud Snowflake connections — the locator format must always be used directly.", "C": "Contact Snowflake support to get the locator-format account ID that maps to the custom domain.", "D": "Use the full URL `https://analytics.company.com` in the Account field."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "For Snowflake custom domains, the **Account field** must still contain the locator-format account ID. The custom domain is specified separately using the extended attribute `host: https://your_custom_domain.com` on the environment. Both pieces are needed."}, "B": {"label": "❌ Incorrect", "text": "Custom domains are supported — they require the `host` extended attribute alongside the locator-format account ID."}, "C": {"label": "❌ Incorrect", "text": "While the locator ID exists, Snowflake custom domains can be configured in dbt without needing to abandon the custom domain."}, "D": {"label": "❌ Incorrect", "text": "The Account field takes a locator-style value, not a full HTTPS URL. The custom domain goes in the `host` attribute."}}, "key_rule": "Snowflake custom domain = locator ID in Account field + `host: https://custom_domain.com` in extended attributes."}, {"id": "q01_Q14", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 14, "high_yield": false, "subdomain_id": "1.14", "subdomain_topic": "Snowflake minimum permissions", "question_text": "A new Snowflake service account is created for dbt Cloud. An admin grants only `USAGE` on the warehouse, database, and schema, plus `SELECT` on all tables. After connecting successfully, the dbt jobs fail when trying to materialize models. What is the most likely missing permission?", "is_multi_select": false, "options": {"A": "`MONITOR` on the warehouse — required to track query execution.", "B": "`OWNERSHIP` on the target schema — required for model creation.", "C": "`CREATE TABLE` and `CREATE VIEW` on the schema — required for dbt to materialize models.", "D": "`SYSADMIN` role — required for dbt to manage schemas."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`MONITOR` on the warehouse is not in the documented minimum permission set for dbt."}, "B": {"label": "❌ Incorrect", "text": "`OWNERSHIP` is also overly permissive. dbt only needs specific DML/DDL grants, not ownership."}, "C": {"label": "✅ Correct", "text": "`SELECT` alone is insufficient. dbt materializes models by creating or replacing tables and views. The minimum permissions include `USAGE` on warehouse/database/schema **plus** `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `INSERT`, `UPDATE`, `DELETE`, `TRUNCATE`, and `DROP` on the schema. Without `CREATE TABLE` and `CREATE VIEW`, model materialization fails."}, "D": {"label": "❌ Incorrect", "text": "`SYSADMIN` is far more permissive than needed and is not a documented requirement. A purpose-built role with specific grants is the best practice."}}, "key_rule": "Snowflake minimum = `USAGE` (warehouse/DB/schema) + `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `INSERT`, `UPDATE`, `DELETE`, `TRUNCATE`, `DROP`."}, {"id": "q01_Q15", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 15, "high_yield": false, "subdomain_id": "1.15", "subdomain_topic": "BigQuery OAuth setup flow", "question_text": "An Enterprise-tier team successfully configures BigQuery OAuth at the organization level in dbt Cloud Account Settings. A developer on the team opens the dbt Cloud IDE but gets an authentication error even though the org-level OAuth app is configured. What step is the developer missing?", "is_multi_select": false, "options": {"A": "The developer must connect their own BigQuery account under Credentials (Native OAuth → Connect to BigQuery).", "B": "The developer must log out and back in so dbt Cloud re-reads the org-level OAuth configuration.", "C": "The developer must request an IT admin to link their account — individual users cannot complete this step themselves.", "D": "The developer must be assigned the Database Admin permission set before OAuth becomes active for their profile."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The org-level setup is step one. With BigQuery OAuth on, every developer must authenticate with BigQuery to use dev tools like the IDE: Account settings → Credentials → pick the project → Authentication Method = Native OAuth → Connect to BigQuery."}, "B": {"label": "❌ Incorrect", "text": "Logging out does not trigger the personal OAuth linking flow. The developer must explicitly connect under Credentials."}, "C": {"label": "❌ Incorrect", "text": "Individual developers complete this step themselves in their own profile — it is not an admin-delegated action."}, "D": {"label": "❌ Incorrect", "text": "Not a documented requirement."}}, "key_rule": "BigQuery OAuth = two steps: (1) admin adds the client ID/secret on the connection; (2) each developer connects under Credentials → Native OAuth."}, {"id": "q01_Q16", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 16, "high_yield": false, "subdomain_id": "1.16", "subdomain_topic": "Databricks Unity Catalog permissions", "question_text": "A team moves a Databricks project to Unity Catalog. Which privileges does the Databricks user or service principal need?", "is_multi_select": false, "options": {"A": "`USAGE` and `SELECT` only.", "B": "Ownership of the metastore.", "C": "`SYSADMIN`.", "D": "`USE CATALOG`, `USE SCHEMA`, `SELECT`, `CREATE TABLE`, `CREATE VIEW` and `MODIFY` (plus `CREATE SCHEMA` if dbt creates schemas)."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "`USAGE` is a Hive metastore privilege, and `SELECT` alone can't create tables or views."}, "B": {"label": "❌ Incorrect", "text": "Not a documented requirement."}, "C": {"label": "❌ Incorrect", "text": "`SYSADMIN` is a Snowflake role, not a Databricks privilege."}, "D": {"label": "✅ Correct", "text": "That is the documented Unity Catalog list."}}, "key_rule": "Unity Catalog = `USE CATALOG`, `USE SCHEMA`, `SELECT`, `CREATE TABLE`, `CREATE VIEW`, `MODIFY`. Hive metastore = `USAGE`, `SELECT`, `CREATE`, `MODIFY`."}, {"id": "q01_Q17", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 17, "high_yield": false, "subdomain_id": "1.17", "subdomain_topic": "Databricks required connection fields", "question_text": "An architect is documenting the minimum required fields for a Databricks connection in dbt Cloud. Which two fields are always required regardless of whether Unity Catalog is used?", "is_multi_select": false, "options": {"A": "HTTP Path and Token", "B": "Server Hostname and HTTP Path", "C": "Server Hostname and Catalog", "D": "Catalog and Token"}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "HTTP Path + Token alone are insufficient — Server Hostname is also required and is one of the two most fundamental fields."}, "B": {"label": "✅ Correct", "text": "**Server Hostname** (the Databricks workspace URL) and **HTTP Path** (the SQL warehouse or cluster endpoint) are always required for any Databricks connection. The Token (personal access token or service principal credential) is also required for authentication, but Catalog is optional and only used for Unity Catalog."}, "C": {"label": "❌ Incorrect", "text": "Catalog is **optional** — it is only needed when using Unity Catalog. It is not a required field."}, "D": {"label": "❌ Incorrect", "text": "Catalog is optional, and Token alone without Server Hostname and HTTP Path is not sufficient to establish a connection."}}, "key_rule": "Databricks required fields = **Server Hostname** + **HTTP Path**. Catalog is optional (Unity Catalog only). Token is required for auth."}, {"id": "q01_Q18", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 18, "high_yield": false, "subdomain_id": "1.18", "subdomain_topic": "Platform-specific editable environment fields", "question_text": "A team uses Redshift as their data warehouse. An architect wants to use the environment UI to override the schema that a production deployment job writes to, separate from the connection-level schema. They navigate to the environment settings but find no editable schema field. What is the correct approach?", "is_multi_select": false, "options": {"A": "Redshift schema overrides must be set at the job level using environment variables, not at the environment level.", "B": "Redshift connections require the schema to be defined at the connection level — it cannot be overridden per environment.", "C": "Redshift environment settings have no editable connection fields in the UI; schema overrides must be done via extended attributes on the environment.", "D": "The schema field is hidden by default — enable \"Advanced mode\" in the environment settings to reveal it."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "While job-level environment variables can influence schema naming via custom macros, the canonical override mechanism at the environment level is extended attributes."}, "B": {"label": "❌ Incorrect", "text": "Redshift schemas can be overridden per environment — just not via a UI field. Extended attributes are the mechanism."}, "C": {"label": "✅ Correct", "text": "For **Postgres, Redshift, BigQuery, and Spark**, the environment UI has **no editable connection fields** — all settings are inferred from the project connection. To override values like schema, use **extended attributes** (a YAML snippet in the environment settings that overrides `profiles.yml` top-level keys). Snowflake is the exception — it exposes Role, Database, and Warehouse as editable fields directly in the environment UI."}, "D": {"label": "❌ Incorrect", "text": "There is no \"Advanced mode\" toggle that reveals hidden Redshift environment fields."}}, "key_rule": "Snowflake = editable Role/Database/Warehouse in environment UI. Postgres/Redshift/BigQuery/Spark = no UI fields; use extended attributes."}, {"id": "q01_Q19", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 19, "high_yield": false, "subdomain_id": "1.19", "subdomain_topic": "Single-warehouse constraint per job", "question_text": "An architect proposes a dbt Cloud architecture where a single production job writes transformed models to both a Snowflake data warehouse and a Redshift warehouse simultaneously, using two separate connections defined in the same project. Is this possible?", "is_multi_select": false, "options": {"A": "No — each environment references exactly one connection, and a single job cannot write to two warehouses simultaneously.", "B": "Yes — but only on Enterprise+ plan where multiple connections per job are supported.", "C": "Yes — dbt Cloud supports multi-warehouse jobs by specifying multiple target profiles in the job configuration.", "D": "No — but the same job can write to two schemas within the same warehouse using the `schema` config on individual models."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "A dbt Cloud environment references **exactly one connection**, and a job runs in exactly one environment. Therefore, a single job cannot write to two different warehouses simultaneously. Different environments (e.g., dev on Snowflake, prod on Redshift) can use different connections, but each environment is single-warehouse."}, "B": {"label": "❌ Incorrect", "text": "Multi-warehouse jobs are not a feature on any dbt Cloud plan."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not support specifying multiple target profiles for a single job. Each job runs against one environment, which has one connection."}, "D": {"label": "❌ Incorrect", "text": "While models can write to different schemas within one warehouse, this answer sidesteps the actual question about cross-warehouse writes, which remain unsupported."}}, "key_rule": "One environment = one connection = one warehouse. A single job cannot write to two warehouses simultaneously."}, {"id": "q01_Q20", "file_id": "q01", "topic_num": "1", "topic_name": "Warehouse Connections", "question_num": 20, "high_yield": false, "subdomain_id": "1.20", "subdomain_topic": "Managed repository migration", "question_text": "A startup prototyped on a dbt-managed repository and is now ready for production. Which of the following is NOT a valid reason to move away from it?", "is_multi_select": false, "options": {"A": "You can't use Git features like pull requests.", "B": "It can't be exported to a self-hosted Git provider.", "C": "dbt Labs recommends against using a managed repository in production.", "D": "It is meant for trying dbt without your own repository."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Not the answer", "text": "This is a valid reason. The docs say you can't use Git features like pull requests."}, "B": {"label": "✅ Correct (NOT a valid reason)", "text": "The docs say you can export the repository from dbt at any time (project settings → repo link → Deploy key → Download repository)."}, "C": {"label": "❌ Not the answer", "text": "This is a valid reason. The docs say so directly."}, "D": {"label": "❌ Not the answer", "text": "This is a valid reason. The docs call it a way to trial dbt."}}, "key_rule": "Managed repo = trial, no pull requests, not recommended for production, but you can export it any time."}, {"id": "q02_Q1", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 1, "high_yield": true, "subdomain_id": "2.1", "subdomain_topic": "GitLab personal repos", "question_text": "A developer on a team sets up a GitLab OAuth connection in dbt Cloud pointing to a repository under their personal GitLab account (e.g., `gitlab.com/alice/my-dbt-project`). dbt can't use the repository. What is the root cause?", "is_multi_select": false, "options": {"A": "The developer does not have Maintainer role on the repository.", "B": "The developer used `read_api` scope instead of `api` scope for the GitLab OAuth app.", "C": "GitLab Free does not report CI status back to merge requests.", "D": "GitLab repos must belong to a **GitLab group** — personal account repos are not supported for native integration."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Maintainer role is required to set up the connection, but a missing role isn't the problem here. The repo is in a personal account."}, "B": {"label": "❌ Incorrect", "text": "The docs list `api` as the scope for the GitLab OAuth app, but scope isn't what this question is about. The problem is where the repo lives."}, "C": {"label": "❌ Incorrect", "text": "That is a real GitLab Free limitation, but it's about job status, not about which repos dbt can read."}, "D": {"label": "✅ Correct", "text": "Repos must belong to a **GitLab group** (e.g., `gitlab.com/my-org/repo`). The docs say it plainly: dbt will not read repos associated with a user."}}, "key_rule": "GitLab repos must be in a **GitLab group**, not a personal account. Personal repos are unsupported."}, {"id": "q02_Q2", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 2, "high_yield": true, "subdomain_id": "2.2", "subdomain_topic": "Azure DevOps plan requirements", "question_text": "A company on the dbt Cloud Starter plan connects their Azure DevOps repository using deploy keys. Developers complain that CI jobs never trigger automatically when PRs are opened. The team asks if upgrading to Enterprise would fix this. Is it correct?", "is_multi_select": false, "options": {"A": "No — Azure DevOps CI triggers require a separate webhook configuration regardless of plan.", "B": "No — CI triggers with Azure DevOps are available on all plans; the deploy key setup is likely misconfigured.", "C": "Yes — Azure DevOps native integration (which enables automatic CI triggers) is **Enterprise-only**. Starter can only use deploy keys, which don't support auto CI.", "D": "Yes — but only if they also switch from deploy keys to Service Principal authentication."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Webhooks are part of the native integration — not an additional manual step that works on all plans."}, "B": {"label": "❌ Incorrect", "text": "Deploy keys intentionally do not support automatic CI triggers on any plan. This is not a misconfiguration — it's a plan limitation."}, "C": {"label": "✅ Correct", "text": "Azure DevOps **native integration** is **Enterprise/Enterprise+ only**. On Starter and Developer you can connect with a deploy key and still develop, but you can't configure automated CI jobs."}, "D": {"label": "❌ Incorrect", "text": "While Service Principal is the recommended auth method for Azure DevOps on Enterprise, the issue in the question is the plan limitation — not the auth method."}}, "key_rule": "Azure DevOps native integration = **Enterprise/Enterprise+ only**. Starter/Developer = deploy keys, no auto CI."}, {"id": "q02_Q3", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 3, "high_yield": false, "subdomain_id": "2.3", "subdomain_topic": "GitHub profile linking (Enterprise)", "question_text": "A company on the dbt Enterprise plan has installed the GitHub native app. Why does each developer still need to connect their personal GitHub profile to dbt?", "is_multi_select": false, "options": {"A": "GitHub requires a separate app approval for every developer.", "B": "The Studio IDE checks each developer's read/write access to the repo, so each developer must link their own profile.", "C": "Linking a profile is what turns on the native GitHub integration for the whole account.", "D": "Without a linked profile, dbt can't run scheduled jobs."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The app is installed once, by a GitHub org owner. Nothing in the docs asks for a per-developer approval."}, "B": {"label": "✅ Correct", "text": "On Enterprise/Enterprise+, every developer must connect their GitHub profile, because the Studio IDE verifies each developer's read/write access to the dbt repo."}, "C": {"label": "❌ Incorrect", "text": "The org-level install (GitHub org owner + dbt Owner/Account Admin) turns on the integration. Profile linking is a separate, per-developer step."}, "D": {"label": "❌ Incorrect", "text": "The docs tie profile linking to IDE/CLI access, not to scheduled jobs."}}, "key_rule": "Enterprise/Enterprise+ = every developer links their GitHub profile (the IDE checks read/write access). Starter = optional but recommended."}, {"id": "q02_Q4", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 4, "high_yield": false, "subdomain_id": "2.4", "subdomain_topic": "GitLab Free Plan CI status", "question_text": "A team migrates their Git provider from GitHub to GitLab Free. After the migration, dbt CI jobs run successfully in dbt Cloud and tests pass, but developers say they see no green checkmark on their Merge Requests in GitLab. What is the cause?", "is_multi_select": false, "options": {"A": "The GitLab repo is set to private, blocking dbt from writing status back.", "B": "The repo belongs to a personal GitLab account instead of a GitLab group.", "C": "Status checks only appear in GitLab after the MR is merged, not while it's open.", "D": "dbt CI runs on GitLab Free don't post status checks back to Merge Requests — this is a Free plan limitation."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Repo visibility is not the documented reason. The documented reason is the GitLab plan."}, "B": {"label": "❌ Incorrect", "text": "dbt would not read a repo tied to a personal account, so CI would not run at all. The question says CI runs succeed."}, "C": {"label": "❌ Incorrect", "text": "On supported GitLab plans, status is reported while the MR is open. What the question describes is a plan limitation."}, "D": {"label": "✅ Correct", "text": "On **GitLab Free**, MRs still trigger CI jobs, but the job status (success or failure) is **not reported back** to GitLab. Native CI needs a paid or self-hosted GitLab that supports webhooks and project access tokens."}}, "key_rule": "GitLab Free → CI triggers work but **no status posted back to MRs**. Use a paid or self-hosted GitLab for status checks."}, {"id": "q02_Q5", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 5, "high_yield": false, "subdomain_id": "2.5", "subdomain_topic": "Case-sensitive repository names", "question_text": "A dbt Cloud account admin connects a GitHub repository named `Analytics-Core` to a project. The connection is configured as `analytics-core` (all lowercase) in the dbt Cloud UI. CI jobs are set up and appear functional. What is the likely outcome?", "is_multi_select": false, "options": {"A": "The repo name must match the case in the GitHub URL, so cloning will fail or jobs will error.", "B": "Git connections are case-insensitive on GitHub, so the mismatch will have no effect.", "C": "dbt Cloud normalizes repository names to lowercase automatically — no issue will occur.", "D": "The case mismatch only matters for GitHub Enterprise, not GitHub.com."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say the repository name must exactly match the case used in the GitHub URL (`Analytics-Core`, not `analytics-core`) to avoid cloning errors or job failures."}, "B": {"label": "❌ Incorrect", "text": "The docs say the name must match the case in the GitHub URL exactly."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not normalize repository names. The exact string is used as entered."}, "D": {"label": "❌ Incorrect", "text": "The docs give the case rule for GitHub repos in general, not just for Enterprise."}}, "key_rule": "Repo name must match the GitHub URL **exactly, including case**. `Analytics-Core` ≠ `analytics-core` → clone errors or job failures."}, {"id": "q02_Q6", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 6, "high_yield": false, "subdomain_id": "2.6", "subdomain_topic": "BitBucket and CodeCommit", "question_text": "An organization uses AWS CodeCommit for version control. They want to set up automated CI in dbt Cloud so that jobs trigger on every pull request. Which approach is required?", "is_multi_select": false, "options": {"A": "CodeCommit CI works automatically when using an IAM role-based connection in dbt Cloud.", "B": "Use the dbt Cloud native CodeCommit integration available in Account Settings → Integrations.", "C": "Use the Git URL (deploy key) method to connect the repo, then trigger CI jobs through the dbt Administrative API.", "D": "CodeCommit PRs cannot trigger dbt CI under any configuration — use GitHub or GitLab instead."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "CodeCommit is set up with an IAM user and a dbt-generated key. There is no automated CI for it."}, "B": {"label": "❌ Incorrect", "text": "There is **no native CodeCommit integration** in dbt Cloud. It is not listed in Account Settings integrations."}, "C": {"label": "✅ Correct", "text": "CodeCommit (and BitBucket) have no native integration, so you connect with the **Git clone / deploy key** method and use the **dbt Administrative API** to trigger CI jobs. API triggering needs Enterprise/Enterprise+."}, "D": {"label": "❌ Incorrect", "text": "CI can be triggered through the Administrative API."}}, "key_rule": "BitBucket and CodeCommit = **no native integration**, no automated CI. Use Git clone + dbt Admin API (Enterprise/Enterprise+) to trigger CI."}, {"id": "q02_Q7", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 7, "high_yield": false, "subdomain_id": "2.7", "subdomain_topic": "Azure DevOps Server (on-premises)", "question_text": "A large enterprise runs Azure DevOps Server on-premises. They are evaluating upgrading to dbt Cloud Enterprise to get the Azure DevOps native integration. Will the upgrade enable native integration for their on-premises instance?", "is_multi_select": false, "options": {"A": "No — Azure DevOps Server (on-premises) has no native dbt Cloud integration on any plan. They must use the Git URL method.", "B": "Yes — but only if the on-premises server is accessible via a public FQDN.", "C": "Yes — dbt Cloud Enterprise enables native Azure DevOps integration for both cloud-hosted and on-premises instances.", "D": "No — on-premises Azure DevOps requires PrivateLink before native integration can be configured."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "**Azure DevOps Server (on-premises)** has **no native dbt Cloud integration on any plan** — not even Enterprise+. Teams using on-premises ADO must connect via the Git URL/deploy key method regardless of their dbt Cloud plan tier."}, "B": {"label": "❌ Incorrect", "text": "Public FQDN accessibility is not a documented path to native integration for on-prem ADO."}, "C": {"label": "❌ Incorrect", "text": "The native integration is for Azure DevOps cloud accounts. The docs say it does not support Azure DevOps Server (on-premise)."}, "D": {"label": "❌ Incorrect", "text": "PrivateLink is a network feature — it doesn't unlock native provider integrations."}}, "key_rule": "Azure DevOps Server (on-prem) = **no native integration on any plan**. Cloud ADO = Enterprise/Enterprise+ only."}, {"id": "q02_Q8", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 8, "high_yield": false, "subdomain_id": "2.8", "subdomain_topic": "GitLab OAuth setup requirements", "question_text": "A company on dbt Cloud Enterprise is setting up GitLab as their Git provider. Which of the following steps are required? **Select TWO correct answers.**", "is_multi_select": true, "options": {"A": "The OAuth app credentials must be added to each project individually, not at the account level.", "B": "The dbt user must have the Owner role on the GitLab project.", "C": "The GitLab OAuth app must be created with the `api` scope.", "D": "The repository must be in a GitLab group, not under a personal user account.", "E": "The GitLab instance must be version 14.0 or higher."}, "correct_answers": ["C", "D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "On Enterprise, an admin creates a group-owned OAuth app and adds the Application ID + Secret to **Account Settings → Integrations** — it's configured once at the account level."}, "B": {"label": "❌ Incorrect", "text": "The required role is **Maintainer**, not Owner. Owner is more permissive than required."}, "C": {"label": "✅ Correct", "text": "The group-owned GitLab OAuth app is created with the **`api` scope**."}, "D": {"label": "✅ Correct", "text": "Repositories must belong to a **GitLab group** (e.g., `gitlab.com/my-org/repo`). Personal account repos are not supported for the native integration."}, "E": {"label": "❌ Incorrect", "text": "There is no documented GitLab version requirement at 14.0+ — this is not a listed constraint."}}, "key_rule": "GitLab = `api` scope + repo must be in a **GitLab group** + **Maintainer role** required."}, {"id": "q02_Q9", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 9, "high_yield": false, "subdomain_id": "2.9", "subdomain_topic": "GitLab webhook and project access token", "question_text": "A GitLab repo is connected to dbt with the native integration. What does dbt set up in GitLab automatically so CI can run and report back?", "is_multi_select": false, "options": {"A": "A scheduled poll that checks GitLab for new merge requests.", "B": "A group-owned OAuth app for the whole account.", "C": "A webhook that triggers jobs in dbt, and a project access token that sends the job status back to GitLab.", "D": "A deploy key that dbt uses to comment on merge requests."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "dbt listens for notifications from the Git provider (the webhook). It doesn't poll."}, "B": {"label": "❌ Incorrect", "text": "On Enterprise, the admin creates the OAuth app themselves before connecting any repo. dbt doesn't create it during repo setup."}, "C": {"label": "✅ Correct", "text": "When you configure the repo, dbt registers a **webhook** (triggers jobs in dbt) and creates a **project access token** (sends the job run status back to GitLab). dbt refreshes the token automatically."}, "D": {"label": "❌ Incorrect", "text": "Deploy keys belong to the Git clone method, not the native integration."}}, "key_rule": "GitLab native CI = webhook (triggers) + project access token (reports status). CI not triggering? Check the webhook in GitLab (Settings → Webhooks): enabled, correct URL and secret."}, {"id": "q02_Q10", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 10, "high_yield": false, "subdomain_id": "2.10", "subdomain_topic": "GitLab Maintainer role", "question_text": "A developer with **Developer** role (not Maintainer) on a GitLab group repository attempts to set up the GitLab OAuth connection in dbt Cloud. The connection setup fails. What is the reason?", "is_multi_select": false, "options": {"A": "The Developer role in GitLab cannot generate OAuth tokens at all.", "B": "Only GitLab group Owners can connect repositories to external tools like dbt Cloud.", "C": "GitLab Developer role cannot read repository contents, which dbt requires.", "D": "Setting up the GitLab native integration requires **Maintainer** role on the repository — Developer role is insufficient."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Not what the docs say. The documented requirement is the Maintainer role."}, "B": {"label": "❌ Incorrect", "text": "Owner is not required — Maintainer is sufficient."}, "C": {"label": "❌ Incorrect", "text": "GitLab Developer role has read access to repository contents. Read access is not the issue."}, "D": {"label": "✅ Correct", "text": "The docs say only users with **Maintainer** permissions can set up repository connections. Developer role is insufficient."}}, "key_rule": "GitLab integration requires **Maintainer role** minimum. Developer role is insufficient."}, {"id": "q02_Q11", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 11, "high_yield": false, "subdomain_id": "2.11", "subdomain_topic": "GitLab Enterprise vs Starter setup flow", "question_text": "An organization on dbt Cloud Enterprise is setting up GitLab integration. A developer on the same account who is on a personal Starter project is also trying to connect to GitLab. Which statement correctly distinguishes the two setup flows?", "is_multi_select": false, "options": {"A": "Both flows are identical — all plans use personal GitLab OAuth apps connected via Profile Settings.", "B": "On Enterprise, an admin creates a **group-owned OAuth app** and configures it in Account Settings → Integrations. On Starter/Developer, each user connects their personal GitLab account via Profile Settings → Linked Accounts.", "C": "On Enterprise, dbt Cloud uses a pre-built GitLab app that doesn't need manual OAuth configuration. On Starter, a manual deploy key must be used.", "D": "On Starter, the group-owned OAuth app method is used. On Enterprise, personal OAuth apps are used for greater isolation."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The flows differ significantly between Enterprise and Starter/Developer tiers."}, "B": {"label": "✅ Correct", "text": "**Enterprise**: A dbt Cloud admin creates a **group-owned GitLab OAuth app**, then adds the Application ID and Secret to **Account Settings → Integrations**. All users in the account share this app. **Starter/Developer**: Each user connects their personal GitLab account individually via **Profile Settings → Linked Accounts**. There is no account-level shared app setup."}, "C": {"label": "❌ Incorrect", "text": "dbt Cloud does not provide a pre-built GitLab app — admins must create their own OAuth app in GitLab."}, "D": {"label": "❌ Incorrect", "text": "This reverses the actual behavior. Enterprise uses the shared group-owned app; personal account linking is for Starter/Developer."}}, "key_rule": "GitLab Enterprise = admin creates group OAuth app → Account Settings → Integrations. Starter/Developer = each user links personally via Profile Settings."}, {"id": "q02_Q12", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 12, "high_yield": false, "subdomain_id": "2.12", "subdomain_topic": "Azure DevOps recommended authentication", "question_text": "A platform team is setting up Azure DevOps native integration in dbt Cloud for the first time. They are choosing between two authentication methods: **Service User** and **Service Principal**. Which should they choose, and why?", "is_multi_select": false, "options": {"A": "Service User — Service Principal requires Enterprise+ while Service User works on Enterprise.", "B": "Either method is acceptable — the choice depends on whether the team uses Entra ID or Active Directory.", "C": "Service Principal (via Microsoft Entra ID) — it is the recommended method; Service User is a legacy approach.", "D": "Service User — it provides more granular permissions than Service Principal."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs list both methods as available to all accounts with the Azure DevOps integration."}, "B": {"label": "❌ Incorrect", "text": "dbt explicitly recommends Service Principal over Service User — this is not a neutral choice."}, "C": {"label": "✅ Correct", "text": "**Service Principal** is the **recommended** authentication method for Azure DevOps. The docs label Service User as **legacy**."}, "D": {"label": "❌ Incorrect", "text": "The docs label Service User as legacy and Service Principal as recommended."}}, "key_rule": "Azure DevOps auth = **Service Principal** (recommended) via Entra ID. Service User = legacy, not recommended for new setups."}, {"id": "q02_Q13", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 13, "high_yield": false, "subdomain_id": "2.13", "subdomain_topic": "Azure DevOps admin coordination", "question_text": "An organization wants to enable dbt Cloud's native Azure DevOps integration. A project manager says \"just have the dbt admin configure it.\" An architect pushes back, saying it requires coordination across multiple teams. Who is correct, and which teams are involved?", "is_multi_select": false, "options": {"A": "The project manager — if Service User auth is chosen, only one admin is needed.", "B": "The project manager — only the dbt Account Admin needs to configure the integration from Account Settings.", "C": "The architect — setup requires both the dbt admin and the Azure DevOps admin, but Entra ID is not involved.", "D": "The architect — setup requires coordination across three admin teams: dbt admins, Azure Entra ID admins, and Azure DevOps admins."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say you need all three admin teams no matter which approach you take."}, "B": {"label": "❌ Incorrect", "text": "The dbt admin alone cannot complete the setup — Azure-side configuration is required in systems the dbt admin does not control."}, "C": {"label": "❌ Incorrect", "text": "Entra ID is central to the recommended Service Principal method and must be involved."}, "D": {"label": "✅ Correct", "text": "The docs say you need admins for **dbt, Azure Entra ID, and Azure DevOps** to complete the integration."}}, "key_rule": "Azure DevOps native integration = 3-team coordination: dbt admins + Azure Entra ID admins + Azure DevOps admins."}, {"id": "q02_Q14", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 14, "high_yield": false, "subdomain_id": "2.14", "subdomain_topic": "API-triggered CI and schema cleanup", "question_text": "A team uses BitBucket and triggers dbt CI jobs through the dbt Administrative API when PRs are opened. What will dbt **not** do for them automatically?", "is_multi_select": false, "options": {"A": "Delete the temporary CI schema after the PR is closed or merged.", "B": "Read the repo using the deploy key.", "C": "Build the modified models in the CI job.", "D": "Run the CI job."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say dbt will not auto-delete the temporary schema for API-triggered CI. Automatic deletion relies on webhooks from the Git provider, which only native integrations have."}, "B": {"label": "❌ Incorrect", "text": "The deploy key is how dbt clones the repo with the Git clone method."}, "C": {"label": "❌ Incorrect", "text": "The job still runs its commands."}, "D": {"label": "❌ Incorrect", "text": "The API call starts the CI job as normal."}}, "key_rule": "Non-native provider + Admin API for CI (Enterprise/Enterprise+) = you clean up the temp CI schema yourself."}, {"id": "q02_Q15", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 15, "high_yield": false, "subdomain_id": "2.15", "subdomain_topic": "Switching to a custom GitHub app", "question_text": "A company has used the shared dbt GitHub app and switches to its own custom GitHub app. What happens to developers' existing GitHub profile links?", "is_multi_select": false, "options": {"A": "They carry over automatically.", "B": "Every existing link is invalidated, and everyone on the account must relink their GitHub profile.", "C": "Only account admins have to relink.", "D": "Only Starter developers have to relink."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs say switching to your own application invalidates every existing GitHub profile link."}, "B": {"label": "✅ Correct", "text": "Every existing link is invalidated, so everyone on the account has to relink."}, "C": {"label": "❌ Incorrect", "text": "It affects everyone on the account, not just admins."}, "D": {"label": "❌ Incorrect", "text": "It isn't tied to a plan."}}, "key_rule": "Shared app → custom app = everyone relinks. Also: **one GitHub app per dbt account**, not per project."}, {"id": "q02_Q16", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 16, "high_yield": false, "subdomain_id": "2.16", "subdomain_topic": "GitHub org owner requirement", "question_text": "A dbt Cloud account admin tries to set up the GitHub native app integration but is not the GitHub organization owner — they are only a repository admin. They complete the dbt Cloud side of the setup but CI jobs never trigger. What is the root cause?", "is_multi_select": false, "options": {"A": "GitHub requires the dbt app to be installed by a GitHub **org owner**. A repository admin cannot install org-level GitHub apps, so the app was never actually installed.", "B": "The GitHub app requires a separate token from the repo admin to authorize CI triggers.", "C": "GitHub apps only work with GitHub Enterprise, not GitHub.com accounts.", "D": "Repository admins can install GitHub apps — the issue must be elsewhere in the CI job configuration."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "The docs say you must be a **GitHub organization owner** to install the dbt GitHub App. That person also needs Owner or Account Admin permissions in dbt."}, "B": {"label": "❌ Incorrect", "text": "No separate token from the repo admin is required. The org-level app installation handles authorization."}, "C": {"label": "❌ Incorrect", "text": "The shared dbt GitHub App is available to any org connecting to `github.com`."}, "D": {"label": "❌ Incorrect", "text": "Repository admins cannot install organization-level GitHub apps — only org owners can."}}, "key_rule": "GitHub native app must be installed by the **GitHub org owner** — repository admin is insufficient."}, {"id": "q02_Q17", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 17, "high_yield": false, "subdomain_id": "2.17", "subdomain_topic": "Fork PR CI failure", "question_text": "A contributor forks a dbt Cloud-connected GitHub repository and opens a pull request from their fork. The job fails at the Clone Git Repository step with \"Failed to checkout to specified revision.\" What is the cause and how should the team handle it?", "is_multi_select": false, "options": {"A": "The contributor's fork is private — they must make it public before dbt can access it.", "B": "Fork PRs require a deploy key to be added to the fork repository before CI can run.", "C": "The CI job needs to be reconfigured with \"allow fork PRs\" enabled in the job's Git Trigger settings.", "D": "dbt Cloud cannot check out commits from fork repositories — the contributor must push their branch directly to the origin repository instead."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Visibility is not the issue. dbt can't check out commits that belong to a fork."}, "B": {"label": "❌ Incorrect", "text": "Not a documented fix. dbt can only check out commits from the original repo."}, "C": {"label": "❌ Incorrect", "text": "Not a documented setting."}, "D": {"label": "✅ Correct", "text": "The docs say dbt can only check out commits that belong to the **original repository**, not commits that belong to a fork. Push the branch to the original repo instead."}}, "key_rule": "Fork PRs = dbt CI cannot check out commits. Contributors must push branches directly to the origin repo."}, {"id": "q02_Q18", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 18, "high_yield": false, "subdomain_id": "2.18", "subdomain_topic": "Azure DevOps reused branch", "question_text": "A developer on an Azure DevOps project closes a pull request without merging and then opens a new PR using the exact same branch name. The CI job does not trigger for the new PR. What is the cause?", "is_multi_select": false, "options": {"A": "Azure DevOps requires CI jobs to be manually re-enabled after a PR is closed without merging.", "B": "dbt Cloud CI will not trigger on a new PR that reuses the same branch name from a previously closed or abandoned PR.", "C": "The branch protection rule is preventing new PRs from being opened on used branches.", "D": "This is a billing issue — the organization has exceeded its CI run quota for the month."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "There is no manual re-enable step required for CI jobs after a PR is closed."}, "B": {"label": "✅ Correct", "text": "dbt won't trigger a CI run if the latest commit in a PR has already triggered a run for that job. If PR 1 is abandoned and PR 2 is opened from the same branch (same commit) into `main`, no new run starts. Use a new branch or a new commit."}, "C": {"label": "❌ Incorrect", "text": "Branch protection rules are an Azure DevOps configuration — they would block PR creation entirely, not just CI triggering."}, "D": {"label": "❌ Incorrect", "text": "CI run quotas are not a documented dbt Cloud billing constraint."}}, "key_rule": "Azure DevOps CI won't trigger on a new PR whose latest commit already triggered a run (e.g. branch reused after an abandoned PR). Use a new branch or a new commit."}, {"id": "q02_Q19", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 19, "high_yield": false, "subdomain_id": "2.19", "subdomain_topic": "Deploy key limitations", "question_text": "An organization on a Starter plan uses a deploy key to connect their GitHub repository to dbt Cloud. They want CI jobs to trigger automatically on every pull request. What is the limitation they will encounter?", "is_multi_select": false, "options": {"A": "Deploy keys expire after 90 days and must be rotated, causing periodic CI outages.", "B": "Deploy keys require a self-hosted dbt runner to function.", "C": "Deploy keys (the Git clone method) don't support automated CI jobs, because there is no native integration with the Git host.", "D": "Deploy keys only work with GitHub and not with GitLab or Azure DevOps."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The docs don't describe key expiry as a limitation."}, "B": {"label": "❌ Incorrect", "text": "Deploy keys work with dbt Cloud-hosted runners — no self-hosted runner is required."}, "C": {"label": "✅ Correct", "text": "The Git clone method has no native integration, so dbt can't use features that need a tight integration with the Git host, like updating PRs with run statuses. Automated CI needs a native integration. To trigger CI anyway, use the Administrative API (Enterprise/Enterprise+)."}, "D": {"label": "❌ Incorrect", "text": "Deploy keys work with GitHub, GitLab, Azure DevOps, and other providers — they're a standard Git mechanism, not GitHub-specific."}}, "key_rule": "Deploy key (Git clone) = no automated CI, no PR status updates. The key needs **read and write** access."}, {"id": "q02_Q20", "file_id": "q02", "topic_num": "2", "topic_name": "Git Connections", "question_num": 20, "high_yield": false, "subdomain_id": "2.20", "subdomain_topic": "GitHub Enterprise Server / on-prem GitHub", "question_text": "A company on the dbt **Starter** plan runs GitHub Enterprise Server on their own domain (`github.company.com`). They want to connect it to dbt. Which connection method works?", "is_multi_select": false, "options": {"A": "PrivateLink — required for any on-premises Git provider.", "B": "Git URL / deploy key — on plans below Enterprise, this is how on-prem GitHub connects.", "C": "Azure DevOps native integration, since on-premises GitHub requires a Microsoft product for integration.", "D": "The shared dbt GitHub App — it works with any GitHub domain."}, "correct_answers": ["B"], "explanations": {"A": {"label": "❌ Incorrect", "text": "PrivateLink is a network feature, not a Git connection method."}, "B": {"label": "✅ Correct", "text": "On Enterprise/Enterprise+ you can use the native integration by registering a **custom GitHub application** (private beta). On other plans, like Starter, connect with a **Git URL**, which supports fewer Git features."}, "C": {"label": "❌ Incorrect", "text": "Azure DevOps native integration is for Azure DevOps, not GitHub Enterprise."}, "D": {"label": "❌ Incorrect", "text": "The shared dbt GitHub App only reaches `github.com`. It can't reach on-prem GitHub (or `ghe.com`)."}}, "key_rule": "On-prem GitHub or `ghe.com`: Enterprise/Enterprise+ → custom GitHub app (private beta). Other plans → Git URL / deploy key. The shared dbt app can't reach either."}, {"id": "q03_Q1", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 1, "high_yield": true, "subdomain_id": "3.1", "subdomain_topic": "Default schema generation behavior", "question_text": "A developer's dbt Cloud IDE is configured with a target schema of `dbt_alice`. A model has the following config:\n\n```yaml\nconfig:\n  schema: 'finance'\n```\n\nWhen the developer runs this model in the IDE, which schema does the model land in?", "is_multi_select": false, "options": {"A": "`dbt_alice` — the custom schema config is ignored in development.", "B": "`finance` — the custom schema replaces the target schema.", "C": "`dbt_finance` — the target schema prefix is shortened to match the `dbt_` prefix convention.", "D": "`dbt_alice_finance` — the default macro prepends the target schema."}, "correct_answers": ["D"], "explanations": {"A": {"label": "❌ Incorrect", "text": "The custom schema config IS honored — it just appends rather than replaces."}, "B": {"label": "❌ Incorrect", "text": "In the default `generate_schema_name` macro, custom schema does NOT replace target schema — it appends to it. Replacing would cause multi-developer collisions."}, "C": {"label": "❌ Incorrect", "text": "There is no `dbt_` prefix shortening behavior in dbt's default logic."}, "D": {"label": "✅ Correct", "text": "Default behavior: `<target.schema>_<custom_schema>` = `dbt_alice_finance`. This ensures isolation when multiple developers have models with the same `schema: finance` config — `dbt_alice_finance` and `dbt_bob_finance` are distinct."}}, "key_rule": "Default formula = `<target.schema>_<custom_schema>`. Custom schema APPENDS, does NOT replace."}, {"id": "q03_Q2", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 2, "high_yield": true, "subdomain_id": "3.2", "subdomain_topic": "Schema generation override for production", "question_text": "A team wants models with `schema: 'core'` to land in the `core` schema in production (not `analytics_core`), while still having developer isolation in dev. Where must the override macro be placed and what logic should it use?", "is_multi_select": false, "options": {"A": "Override `generate_schema_name` in `dbt_project.yml` — check the environment type and return only `custom_schema_name` for production.", "B": "Set `schema: 'core'` directly in `dbt_project.yml` under the `models:` key for the production environment.", "C": "Override `generate_schema_name` in `macros/` — check `target.name == 'prod'` and return only `custom_schema_name` in that case.", "D": "Override `generate_target_schema` in `dbt_project.yml` using an environment variable check."}, "correct_answers": ["C"], "explanations": {"A": {"label": "❌ Incorrect", "text": "Macros cannot be defined in `dbt_project.yml`. Macro overrides must live in the `macros/` directory as `.sql` files."}, "B": {"label": "❌ Incorrect", "text": "Setting `schema: 'core'` in `dbt_project.yml` still goes through the same `generate_schema_name` logic — it doesn't bypass it."}, "C": {"label": "✅ Correct", "text": "Put the override in `macros/generate_schema_name.sql`. When `target.name == 'prod'`, return the custom schema. In other targets, keep the target schema so developers don't collide (the docs' version ignores the custom schema in dev/CI; appending it also keeps developers apart). Set **Target name = `prod`** on the production job."}, "D": {"label": "❌ Incorrect", "text": "There is no `generate_target_schema` macro in dbt. The macro to override is `generate_schema_name`."}}, "key_rule": "Override location = `macros/generate_schema_name.sql`. Signal = `target.name` set in job Advanced Settings."}, {"id": "q03_Q3", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 3, "high_yield": false, "subdomain_id": "3.3", "subdomain_topic": "Developer collision with custom schema override", "question_text": "A developer overrides `generate_schema_name` to always return only `custom_schema_name` (stripping the target schema prefix entirely) in all environments. Two developers — Alice (`dbt_alice`) and Bob (`dbt_bob`) — both have models with `schema: 'finance'`. What is the consequence?", "is_multi_select": false, "options": {"A": "Both developers' models will write to the same `finance` schema — they will overwrite each other's data.", "B": "Alice and Bob's models will land in `dbt_alice_finance` and `dbt_bob_finance` respectively, as intended.", "C": "Models will land in `dbt_alice` and `dbt_bob` respectively because the custom schema config is ignored.", "D": "dbt will throw a compile-time error when two developers use the same custom schema."}, "correct_answers": ["A"], "explanations": {"A": {"label": "✅ Correct", "text": "When the prefix is stripped, all developers with `schema: 'finance'` write to the exact same `finance` schema. Alice's run overwrites Bob's models and vice versa. This is the core reason the default macro preserves the `target.schema` prefix in development."}, "B": {"label": "❌ Incorrect", "text": "The override strips the target schema prefix entirely — so it returns `finance`, not `dbt_alice_finance`."}, "C": {"label": "❌ Incorrect", "text": "The custom schema config is respected by the override — the override returns `finance`, not the target schema."}, "D": {"label": "❌ Incorrect", "text": "dbt does not detect multi-user collisions at compile time — it only runs for one user at a time. The collision is a runtime data problem."}}, "key_rule": "Always preserve `target.schema` as a prefix in dev. Stripping it causes multi-developer schema collisions."}, {"id": "q03_Q4", "file_id": "q03", "topic_num": "3", "topic_name": "Environments & Schema Generation", "question_num": 4, "high_yield": true, "subdomain_id": "3.4", "subdomain_topic": "CI PR schema cleanup and custom macros", "question_text": "After merging a PR, a team notices that the temporary CI schema (`dbt_cloud_pr_123_456`) is not being deleted from the warehouse. They recently added a custom `generate_schema_name` macro. What is the most likely cause?", "is_multi_select"
